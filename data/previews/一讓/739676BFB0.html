    <!-- Script Section -->
    <script>
        // Web Audio Synthesizer for sound effects
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
            }

            playJump() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playCoin() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime);
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playHurt() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playHeal() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            playHit() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        const sound = new SoundSystem();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameWrapper = document.getElementById('game-wrapper');

        // Game Constants & State Variables
        let gameRunning = false;
        let isPaused = false;
        let score = 0;
        let coins = 0;
        let hp = 3;
        const maxHp = 3;
        let invincibilityTimer = 0; // Invincibility frames timer (in frames)
        let screenShakeTime = 0;
        let highScore = window.__galleryStorage.getItem('parkour_high_score') || 0;
        let gameSpeed = 6;
        let baseSpeed = 6;
        let frameCount = 0;
        let animFrameId = null;

        document.getElementById('high-score-val').innerText = highScore;

        function updateHeartsUI() {
            const container = document.getElementById('hearts-container');
            container.innerHTML = '';
            for (let i = 0; i < maxHp; i++) {
                const heart = document.createElement('i');
                if (i < hp) {
                    heart.className = 'fa-solid fa-heart text-red-500 scale-100 transition-transform duration-200';
                } else {
                    heart.className = 'fa-regular fa-heart text-slate-600';
                }
                container.appendChild(heart);
            }
        }

        class Player {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = 80;
                this.normalHeight = 56;
                this.slideHeight = 28;
                this.width = 36;
                this.height = this.normalHeight;
                this.groundY = canvas.height - 50;
                this.y = this.groundY - this.height;
                this.vy = 0;
                this.gravity = 0.7;
                this.jumpForce = -13.5;
                this.isGrounded = false;
                this.jumpCount = 0;
                this.maxJumps = 2;
                this.isSliding = false;
                this.runAnimTimer = 0;
            }

            update() {
                // Apply Gravity
                this.vy += this.gravity;
                this.y += this.vy;

                // Ground Collision
                const currentGround = canvas.height - 50;
                if (this.y + this.height >= currentGround) {
                    this.y = currentGround - this.height;
                    this.vy = 0;
                    this.isGrounded = true;
                    this.jumpCount = 0;
                } else {
                    this.isGrounded = false;
                }

                // Sliding state logic
                if (this.isSliding) {
                    this.height = this.slideHeight;
                    if (!this.isGrounded) {
                        this.vy += 1.2;
                    }
                } else {
                    if (this.height !== this.normalHeight) {
                        this.y -= (this.normalHeight - this.height);
                        this.height = this.normalHeight;
                    }
                }

                this.runAnimTimer += gameSpeed * 0.05;
            }

            jump() {
                if (this.jumpCount < this.maxJumps) {
                    this.isSliding = false;
                    this.vy = this.jumpForce;
                    this.jumpCount++;
                    sound.playJump();
                    createParticles(this.x + this.width / 2, this.y + this.height, '#38bdf8', 8);
                }
            }

            slide(slideState) {
                this.isSliding = slideState;
            }

            draw() {
                // Invincibility flashing effect (flicker every 4 frames)
                if (invincibilityTimer > 0 && Math.floor(invincibilityTimer / 4) % 2 === 0) {
                    return;
                }

                ctx.save();
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(this.x + this.width / 2, canvas.height - 50, this.width / 2, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.isSliding) {
                    // Sliding Player Body
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.roundRect(this.x, this.y, this.width + 10, this.height, 8);
                    ctx.fill();

                    // Head/Goggles in slide
                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(this.x + this.width, this.y + 4, 8, 8);
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillRect(this.x + this.width + 4, this.y + 6, 4, 4);
                } else {
                    // Standing / Running Player Body
                    const bounce = this.isGrounded ? Math.sin(this.runAnimTimer * 2) * 3 : 0;

                    // Body
                    ctx.fillStyle = '#0284c7';
                    ctx.beginPath();
                    ctx.roundRect(this.x, this.y + 14 + bounce, this.width, this.height - 14, 8);
                    ctx.fill();

                    // Shirt / Upper
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.roundRect(this.x + 2, this.y + 12 + bounce, this.width - 4, 20, 6);
                    ctx.fill();

                    // Head
                    ctx.fillStyle = '#f8fafc';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2 + 2, this.y + 10 + bounce, 12, 0, Math.PI * 2);
                    ctx.fill();

                    // Headband / Visor
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(this.x + 4, this.y + 4 + bounce, 18, 6);

                    // Running Leg Animation
                    if (this.isGrounded) {
                        const legOffset = Math.sin(this.runAnimTimer * 3) * 10;
                        ctx.strokeStyle = '#0284c7';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(this.x + 10, this.y + this.height - 10);
                        ctx.lineTo(this.x + 10 + legOffset, this.y + this.height);
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(this.x + this.width - 10, this.y + this.height - 10);
                        ctx.lineTo(this.x + this.width - 10 - legOffset, this.y + this.height);
                        ctx.stroke();
                    }
                }

                ctx.restore();
            }
        }

        class HeartPickup {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 22;
                this.markedForDeletion = false;
                this.bounceTimer = Math.random() * Math.PI * 2;
            }

            update() {
                this.x -= gameSpeed;
                this.bounceTimer += 0.08;
                if (this.x + this.size < -30) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                const hoverY = this.y + Math.sin(this.bounceTimer) * 5;
                ctx.translate(this.x, hoverY);

                // Glowing background circle
                ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();

                // Draw Heart
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(0, 4);
                ctx.bezierCurveTo(-10, -6, -12, -14, 0, -18);
                ctx.bezierCurveTo(12, -14, 10, -6, 0, 4);
                ctx.fill();

                // Heart highlight
                ctx.fillStyle = '#fca5a5';
                ctx.beginPath();
                ctx.arc(-4, -12, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class BrickObstacle {
            constructor(type) {
                this.x = canvas.width + 50;
                this.markedForDeletion = false;
                this.type = type; // 0: Ground brick, 1: High floating brick (requires sliding), 2: Double stacked
                
                this.width = 44;
                const groundY = canvas.height - 50;

                if (this.type === 0) { // Low Ground Brick
                    this.height = 44;
                    this.y = groundY - this.height;
                } else if (this.type === 1) { // Floating Overhead Brick (slide under)
                    this.height = 50;
                    this.y = groundY - 95; 
                } else if (this.type === 2) { // Tall Wall Brick
                    this.height = 80;
                    this.y = groundY - this.height;
                }
            }

            update() {
                this.x -= gameSpeed;
                if (this.x + this.width < -50) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                
                // Brick main body background
                ctx.fillStyle = '#9a3412'; // Rich reddish-brown brick color
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 4);
                ctx.fill();
                ctx.strokeStyle = '#431407';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Detailed Brick Pattern
                ctx.strokeStyle = '#c2410c';
                ctx.lineWidth = 1.5;
                const rows = Math.floor(this.height / 14);
                const brickH = this.height / rows;

                for (let r = 0; r < rows; r++) {
                    const rowY = this.y + r * brickH;
                    // Horizontal line
                    ctx.beginPath();
                    ctx.moveTo(this.x, rowY);
                    ctx.lineTo(this.x + this.width, rowY);
                    ctx.stroke();

                    // Vertical lines (staggered)
                    const offset = (r % 2 === 0) ? 0 : 12;
                    for (let cx = offset; cx < this.width; cx += 22) {
                        ctx.beginPath();
                        ctx.moveTo(this.x + cx, rowY);
                        ctx.lineTo(this.x + cx, rowY + brickH);
                        ctx.stroke();
                    }
                }

                // Top highlight
                ctx.fillStyle = '#ea580c';
                ctx.fillRect(this.x + 2, this.y + 2, this.width - 4, 3);

                ctx.restore();
            }
        }

        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 12;
                this.markedForDeletion = false;
                this.rotation = 0;
            }

            update() {
                this.x -= gameSpeed;
                this.rotation += 0.1;
                if (this.x + this.radius < -20) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Coin animation 3D flip effect
                const scaleX = Math.cos(this.rotation);
                ctx.scale(scaleX, 1);

                // Golden Outer Circle
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Inner Shiny Yellow
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius - 3, 0, Math.PI * 2);
                ctx.fill();

                // Center Coin Symbol
                ctx.fillStyle = '#d97706';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', 0, 1);

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 4 + 2;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.alpha = 1;
                this.markedForDeletion = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
                if (this.alpha <= 0) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let player = new Player();
        let obstacles = [];
        let coinsList = [];
        let heartsList = [];
        let particles = [];

        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        let obstacleTimer = 0;
        let minObstacleInterval = 90;

        function spawnManager() {
            obstacleTimer++;

            if (obstacleTimer > minObstacleInterval + Math.random() * 60) {
                const type = Math.floor(Math.random() * 3);
                obstacles.push(new BrickObstacle(type));
                obstacleTimer = 0;

                // Spawn Coin Patterns
                if (Math.random() > 0.3) {
                    const coinCount = Math.floor(Math.random() * 4) + 2;
                    const startX = canvas.width + 120;
                    const coinY = (type === 1) ? canvas.height - 40 : canvas.height - 120 - Math.random() * 40;

                    for (let i = 0; i < coinCount; i++) {
                        coinsList.push(new Coin(startX + i * 32, coinY));
                    }
                }

                // Spawn Heart Pickup randomly (approx 15% chance if HP is missing or rare boost)
                if (Math.random() < 0.15 && heartsList.length === 0) {
                    const heartY = canvas.height - 110 - Math.random() * 50;
                    heartsList.push(new HeartPickup(canvas.width + 180, heartY));
                }
            }
        }

        function checkCollisions() {
            const pBox = {
                x: player.x + 4,
                y: player.y + 2,
                width: player.width - 8,
                height: player.height - 4
            };

            // Check Obstacles (Bricks) with Invincibility logic
            if (invincibilityTimer <= 0) {
                for (let obs of obstacles) {
                    if (
                        pBox.x < obs.x + obs.width &&
                        pBox.x + pBox.width > obs.x &&
                        pBox.y < obs.y + obs.height &&
                        pBox.y + pBox.height > obs.y
                    ) {
                        // Deduct HP
                        hp -= 1;
                        updateHeartsUI();
                        screenShakeTime = 18; // Trigger screen shake
                        invincibilityTimer = 90; // ~1.5s invincibility (60fps)

                        createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ef4444', 25);

                        if (hp <= 0) {
                            sound.playHit();
                            gameOver();
                            return;
                        } else {
                            sound.playHurt();
                        }
                        break;
                    }
                }
            }

            // Check Coins Collection
            for (let coin of coinsList) {
                if (!coin.markedForDeletion) {
                    const dx = (pBox.x + pBox.width / 2) - coin.x;
                    const dy = (pBox.y + pBox.height / 2) - coin.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < coin.radius + pBox.width / 2) {
                        coin.markedForDeletion = true;
                        coins += 1;
                        score += 50;
                        sound.playCoin();
                        createParticles(coin.x, coin.y, '#fde047', 8);
                        
                        document.getElementById('coins-val').innerText = coins;
                        document.getElementById('score-val').innerText = Math.floor(score);
                    }
                }
            }

            // Check Hearts Pickup
            for (let heart of heartsList) {
                if (!heart.markedForDeletion) {
                    const dx = (pBox.x + pBox.width / 2) - heart.x;
                    const dy = (pBox.y + pBox.height / 2) - heart.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < heart.size + pBox.width / 2) {
                        heart.markedForDeletion = true;
                        if (hp < maxHp) {
                            hp += 1;
                            updateHeartsUI();
                        }
                        score += 100;
                        sound.playHeal();
                        createParticles(heart.x, heart.y, '#f43f5e', 15);
                    }
                }
            }
        }

        function gameLoop() {
            if (!gameRunning || isPaused) return;

            frameCount++;
            score += 0.15;
            gameSpeed = baseSpeed + Math.floor(score / 300) * 0.5;

            if (invincibilityTimer > 0) invincibilityTimer--;

            document.getElementById('score-val').innerText = Math.floor(score);

            ctx.save();

            // Handle Screen Shake on damage
            if (screenShakeTime > 0) {
                screenShakeTime--;
                const shakeX = (Math.random() - 0.5) * 12;
                const shakeY = (Math.random() - 0.5) * 12;
                ctx.translate(shakeX, shakeY);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render World
            drawBackground();

            // Update & Render Player
            player.update();
            player.draw();

            // Manage Obstacles
            spawnManager();
            obstacles.forEach(obs => {
                obs.update();
                obs.draw();
            });
            obstacles = obstacles.filter(obs => !obs.markedForDeletion);

            // Manage Coins
            coinsList.forEach(coin => {
                coin.update();
                coin.draw();
            });
            coinsList = coinsList.filter(coin => !coin.markedForDeletion);

            // Manage Hearts
            heartsList.forEach(heart => {
                heart.update();
                heart.draw();
            });
            heartsList = heartsList.filter(h => !h.markedForDeletion);

            // Manage Particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            particles = particles.filter(p => !p.markedForDeletion);

            // Check Collisions
            checkCollisions();

            ctx.restore();

            animFrameId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            sound.init();
            score = 0;
            coins = 0;
            hp = maxHp;
            invincibilityTimer = 0;
            screenShakeTime = 0;
            gameSpeed = baseSpeed;
            obstacles = [];
            coinsList = [];
            heartsList = [];
            particles = [];
            player.reset();

            updateHeartsUI();
            document.getElementById('score-val').innerText = '0';
            document.getElementById('coins-val').innerText = '0';

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('pause-screen').classList.add('hidden');

            gameRunning = true;
            isPaused = false;

            cancelAnimationFrame(animFrameId);
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animFrameId);

            const currentScore = Math.floor(score);
            if (currentScore > highScore) {
                highScore = currentScore;
                window.__galleryStorage.setItem('parkour_high_score', highScore);
                document.getElementById('high-score-val').innerText = highScore;
            }

            document.getElementById('final-score').innerText = currentScore;
            document.getElementById('final-coins').innerText = coins;
            document.getElementById('final-highscore').innerText = highScore;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        function drawBackground() {
            if (canvas.width !== gameWrapper.clientWidth || canvas.height !== gameWrapper.clientHeight) {
                resizeCanvas();
            }

            // Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#0f172a');
            skyGrad.addColorStop(0.7, '#1e1b4b');
            skyGrad.addColorStop(1, '#312e81');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parallax Distant Stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            const starOffset = (frameCount * 0.3) % 300;
            for (let i = 0; i < 25; i++) {
                const sx = ((i * 70 - starOffset) + canvas.width * 2) % canvas.width;
                const sy = (i * 37) % (canvas.height * 0.5);
                ctx.beginPath();
                ctx.arc(sx, sy, (i % 3 === 0) ? 2 : 1, 0, Math.PI * 2);
                ctx.fill();
            }

            // Parallax City Silhouette / Mountains
            ctx.fillStyle = '#1e1b4b';
            const bgOffset = (frameCount * (gameSpeed * 0.25)) % 160;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 50);
            for (let x = -bgOffset - 160; x <= canvas.width + 160; x += 160) {
                ctx.lineTo(x + 80, canvas.height - 110);
                ctx.lineTo(x + 160, canvas.height - 50);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Ground Floor
            const groundY = canvas.height - 50;
            const groundGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
            groundGrad.addColorStop(0, '#1e293b');
            groundGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, groundY, canvas.width, 50);

            // Ground Top Glowing Edge
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Moving Ground Grid Stripe Lines
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
            ctx.lineWidth = 2;
            const stripeOffset = (frameCount * gameSpeed) % 40;
            for (let x = -stripeOffset; x < canvas.width + 40; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, groundY);
                ctx.lineTo(x - 20, canvas.height);
                ctx.stroke();
            }
        }

        function resizeCanvas() {
            canvas.width = gameWrapper.clientWidth;
            canvas.height = gameWrapper.clientHeight;
            if (player) {
                player.groundY = canvas.height - 50;
            }
        }

        function togglePause() {
            if (!gameRunning) return;
            isPaused = !isPaused;
            const pauseScreen = document.getElementById('pause-screen');
            if (isPaused) {
                pauseScreen.classList.remove('hidden');
            } else {
                pauseScreen.classList.add('hidden');
                gameLoop();
            }
        }

        // Event Listeners setup
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (!gameRunning) drawBackground();
        });

        // Controls: Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                if (gameRunning && !isPaused) player.jump();
            } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                e.preventDefault();
                if (gameRunning && !isPaused) player.slide(true);
            } else if (e.code === 'KeyP' || e.code === 'Escape') {
                togglePause();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                if (gameRunning) player.slide(false);
            }
        });

        // Controls: Touch zones for Mobile
        const jumpZone = document.getElementById('touch-jump-zone');
        const slideZone = document.getElementById('touch-slide-zone');

        if (jumpZone) {
            jumpZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameRunning && !isPaused) player.jump();
            });
        }

        if (slideZone) {
            slideZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameRunning && !isPaused) player.slide(true);
            });
            slideZone.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (gameRunning) player.slide(false);
            });
        }

        // Button Event Handlers
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        document.getElementById('resume-btn').addEventListener('click', togglePause);
        document.getElementById('restart-from-pause-btn').addEventListener('click', startGame);

        document.getElementById('audio-toggle-btn').addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            const icon = document.getElementById('audio-icon');
            if (sound.enabled) {
                icon.className = 'fa-solid fa-volume-high text-lg';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-lg text-red-400';
            }
        });

        // Initial setup
        window.onload = () => {
            resizeCanvas();
            updateHeartsUI();
            drawBackground();
        };
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
