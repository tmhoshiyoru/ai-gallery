    <script>
        class MemeAudioSystem {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Comical Jump Sound
            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(780, this.ctx.currentTime + 0.18);
                
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.18);
            }

            // Splat sound for ink attack
            playSplat() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.25);
            }

            // Bonk sound when hit by tofu
            playBonk() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);

                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.15);
            }

            // Slip / shoe lace trip sound
            playSlip() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(180, now + 0.3);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.3);
            }

            // Funny Bonus Pickup Pitch
            playScore() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                
                // Meme Arpeggio chime
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.06); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.12); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.18); // C6

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.3);
            }

            // Sad Meme Wasted Sound
            playGameOver() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                // Pitch slide down
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.6);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.6);
            }

            // Alien Beam Wobble Sound
            playAlienSound() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                osc.frequency.linearRampToValueAtTime(200, now + 0.4);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.4);
            }
        }

        const audio = new MemeAudioSystem();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Element References
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreText = document.getElementById('scoreText');
        const highScoreText = document.getElementById('highScoreText');
        const finalScore = document.getElementById('finalScore');
        const finalHighScore = document.getElementById('finalHighScore');
        const memeDeathQuote = document.getElementById('memeDeathQuote');

        // Touch Control Elements
        const touchLeft = document.getElementById('touchLeft');
        const touchRight = document.getElementById('touchRight');
        const touchJump = document.getElementById('touchJump');

        // Virtual Canvas Dimensions
        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 540;
        const GROUND_Y = 440;

        // Game State Variables
        let isRunning = false;
        let isGameOver = false;
        let score = 0;
        let highScore = window.__galleryStorage.getItem('milkfrog_meme_highscore') || 0;
        let gameSpeed = 6.5;
        let frameCount = 0;
        let particles = [];
        let obstacles = [];
        let collectibles = [];
        let floatingTexts = [];

        // Random Meme Event State Variables
        let inkTimer = 0;          // Ink splatter coverage duration
        let shoeLaceTimer = 0;     // Shoes untied slow-down duration
        let speedBoostTimer = 0;   // Loudspeaker boost duration
        let nextEventFrame = 200;  // Frame trigger for next random chaos (~3.3 seconds)
        let firstAlienSpawned = false; // Track if alien has appeared for the 1st time
        let eventNoticeText = "";  // Screen banner for current event
        let eventNoticeTimer = 0;
        let tofuHazards = [];      // Flying tofu objects
        let activeAlien = null;    // Chasing Alien object

        highScoreText.textContent = String(highScore).padStart(5, '0');

        function resizeCanvas() {
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
        }
        resizeCanvas();

        const keys = { left: false, right: false, up: false };

        window.addEventListener('keydown', (e) => {
            audio.init();
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
                if (!keys.up) frog.jump();
                keys.up = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
        });

        const bindTouch = (btn, action, isJump = false) => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                audio.init();
                if (isJump) frog.jump();
                else keys[action] = true;
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (!isJump) keys[action] = false;
            });
        };
        bindTouch(touchLeft, 'left');
        bindTouch(touchRight, 'right');
        bindTouch(touchJump, 'up', true);

        // Funny Meme Captions on Death
        const MEME_DEATH_QUOTES = [
            "哈哈哈哈哈",
            "哈哈哈哈哈！",
            "哈哈哈哈哈🤣",
            "哈哈哈哈哈",
            "哈哈哈哈哈！！"
        ];

        class MemeMilkFrog {
            constructor() {
                this.width = 72;
                this.height = 64;
                this.x = 120;
                this.y = GROUND_Y - this.height;
                this.vx = 0;
                this.vy = 0;
                this.gravity = 0.85;
                this.jumpPower = -15.5;
                this.isGrounded = false;
                this.jumpCount = 0;
                this.maxJumps = 2;
                this.animTimer = 0;
                this.squishX = 1;
                this.squishY = 1;
                this.dizzyTimer = 0; // Stars dizzy timer when hit by tofu
                this.rotation = 0;
            }

            reset() {
                this.x = 120;
                this.y = GROUND_Y - this.height;
                this.vx = 0;
                this.vy = 0;
                this.isGrounded = true;
                this.jumpCount = 0;
                this.dizzyTimer = 0;
                this.rotation = 0;
            }

            jump() {
                if (!isRunning || isGameOver) return;
                if (this.jumpCount < this.maxJumps) {
                    this.vy = this.jumpPower;
                    this.jumpCount++;
                    this.isGrounded = false;
                    this.squishX = 0.7;
                    this.squishY = 1.3;
                    audio.playJump();

                    // Jump dust + meme text floating
                    createParticles(this.x + this.width / 2, this.y + this.height, 10, '#fef08a');
                    const jumpTexts = ["起飛！", "起飛囉", "二段跳！", "滑行", "歐買尬"];
                    addFloatingText(this.x + 20, this.y - 10, jumpTexts[Math.floor(Math.random() * jumpTexts.length)], '#38bdf8');
                }
            }

            update() {
                // Horizontal Movement (Slower if shoe lace untied or dizzy)
                let moveSpeed = 6.5;
                if (shoeLaceTimer > 0) moveSpeed = 2.8; // Tripped speed limit
                if (this.dizzyTimer > 0) moveSpeed = 3.5;

                if (keys.left) this.vx = -moveSpeed;
                else if (keys.right) this.vx = moveSpeed;
                else this.vx = 0;

                this.x += this.vx;

                // Canvas boundaries
                if (this.x < 20) this.x = 20;
                if (this.x > GAME_WIDTH - this.width - 20) this.x = GAME_WIDTH - this.width - 20;

                // Gravity & Jump Physics
                this.vy += this.gravity;
                this.y += this.vy;

                // Ground Collision
                if (this.y >= GROUND_Y - this.height) {
                    this.y = GROUND_Y - this.height;
                    this.vy = 0;
                    if (!this.isGrounded) {
                        this.squishX = 1.3;
                        this.squishY = 0.7;
                    }
                    this.isGrounded = true;
                    this.jumpCount = 0;
                }

                // Smooth Return from Squish
                this.squishX += (1 - this.squishX) * 0.18;
                this.squishY += (1 - this.squishY) * 0.18;

                if (this.dizzyTimer > 0) this.dizzyTimer--;
                this.animTimer += 0.2;

                // Tumble rotation if tripping on shoelaces
                if (shoeLaceTimer > 0 && !this.isGrounded) {
                    this.rotation += 0.2;
                } else {
                    this.rotation = 0;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height);
                ctx.rotate(this.rotation);
                ctx.scale(this.squishX, this.squishY);

                const bounceY = this.isGrounded ? Math.sin(this.animTimer * 2.5) * 4 : -2;

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.ellipse(0, 2, 28, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Bold Black Outline for Meme Cartoon Look
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;

                // Main Torso Path (Yellow Milk Frog)
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.roundRect(-30, -48 + bounceY, 60, 48, [24, 24, 14, 14]);
                ctx.fill();
                ctx.stroke();

                // Milky Cream Belly
                ctx.fillStyle = '#fef3c7';
                ctx.beginPath();
                ctx.ellipse(0, -20 + bounceY, 18, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Eyes Bulges
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(-18, -48 + bounceY, 14, 0, Math.PI * 2);
                ctx.arc(18, -48 + bounceY, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Eye Details & Expressions
                if (isGameOver || this.dizzyTimer > 0) {
                    // Crying / Dizzy Meme Eyes (暈眩 @ @)
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.arc(-18, -35 + bounceY, 6, 0, Math.PI * 2);
                    ctx.arc(18, -35 + bounceY, 6, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 3.5;
                    // Left Eye X
                    ctx.beginPath();
                    ctx.moveTo(-24, -53 + bounceY); ctx.lineTo(-12, -43 + bounceY);
                    ctx.moveTo(-12, -53 + bounceY); ctx.lineTo(-24, -43 + bounceY);
                    // Right Eye X
                    ctx.moveTo(12, -53 + bounceY); ctx.lineTo(24, -43 + bounceY);
                    ctx.moveTo(24, -53 + bounceY); ctx.lineTo(12, -43 + bounceY);
                    ctx.stroke();

                    // Wavy Crying / Stunned Mouth
                    ctx.beginPath();
                    ctx.moveTo(-10, -20 + bounceY);
                    ctx.quadraticCurveTo(0, -12 + bounceY, 10, -20 + bounceY);
                    ctx.stroke();
                } else if (!this.isGrounded) {
                    // Intense Screaming Frog Eyes
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-18, -48 + bounceY, 10, 0, Math.PI * 2);
                    ctx.arc(18, -48 + bounceY, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(-18, -48 + bounceY, 3, 0, Math.PI * 2);
                    ctx.arc(18, -48 + bounceY, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.ellipse(0, -22 + bounceY, 8, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    // Smug Meme Eyes
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-18, -48 + bounceY, 10, 0, Math.PI * 2);
                    ctx.arc(18, -48 + bounceY, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(-16, -46 + bounceY, 5, 0, Math.PI * 2);
                    ctx.arc(20, -46 + bounceY, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, -24 + bounceY, 6, 0.1 * Math.PI, 0.9 * Math.PI);
                    ctx.stroke();
                }

                // Rosy Cheeks
                ctx.fillStyle = '#fca5a5';
                ctx.beginPath();
                ctx.arc(-22, -26 + bounceY, 6, 0, Math.PI * 2);
                ctx.arc(22, -26 + bounceY, 6, 0, Math.PI * 2);
                ctx.fill();

                // Cute Feet
                ctx.fillStyle = '#facc15';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(-24, 0, 11, 5, -0.2, 0, Math.PI * 2);
                ctx.ellipse(24, 0, 11, 5, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Draw Dizzy Stars orbiting head if stunned
                if (this.dizzyTimer > 0) {
                    const starAngle = Date.now() * 0.008;
                    for (let i = 0; i < 3; i++) {
                        const a = starAngle + (i * Math.PI * 2 / 3);
                        const sx = Math.cos(a) * 22;

                // Draw Untied Shoelace visual indicator
                if (shoeLaceTimer > 0) {
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(-18, 2);
                    ctx.lineTo(-32, 12);
                    ctx.moveTo(18, 2);
                    ctx.lineTo(32, 12);
                    ctx.stroke();
                }

                ctx.restore();
            }

            getBounds() {
                return {
                    x: this.x + 8,
                    y: this.y + 8,
                    width: this.width - 16,
                    height: this.height - 10
                };

        const frog = new MemeMilkFrog();

        class MemeExamPaper {
            constructor() {
                this.width = 60;
                this.height = 76;
                this.x = GAME_WIDTH + 50;

                this.rotation = (Math.random() - 0.5) * 0.3;
                this.floatTimer = Math.random() * 10;

                // Funny Meme Test Paper Stamps
                const MEME_LABELS = [
                    '0分 慘', '59分 哭', '不及格', '死心重修', '當掉!',

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;

                ctx.roundRect(-this.width / 2, -this.height / 2, this.width, this.height, 6);

                ctx.stroke();

                // Faint blue horizontal lines
                ctx.strokeStyle = '#cbd5e1';

                for (let i = -this.height / 2 + 20; i < this.height / 2 - 10; i += 11) {
                    ctx.beginPath();
                    ctx.moveTo(-this.width / 2 + 8, i);
                    ctx.lineTo(this.width / 2 - 8, i);

                }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.8) * 6,
                    size: Math.random() * 7 + 3,
                    color: color,
                    alpha: 1,
                    life: 0.04
                });
            }
        }

        function addFloatingText(x, y, text, color = '#f59e0b') {
            floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                alpha: 1,
                vy: -1.8
            });
        }

        function updateAndDrawParticles() {
            // Draw regular particle specks
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.life;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            // Draw floating meme text bubbles
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.025;

                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4.5;
                ctx.font = '900 24px "Noto Sans TC", sans-serif';
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
        }

        let bgOffset = 0;

        function drawClassroomBackground() {
            // Bright Yellow Classroom Wall
            const wallGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            wallGrad.addColorStop(0, '#fde047');
            wallGrad.addColorStop(0.7, '#fef08a');
            wallGrad.addColorStop(1, '#e2e8f0');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Large Classroom Chalkboard
            const boardMarginX = 50;
            const boardY = 45;
            const boardHeight = 230;
            
            // Outer Wooden Board Frame
            ctx.fillStyle = '#854d0e';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(boardMarginX, boardY, GAME_WIDTH - boardMarginX * 2, boardHeight, 14);
            ctx.fill();
            ctx.stroke();

            // Slate Green Chalkboard Surface
            ctx.fillStyle = '#064e3b';
            ctx.beginPath();
            ctx.roundRect(boardMarginX + 10, boardY + 10, GAME_WIDTH - boardMarginX * 2 - 20, boardHeight - 20, 8);
            ctx.fill();

            // Blackboard Title & Quotes - Enlarged text with "奶皇萬歲"
            ctx.fillStyle = '#fef08a';
            ctx.font = '900 36px "Noto Sans TC", sans-serif';
            ctx.fillText('👑 奶皇萬歲！萬歲！萬萬歲！ 🐸', boardMarginX + 110, boardY + 68);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.font = '900 24px "Noto Sans TC", sans-serif';
            ctx.fillText('💯 考卷退散！歐皇附體，奶皇永不重修！ 💯', boardMarginX + 110, boardY + 135);

            // Funny Chalk Stick Drawings
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 3;
            // Draw crown emoji on chalkboard side
            ctx.beginPath();
            ctx.arc(boardMarginX + 750, boardY + 130, 22, 0, Math.PI * 2);
            ctx.stroke();

            // Wooden Floor
            bgOffset = (bgOffset + gameSpeed) % 80;

            const floorGrad = ctx.createLinearGradient(0, GROUND_Y, 0, GAME_HEIGHT);
            floorGrad.addColorStop(0, '#f59e0b');
            floorGrad.addColorStop(1, '#92400e');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

            // Floor Seam Line
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(GAME_WIDTH, GROUND_Y);
            ctx.stroke();

            // Vertical scrolling plank lines
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
            for (let x = -bgOffset; x < GAME_WIDTH + 80; x += 80) {
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y);
                ctx.lineTo(x, GAME_HEIGHT);
                ctx.stroke();
            }
        }

        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function triggerGameOver() {
            if (isGameOver) return;
            isGameOver = true;
            isRunning = false;
            audio.playGameOver();

            // Collision explosion effect
            createParticles(frog.x + frog.width / 2, frog.y + frog.height / 2, 25, '#ef4444');
            addFloatingText(frog.x - 20, frog.y - 30, '哭啊！慘遭重修！', '#ef4444');

            // Update Highscore
            if (score > highScore) {
                highScore = score;
                window.__galleryStorage.setItem('milkfrog_meme_highscore', highScore);
            }

            // Pick random funny death quote
            const randomQuote = MEME_DEATH_QUOTES[Math.floor(Math.random() * MEME_DEATH_QUOTES.length)];
            memeDeathQuote.textContent = randomQuote;

            // Display UI
            finalScore.textContent = Math.floor(score);
            finalHighScore.textContent = Math.floor(highScore);
            highScoreText.textContent = String(Math.floor(highScore)).padStart(5, '0');
            gameOverOverlay.classList.remove('hidden');
        }

        function resetGame() {
            score = 0;
            gameSpeed = 6.5;
            frameCount = 0;
            obstacles = [];
            collectibles = [];
            particles = [];
            floatingTexts = [];
            tofuHazards = [];
            activeAlien = null;
            inkTimer = 0;
            shoeLaceTimer = 0;
            speedBoostTimer = 0;
            eventNoticeTimer = 0;
            firstAlienSpawned = false;
            nextEventFrame = 200; // Trigger 1st event within 3.3s (< 10 seconds)
            isGameOver = false;
            isRunning = true;
            frog.reset();
            scoreText.textContent = '00000';
            gameOverOverlay.classList.add('hidden');
            startOverlay.classList.add('hidden');
        }

        function triggerRandomMemeEvent() {
            const events = ['INK', 'TOFU', 'SHOELACE', 'SPEAKER', 'ALIEN'];
            let chosen = events[Math.floor(Math.random() * events.length)];

            // Guarantee Alien appears on the very first event trigger (within 10 seconds)
            if (!firstAlienSpawned) {
                chosen = 'ALIEN';
                firstAlienSpawned = true;
            }

            if (chosen === 'INK') {
                inkTimer = 220; // ~3.6 seconds of ink splatter screen coverage
                audio.playSplat();
                eventNoticeText = '🦑 墨魚噴墨！視線失明！';
                addFloatingText(frog.x - 10, frog.y - 40, '墨魚大俠來亂啦！', '#000000');
            } else if (chosen === 'TOFU') {
                tofuHazards.push(new FlyingTofu());
                tofuHazards.push(new FlyingTofu());
                eventNoticeText = '🧱 警告！飛天臭豆腐砸頭！';
                addFloatingText(frog.x - 10, frog.y - 40, '天上掉豆腐？！', '#eab308');
            } else if (chosen === 'SHOELACE') {
                shoeLaceTimer = 160; // Slow down tumble
                audio.playSlip();
                eventNoticeText = '👟 慘！鞋帶鬆掉摔跤啦！';
                addFloatingText(frog.x - 10, frog.y - 40, '鞋帶掉了腳滑！', '#ef4444');
            } else if (chosen === 'SPEAKER') {
                speedBoostTimer = 180;
                eventNoticeText = '📢 廣播：導師在後門狠瞪你！全速逃跑！';
                addFloatingText(frog.x - 10, frog.y - 40, '1.5x 極速衝刺！', '#f59e0b');
            } else if (chosen === 'ALIEN') {
                activeAlien = new MemeAlien();
                audio.playAlienSound();
                eventNoticeText = '👽 警告！外星人綁架！按右鍵 [→] 快衝！';
                addFloatingText(frog.x - 10, frog.y - 40, '外星人抓包啦！', '#22c55e');
            }

            eventNoticeTimer = 130;
        }

        function drawInkSplatter() {
            if (inkTimer <= 0) return;
            inkTimer--;

            ctx.save();
            const opacity = Math.min(0.9, inkTimer / 30);
            ctx.fillStyle = `rgba(15, 23, 42, ${opacity})`;

            // Draw 4 distinct ink blobs covering screen
            ctx.beginPath();
            ctx.ellipse(300, 180, 180, 130, 0.2, 0, Math.PI * 2);
            ctx.ellipse(650, 280, 220, 140, -0.1, 0, Math.PI * 2);
            ctx.ellipse(480, 380, 160, 100, 0.4, 0, Math.PI * 2);
            ctx.fill();

            // Ink drips
            ctx.fillStyle = `rgba(15, 23, 42, ${opacity})`;
            ctx.beginPath();
            ctx.arc(220, 290, 25, 0, Math.PI * 2);
            ctx.arc(380, 320, 30, 0, Math.PI * 2);
            ctx.arc(720, 420, 28, 0, Math.PI * 2);
            ctx.arc(520, 470, 22, 0, Math.PI * 2);
            ctx.fill();

            // Warning Text under ink (Enlarged)
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 28px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🦑 墨汁遮蔽中！憑直覺二段跳！', GAME_WIDTH / 2, 72);
            ctx.restore();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 1. Render Classroom Background
            drawClassroomBackground();

            if (isRunning) {
                frameCount++;
                score += 0.2; // Continuous distance score

                // Check speed modifiers (Speaker event)
                let currentSpeed = 6.5 + Math.floor(score / 140) * 0.5;
                if (speedBoostTimer > 0) {
                    speedBoostTimer--;
                    currentSpeed *= 1.45;
                }
                gameSpeed = currentSpeed;
                scoreText.textContent = String(Math.floor(score)).padStart(5, '0');

                // Trigger Random Meme Events every ~8-12 seconds
                if (frameCount >= nextEventFrame) {
                    triggerRandomMemeEvent();
                    nextEventFrame = frameCount + 420 + Math.floor(Math.random() * 250);
                }

                // Spawn Meme Exam Papers (Significantly reduced spawn rate during Alien chase)
                let spawnRate = Math.max(65, 125 - Math.floor(gameSpeed * 4));
                if (activeAlien) {
                    spawnRate = Math.floor(spawnRate * 2.5); // 外星人追趕時障礙物生成間隔拉長為 2.5 倍
                }
                if (frameCount % spawnRate === 0) {
                    obstacles.push(new MemeExamPaper());
                }

                // Spawn 100-Point Badges
                if (frameCount % 170 === 0 && Math.random() < 0.65) {
                    collectibles.push(new MemeCollectible());
                }

                if (shoeLaceTimer > 0) shoeLaceTimer--;
            }

            // 2. Collectibles Update & Render
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const item = collectibles[i];
                if (isRunning) item.update();
                item.draw();

                if (isRunning && !item.collected && checkCollision(frog.getBounds(), item.getBounds())) {
                    item.collected = true;
                    score += 66; // Bonus Points
                    audio.playScore();
                    createParticles(item.x, item.y, 12, '#fbbf24');
                    addFloatingText(item.x - 10, item.y - 20, '+100分！歐皇爆發！', '#fbbf24');
                    collectibles.splice(i, 1);
                } else if (item.x < -40) {
                    collectibles.splice(i, 1);
                }
            }

            // 3. Tofu Hazards Update & Render
            for (let i = tofuHazards.length - 1; i >= 0; i--) {
                const tofu = tofuHazards[i];
                if (isRunning) tofu.update();
                tofu.draw();

                if (isRunning && !tofu.hit && checkCollision(frog.getBounds(), tofu.getBounds())) {
                    tofu.hit = true;
                    frog.dizzyTimer = 90; // Stun frog head
                    audio.playBonk();
                    createParticles(frog.x + 30, frog.y, 15, '#fef08a');
                    addFloatingText(frog.x, frog.y - 20, '頭頂爆擊！暈眩！', '#ef4444');
                    tofuHazards.splice(i, 1);
                } else if (tofu.y > GAME_HEIGHT + 50 || tofu.x < -50) {
                    tofuHazards.splice(i, 1);
                }
            }

            // 3.5 Alien Pursuit Event Update & Render
            if (activeAlien) {
                if (isRunning) activeAlien.update();
                activeAlien.draw();

                // Check collision/catch condition with frog
                if (isRunning && checkCollision(frog.getBounds(), activeAlien.getBounds())) {
                    addFloatingText(frog.x, frog.y - 30, '被外星人綁架啦！', '#22c55e');
                    triggerGameOver();
                }

                // Remove alien when offscreen
                if (activeAlien.y < -100 || activeAlien.x > GAME_WIDTH + 100) {
                    activeAlien = null;
                }
            }

            // 4. Obstacles Update & Render
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                if (isRunning) obs.update();
                obs.draw();

                if (isRunning && checkCollision(frog.getBounds(), obs.getBounds())) {
                    triggerGameOver();
                }

                if (obs.x < -80) {
                    obstacles.splice(i, 1);
                }
            }

            // 5. Render Player Frog
            if (isRunning) frog.update();
            frog.draw();

            // 6. Ink Splatter Overlay (Random Event)
            drawInkSplatter();

            // 7. Event Notice Banner Rendering
            if (eventNoticeTimer > 0) {
                eventNoticeTimer--;
                ctx.save();
                ctx.fillStyle = '#fef08a';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.roundRect(GAME_WIDTH / 2 - 250, 12, 500, 50, 14);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#000000';
                ctx.font = '900 20px "Noto Sans TC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(eventNoticeText, GAME_WIDTH / 2, 44);
                ctx.restore();
            }

            // 8. Render Particle Effects & Floating Text
            updateAndDrawParticles();

            requestAnimationFrame(gameLoop);
        }

        // Button Event Listeners
        startBtn.addEventListener('click', () => {
            audio.init();
            resetGame();
        });

        restartBtn.addEventListener('click', () => {
            audio.init();
            resetGame();
        });

        // Start animation loop
        requestAnimationFrame(gameLoop);
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
