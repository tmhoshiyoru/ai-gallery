    <script>
        const GAME_STATES = { MENU: 'MENU', PLAYING: 'PLAYING', GAMEOVER: 'GAMEOVER' };
        let currentState = GAME_STATES.MENU;

        // 跑道座標設定 (左:-2.2, 中:0, 右:2.2)
        const LANES = [-2.2, 0, 2.2];
        let currentLane = 1; // 預設中間 (index 1)
        let targetX = 0;

        // 玩家動作屬性
        let playerY = 0;
        let isJumping = false;
        let jumpVelocity = 0;
        const jumpPower = 0.32;
        const gravity = -0.018;

        let isSliding = false;
        let slideTimer = 0;
        const slideDuration = 35; // 幀數

        // 遊戲數值
        let score = 0;
        let distance = 0;
        let coinsCollected = 0;
        let baseSpeed = 0.45;
        let speed = baseSpeed;
        const maxSpeed = 0.95;

        // 本地儲存資料
        let highScore = parseInt(window.__galleryStorage.getItem('cyber_run_high_score')) || 0;
        let totalCoins = parseInt(window.__galleryStorage.getItem('cyber_run_total_coins')) || 0;
        let activeSkinId = window.__galleryStorage.getItem('cyber_run_active_skin') || 'default';

        // 道具狀態 (計時器以幀數為單位)
        let powerups = {
            magnetTimer: 0,
            shieldActive: false,
            multiplierTimer: 0
        };

        // 皮膚資料列表
        const SKINS = [
            { id: 'default', name: '經典科技藍', color: 0x06b6d4, price: 0, unlocked: true },
            { id: 'ruby', name: '疾風寶紅', color: 0xef4444, price: 100, unlocked: false },
            { id: 'gold', name: '璀璨尊爵金', color: 0xeab308, price: 250, unlocked: false },
            { id: 'emerald', name: '極光寶石綠', color: 0x10b981, price: 400, unlocked: false },
            { id: 'neon', name: '霓虹賽博粉', color: 0xec4899, price: 600, unlocked: false }
        ];

        // 載入已解鎖皮膚
        const savedUnlocked = JSON.parse(window.__galleryStorage.getItem('cyber_run_unlocked_skins'));
        if (savedUnlocked && Array.isArray(savedUnlocked)) {
            SKINS.forEach(s => {
                if (savedUnlocked.includes(s.id)) s.unlocked = true;
            });
        }

        class SoundSystem {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, duration, type = 'sine') {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }
            playCoin() {
                this.playTone(987.77, 0.08, 'sine');
                setTimeout(() => this.playTone(1318.51, 0.15, 'sine'), 50);
            }
            playJump() {
                this.playTone(300, 0.15, 'triangle');
            }
            playPowerup() {
                this.playTone(523.25, 0.1, 'square');
                setTimeout(() => this.playTone(659.25, 0.1, 'square'), 80);
                setTimeout(() => this.playTone(783.99, 0.2, 'square'), 160);
            }
            playHit() {
                this.playTone(120, 0.3, 'sawtooth');
            }
        }
        const sounds = new SoundSystem();

        let scene, camera, renderer;
        let playerGroup, playerLeftLeg, playerRightLeg, shieldMesh;
        let roadSegments = [];
        let obstacles = [];
        let coins = [];
        let powerupItems = [];
        let particles = [];

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.8, -6.5);
            camera.lookAt(0, 1.6, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, -10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createPlayerModel();

            // 生成初始地塊
            for (let i = 0; i < 10; i++) {
                const seg = createRoadSegment(i * 20);
                roadSegments.push(seg);
                scene.add(seg);
            }

            window.addEventListener('resize', onWindowResize);
        }

        function createPlayerModel() {
            if (playerGroup) scene.remove(playerGroup);

            playerGroup = new THREE.Group();

            const skin = SKINS.find(s => s.id === activeSkinId) || SKINS[0];
            const bodyMat = new THREE.MeshStandardMaterial({ color: skin.color, roughness: 0.3, metalness: 0.5 });
            const jointMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
            const visorMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

            // 身體
            const bodyGeo = new THREE.BoxGeometry(0.7, 0.9, 0.4);
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = 1.05;
            bodyMesh.castShadow = true;
            playerGroup.add(bodyMesh);

            // 頭部
            const headGeo = new THREE.BoxGeometry(0.45, 0.45, 0.45);
            const headMesh = new THREE.Mesh(headGeo, bodyMat);
            headMesh.position.y = 1.75;
            headMesh.castShadow = true;

            // 護目鏡
            const visorGeo = new THREE.BoxGeometry(0.35, 0.12, 0.1);
            const visorMesh = new THREE.Mesh(visorGeo, visorMat);
            visorMesh.position.set(0, 0.02, 0.22);
            headMesh.add(visorMesh);

            playerGroup.add(headMesh);

            // 雙腿
            const legGeo = new THREE.BoxGeometry(0.22, 0.6, 0.22);

            playerLeftLeg = new THREE.Mesh(legGeo, jointMat);
            playerLeftLeg.position.set(-0.2, 0.3, 0);
            playerLeftLeg.castShadow = true;
            playerGroup.add(playerLeftLeg);

            playerRightLeg = new THREE.Mesh(legGeo, jointMat);
            playerRightLeg.position.set(0.2, 0.3, 0);
            playerRightLeg.castShadow = true;
            playerGroup.add(playerRightLeg);

            // 護盾光罩 (預設隱藏)
            const shieldGeo = new THREE.SphereGeometry(1.2, 16, 16);
            const shieldMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35, wireframe: true });
            shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
            shieldMesh.position.y = 1.0;
            shieldMesh.visible = false;
            playerGroup.add(shieldMesh);

            scene.add(playerGroup);
        }

        function createRoadSegment(zPos) {
            const group = new THREE.Group();
            group.position.z = zPos;

            // 主路面
            const roadGeo = new THREE.BoxGeometry(8, 0.2, 20);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
            const roadMesh = new THREE.Mesh(roadGeo, roadMat);
            roadMesh.position.set(0, -0.1, 10);
            roadMesh.receiveShadow = true;
            group.add(roadMesh);

            // 霓虹分道線
            [-1.1, 1.1].forEach(x => {
                const lineGeo = new THREE.BoxGeometry(0.08, 0.22, 20);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x0284c7 });
                const lineMesh = new THREE.Mesh(lineGeo, lineMat);
                lineMesh.position.set(x, -0.08, 10);
                group.add(lineMesh);
            });

            // 兩側護欄
            [-4.1, 4.1].forEach(x => {
                const borderGeo = new THREE.BoxGeometry(0.3, 0.5, 20);
                const borderMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8 });
                const borderMesh = new THREE.Mesh(borderGeo, borderMat);
                borderMesh.position.set(x, 0.1, 10);
                group.add(borderMesh);
            });

            return group;
        }

        function spawnElements(zPos) {
            if (zPos < 35) return; // 前端保持安全清空

            const laneIndex = Math.floor(Math.random() * 3);
            const laneX = LANES[laneIndex];

            // 障礙物生成
            if (Math.random() < 0.65) {
                const isHigh = Math.random() < 0.35;
                const obsGeo = isHigh ? new THREE.BoxGeometry(2.0, 0.8, 0.4) : new THREE.BoxGeometry(2.0, 1.0, 0.5);
                const obsMat = new THREE.MeshStandardMaterial({
                    color: isHigh ? 0xf97316 : 0xef4444,
                    emissive: isHigh ? 0x7c2d12 : 0x7f1d1d,
                    roughness: 0.2
                });
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.set(laneX, isHigh ? 2.2 : 0.5, zPos + 10);
                obs.userData = { isHigh };
                obs.castShadow = true;
                scene.add(obs);
                obstacles.push(obs);
            }

            // 金幣生成 (挑選不同軌道)
            const coinLane = (laneIndex + 1 + Math.floor(Math.random() * 2)) % 3;
            const coinX = LANES[coinLane];
            const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 12);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, roughness: 0.1 });

            const numCoins = Math.floor(Math.random() * 4) + 2;
            for (let c = 0; c < numCoins; c++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(coinX, 0.7, zPos + 5 + c * 2.2);
                coin.castShadow = true;
                scene.add(coin);
                coins.push(coin);
            }

            // 稀有道具生成
            if (Math.random() < 0.14) {
                const pLane = LANES[Math.floor(Math.random() * 3)];
                const types = ['magnet', 'shield', 'multiplier'];
                const selectedType = types[Math.floor(Math.random() * types.length)];

                let pColor = 0x38bdf8;
                if (selectedType === 'shield') pColor = 0x2dd4bf;
                if (selectedType === 'multiplier') pColor = 0xc084fc;

                const pGeo = new THREE.OctahedronGeometry(0.4);
                const pMat = new THREE.MeshStandardMaterial({ color: pColor, emissive: pColor, emissiveIntensity: 0.5 });
                const pMesh = new THREE.Mesh(pGeo, pMat);
                pMesh.position.set(pLane, 1.0, zPos + 12);
                pMesh.userData = { pType: selectedType };
                scene.add(pMesh);
                powerupItems.push(pMesh);
            }
        }

        // 【核心控制邏輯】按鍵功能反轉：按左往右，按右往左
        function handleInvertedMoveLeft() {
            // 原本的左搬移 -> 現在變成【往右切換軌道】
            if (currentLane < 2) {
                currentLane++;
            }
        }

        function handleInvertedMoveRight() {
            // 原本的右搬移 -> 現在變成【往左切換軌道】
            if (currentLane > 0) {
                currentLane--;
            }
        }

        function handleJump() {
            if (!isJumping && !isSliding) {
                isJumping = true;
                jumpVelocity = jumpPower;
                sounds.playJump();
            }
        }

        function handleSlide() {
            if (!isSliding && !isJumping) {
                isSliding = true;
                slideTimer = slideDuration;
            }
        }

        function setupControls() {
            // 1. 鍵盤事件控制
            window.addEventListener('keydown', (e) => {
                if (currentState !== GAME_STATES.PLAYING) return;

                switch (e.key) {
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        handleInvertedMoveLeft(); // 左鍵 -> 右移
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        handleInvertedMoveRight(); // 右鍵 -> 左移
                        break;
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                    case ' ':
                        handleJump();
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        handleSlide();
                        break;
                }
            });

            // 2. 螢幕按鈕點擊事件 (按鈕標示與動作反轉)
            document.getElementById('btn-left').addEventListener('click', handleInvertedMoveLeft);
            document.getElementById('btn-right').addEventListener('click', handleInvertedMoveRight);
            document.getElementById('btn-up').addEventListener('click', handleJump);
            document.getElementById('btn-down').addEventListener('click', handleSlide);

            // 3. 手勢滑動控制 (滑動方向反轉)
            let touchStartX = 0;
            let touchStartY = 0;

            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                if (currentState !== GAME_STATES.PLAYING) return;

                const diffX = e.changedTouches[0].clientX - touchStartX;
                const diffY = e.changedTouches[0].clientY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 30) {
                        // 向右滑動 -> 執行右按鍵反轉動作 (角色往左)
                        handleInvertedMoveRight();
                    } else if (diffX < -30) {
                        // 向左滑動 -> 執行左按鍵反轉動作 (角色往右)
                        handleInvertedMoveLeft();
                    }
                } else {
                    if (diffY < -30) {
                        handleJump();
                    } else if (diffY > 30) {
                        handleSlide();
                    }
                }
            }, { passive: true });
        }

        function createParticles(pos, color, count = 8) {
            const pGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
            const pMat = new THREE.MeshBasicMaterial({ color: color });

            for (let i = 0; i < count; i++) {
                const mesh = new THREE.Mesh(pGeo, pMat);
                mesh.position.copy(pos);
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3,
                    Math.random() * 0.3 + 0.1,
                    (Math.random() - 0.5) * 0.3
                );
                scene.add(mesh);
                particles.push({ mesh, vel, life: 25 });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.add(p.vel);
                p.life--;
                p.mesh.scale.multiplyScalar(0.92);
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        function updatePowerups() {
            // 磁鐵
            if (powerups.magnetTimer > 0) {
                powerups.magnetTimer--;
            }

            // 雙倍得分
            if (powerups.multiplierTimer > 0) {
                powerups.multiplierTimer--;
                document.getElementById('multiplier-badge').classList.remove('hidden');
            } else {
                document.getElementById('multiplier-badge').classList.add('hidden');
            }

            // 護盾顯示
            if (shieldMesh) {
                shieldMesh.visible = powerups.shieldActive;
            }

            // 更新 UI 圖示
            const activeContainer = document.getElementById('active-powerups');
            activeContainer.innerHTML = '';

            if (powerups.magnetTimer > 0) {
                activeContainer.innerHTML += `
                    <div class="glass-panel px-3 py-1.5 rounded-xl text-cyan-400 text-xs font-bold flex items-center gap-1 shadow">
                        <i class="fa-solid fa-magnet"></i> ${(powerups.magnetTimer / 60).toFixed(0)}s
                    </div>`;
            }
            if (powerups.shieldActive) {
                activeContainer.innerHTML += `
                    <div class="glass-panel px-3 py-1.5 rounded-xl text-teal-300 text-xs font-bold flex items-center gap-1 shadow">
                        <i class="fa-solid fa-shield-halved"></i> 護盾中
                    </div>`;
            }
            if (powerups.multiplierTimer > 0) {
                activeContainer.innerHTML += `
                    <div class="glass-panel px-3 py-1.5 rounded-xl text-purple-400 text-xs font-bold flex items-center gap-1 shadow">
                        <i class="fa-solid fa-bolt"></i> 2X
                    </div>`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (currentState === GAME_STATES.PLAYING) {
                // 1. 速度與距離遞增
                speed = Math.min(maxSpeed, baseSpeed + (distance / 15000));
                distance += speed * 0.4;
                const scoreAdd = (powerups.multiplierTimer > 0 ? 2 : 1);
                score += Math.round(speed * 3 * scoreAdd);

                // 更新 HUD
                document.getElementById('score-text').textContent = String(score).padStart(6, '0');
                document.getElementById('distance-text').textContent = Math.floor(distance) + ' m';
                document.getElementById('coin-text').textContent = coinsCollected;

                // 2. 玩家橫向平滑切換
                targetX = LANES[currentLane];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.22;

                // 3. 跳躍與重力物理計算
                if (isJumping) {
                    playerY += jumpVelocity;
                    jumpVelocity += gravity;
                    if (playerY <= 0) {
                        playerY = 0;
                        isJumping = false;
                    }
                }
                playerGroup.position.y = playerY;

                // 4. 滑行動作處置
                if (isSliding) {
                    slideTimer--;
                    playerGroup.scale.set(1, 0.5, 1);
                    if (slideTimer <= 0) {
                        isSliding = false;
                        playerGroup.scale.set(1, 1, 1);
                    }
                } else {
                    playerGroup.scale.set(1, 1, 1);
                }

                // 雙腿跑步擺動動畫
                const legSwing = Math.sin(Date.now() * 0.018 * (speed / baseSpeed)) * 0.6;
                if (!isJumping && !isSliding) {
                    playerLeftLeg.rotation.x = legSwing;
                    playerRightLeg.rotation.x = -legSwing;
                } else {
                    playerLeftLeg.rotation.x = 0;
                    playerRightLeg.rotation.x = 0;
                }

                // 5. 滾動與生成道路段落
                roadSegments.forEach(seg => {
                    seg.position.z -= speed;
                    if (seg.position.z < -20) {
                        seg.position.z += 200;
                        spawnElements(seg.position.z);
                    }
                });

                // 6. 障礙物位置更新與撞擊判定
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z -= speed;

                    // 撞擊判定範圍
                    if (Math.abs(obs.position.z) < 0.85 && Math.abs(obs.position.x - playerGroup.position.x) < 0.9) {
                        let hit = false;
                        if (obs.userData.isHigh) {
                            // 高障礙：如果沒蹲下 (slide) 就會撞到
                            if (!isSliding) hit = true;
                        } else {
                            // 低障礙：如果沒跳過 (y < 0.8) 就會撞到
                            if (playerY < 0.8) hit = true;
                        }

                        if (hit) {
                            if (powerups.shieldActive) {
                                // 消耗護盾抵擋撞擊
                                powerups.shieldActive = false;
                                createParticles(obs.position, 0x38bdf8, 15);
                                scene.remove(obs);
                                obstacles.splice(i, 1);
                                sounds.playHit();
                                continue;
                            } else {
                                // 遊戲結束
                                triggerGameOver();
                                break;
                            }
                        }
                    }

                    if (obs.position.z < -10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // 7. 金幣收集與磁鐵吸附邏輯
                for (let i = coins.length - 1; i >= 0; i--) {
                    const coin = coins[i];
                    coin.position.z -= speed;
                    coin.rotation.z += 0.08;

                    // 磁鐵道具效果：拉近金幣
                    if (powerups.magnetTimer > 0 && coin.position.z > -2 && coin.position.z < 18) {
                        coin.position.x += (playerGroup.position.x - coin.position.x) * 0.18;
                        coin.position.y += (playerY + 0.7 - coin.position.y) * 0.18;
                    }

                    // 金幣吃取判定
                    const distToPlayer = coin.position.distanceTo(new THREE.Vector3(playerGroup.position.x, playerY + 0.7, 0));
                    if (distToPlayer < 1.1) {
                        coinsCollected++;
                        totalCoins++;
                        score += 50 * (powerups.multiplierTimer > 0 ? 2 : 1);
                        createParticles(coin.position, 0xfacc15, 6);
                        sounds.playCoin();
                        scene.remove(coin);
                        coins.splice(i, 1);
                        continue;
                    }

                    if (coin.position.z < -10) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                    }
                }

                // 8. 道具撿拾判定
                for (let i = powerupItems.length - 1; i >= 0; i--) {
                    const item = powerupItems[i];
                    item.position.z -= speed;
                    item.rotation.y += 0.05;

                    const distToPlayer = item.position.distanceTo(new THREE.Vector3(playerGroup.position.x, playerY + 0.7, 0));
                    if (distToPlayer < 1.2) {
                        const pType = item.userData.pType;
                        if (pType === 'magnet') powerups.magnetTimer = 450; // 約7.5秒
                        if (pType === 'shield') powerups.shieldActive = true;
                        if (pType === 'multiplier') powerups.multiplierTimer = 400; // 約6.6秒

                        sounds.playPowerup();
                        createParticles(item.position, 0x38bdf8, 12);
                        scene.remove(item);
                        powerupItems.splice(i, 1);
                        continue;
                    }

                    if (item.position.z < -10) {
                        scene.remove(item);
                        powerupItems.splice(i, 1);
                    }
                }

                updatePowerups();
                updateParticles();
            } else {
                // 選單畫面下的背景旋轉效果
                roadSegments.forEach(seg => {
                    seg.position.z -= 0.1;
                    if (seg.position.z < -20) seg.position.z += 200;
                });
            }

            renderer.render(scene, camera);
        }

        function startGame() {
            sounds.init();
            currentState = GAME_STATES.PLAYING;

            // 重設數值
            score = 0;
            distance = 0;
            coinsCollected = 0;
            speed = baseSpeed;
            currentLane = 1;
            playerY = 0;
            isJumping = false;
            isSliding = false;
            powerups = { magnetTimer: 0, shieldActive: false, multiplierTimer: 0 };

            // 清理場上物件
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            powerupItems.forEach(p => scene.remove(p));
            obstacles = [];
            coins = [];
            powerupItems = [];

            // 切換 UI
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('touch-controls').classList.remove('hidden');
        }

        function triggerGameOver() {
            currentState = GAME_STATES.GAMEOVER;
            sounds.playHit();

            // 儲存金幣與高分紀錄
            window.__galleryStorage.setItem('cyber_run_total_coins', totalCoins);
            let isNewRecord = false;
            if (score > highScore) {
                highScore = score;
                window.__galleryStorage.setItem('cyber_run_high_score', highScore);
                isNewRecord = true;
            }

            // 更新 Game Over 介面
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-distance').textContent = Math.floor(distance) + ' m';
            document.getElementById('final-coins').textContent = coinsCollected;

            const recordBadge = document.getElementById('new-record-badge');
            if (isNewRecord) {
                recordBadge.classList.remove('hidden');
            } else {
                recordBadge.classList.add('hidden');
            }

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('touch-controls').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function updateMenuData() {
            document.getElementById('high-score-text').textContent = highScore;
            document.getElementById('total-coins-text').innerHTML = `<i class="fa-solid fa-coins text-sm"></i> ${totalCoins}`;
        }

        function renderShop() {
            document.getElementById('shop-coins-text').textContent = totalCoins;
            const skinList = document.getElementById('skin-list');
            skinList.innerHTML = '';

            SKINS.forEach(skin => {
                const isEquipped = activeSkinId === skin.id;
                const hexColor = '#' + skin.color.toString(16).padStart(6, '0');

                const item = document.createElement('div');
                item.className = `glass-panel p-3 rounded-2xl flex items-center justify-between border ${isEquipped ? 'border-amber-400 bg-amber-500/10' : 'border-slate-800'}`;

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full shadow-inner border border-white/20" style="background-color: ${hexColor}"></div>
                        <div>
                            <div class="font-bold text-sm text-white">${skin.name}</div>
                            <div class="text-xs text-slate-400">${skin.unlocked ? '已擁有' : `售價: ${skin.price} 金幣`}</div>
                        </div>
                    </div>
                `;

                const btn = document.createElement('button');
                if (isEquipped) {
                    btn.className = 'px-4 py-1.5 rounded-xl bg-amber-500/20 text-amber-300 font-bold text-xs border border-amber-400/40 cursor-default';
                    btn.textContent = '裝備中';
                } else if (skin.unlocked) {
                    btn.className = 'px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold text-xs border border-cyan-500/30 active:scale-95 transition';
                    btn.textContent = '使用';
                    btn.onclick = () => {
                        activeSkinId = skin.id;
                        window.__galleryStorage.setItem('cyber_run_active_skin', activeSkinId);
                        createPlayerModel();
                        renderShop();
                    };
                } else {
                    const canAfford = totalCoins >= skin.price;
                    btn.className = `px-4 py-1.5 rounded-xl font-bold text-xs active:scale-95 transition ${canAfford ? 'bg-amber-500 text-slate-950 hover:bg-amber-400 shadow-md shadow-amber-500/20' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`;
                    btn.textContent = '購買';
                    btn.onclick = () => {
                        if (canAfford) {
                            totalCoins -= skin.price;
                            skin.unlocked = true;
                            activeSkinId = skin.id;
                            window.__galleryStorage.setItem('cyber_run_total_coins', totalCoins);
                            window.__galleryStorage.setItem('cyber_run_active_skin', activeSkinId);
                            window.__galleryStorage.setItem('cyber_run_unlocked_skins', JSON.stringify(SKINS.filter(s => s.unlocked).map(s => s.id)));
                            createPlayerModel();
                            updateMenuData();
                            renderShop();
                            sounds.playPowerup();
                        }
                    };
                }

                item.appendChild(btn);
                skinList.appendChild(item);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = function () {
            initThree();
            setupControls();
            updateMenuData();

            // UI 按鈕監聽
            document.getElementById('btn-start').addEventListener('click', startGame);
            document.getElementById('btn-restart').addEventListener('click', startGame);

            document.getElementById('btn-menu').addEventListener('click', () => {
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
                updateMenuData();
                currentState = GAME_STATES.MENU;
            });

            document.getElementById('btn-shop').addEventListener('click', () => {
                renderShop();
                document.getElementById('shop-modal').classList.remove('hidden');
            });

            document.getElementById('btn-close-shop').addEventListener('click', () => {
                document.getElementById('shop-modal').classList.add('hidden');
            });

            // 啟動主繪圖循環
            animate();
        };
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
