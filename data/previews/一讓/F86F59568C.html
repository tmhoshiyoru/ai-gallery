    <script>
        // Web Audio Synthesizer
        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }
            playEat() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450 + Math.random() * 200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.06);
            }
            playKill() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }
            playDie() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const sound = new SoundFX();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const miniCtx = minimapCanvas.getContext('2d');

        // Optimized World Configuration
        const WORLD_SIZE = 3400;
        const FOOD_COUNT = 450; // Optimized food density
        const MIN_AI_COUNT = 12;

        const SKINS = [
            { id: 'emerald', name: '翡翠綠', head: '#10b981', body: '#059669' },
            { id: 'cyan', name: '電光藍', head: '#06b6d4', body: '#0284c7' },
            { id: 'purple', name: '幻影紫', head: '#a855f7', body: '#7e22ce' },
            { id: 'amber', name: '烈焰黃', head: '#f59e0b', body: '#d97706' },
            { id: 'rose', name: '霓虹粉', head: '#f43f5e', body: '#be123c' }
        ];

        let selectedSkin = SKINS[0];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function lerpAngle(a, b, step) {
            let cs = (1 - step) * Math.cos(a) + step * Math.cos(b);
            let sn = (1 - step) * Math.sin(a) + step * Math.sin(b);
            return Math.atan2(sn, cs);
        }

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        class Snake {
            constructor(id, name, x, y, skin, isAI = false) {
                this.id = id;
                this.name = name;
                this.x = x;
                this.y = y;
                this.skin = skin;
                this.isAI = isAI;

                this.angle = Math.random() * Math.PI * 2;
                this.targetAngle = this.angle;
                this.turnSpeed = 0.15;

                this.baseSpeed = 5.0;
                this.boostSpeed = 9.5;
                this.speed = this.baseSpeed;
                this.isBoosting = false;

                this.radius = 14;
                this.score = 0;
                this.kills = 0;
                this.isDead = false;

                this.length = 20;
                this.segmentSpacing = 8;
                this.segments = [];
                for (let i = 0; i < this.length; i++) {
                    this.segments.push({ x: this.x - i * this.segmentSpacing * Math.cos(this.angle), y: this.y - i * this.segmentSpacing * Math.sin(this.angle) });
                }

                this.aiTargetFood = null;
                this.aiChangeTargetTimer = 0;
            }

            update() {
                if (this.isDead) return;

                if (this.isBoosting && this.length > 10) {
                    this.speed = this.boostSpeed;
                    if (Math.random() < 0.25) {
                        this.length = Math.max(10, this.length - 0.2);
                        this.score = Math.max(0, Math.floor(this.score - 2));
                        const tail = this.segments[this.segments.length - 1];
                        if (tail) {
                            foods.push(new Food(tail.x + randomRange(-4, 4), tail.y + randomRange(-4, 4), 1.5, true));
                        }
                    }
                } else {
                    this.speed = this.baseSpeed;
                    this.isBoosting = false;
                }

                this.angle = lerpAngle(this.angle, this.targetAngle, this.turnSpeed);

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Boundary check
                if (this.x < 50 || this.x > WORLD_SIZE - 50 || this.y < 50 || this.y > WORLD_SIZE - 50) {
                    const centerAngle = Math.atan2(WORLD_SIZE / 2 - this.y, WORLD_SIZE / 2 - this.x);
                    this.targetAngle = centerAngle;

                    if (this.x <= 20 || this.x >= WORLD_SIZE - 20 || this.y <= 20 || this.y >= WORLD_SIZE - 20) {
                        this.die("撞擊了邊界結界！");
                        return;
                    }
                }

                this.segments[0] = { x: this.x, y: this.y };

                const targetSegCount = Math.floor(this.length);
                while (this.segments.length < targetSegCount) {
                    const last = this.segments[this.segments.length - 1];
                    this.segments.push({ x: last.x, y: last.y });
                }
                while (this.segments.length > targetSegCount) {
                    this.segments.pop();
                }

                for (let i = 1; i < this.segments.length; i++) {
                    const prev = this.segments[i - 1];
                    const curr = this.segments[i];
                    const dx = prev.x - curr.x;
                    const dy = prev.y - curr.y;

                    if (dx * dx + dy * dy > this.segmentSpacing * this.segmentSpacing) {
                        const ang = Math.atan2(dy, dx);
                        curr.x = prev.x - Math.cos(ang) * this.segmentSpacing;
                        curr.y = prev.y - Math.sin(ang) * this.segmentSpacing;
                    }
                }

                this.radius = 12 + Math.min(20, Math.floor(this.length / 30));
            }

            die(reason) {
                if (this.isDead) return;
                this.isDead = true;

                for (let i = 0; i < this.segments.length; i += 2) {
                    const seg = this.segments[i];
                    foods.push(new Food(seg.x + randomRange(-12, 12), seg.y + randomRange(-12, 12), randomRange(3, 7), true));
                }

                if (!this.isAI) {
                    sound.playDie();
                    showGameOverModal(reason);
                }
            }

            draw(ctx, camera) {
                if (this.isDead) return;

                const screenWidth = canvas.width;
                const screenHeight = canvas.height;

                // Render Body Segments with viewport culling
                for (let i = this.segments.length - 1; i >= 0; i--) {
                    const seg = this.segments[i];
                    const screenX = seg.x - camera.x;
                    const screenY = seg.y - camera.y;

                    // Viewport Culling
                    if (screenX < -40 || screenX > screenWidth + 40 || screenY < -40 || screenY > screenHeight + 40) continue;

                    const segRadius = this.radius * (1 - (i / this.segments.length) * 0.22);

                    ctx.beginPath();
                    ctx.arc(screenX, screenY, segRadius, 0, Math.PI * 2);
                    ctx.fillStyle = (i % 2 === 0) ? this.skin.head : this.skin.body;
                    ctx.fill();
                }

                // Render Head Features
                const head = this.segments[0];
                const headX = head.x - camera.x;
                const headY = head.y - camera.y;

                if (headX >= -50 && headX <= screenWidth + 50 && headY >= -50 && headY <= screenHeight + 50) {
                    const eyeOffset = this.radius * 0.55;
                    const eyeAngle = 0.6;
                    
                    const leftEyeX = headX + Math.cos(this.angle - eyeAngle) * eyeOffset;
                    const leftEyeY = headY + Math.sin(this.angle - eyeAngle) * eyeOffset;
                    const rightEyeX = headX + Math.cos(this.angle + eyeAngle) * eyeOffset;
                    const rightEyeY = headY + Math.sin(this.angle + eyeAngle) * eyeOffset;

                    // Outer white eyes
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(leftEyeX, leftEyeY, this.radius * 0.35, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(rightEyeX, rightEyeY, this.radius * 0.35, 0, Math.PI * 2); ctx.fill();

                    // Pupils
                    ctx.fillStyle = '#0f172a';
                    const pupilDist = this.radius * 0.12;
                    ctx.beginPath(); ctx.arc(leftEyeX + Math.cos(this.angle) * pupilDist, leftEyeY + Math.sin(this.angle) * pupilDist, this.radius * 0.2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(rightEyeX + Math.cos(this.angle) * pupilDist, rightEyeY + Math.sin(this.angle) * pupilDist, this.radius * 0.2, 0, Math.PI * 2); ctx.fill();

                    // Boost ring (Lightweight effect without shadowBlur)
                    if (this.isBoosting) {
                        ctx.beginPath();
                        ctx.arc(headX, headY, this.radius + 4, 0, Math.PI * 2);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    // Name Tag
                    ctx.font = 'bold 12px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.fillText(this.name, headX, headY - this.radius - 8);
                }
            }
        }

        class AISnake extends Snake {
            constructor(id, name, x, y, skin) {
                super(id, name, x, y, skin, true);
            }

            updateAI(allSnakes, foods) {
                if (this.isDead) return;

                this.aiChangeTargetTimer--;

                let dangerDetected = false;
                for (let other of allSnakes) {
                    if (other.id === this.id || other.isDead) continue;

                    // Quick Bounding Box Filter
                    if (Math.abs(this.x - other.x) > 300 || Math.abs(this.y - other.y) > 300) continue;

                    for (let i = 0; i < other.segments.length; i += 4) {
                        const seg = other.segments[i];
                        const dx = this.x - seg.x;
                        const dy = this.y - seg.y;
                        if (dx * dx + dy * dy < (this.radius + 45) * (this.radius + 45)) {
                            this.targetAngle = Math.atan2(dy, dx);
                            dangerDetected = true;
                            this.isBoosting = (this.length > 15);
                            break;
                        }
                    }
                    if (dangerDetected) break;
                }

                if (!dangerDetected && (this.aiChangeTargetTimer <= 0 || !this.aiTargetFood)) {
                    this.aiChangeTargetTimer = 80 + Math.floor(Math.random() * 60);
                    this.isBoosting = false;

                    let closest = null;
                    let minDistSq = 350 * 350;
                    for (let f of foods) {
                        const dx = this.x - f.x;
                        const dy = this.y - f.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < minDistSq) {
                            minDistSq = distSq;
                            closest = f;
                        }
                    }

                    if (closest) {
                        this.aiTargetFood = closest;
                        this.targetAngle = Math.atan2(closest.y - this.y, closest.x - this.x);
                    } else {
                        this.targetAngle += randomRange(-0.8, 0.8);
                    }
                }

                super.update();
            }
        }

        const SMALL_FRUITS = ['🫐', '🍒', '🍓', '🍋', '🍏', '🍐'];
        const MEDIUM_FRUITS = ['🍎', '🍊', '🍌', '🥝', '🍑', '🥑'];
        const LARGE_FRUITS = ['🍉', '🍍', '🍇', '🥭', '🍈'];

        class Food {
            constructor(x, y, value = 1, isDropped = false) {
                this.x = x;
                this.y = y;
                this.value = value;
                this.radius = 8 + Math.min(value * 2, 12);
                this.isDropped = isDropped;
                
                if (value >= 4) {
                    this.emoji = LARGE_FRUITS[Math.floor(Math.random() * LARGE_FRUITS.length)];
                } else if (value >= 2) {
                    this.emoji = MEDIUM_FRUITS[Math.floor(Math.random() * MEDIUM_FRUITS.length)];
                } else {
                    this.emoji = SMALL_FRUITS[Math.floor(Math.random() * SMALL_FRUITS.length)];
                }

                this.pulse = Math.random() * Math.PI * 2;
                this.fontSize = Math.max(14, Math.floor(this.radius * 1.8));
                this.fontString = `${this.fontSize}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
            }

            drawFast(ctx, camera, camLeft, camRight, camTop, camBottom) {
                // Viewport Culling for maximum FPS
                if (this.x < camLeft || this.x > camRight || this.y < camTop || this.y > camBottom) return;

                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                if (this.isDropped) {
                    this.pulse += 0.08;
                    const animatedRadius = this.radius + Math.sin(this.pulse) * 2;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, animatedRadius * 1.1, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 220, 100, 0.25)';
                    ctx.fill();
                }

                ctx.font = this.fontString;
                ctx.fillText(this.emoji, screenX, screenY);
            }
        }

        let player = null;
        let snakes = [];
        let foods = [];

        function spawnFood(count) {
            for (let i = 0; i < count; i++) {
                foods.push(new Food(
                    randomRange(80, WORLD_SIZE - 80),
                    randomRange(80, WORLD_SIZE - 80),
                    Math.random() < 0.12 ? randomRange(2, 4) : 1
                ));
            }
        }

        function checkCollisions() {
            // 1. Food Consumption
            for (let snake of snakes) {
                if (snake.isDead) continue;

                for (let i = foods.length - 1; i >= 0; i--) {
                    const f = foods[i];
                    // Broad phase check
                    const dx = snake.x - f.x;
                    const dy = snake.y - f.y;
                    const minDist = snake.radius + f.radius;

                    if (Math.abs(dx) < minDist && Math.abs(dy) < minDist) {
                        if (dx * dx + dy * dy < minDist * minDist) {
                            snake.score += f.value * 12;
                            snake.length += f.value * 0.45;
                            if (!snake.isAI) sound.playEat();
                            foods.splice(i, 1);
                        }
                    }
                }
            }

            if (foods.length < FOOD_COUNT) {
                spawnFood(FOOD_COUNT - foods.length);
            }

            // 2. Snake Collisions
            for (let snakeA of snakes) {
                if (snakeA.isDead) continue;

                for (let snakeB of snakes) {
                    if (snakeB.isDead) continue;

                    if (Math.abs(snakeA.x - snakeB.x) > 400 || Math.abs(snakeA.y - snakeB.y) > 400) continue;

                    const startSeg = (snakeA.id === snakeB.id) ? 5 : 0;

                    for (let j = startSeg; j < snakeB.segments.length; j += 2) {
                        const seg = snakeB.segments[j];
                        const dx = snakeA.x - seg.x;
                        const dy = snakeA.y - seg.y;
                        const hitDist = snakeA.radius + (snakeB.radius * 0.7);

                        if (dx * dx + dy * dy < hitDist * hitDist) {
                            const cause = (snakeA.id === snakeB.id) 
                                ? "自身碰撞過度拐彎死亡！" 
                                : `撞上了 「${snakeB.name}」 的身體！`;
                            
                            snakeA.die(cause);

                            if (snakeA.id !== snakeB.id) {
                                snakeB.kills += 1;
                                snakeB.score += 250;
                                snakeB.length += 3.5;
                                if (!snakeB.isAI) sound.playKill();
                            }
                            break;
                        }
                    }
                }
            }
        }

        function drawBackground(camera) {
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Light grid lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
            ctx.lineWidth = 1;

            const gridSize = 100;
            const startX = - (camera.x % gridSize);
            const startY = - (camera.y % gridSize);

            ctx.beginPath();
            for (let x = startX; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            for (let y = startY; y < canvas.height; y += gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // Wall Boundary
            const wallLeft = -camera.x;
            const wallTop = -camera.y;

            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 5;
            ctx.strokeRect(wallLeft, wallTop, WORLD_SIZE, WORLD_SIZE);
        }

        function drawMinimap() {
            miniCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            const scale = minimapCanvas.width / WORLD_SIZE;

            for (let snake of snakes) {
                if (snake.isDead) continue;
                miniCtx.beginPath();
                miniCtx.arc(snake.x * scale, snake.y * scale, snake === player ? 3 : 1.5, 0, Math.PI * 2);
                miniCtx.fillStyle = snake === player ? '#f59e0b' : snake.skin.head;
                miniCtx.fill();
            }
        }

        function updateLeaderboard() {
            const sorted = [...snakes]
                .filter(s => !s.isDead)
                .sort((a, b) => b.score - a.score)
                .slice(0, 5);

            const listEl = document.getElementById('leaderboardList');
            listEl.innerHTML = '';

            sorted.forEach((s, index) => {
                const isPlayer = (s === player);
                const li = document.createElement('li');
                li.className = `flex justify-between items-center ${isPlayer ? 'text-amber-400 font-bold' : 'text-slate-300'}`;
                li.innerHTML = `
                    <span class="truncate max-w-[100px]">${index + 1}. ${s.name}</span>
                    <span class="font-mono text-[11px]">${Math.floor(s.score)}</span>
                `;
                listEl.appendChild(li);
            });
        }

        let mousePos = { x: canvas.width / 2, y: canvas.height / 2 };

        window.addEventListener('mousemove', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;

            if (player && !player.isDead) {
                player.targetAngle = Math.atan2(mousePos.y - canvas.height / 2, mousePos.x - canvas.width / 2);
            }
        });

        window.addEventListener('mousedown', (e) => { if (e.button === 0 && player) player.isBoosting = true; });
        window.addEventListener('mouseup', (e) => { if (e.button === 0 && player) player.isBoosting = false; });
        window.addEventListener('keydown', (e) => { if (e.code === 'Space' && player) player.isBoosting = true; });
        window.addEventListener('keyup', (e) => { if (e.code === 'Space' && player) player.isBoosting = false; });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0 && player && !player.isDead) {
                const touch = e.touches[0];
                player.targetAngle = Math.atan2(touch.clientY - canvas.height / 2, touch.clientX - canvas.width / 2);
            }
        }, { passive: true });

        const mobileBoostBtn = document.getElementById('mobileBoostBtn');
        mobileBoostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (player) player.isBoosting = true; });
        mobileBoostBtn.addEventListener('touchend', (e) => { e.preventDefault(); if (player) player.isBoosting = false; });

        function initSkinSelector() {
            const container = document.getElementById('skinSelector');
            container.innerHTML = '';

            SKINS.forEach((skin) => {
                const btn = document.createElement('button');
                btn.className = `w-10 h-10 rounded-full border-2 transition transform active:scale-95 flex items-center justify-center ${selectedSkin.id === skin.id ? 'border-white scale-110 shadow-lg' : 'border-transparent opacity-70'}`;
                btn.style.background = `linear-gradient(135deg, ${skin.head}, ${skin.body})`;
                btn.title = skin.name;
                btn.onclick = () => {
                    selectedSkin = skin;
                    initSkinSelector();
                };
                container.appendChild(btn);
            });
        }

        const AI_NAMES = ["烈焰狂蛇", "暗影獵手", "極速閃電", "毒蛇王者", "巨無霸", "快樂貪食蛇", "冷血刺客", "吞噬者", "暴風者", "星空霸主"];

        function spawnAISnake() {
            const randomName = AI_NAMES[Math.floor(Math.random() * AI_NAMES.length)] + "_" + Math.floor(Math.random() * 99);
            const randomSkin = SKINS[Math.floor(Math.random() * SKINS.length)];
            const ai = new AISnake(
                'ai_' + Date.now() + '_' + Math.random(),
                randomName,
                randomRange(200, WORLD_SIZE - 200),
                randomRange(200, WORLD_SIZE - 200),
                randomSkin
            );
            ai.length = randomRange(18, 40);
            ai.score = ai.length * 20;
            snakes.push(ai);
        }

        function startGame() {
            sound.init();
            const nameInput = document.getElementById('playerNameInput').value.trim() || "蛇蛇大王";

            player = new Snake('player', nameInput, WORLD_SIZE / 2, WORLD_SIZE / 2, selectedSkin);
            snakes = [player];

            foods = [];
            spawnFood(FOOD_COUNT);

            for (let i = 0; i < MIN_AI_COUNT; i++) {
                spawnAISnake();
            }

            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverModal').classList.add('hidden');
            document.getElementById('hudOverlay').classList.remove('hidden');
        }

        function showGameOverModal(reason) {
            document.getElementById('deathCauseText').innerText = reason;
            document.getElementById('finalScore').innerText = Math.floor(player.score);
            document.getElementById('finalKills').innerText = player.kills;
            document.getElementById('finalLength').innerText = Math.floor(player.length);

            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        document.getElementById('startGameBtn').addEventListener('click', startGame);
        document.getElementById('restartGameBtn').addEventListener('click', startGame);

        initSkinSelector();

        let camera = { x: 0, y: 0 };

        function gameLoop() {
            const aliveAIs = snakes.filter(s => s.isAI && !s.isDead).length;
            if (aliveAIs < MIN_AI_COUNT) {
                spawnAISnake();
            }

            snakes.forEach(snake => {
                if (snake.isAI) {
                    snake.updateAI(snakes, foods);
                } else {
                    snake.update();
                }
            });

            checkCollisions();

            if (player && !player.isDead) {
                camera.x = player.x - canvas.width / 2;
                camera.y = player.y - canvas.height / 2;

                document.getElementById('scoreText').innerText = Math.floor(player.score);
                document.getElementById('killsText').innerText = player.kills;
                document.getElementById('lengthText').innerText = Math.floor(player.length);
            }

            drawBackground(camera);

            // Render Foods with Viewport Bounding Box Calculation
            const camLeft = camera.x - 30;
            const camRight = camera.x + canvas.width + 30;
            const camTop = camera.y - 30;
            const camBottom = camera.y + canvas.height + 30;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            foods.forEach(f => f.drawFast(ctx, camera, camLeft, camRight, camTop, camBottom));

            // Render Snakes
            snakes.forEach(s => s.draw(ctx, camera));

            drawMinimap();
            updateLeaderboard();

            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            gameLoop();
        };
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
