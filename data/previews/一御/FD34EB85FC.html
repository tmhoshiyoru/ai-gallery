    <script>
        class TetrisSoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            // Retro 8-bit Square / Triangle Wave Tone Generator
            playChiptune(freq, type = 'square', duration = 0.08, vol = 0.08) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { console.error(e); }
            }

            playPaddleHit() {
                this.playChiptune(240, 'square', 0.08, 0.1);
                setTimeout(() => this.playChiptune(360, 'square', 0.06, 0.08), 20);
            }

            playWallHit() {
                this.playChiptune(180, 'triangle', 0.05, 0.08);
            }

            playBrickHit(combo = 0) {
                const pitch = 350 + (combo % 8) * 60;
                this.playChiptune(pitch, 'square', 0.09, 0.12);
            }

            playLifeLost() {
                if (!this.enabled || !this.ctx) return;
                this.playChiptune(160, 'sawtooth', 0.15, 0.12);
                setTimeout(() => this.playChiptune(100, 'sawtooth', 0.22, 0.12), 100);
            }

            playGameOver() {
                if (!this.enabled || !this.ctx) return;
                const notes = [220, 196, 174, 146];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playChiptune(freq, 'sawtooth', 0.2, 0.12), idx * 120);
                });
            }

            playVictory() {
                if (!this.enabled || !this.ctx) return;
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playChiptune(freq, 'square', 0.18, 0.12), idx * 80);
                });
            }
        }

        const sound = new TetrisSoundEngine();

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI References
        const scoreText = document.getElementById('scoreText');
        const highScoreText = document.getElementById('highScoreText');
        const livesContainer = document.getElementById('livesContainer');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const finalScore = document.getElementById('finalScore');
        const highScoreNotice = document.getElementById('highScoreNotice');
        const statusTag = document.getElementById('statusTag');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');

        // Fixed Resolution
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // Game State
        let isPlaying = false;
        let score = 0;
        let highScore = parseInt(window.__galleryStorage.getItem('tetris_brick_high_score') || '0', 10);
        let lives = 3;
        let combo = 0;
        let animationFrameId = null;

        highScoreText.innerText = highScore.toString().padStart(4, '0');

        const keys = { left: false, right: false };

        // Tetris Paddle Config
        const paddle = {
            width: 120,
            height: 20,
            x: (CANVAS_WIDTH - 120) / 2,
            y: CANVAS_HEIGHT - 38,
            speed: 9
        };

        // Tetris Pixel Ball Config
        const ball = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT - 60,
            radius: 10,
            speed: 6.8,
            dx: 4.8,
            dy: -4.8
        };

        // 8 Rows of Tetris Bricks
        const BRICK_ROWS = 8;
        const BRICK_COLS = 10;
        const BRICK_PADDING = 6;
        const BRICK_OFFSET_TOP = 42;
        const BRICK_OFFSET_LEFT = 35;
        const BRICK_WIDTH = (CANVAS_WIDTH - (BRICK_OFFSET_LEFT * 2) - (BRICK_PADDING * (BRICK_COLS - 1))) / BRICK_COLS;
        const BRICK_HEIGHT = 18;

        // Classic 3D Bevel Tetris Color Palette (I, O, T, S, Z, J, L)
        const TETRIS_ROW_COLORS = [
            { main: '#00f0f0', light: '#b3ffff', dark: '#008b8b' }, // I-Piece Cyan
            { main: '#f0f000', light: '#ffffb3', dark: '#8b8b00' }, // O-Piece Yellow
            { main: '#a000f0', light: '#e6b3ff', dark: '#5c008b' }, // T-Piece Purple
            { main: '#00f000', light: '#b3ffb3', dark: '#008b00' }, // S-Piece Green
            { main: '#f00000', light: '#ffb3b3', dark: '#8b0000' }, // Z-Piece Red
            { main: '#0000f0', light: '#b3b3ff', dark: '#00008b' }, // J-Piece Blue
            { main: '#f0a000', light: '#ffe6b3', dark: '#8b5c00' }, // L-Piece Orange
            { main: '#f000a0', light: '#ffb3e6', dark: '#8b005c' }  // Magenta Piece
        ];

        let bricks = [];
        let particles = [];

        // Render Classic 3D Bevel Tetris Block
        function drawTetrisBlock(x, y, width, height, colorObj) {
            ctx.fillStyle = colorObj.main;
            ctx.fillRect(x, y, width, height);

            const border = 3;
            // Top & Left Highlight Bevel
            ctx.fillStyle = colorObj.light;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + width, y);
            ctx.lineTo(x + width - border, y + border);
            ctx.lineTo(x + border, y + border);
            ctx.lineTo(x + border, y + height - border);
            ctx.lineTo(x, y + height);
            ctx.closePath();
            ctx.fill();

            // Bottom & Right Shadow Bevel
            ctx.fillStyle = colorObj.dark;
            ctx.beginPath();
            ctx.moveTo(x + width, y);
            ctx.lineTo(x + width, y + height);
            ctx.lineTo(x, y + height);
            ctx.lineTo(x + border, y + height - border);
            ctx.lineTo(x + width - border, y + height - border);
            ctx.lineTo(x + width - border, y + border);
            ctx.closePath();
            ctx.fill();
        }

        // Draw Tetris Matrix Grid Backdrop
        function drawTetrisGrid() {
            ctx.fillStyle = '#0a0d17';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.strokeStyle = 'rgba(30, 58, 138, 0.25)';
            ctx.lineWidth = 1;
            const gridSize = 24;

            for (let x = 0; x < CANVAS_WIDTH; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }

            for (let y = 0; y < CANVAS_HEIGHT; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
        }

        // Draw Paddle as connected Tetris blocks
        function drawTetrisPaddle(x, y, w, h) {
            const blockCount = 5;
            const blockW = w / blockCount;
            const paddleColor = { main: '#00f0f0', light: '#b3ffff', dark: '#008b8b' }; // Cyan I-Block

            for (let i = 0; i < blockCount; i++) {
                drawTetrisBlock(x + i * blockW, y, blockW, h, paddleColor);
            }
        }

        // Draw Ball as a Retro Tetris Pixel Block
        function drawTetrisBall(x, y, radius) {
            const size = radius * 2;
            const ballColor = { main: '#f0f000', light: '#ffffb3', dark: '#8b8b00' }; // Yellow O-Block
            drawTetrisBlock(x - radius, y - radius, size, size, ballColor);
        }

        function createParticles(x, y, colorObj) {
            const count = 10;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 3,
                    colorObj: colorObj,
                    alpha: 1.0,
                    decay: Math.random() * 0.04 + 0.02
                });
            }
        }

        function updateAndRenderParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                drawTetrisBlock(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size, p.colorObj);
                ctx.restore();
            }
        }

        function initBricks() {
            bricks = [];
            for (let r = 0; r < BRICK_ROWS; r++) {
                bricks[r] = [];
                for (let c = 0; c < BRICK_COLS; c++) {
                    const brickX = BRICK_OFFSET_LEFT + c * (BRICK_WIDTH + BRICK_PADDING);
                    const brickY = BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING);
                    bricks[r][c] = {
                        x: brickX,
                        y: brickY,
                        status: 1,
                        colorObj: TETRIS_ROW_COLORS[r % TETRIS_ROW_COLORS.length]
                    };
                }
            }
        }

        function updateLivesDisplay() {
            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const block = document.createElement('i');
                if (i < lives) {
                    block.className = 'fa-solid fa-cube text-rose-400 scale-100 transition-transform';
                } else {
                    block.className = 'fa-solid fa-cube text-slate-800';
                }
                livesContainer.appendChild(block);
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') {
                keys.right = true;
            } else if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') {
                keys.left = true;
            }
        }

        function handleKeyUp(e) {
            if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') {
                keys.right = false;
            } else if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') {
                keys.left = false;
            }
        }

        function handlePointerMove(e) {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : null);
            if (clientX !== null) {
                const canvasTouchX = (clientX - rect.left) * scaleX;
                paddle.x = canvasTouchX - paddle.width / 2;
                if (paddle.x < 0) paddle.x = 0;
                if (paddle.x + paddle.width > CANVAS_WIDTH) paddle.x = CANVAS_WIDTH - paddle.width;
            }
        }

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('touchmove', handlePointerMove, { passive: true });

        function checkHighScore() {
            if (score > highScore) {
                highScore = score;
                window.__galleryStorage.setItem('tetris_brick_high_score', highScore.toString());
                highScoreText.innerText = highScore.toString().padStart(4, '0');
                return true;
            }
            return false;
        }

        function collisionDetection() {
            let activeBricksCount = 0;

            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        activeBricksCount++;
                        if (
                            ball.x + ball.radius > b.x &&
                            ball.x - ball.radius < b.x + BRICK_WIDTH &&
                            ball.y + ball.radius > b.y &&
                            ball.y - ball.radius < b.y + BRICK_HEIGHT
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            combo++;
                            score += 10;
                            scoreText.innerText = score.toString().padStart(4, '0');

                            checkHighScore();
                            createParticles(b.x + BRICK_WIDTH / 2, b.y + BRICK_HEIGHT / 2, b.colorObj);
                            sound.playBrickHit(combo);

                            if (Math.abs(ball.dy) < 10) {
                                ball.dy *= 1.008;
                                ball.dx *= 1.008;
                            }
                        }
                    }
                }
            }

            if (activeBricksCount === 0) {
                gameWin();
            }
        }

        // Reset Ball while KEEPING Paddle position where it currently is!
        function resetBallAndPaddle() {
            // NOTE: paddle.x is NOT reset to center! It remains in its current position.
            ball.x = paddle.x + paddle.width / 2;
            ball.y = paddle.y - ball.radius - 6;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * (4.2 + Math.random() * 1.5);
            ball.dy = -5.8;
            combo = 0;
        }

        function update() {
            if (!isPlaying) return;

            if (keys.right) {
                paddle.x += paddle.speed;
            } else if (keys.left) {
                paddle.x -= paddle.speed;
            }

            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > CANVAS_WIDTH) paddle.x = CANVAS_WIDTH - paddle.width;

            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall Collisions
            if (ball.x + ball.radius > CANVAS_WIDTH || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
                sound.playWallHit();
            }

            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
                sound.playWallHit();
            }

            // Paddle Hit
            if (
                ball.y + ball.radius >= paddle.y &&
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width
            ) {
                const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                
                ball.dx = hitPoint * (currentSpeed * 0.82);
                ball.dy = -Math.sqrt(Math.max(12, currentSpeed * currentSpeed - ball.dx * ball.dx));
                
                combo = 0;
                sound.playPaddleHit();
                createParticles(ball.x, paddle.y, { main: '#00f0f0', light: '#ffffff', dark: '#008b8b' });
            }

            // Ball Out of Bounds -> Lose 1 Life & Keep Paddle Position
            if (ball.y + ball.radius > CANVAS_HEIGHT) {
                lives--;
                updateLivesDisplay();

                if (lives <= 0) {
                    gameOver();
                } else {
                    sound.playLifeLost();
                    resetBallAndPaddle(); // Keeps paddle.x unchanged!
                }
                return;
            }

            collisionDetection();
        }

        function draw() {
            // Draw Retro Tetris Grid Background
            drawTetrisGrid();

            // Draw Bricks
            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        drawTetrisBlock(b.x, b.y, BRICK_WIDTH, BRICK_HEIGHT, b.colorObj);
                    }
                }
            }

            // Draw Tetris Paddle
            drawTetrisPaddle(paddle.x, paddle.y, paddle.width, paddle.height);

            // Draw Tetris Pixel Ball
            drawTetrisBall(ball.x, ball.y, ball.radius);

            // Particles
            updateAndRenderParticles();
        }

        function gameLoop() {
            update();
            draw();
            if (isPlaying) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function startGame() {
            sound.init();
            score = 0;
            lives = 3;
            combo = 0;
            scoreText.innerText = '0000';
            updateLivesDisplay();

            paddle.x = (CANVAS_WIDTH - paddle.width) / 2; // Center paddle on game initial start only
            resetBallAndPaddle();
            initBricks();
            particles = [];

            isPlaying = true;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            highScoreNotice.classList.add('hidden');

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function gameOver() {
            isPlaying = false;
            sound.playGameOver();

            const isNewHigh = checkHighScore();

            statusTag.innerText = "GAME OVER";
            gameOverTitle.innerText = "GAME OVER";
            finalScore.innerText = score;

            if (isNewHigh) {
                highScoreNotice.classList.remove('hidden');
            } else {
                highScoreNotice.classList.add('hidden');
            }

            gameOverOverlay.classList.remove('hidden');
        }

        function gameWin() {
            isPlaying = false;
            sound.playVictory();

            const isNewHigh = checkHighScore();

            statusTag.innerText = "STAGE CLEAR";
            gameOverTitle.innerText = "VICTORY!";
            finalScore.innerText = score;

            if (isNewHigh) {
                highScoreNotice.classList.remove('hidden');
            } else {
                highScoreNotice.classList.add('hidden');
            }

            gameOverOverlay.classList.remove('hidden');
        }

        soundToggleBtn.addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            if (sound.enabled) {
                soundIcon.className = 'fa-solid fa-volume-high text-cyan-400';
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark text-slate-500';
            }
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        initBricks();
        updateLivesDisplay();
        draw();
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
