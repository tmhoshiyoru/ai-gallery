<!DOCTYPE html>
<html lang="zh-TW">
<head><base href="../../../%E4%BD%9C%E5%93%81/%E7%AC%AC%E4%B8%80%E5%80%8BAI%E7%A8%8B%E5%BC%8F/%E4%B8%80%E5%BE%A1/"><script>
window.__galleryStorage = (() => {
  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();
</script>
    <meta charset="UTF-8">
    <title>貪食蛇遊戲 - 淺藍背景版</title>
    <style>
        body {
            /* 主背景改為淡藍色 */
            background-color: #e3f2fd;
            color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; color: #1976d2; }
        .score-board {
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #0d47a1;
        }
        canvas {
            /* 畫布背景設為極淺藍，配上藍色邊框 */
            background-color: #f0f8ff;
            border: 4px solid #42a5f5;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(33, 150, 243, 0.2);
        }
        .info {
            margin-top: 15px;
            color: #546e7a;
            font-size: 14px;
        }
    </style>
<style id="gallery-layout-support">
html { overflow-y: auto !important; }
body { height: auto !important; min-height: 100vh !important; overflow-y: auto !important; }
/* Full-height games need a definite containing height for percentage-sized canvases. */
body.h-full, body.h-screen { height: 100vh !important; }
body { height: 100vh !important; }
body > header, body > main, body > footer, body > canvas { flex-shrink: 0; }

</style></head>
<body>

    <h1> 貪食蛇 </h1>
    <div class="score-board">目前分數：<span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="info">提示：使用鍵盤方向鍵 ⬆️ ⬇️ ⬅️ ➡️ 控制方向</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let score = 0;
    let snake = [{ x: 10, y: 10 }];
    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = 0;
    let gameStarted = false;

    // 監聽鍵盤按鍵
    document.addEventListener("keydown", changeDirection);

    function gameLoop() {
        moveSnake();
        if (checkGameOver()) {
            alert(`Game Over! 你的最終得分是：${score}`);
            resetGame();
            return;
        }
        clearCanvas();
        drawFood();
        drawSnake();
    }

    function clearCanvas() {
        ctx.fillStyle = "#f0f8ff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            // 蛇頭用深藍，身體用鮮藍
            ctx.fillStyle = index === 0 ? "#1565c0" : "#1e88e5";
            ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
        });
    }

    function drawFood() {
        // 食物用明顯的粉紅色/紅色
        ctx.fillStyle = "#e91e63";
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
    }

    function moveSnake() {
        if (!gameStarted) return;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreElement.textContent = score;
            generateFood();
        } else {
            snake.pop();
        }
    }

    function generateFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        snake.forEach(part => {
            if (part.x === food.x && part.y === food.y) {
                generateFood();
            }
        });
    }

    function changeDirection(event) {
        const keyPressed = event.keyCode;
        const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;

        const goingUp = dy === -1;
        const goingDown = dy === 1;
        const goingRight = dx === 1;
        const goingLeft = dx === -1;

        if (keyPressed === LEFT && !goingRight) { dx = -1; dy = 0; gameStarted = true; }
        if (keyPressed === UP && !goingDown) { dx = 0; dy = -1; gameStarted = true; }
        if (keyPressed === RIGHT && !goingLeft) { dx = 1; dy = 0; gameStarted = true; }
        if (keyPressed === DOWN && !goingUp) { dx = 0; dy = 1; gameStarted = true; }
    }

    function checkGameOver() {
        if (!gameStarted) return;

        const head = snake[0];

        const hitLeftWall = head.x < 0;
        const hitRightWall = head.x >= tileCount;
        const hitToptWall = head.y < 0;
        const hitBottomWall = head.y >= tileCount;

        if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) {
            return true;
        }

        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                return true;
            }
        }

        return false;
    }

    function resetGame() {
        score = 0;
        scoreElement.textContent = score;
        snake = [{ x: 10, y: 10 }];
        dx = 0;
        dy = 0;
        gameStarted = false;
        generateFood();
    }

    // 保持舒適的慢速移動（200ms）
    setInterval(gameLoop, 150);
</script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
