window.__galleryStorage = (() => {
  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();
</script>
    <meta charset="UTF-8">

<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4">

    <div class="w-full max-w-[850px] mb-3 flex items-center justify-between px-4 py-3 bg-slate-900/90 backdrop-blur-md rounded-2xl neon-box">

            <span class="text-2xl animate-bounce">👨‍🚀</span>
            <h1 class="text-lg sm:text-2xl font-black tracking-wider text-cyan-400 font-['Orbitron']">ASTEROID BREAKOUT</h1>
        </div>

        <div class="flex items-center space-x-3 sm:space-x-6 font-['Orbitron']">
            <div>
                <span class="text-gray-400 text-[10px] sm:text-xs block tracking-widest">SCORE</span>

        <button id="inGameRestartBtn" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-red-600/80 hover:bg-red-500 text-white rounded-xl text-xs sm:text-sm font-bold transition duration-200 border border-red-400/40 shadow-lg cursor-pointer">

    <!-- Main Game Viewport -->
    <div class="relative w-full max-w-[850px] flex justify-center">
        <canvas id="gameCanvas" width="850" height="600" class="w-full h-auto max-h-[75vh] object-contain border border-cyan-500/30"></canvas>

        <!-- Overlay Screen -->
        <div id="overlayScreen" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center rounded-2xl p-6 text-center transition-all duration-300">
            <h2 id="overlayTitle" class="text-4xl sm:text-6xl font-black mb-3 text-cyan-400 font-['Orbitron'] neon-text-cyan">隕石擊碎戰</h2>
            <p id="overlaySubtitle" class="text-gray-300 mb-6 text-sm sm:text-base max-w-md leading-relaxed">
                駕駛太空滑塊，擊碎軌道上的所有星際隕石！<br>
                擊碎隕石有 <span class="text-green-400 font-bold">20% 機率掉落擴展膠囊 ↔️</span><br>
                掉落底部扣 1 滴血，扣血後小球將<span class="text-cyan-300 font-bold">自動發射繼續戰鬥</span>。

            <button id="startBtn" class="glow-btn px-10 py-3.5 rounded-full text-lg sm:text-xl font-bold text-white tracking-widest uppercase font-['Orbitron'] cursor-pointer">

    <!-- Controls Description -->

        <span>🎮 鍵盤：◄ ► 或 A/D 移動太空人滑塊</span>
        <span>🖱️ 滑鼠 / 📱 觸控：左右拖曳移動滑塊</span>
        <span>⚡ 綠色膠囊：滑塊長度 +50% (5秒)</span>
    </div>

    <script>
        // --- Web Audio API Dynamic Synthesizer ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPaddleHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(260, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playAsteroidHit(pitchOffset = 0) {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                const freq = 180 + pitchOffset * 35;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.12);

                const bufferSize = this.ctx.sampleRate * 0.08;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.2, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                noise.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);
                noise.start(now);
            }

            // Power-up Picked Up SFX
            playPowerupSound() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'sine';
                osc2.type = 'triangle';

                osc1.frequency.setValueAtTime(440, now);
                osc1.frequency.exponentialRampToValueAtTime(880, now + 0.18);
                
                osc2.frequency.setValueAtTime(660, now + 0.05);
                osc2.frequency.exponentialRampToValueAtTime(1320, now + 0.22);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now + 0.05);
                osc1.stop(now + 0.25);
                osc2.stop(now + 0.25);
            }

            playLaunch() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(240, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playLoseLife() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            playGameOver() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(70, this.ctx.currentTime + 0.7);
                gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.7);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.7);
            }

            playVictory() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.25);
                });
            }
        }

        const sound = new SoundEngine();

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Handles
        const scoreText = document.getElementById('scoreText');
        const highScoreText = document.getElementById('highScoreText');
        const livesContainer = document.getElementById('livesContainer');
        const overlayScreen = document.getElementById('overlayScreen');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const startBtn = document.getElementById('startBtn');
        const inGameRestartBtn = document.getElementById('inGameRestartBtn');
        const powerupTimerBox = document.getElementById('powerupTimerBox');
        const powerupBar = document.getElementById('powerupBar');

        // State & LocalStorage HighScore
        const STORAGE_KEY = 'Breakout_Space_HighScore';
        let score = 0;
        let highScore = parseInt(window.__galleryStorage.getItem(STORAGE_KEY) || '0', 10);
        let lives = 3;
        let isPlaying = false;
        let animationFrameId = null;
        let spaceTimer = 0;

        highScoreText.textContent = highScore;

        const keys = { left: false, right: false };

        // Grid Configuration
        const BRICK_ROWS = 5;
        const BRICK_COLS = 9;
        const BRICK_PADDING = 12;
        const BRICK_OFFSET_TOP = 65;
        const BRICK_OFFSET_LEFT = 40;
        const BRICK_WIDTH = 76;
        const BRICK_HEIGHT = 26;

        // 5 Distinct Mineral Meteorite Color Themes
        const ASTEROID_THEMES = [
            { name: 'Fiery Red Iron', base: '#8a1c1c', light: '#ff4d4d', dark: '#4a0a0a', glow: '#ff3333' },
            { name: 'Pyrite Gold', base: '#997300', light: '#ffd700', dark: '#4d3a00', glow: '#ffea00' },
            { name: 'Kryptonite Green', base: '#1b8034', light: '#33ff66', dark: '#0a4018', glow: '#00ff66' },
            { name: 'Cobalt Ice Blue', base: '#105282', light: '#33b5ff', dark: '#072a45', glow: '#00f3ff' },
            { name: 'Amethyst Purple', base: '#611b82', light: '#b833ff', dark: '#320b45', glow: '#d000ff' }
        ];

        // Paddle Definition
        const NORMAL_PADDLE_WIDTH = 130;
        const EXTENDED_PADDLE_WIDTH = 195; // 50% wider
        const POWERUP_DURATION = 5000; // 5 seconds

        const paddle = {
            width: NORMAL_PADDLE_WIDTH,
            height: 18,
            x: canvas.width / 2 - NORMAL_PADDLE_WIDTH / 2,
            y: canvas.height - 38,
            speed: 9.5,
            isExtended: false,
            powerupEndTime: 0
        };

        // Ball Definition
        const ball = {
            x: canvas.width / 2,
            y: paddle.y - 12,
            radius: 8,
            speed: 7.2,
            dx: 0,
            dy: 0,
            glowColor: '#00f3ff'
        };

        // Power-ups Array & Particles
        let powerups = [];
        let particles = [];
        let ballTrail = [];

        function spawnPowerup(x, y) {
            if (Math.random() <= 0.20) { // 20% Chance
                powerups.push({
                    x: x,
                    y: y,
                    width: 32,
                    height: 18,
                    speed: 2.3,
                    rotation: 0
                });
            }
        }

        function createRockExplosion(x, y, theme, count = 18) {
            for (let i = 0; i < count; i++) {
                const isDust = Math.random() > 0.6;
                particles.push({
                    x: x,
                    y: y,
                    radius: isDust ? Math.random() * 2 + 1 : Math.random() * 4 + 2,
                    color: isDust ? theme.light : theme.base,
                    dx: (Math.random() - 0.5) * 8,
                    dy: (Math.random() - 0.5) * 8,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015,
                    isPolygon: !isDust
                });
            }
        }

        function createVictoryFireworks() {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height / 2);
                    const randomTheme = ASTEROID_THEMES[Math.floor(Math.random() * ASTEROID_THEMES.length)];
                    createRockExplosion(x, y, randomTheme, 40);
                }, i * 140);
            }
        }

        // Deep Space Twinkling Stars Setup
        const stars = Array.from({ length: 110 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2.2 + 0.6,
            alpha: Math.random() * 0.8 + 0.2,
            speed: Math.random() * 0.2 + 0.05,
            phase: Math.random() * Math.PI * 2
        }));

        // Asteroid Bricks Setup with Procedural Polygon Offset Data
        let bricks = [];
        let remainingBricks = 0;

        function generateAsteroidOffsets() {
            const numPoints = 8;
            const offsets = [];
            for (let i = 0; i < numPoints; i++) {
                offsets.push(Math.random() * 0.35 + 0.82);
            }
            const craters = [];
            const craterCount = Math.floor(Math.random() * 2) + 1;
            for (let i = 0; i < craterCount; i++) {
                craters.push({
                    cx: (Math.random() - 0.5) * (BRICK_WIDTH * 0.5),
                    cy: (Math.random() - 0.5) * (BRICK_HEIGHT * 0.5),
                    r: Math.random() * 4 + 3
                });
            }
            return { offsets, craters };
        }

        function initBricks() {
            bricks = [];
            remainingBricks = BRICK_ROWS * BRICK_COLS;
            for (let r = 0; r < BRICK_ROWS; r++) {
                bricks[r] = [];
                for (let c = 0; c < BRICK_COLS; c++) {
                    bricks[r][c] = {
                        x: 0,
                        y: 0,
                        status: 1,
                        theme: ASTEROID_THEMES[r % ASTEROID_THEMES.length],
                        shape: generateAsteroidOffsets()
                    };
                }
            }
        }

        function activatePaddleExtension() {
            const center = paddle.x + paddle.width / 2;
            paddle.width = EXTENDED_PADDLE_WIDTH;
            paddle.x = center - paddle.width / 2;
            
            // Keep in bounds
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

            paddle.isExtended = true;
            paddle.powerupEndTime = Date.now() + POWERUP_DURATION;
            powerupTimerBox.classList.remove('hidden');
            powerupTimerBox.classList.add('flex');
            sound.playPowerupSound();
        }

        function resetPaddleWidth() {
            const center = paddle.x + paddle.width / 2;
            paddle.width = NORMAL_PADDLE_WIDTH;
            paddle.x = center - paddle.width / 2;
            paddle.isExtended = false;
            paddle.powerupEndTime = 0;
            powerupTimerBox.classList.add('hidden');
            powerupTimerBox.classList.remove('flex');
        }

        // Reset and AUTO-SERVE Ball
        function launchBallAutomatically() {
            paddle.x = (canvas.width - paddle.width) / 2;
            ball.x = paddle.x + paddle.width / 2;
            ball.y = paddle.y - ball.radius - 22;
            ballTrail = [];

            const angle = (Math.random() * 0.6 - 0.3);
            ball.dx = ball.speed * Math.sin(angle) + (Math.random() > 0.5 ? 2.5 : -2.5);
            ball.dy = -Math.abs(ball.speed);

            sound.playLaunch();
        }

        function resetGame() {
            score = 0;
            lives = 3;
            powerups = [];
            resetPaddleWidth();
            updateScoreUI();
            updateLivesUI();
            initBricks();
            particles = [];
            launchBallAutomatically();
        }

        // --- Controls Input ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') keys.left = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') keys.left = false;
        });

        function handlePointerMove(clientX) {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const mouseX = (clientX - rect.left) * scaleX;
            paddle.x = mouseX - paddle.width / 2;

            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        }

        canvas.addEventListener('mousemove', (e) => handlePointerMove(e.clientX));
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX);
        }, { passive: true });

        startBtn.addEventListener('click', () => {
            sound.init();
            resetGame();
            isPlaying = true;
            overlayScreen.classList.add('opacity-0', 'pointer-events-none');
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        });

        inGameRestartBtn.addEventListener('click', () => {
            sound.init();
            resetGame();
            if (!isPlaying) {
                isPlaying = true;
                overlayScreen.classList.add('opacity-0', 'pointer-events-none');
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                gameLoop();
            }
        });

        // --- Collision Logic ---
        function detectCollisions() {
            // Bricks Collision
            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        const brickX = c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT;
                        const brickY = r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP;
                        b.x = brickX;
                        b.y = brickY;

                        if (
                            ball.x + ball.radius > brickX &&
                            ball.x - ball.radius < brickX + BRICK_WIDTH &&
                            ball.y + ball.radius > brickY &&
                            ball.y - ball.radius < brickY + BRICK_HEIGHT
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            remainingBricks--;
                            score += 10;
                            updateScoreUI();

                            sound.playAsteroidHit(BRICK_ROWS - r);
                            createRockExplosion(brickX + BRICK_WIDTH / 2, brickY + BRICK_HEIGHT / 2, b.theme);
                            
                            // Spawn Power-up Chance
                            spawnPowerup(brickX + BRICK_WIDTH / 2, brickY + BRICK_HEIGHT / 2);

                            if (remainingBricks <= 0) {
                                handleWin();
                                return;
                            }
                        }
                    }
                }
            }

            // Power-ups Falling & Paddle Catch Collision
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.speed;
                p.rotation += 0.03;

                // Check Paddle Catch
                if (
                    p.y + p.height / 2 >= paddle.y &&
                    p.y - p.height / 2 <= paddle.y + paddle.height &&
                    p.x + p.width / 2 >= paddle.x &&
                    p.x - p.width / 2 <= paddle.x + paddle.width
                ) {
                    activatePaddleExtension();
                    createRockExplosion(p.x, p.y, { base: '#00ff66', light: '#ffffff' }, 12);
                    powerups.splice(i, 1);
                    continue;
                }

                // Remove if out of screen
                if (p.y > canvas.height + 20) {
                    powerups.splice(i, 1);
                }
            }

            // Side Walls
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
                sound.playPaddleHit();
            }

            // Top Wall
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
                sound.playPaddleHit();
            }

            // Paddle Hit
            if (
                ball.y + ball.radius >= paddle.y - 18 &&
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width &&
                ball.dy > 0
            ) {
                const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                const maxAngle = Math.PI / 2.8;
                const bounceAngle = hitPoint * maxAngle;
                
                const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                ball.dx = speed * Math.sin(bounceAngle);
                ball.dy = -speed * Math.cos(bounceAngle);

                sound.playPaddleHit();
                createRockExplosion(ball.x, paddle.y - 10, { base: '#00f3ff', light: '#ffffff' }, 6);
            }

            // Bottom Border (Life Deduction)
            if (ball.y + ball.radius > canvas.height) {
                lives--;
                updateLivesUI();

                if (lives <= 0) {
                    handleGameOver();
                } else {
                    sound.playLoseLife();
                    launchBallAutomatically();
                }
            }
        }

        // Timer Check for Power-up Duration
        function updatePowerupTimer() {
            if (paddle.isExtended) {
                const now = Date.now();
                const remaining = paddle.powerupEndTime - now;
                if (remaining <= 0) {
                    resetPaddleWidth();
                } else {
                    const pct = Math.max(0, (remaining / POWERUP_DURATION) * 100);
                    powerupBar.style.width = `${pct}%`;
                }
            }
        }

        // UI Updates
        function updateScoreUI() {
            scoreText.textContent = score;
            if (score > highScore) {
                highScore = score;
                highScoreText.textContent = highScore;
                window.__galleryStorage.setItem(STORAGE_KEY, highScore.toString());
            }
        }

        function updateLivesUI() {
            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('span');
                heart.textContent = '❤️';
                heart.style.opacity = i < lives ? '1' : '0.2';
                heart.style.filter = i < lives ? 'drop-shadow(0 0 5px #ff0055)' : 'none';
                livesContainer.appendChild(heart);
            }
        }

        function handleGameOver() {
            isPlaying = false;
            sound.playGameOver();
            updateScoreUI();
            overlayTitle.textContent = "任務失敗 (GAME OVER)";
            overlayTitle.className = "text-4xl sm:text-6xl font-black mb-3 text-red-500 font-['Orbitron'] neon-text-pink";
            overlaySubtitle.innerHTML = `太空船生命值歸零！<br>本次得分：<span class="text-cyan-300 font-bold">${score}</span> 分 | 歷史最高分：<span class="text-yellow-400 font-bold">${highScore}</span> 分`;
            startBtn.textContent = "重新嘗試 (Restart)";
            overlayScreen.classList.remove('opacity-0', 'pointer-events-none');
        }

        function handleWin() {
            isPlaying = false;
            sound.playVictory();
            updateScoreUI();
            createVictoryFireworks();
            overlayTitle.textContent = "任務成功 (YOU WIN!)";
            overlayTitle.className = "text-4xl sm:text-6xl font-black mb-3 text-yellow-400 font-['Orbitron'] neon-text-gold";
            overlaySubtitle.innerHTML = `🎉 太棒了！你擊碎了軌道上的所有星際隕石！<br>最終得分：<span class="text-cyan-300 font-bold text-xl">${score}</span> 分！`;
            startBtn.textContent = "再次出擊 (Play Again)";
            overlayScreen.classList.remove('opacity-0', 'pointer-events-none');
        }

        // --- Render System ---
        function drawStarfield() {
            spaceTimer += 0.02;
            const bgGradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, canvas.width);
            bgGradient.addColorStop(0, '#091026');
            bgGradient.addColorStop(1, '#02040a');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;

                const alpha = Math.abs(Math.sin(spaceTimer + star.phase)) * 0.7 + 0.3;
                ctx.fillStyle = `rgba(220, 240, 255, ${alpha * star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                if (star.size > 1.8) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#00f3ff';
                }
            });
            ctx.restore();
        }

        // Procedural Asteroid Drawing
        function drawAsteroidBricks() {
            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        const bx = c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT;
                        const by = r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP;
                        const cx = bx + BRICK_WIDTH / 2;
                        const cy = by + BRICK_HEIGHT / 2;
                        const rx = BRICK_WIDTH / 2;
                        const ry = BRICK_HEIGHT / 2;

                        ctx.save();
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = b.theme.glow;

                        const astGrad = ctx.createLinearGradient(bx, by, bx + BRICK_WIDTH, by + BRICK_HEIGHT);
                        astGrad.addColorStop(0, b.theme.light);
                        astGrad.addColorStop(0.4, b.theme.base);
                        astGrad.addColorStop(1, b.theme.dark);
                        ctx.fillStyle = astGrad;

                        ctx.beginPath();
                        const offsets = b.shape.offsets;
                        const totalPoints = offsets.length;
                        for (let i = 0; i < totalPoints; i++) {
                            const angle = (i / totalPoints) * Math.PI * 2;
                            const radX = rx * offsets[i];
                            const radY = ry * offsets[i];
                            const px = cx + Math.cos(angle) * radX;
                            const py = cy + Math.sin(angle) * radY;

                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fill();

                        ctx.lineWidth = 1.2;
                        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
                        ctx.stroke();

                        b.shape.craters.forEach(crater => {
                            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                            ctx.beginPath();
                            ctx.arc(cx + crater.cx, cy + crater.cy, crater.r, 0, Math.PI * 2);
                            ctx.fill();

                            ctx.strokeStyle = b.theme.light;
                            ctx.lineWidth = 0.8;
                            ctx.beginPath();
                            ctx.arc(cx + crater.cx - 0.8, cy + crater.cy - 0.8, crater.r, Math.PI * 0.5, Math.PI * 1.5);
                            ctx.stroke();
                        });

                        ctx.restore();
                    }
                }
            }
        }

        // Draw Falling Power-up Capsules
        function drawPowerups() {
            ctx.save();
            powerups.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);

                // Glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ff66';

                // Capsule Outer
                const capGrad = ctx.createLinearGradient(-p.width/2, -p.height/2, p.width/2, p.height/2);
                capGrad.addColorStop(0, '#00ff66');
                capGrad.addColorStop(0.5, '#0d381e');
                capGrad.addColorStop(1, '#00b347');
                
                ctx.fillStyle = capGrad;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(-p.width/2, -p.height/2, p.width, p.height, 9);
                ctx.fill();
                ctx.stroke();

                // Arrows Icon ↔️
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('↔️', 0, 0);

                ctx.restore();
            });
            ctx.restore();
        }

        // Astronaut Paddle
        function drawPaddle() {
            ctx.save();
            const px = paddle.x;
            const py = paddle.y;
            const pw = paddle.width;
            const ph = paddle.height;

            ctx.shadowBlur = paddle.isExtended ? 22 : 15;
            ctx.shadowColor = paddle.isExtended ? '#00ff66' : '#00f3ff';

            const padGradient = ctx.createLinearGradient(px, py, px + pw, py);
            padGradient.addColorStop(0, '#0d1b2a');
            padGradient.addColorStop(0.2, paddle.isExtended ? '#0d381e' : '#1b263b');
            padGradient.addColorStop(0.5, paddle.isExtended ? '#107a3e' : '#415a77');
            padGradient.addColorStop(0.8, paddle.isExtended ? '#0d381e' : '#1b263b');
            padGradient.addColorStop(1, '#0d1b2a');

            ctx.fillStyle = padGradient;
            ctx.beginPath();
            ctx.roundRect(px, py, pw, ph, 9);
            ctx.fill();

            ctx.strokeStyle = paddle.isExtended ? '#00ff66' : '#00f3ff';
            ctx.lineWidth = paddle.isExtended ? 2.5 : 1.5;
            ctx.stroke();

            // Thruster Flames
            const flameHeight = Math.random() * 6 + 4;
            ctx.fillStyle = paddle.isExtended ? '#00ff66' : '#ff6600';
            ctx.beginPath();
            ctx.ellipse(px + 12, py + ph + 2, 4, flameHeight, 0, 0, Math.PI * 2);
            ctx.ellipse(px + pw - 12, py + ph + 2, 4, flameHeight, 0, 0, Math.PI * 2);
            ctx.fill();

            // Astronaut
            const acx = px + pw / 2;
            const acy = py - 10;
            const floatOffsetY = Math.sin(spaceTimer * 3) * 2;
            const astroY = acy + floatOffsetY;

            // Backpack
            ctx.fillStyle = '#e0e1dd';
            ctx.beginPath();
            ctx.roundRect(acx - 16, astroY - 14, 32, 22, 4);
            ctx.fill();

            // Body & Helmet
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(acx, astroY, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(acx, astroY - 12, 11, 0, Math.PI * 2);
            ctx.fill();

            // Visor
            const visorGrad = ctx.createLinearGradient(acx - 7, astroY - 16, acx + 7, astroY - 8);
            visorGrad.addColorStop(0, paddle.isExtended ? '#00ff66' : '#00f3ff');
            visorGrad.addColorStop(0.5, '#ffd700');
            visorGrad.addColorStop(1, '#002855');

            ctx.fillStyle = visorGrad;
            ctx.beginPath();
            ctx.roundRect(acx - 8, astroY - 16, 16, 10, 5);
            ctx.fill();

            // Visor Highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(acx - 4, astroY - 14, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Ball & Comet Trail
        function drawBall() {
            ballTrail.push({ x: ball.x, y: ball.y, alpha: 0.6 });
            if (ballTrail.length > 9) ballTrail.shift();

            ctx.save();
            ballTrail.forEach((t, index) => {
                ctx.beginPath();
                ctx.arc(t.x, t.y, ball.radius * (index / ballTrail.length), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 243, 255, ${t.alpha * (index / ballTrail.length)})`;
                ctx.fill();
            });

            ctx.shadowBlur = 18;
            ctx.shadowColor = ball.glowColor;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Rock Shatter Particles
        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // Main Loop
        function update() {
            if (keys.right && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.speed;
            } else if (keys.left && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }

            ball.x += ball.dx;
            ball.y += ball.dy;

            detectCollisions();
            updatePowerupTimer();
        }

        function render() {
            drawStarfield();
            drawAsteroidBricks();
            drawPowerups();
            drawPaddle();
            drawBall();
            drawParticles();
        }

        function gameLoop() {
            if (!isPlaying) return;
            update();
            render();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Initial Canvas Frame Render
        initBricks();
        drawStarfield();
        drawAsteroidBricks();
        drawPaddle();
        drawBall();
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
