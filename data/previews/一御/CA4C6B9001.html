window.__galleryStorage = (() => {
  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();
</script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const livesEl = document.getElementById('lives');
        const speedMultiplierEl = document.getElementById('speedMultiplier');
        const buffContainer = document.getElementById('buffContainer');
        const buffTimerEl = document.getElementById('buffTimer');
        const excellentSplash = document.getElementById('excellentSplash');
        const watchOutSplash = document.getElementById('watchOutSplash');
        const overlay = document.getElementById('overlay');
        const overlayIcon = document.getElementById('overlayIcon');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const startBtn = document.getElementById('startBtn');
        const btnText = document.getElementById('btnText');
        const restartBtn = document.getElementById('restartBtn');
        const soundToggle = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');

        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundIcon.className = soundEnabled ? 'fa-solid fa-volume-high text-space-accent' : 'fa-solid fa-volume-xmark text-slate-500';
        });

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'bounce') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(160, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'hit') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'powerup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'planet') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.35);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'asteroid') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'launch') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'lifeLost') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {}
        }

        let score = 0;
        let highScore = parseInt(window.__galleryStorage.getItem('space_breakout_highscore')) || 0;
        let lives = 3;
        let gameRunning = false;
        let ballLaunched = false;
        let animationFrameId = null;
        let hitCount = 0;

        const basePaddleWidth = 110;
        const paddleHeight = 16;
        let paddleWidth = basePaddleWidth;
        let paddleX = (canvas.width - paddleWidth) / 2;
        let paddleSpeed = 8;
        let buffTimer = 0;
        let buffInterval = null;

        const ballRadius = 8;
        let ballX = canvas.width / 2;
        let ballY = canvas.height - 30;
        let baseSpeed = 4.5;
        let currentSpeed = baseSpeed;
        let ballSpeedX = currentSpeed;
        let ballSpeedY = -currentSpeed;

        const stars = [];
        const starCount = 80;
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        const brickRowCount = 6;
        const brickColumnCount = 8;
        const brickPadding = 10;
        const brickOffsetTop = 50;
        const brickOffsetLeft = 35;
        const brickWidth = (canvas.width - (brickOffsetLeft * 2) - (brickPadding * (brickColumnCount - 1))) / brickColumnCount;
        const brickHeight = 20;

        const rowColors = [
            { bg: '#ff007f', border: '#ff66b3', glow: 'rgba(255, 0, 127, 0.6)' },
            { bg: '#9d00ff', border: '#c866ff', glow: 'rgba(157, 0, 255, 0.6)' },
            { bg: '#00f0ff', border: '#80f8ff', glow: 'rgba(0, 240, 255, 0.6)' },
            { bg: '#00ff88', border: '#80ffc4', glow: 'rgba(0, ff, 136, 0.6)' },
            { bg: '#ffaa00', border: '#ffcc66', glow: 'rgba(255, 170, 0, 0.6)' },
            { bg: '#ffd700', border: '#ffea80', glow: 'rgba(255, 215, 0, 0.6)' }
        ];

        let bricks = [];
        let particles = [];
        let powerups = [];
        let planets = [];
        let asteroids = [];

        let rightPressed = false;
        let leftPressed = false;

        const planetTypes = [
            { color: '#00f0ff', secondary: '#0055ff', ring: true, name: '冰核星' },
            { color: '#ff007f', secondary: '#880044', ring: false, name: '緋紅星' },
            { color: '#ffaa00', secondary: '#ff3300', ring: true, name: '巨木星' },
            { color: '#00ff88', secondary: '#006633', ring: false, name: '翡翠星' }
        ];

        function updateHUD() {
            scoreEl.textContent = score;
            if (score > highScore) {
                highScore = score;
                window.__galleryStorage.setItem('space_breakout_highscore', highScore);
            }
            highScoreEl.textContent = highScore;

            let livesHTML = '';
            for (let i = 0; i < 3; i++) {
                if (i < lives) {
                    livesHTML += '<i class="fa-solid fa-heart text-space-pink"></i>';
                } else {
                    livesHTML += '<i class="fa-solid fa-heart text-slate-700"></i>';
                }
            }
            livesEl.innerHTML = livesHTML;

            const mult = (currentSpeed / baseSpeed).toFixed(1);
            speedMultiplierEl.textContent = `${mult}x`;
        }

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, row: r };
                }
            }
        }

        function resetBallAndPaddle() {
            ballLaunched = false;
            paddleX = (canvas.width - paddleWidth) / 2;
            ballX = paddleX + paddleWidth / 2;
            ballY = canvas.height - paddleHeight - ballRadius - 4;
            ballSpeedX = currentSpeed * (Math.random() > 0.5 ? 1 : -1);
            ballSpeedY = -currentSpeed;
        }

        function launchBall() {
            if (!ballLaunched && gameRunning) {
                ballLaunched = true;
                playSound('launch');
            }
        }

        function activatePowerup() {
            paddleWidth = basePaddleWidth * 1.5;
            buffTimer = 5;
            buffContainer.classList.remove('hidden');
            buffTimerEl.textContent = `${buffTimer}s`;

            if (buffInterval) clearInterval(buffInterval);

            buffInterval = setInterval(() => {
                buffTimer--;
                if (buffTimer > 0) {
                    buffTimerEl.textContent = `${buffTimer}s`;
                } else {
                    clearInterval(buffInterval);
                    paddleWidth = basePaddleWidth;
                    buffContainer.classList.add('hidden');
                }
            }, 1000);
        }

        function triggerExcellentSplash() {
            playSound('planet');
            excellentSplash.classList.remove('opacity-0', 'scale-50');
            excellentSplash.classList.add('opacity-100', 'scale-100');
            setTimeout(() => {
                excellentSplash.classList.remove('opacity-100', 'scale-100');
                excellentSplash.classList.add('opacity-0', 'scale-50');
            }, 1000);
        }

        function triggerWatchOutSplash() {
            playSound('asteroid');
            watchOutSplash.classList.remove('opacity-0', 'scale-50');
            watchOutSplash.classList.add('opacity-100', 'scale-100');
            setTimeout(() => {
                watchOutSplash.classList.remove('opacity-100', 'scale-100');
                watchOutSplash.classList.add('opacity-0', 'scale-50');
            }, 1000);
        }

        function triggerGameOver(isWin = false) {
            gameRunning = false;
            if (isWin) {
                overlayIcon.innerHTML = '<i class="fa-solid fa-trophy text-space-gold"></i>';
                overlayTitle.textContent = '任務成功！勝利！';
                overlayDesc.innerHTML = `恭喜清除所有磚塊！<br>最終得分：<span class="text-space-gold font-orbitron font-bold text-lg">${score}</span>`;
                btnText.textContent = '再次挑戰 (PLAY AGAIN)';
            } else {
                overlayIcon.innerHTML = '<i class="fa-solid fa-skull-crossbones text-space-pink"></i>';
                overlayTitle.textContent = 'GAME OVER';
                overlayDesc.innerHTML = `護盾崩壞，太空船已被毀滅！<br>最終得分：<span class="text-space-accent font-orbitron font-bold text-lg">${score}</span>`;
                btnText.textContent = '重新開始 (RETRY)';
            }
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100');
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 3 + 2,
                    color: color,
                    alpha: 1,
                    life: 0.03
                });
            }
        }

        function drawBackground() {
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawBricks() {
            let activeBricks = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        activeBricks++;
                        const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        b.x = brickX;
                        b.y = brickY;

                        const style = rowColors[r % rowColors.length];

                        ctx.shadowBlur = 8;
                        ctx.shadowColor = style.glow;

                        ctx.fillStyle = style.bg;
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
                        ctx.fill();

                        ctx.strokeStyle = style.border;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                        ctx.fillRect(brickX + 2, brickY + 2, brickWidth - 4, 3);
                    }
                }
            }
            ctx.shadowBlur = 0;

            if (activeBricks === 0 && gameRunning) {
                triggerGameOver(true);
            }
        }

        function drawPaddle() {
            const paddleY = canvas.height - paddleHeight - 8;

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f0ff';

            const grad = ctx.createLinearGradient(paddleX, paddleY, paddleX, paddleY + paddleHeight);
            grad.addColorStop(0, '#00f0ff');
            grad.addColorStop(0.5, '#0088ff');
            grad.addColorStop(1, '#0033aa');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(paddleX, paddleY, paddleWidth, paddleHeight, 8);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fillRect(paddleX + 10, paddleY + 3, paddleWidth - 20, 2);

            ctx.fillStyle = '#ff007f';
            ctx.fillRect(paddleX + 5, paddleY + paddleHeight - 3, 10, 3);
            ctx.fillRect(paddleX + paddleWidth - 15, paddleY + paddleHeight - 3, 10, 3);

            ctx.shadowBlur = 0;
        }

        function drawBall() {
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00f0ff';

            const grad = ctx.createRadialGradient(ballX, ballY, 1, ballX, ballY, ballRadius);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.4, '#00f0ff');
            grad.addColorStop(1, '#0055ff');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;

            if (!ballLaunched && gameRunning) {
                ctx.font = 'bold 12px Rajdhani, sans-serif';
                ctx.fillStyle = '#ffd700';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#ffd700';
                ctx.fillText('按下【空白鍵】發射能量球', ballX, ballY - 18);
                ctx.shadowBlur = 0;
            }
        }

        function trySpawnPlanet() {
            if (Math.random() < 0.003) {
                const type = planetTypes[Math.floor(Math.random() * planetTypes.length)];
                planets.push({
                    x: Math.random() * (canvas.width - 60) + 30,
                    y: -30,
                    radius: Math.random() * 8 + 14,
                    vy: Math.random() * 1.2 + 1.2,
                    type: type,
                    rot: 0
                });
            }
        }

        function drawPlanets() {
            planets.forEach((p, index) => {
                p.y += p.vy;
                p.rot += 0.02;

                ctx.save();
                ctx.translate(p.x, p.y);

                ctx.shadowBlur = 12;
                ctx.shadowColor = p.type.color;

                const grad = ctx.createRadialGradient(-p.radius*0.3, -p.radius*0.3, p.radius*0.1, 0, 0, p.radius);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.5, p.type.color);
                grad.addColorStop(1, p.type.secondary);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fill();

                if (p.type.ring) {
                    ctx.save();
                    ctx.rotate(0.4);
                    ctx.strokeStyle = p.type.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.radius * 1.7, p.radius * 0.4, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.restore();

                const paddleY = canvas.height - paddleHeight - 8;
                if (
                    p.y + p.radius >= paddleY &&
                    p.y - p.radius <= paddleY + paddleHeight &&
                    p.x >= paddleX &&
                    p.x <= paddleX + paddleWidth
                ) {
                    score += 50;
                    updateHUD();
                    triggerExcellentSplash();
                    createExplosion(p.x, p.y, p.type.color);
                    planets.splice(index, 1);
                } else if (p.y - p.radius > canvas.height) {
                    planets.splice(index, 1);
                }
            });
        }

        function drawPowerups() {
            powerups.forEach((pu, index) => {
                pu.y += pu.vy;

                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff007f';

                ctx.fillStyle = '#ff007f';
                ctx.beginPath();
                ctx.roundRect(pu.x - 12, pu.y - 8, 24, 16, 8);
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('P', pu.x, pu.y);

                ctx.shadowBlur = 0;

                const paddleY = canvas.height - paddleHeight - 8;
                if (
                    pu.y + 8 >= paddleY &&
                    pu.y - 8 <= paddleY + paddleHeight &&
                    pu.x >= paddleX &&
                    pu.x <= paddleX + paddleWidth
                ) {
                    playSound('powerup');
                    activatePowerup();
                    createExplosion(pu.x, pu.y, '#ff007f');
                    powerups.splice(index, 1);
                } else if (pu.y > canvas.height) {
                    powerups.splice(index, 1);
                }
            });
        }

        function trySpawnAsteroid() {
            if (Math.random() < 0.005) {
                const radius = Math.random() * 8 + 12;
                const points = [];
                const pointCount = 7;
                for (let i = 0; i < pointCount; i++) {
                    const angle = (i / pointCount) * Math.PI * 2;
                    const dist = radius * (0.7 + Math.random() * 0.5);
                    points.push({ x: Math.cos(angle) * dist, y: Math.sin(angle) * dist });
                }

                asteroids.push({
                    x: Math.random() * (canvas.width - 60) + 30,
                    y: -30,
                    radius: radius,
                    vy: Math.random() * 1.2 + 1.5,
                    vx: (Math.random() - 0.5) * 0.8,
                    rotSpeed: (Math.random() - 0.5) * 0.05,
                    angle: Math.random() * Math.PI * 2,
                    points: points
                });
            }
        }

        function drawAsteroids() {
            asteroids.forEach((ast, index) => {
                ast.y += ast.vy;
                ast.x += ast.vx;
                ast.angle += ast.rotSpeed;

                ctx.save();
                ctx.translate(ast.x, ast.y);
                ctx.rotate(ast.angle);

                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff3300';

                ctx.fillStyle = '#4a3b32';
                ctx.strokeStyle = '#ff6633';
                ctx.lineWidth = 1.5;

                ctx.beginPath();
                ast.points.forEach((pt, i) => {
                    if (i === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#2d221c';
                ctx.beginPath();
                ctx.arc(-ast.radius * 0.3, -ast.radius * 0.2, ast.radius * 0.25, 0, Math.PI * 2);
                ctx.arc(ast.radius * 0.2, ast.radius * 0.3, ast.radius * 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                const dxBall = ballX - ast.x;
                const dyBall = ballY - ast.y;
                const distBall = Math.sqrt(dxBall * dxBall + dyBall * dyBall);
                if (distBall < ballRadius + ast.radius && ballLaunched) {
                    createExplosion(ast.x, ast.y, '#ff4400');
                    playSound('hit');
                    asteroids.splice(index, 1);
                    return;
                }

                const paddleY = canvas.height - paddleHeight - 8;
                if (
                    ast.y + ast.radius >= paddleY &&
                    ast.y - ast.radius <= paddleY + paddleHeight &&
                    ast.x >= paddleX &&
                    ast.x <= paddleX + paddleWidth
                ) {
                    score = Math.max(0, score - 10);
                    updateHUD();
                    triggerWatchOutSplash();
                    createExplosion(ast.x, ast.y, '#ff0000');
                    asteroids.splice(index, 1);
                } else if (ast.y - ast.radius > canvas.height) {
                    asteroids.splice(index, 1);
                }
            });
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.life;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            });
        }

        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (
                            ballX > b.x &&
                            ballX < b.x + brickWidth &&
                            ballY > b.y &&
                            ballY < b.y + brickHeight
                        ) {
                            ballSpeedY = -ballSpeedY;
                            b.status = 0;
                            score += 10;
                            hitCount++;

                            if (hitCount % 5 === 0) {
                                currentSpeed += 0.6;
                                ballSpeedX = (ballSpeedX > 0 ? 1 : -1) * currentSpeed;
                                ballSpeedY = (ballSpeedY > 0 ? 1 : -1) * currentSpeed;
                            }

                            playSound('hit');
                            updateHUD();

                            const color = rowColors[r % rowColors.length].bg;
                            createExplosion(b.x + brickWidth / 2, b.y + brickHeight / 2, color);

                            if (Math.random() < 0.20) {
                                powerups.push({
                                    x: b.x + brickWidth / 2,
                                    y: b.y + brickHeight / 2,
                                    vy: 2
                                });
                            }
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawBricks();
            drawPaddle();
            drawBall();
            drawPowerups();
            drawPlanets();
            drawAsteroids();
            drawParticles();

            if (gameRunning) {
                if (rightPressed && paddleX < canvas.width - paddleWidth) {
                    paddleX += paddleSpeed;
                } else if (leftPressed && paddleX > 0) {
                    paddleX -= paddleSpeed;
                }

                if (!ballLaunched) {
                    ballX = paddleX + paddleWidth / 2;
                    ballY = canvas.height - paddleHeight - ballRadius - 8;
                } else {
                    ballX += ballSpeedX;
                    ballY += ballSpeedY;

                    if (ballX + ballRadius > canvas.width || ballX - ballRadius < 0) {
                        ballSpeedX = -ballSpeedX;
                        playSound('bounce');
                    }

                    if (ballY - ballRadius < 0) {
                        ballSpeedY = -ballSpeedY;
                        playSound('bounce');
                    }

                    const paddleY = canvas.height - paddleHeight - 8;
                    if (
                        ballY + ballRadius >= paddleY &&
                        ballY - ballRadius <= paddleY + paddleHeight &&
                        ballX >= paddleX &&
                        ballX <= paddleX + paddleWidth &&
                        ballSpeedY > 0
                    ) {
                        const hitPoint = (ballX - (paddleX + paddleWidth / 2)) / (paddleWidth / 2);
                        const maxAngle = Math.PI / 3;
                        const bounceAngle = hitPoint * maxAngle;

                        ballSpeedX = currentSpeed * Math.sin(bounceAngle);
                        ballSpeedY = -currentSpeed * Math.cos(bounceAngle);

                        playSound('bounce');
                    }

                    if (ballY + ballRadius > canvas.height) {
                        lives--;
                        playSound('lifeLost');
                        updateHUD();

                        if (lives <= 0) {
                            triggerGameOver(false);
                        } else {
                            resetBallAndPaddle();
                        }
                    }

                    collisionDetection();
                    trySpawnPlanet();
                    trySpawnAsteroid();
                }
            }

            animationFrameId = requestAnimationFrame(draw);
        }

        function initGame() {
            score = 0;
            lives = 3;
            hitCount = 0;
            currentSpeed = baseSpeed;
            paddleWidth = basePaddleWidth;
            buffTimer = 0;
            if (buffInterval) clearInterval(buffInterval);
            buffContainer.classList.add('hidden');

            updateHUD();
            initBricks();
            resetBallAndPaddle();
            powerups = [];
            planets = [];
            asteroids = [];
            particles = [];
        }

        function startGame() {
            initGame();
            gameRunning = true;
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.classList.remove('opacity-100');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                rightPressed = true;
            } else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                leftPressed = true;
            } else if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                launchBall();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                rightPressed = false;
            } else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                leftPressed = false;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const relativeX = (e.clientX - rect.left) * (canvas.width / rect.width);
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const relativeX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }, { passive: true });

        canvas.addEventListener('click', () => {
            launchBall();
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        window.onload = function() {
            initGame();
            draw();
        };
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
