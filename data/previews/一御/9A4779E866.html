<!DOCTYPE html>
<html lang="zh-TW">
<head><base href="../../../%E4%BD%9C%E5%93%81/%E7%AC%AC%E4%B8%80%E5%80%8BAI%E7%A8%8B%E5%BC%8F/%E4%B8%80%E5%BE%A1/"><script>
window.__galleryStorage = (() => {
  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>接水果大作戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            font-family: 'Nunito', sans-serif;
            touch-action: none; /* 防止手機端滑動縮放干擾 */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 60%, #90EE90 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
            /* 保持內部邏輯比例 800x600 */
            aspect-ratio: 4/3; 
        }

        /* 遊戲 UI 覆蓋層 */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 讓點擊穿透到畫布或指定按鈕 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 手機端虛擬按鈕 */
        .mobile-controls {
            display: none;
            padding: 20px;
            justify-content: space-between;
            pointer-events: auto;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 4px solid white;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: #333;
            user-select: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(0.95);
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            border-radius: 12px;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none !important;
        }
    </style>
<style id="gallery-layout-support">
html { overflow-y: auto !important; }
body { height: auto !important; min-height: 100vh !important; overflow-y: auto !important; }
/* Full-height games need a definite containing height for percentage-sized canvases. */
body.h-full, body.h-screen { height: 100vh !important; }

body > header, body > main, body > footer, body > canvas { flex-shrink: 0; }

</style></head>
<body>

<div id="game-container">
    <!-- 遊戲畫布，內部邏輯解析度為 800x600 -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="ui-layer">
        <div class="p-4 sm:p-6 w-full max-w-4xl mx-auto flex justify-between items-start pointer-events-none">
            <!-- UI 會透過 Canvas 繪製，但這裡保留給外部控制項的空間 -->
        </div>
        
        <!-- 手機端控制面板 -->
        <div class="mobile-controls w-full max-w-2xl mx-auto pb-8">
            <div id="btn-left" class="control-btn">⬅️</div>
            <div id="btn-right" class="control-btn">➡️</div>
        </div>
    </div>

    <!-- 遊戲開始/結束選單 -->
    <div id="overlay">
        <h1 id="menu-title" class="text-5xl md:text-7xl font-black text-white mb-4 drop-shadow-lg text-center tracking-wide">
            接水果大作戰
        </h1>
        <p id="menu-subtitle" class="text-xl md:text-2xl text-yellow-300 font-bold mb-8 drop-shadow-md">
            用方向鍵 ⬅️ ➡️ 移動竹編菜籃
        </p>
        <p id="final-score" class="text-3xl text-white font-bold mb-8 hidden">得分: 0</p>
        <button id="start-btn" class="px-8 py-4 bg-gradient-to-r from-orange-400 to-red-500 hover:from-orange-500 hover:to-red-600 text-white text-2xl font-black rounded-full shadow-xl transform transition hover:scale-105 active:scale-95">
            開始遊戲
        </button>
    </div>
</div>

<script>
    // 使用 ES6 模組化設計風格
    window.onload = function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const menuTitle = document.getElementById('menu-title');
        const menuSubtitle = document.getElementById('menu-subtitle');
        const finalScore = document.getElementById('final-score');
        
        // 內部解析度常數
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 600;

        // --- 遊戲物件定義 ---

        // 1. 竹編菜籃 (玩家)
        class Basket {
            constructor(gameWidth, gameHeight) {
                this.gameWidth = gameWidth;
                this.gameHeight = gameHeight;
                this.width = 100;
                this.height = 80;
                // 初始位置在底部中間
                this.x = (gameWidth / 2) - (this.width / 2);
                this.y = gameHeight - this.height - 20; 
                this.speed = 10; // 移動速度
                this.emoji = '🧺';
            }

            draw(context) {
                context.save();
                context.font = '80px Arial'; // 調整 emoji 大小
                context.textAlign = 'center';
                context.textBaseline = 'top';
                // 繪製陰影
                context.shadowColor = 'rgba(0, 0, 0, 0.3)';
                context.shadowBlur = 10;
                context.shadowOffsetX = 0;
                context.shadowOffsetY = 10;
                context.fillText(this.emoji, this.x + this.width / 2, this.y);
                context.restore();
            }

            update(input) {
                // 根據輸入移動
                if (input.keys.indexOf('ArrowRight') > -1 || input.touchRight) {
                    this.x += this.speed;
                }
                if (input.keys.indexOf('ArrowLeft') > -1 || input.touchLeft) {
                    this.x -= this.speed;
                }

                // 邊界碰撞偵測
                if (this.x < 0) this.x = 0;
                if (this.x > this.gameWidth - this.width) this.x = this.gameWidth - this.width;
            }
        }

        // 2. 水果物件
        class Fruit {
            constructor(gameWidth) {
                this.gameWidth = gameWidth;
                this.width = 60;
                this.height = 60;
                // 隨機 X 位置
                this.x = Math.random() * (gameWidth - this.width);
                this.y = -this.height; // 從螢幕上方外面開始掉落
                
                // 水果清單：香蕉、西瓜、橘子、芭樂(用綠蘋果/梨子代替)
                const types = [
                    { emoji: '🍌', points: 10, speed: 3 },
                    { emoji: '🍉', points: 15, speed: 4 },
                    { emoji: '🍊', points: 10, speed: 3.5 },
                    { emoji: '🍐', points: 20, speed: 5 } // 芭樂分數較高，掉較快
                ];
                
                // 隨機選擇一種水果
                const selectedType = types[Math.floor(Math.random() * types.length)];
                this.emoji = selectedType.emoji;
                this.points = selectedType.points;
                // 加上一點隨機速度變化
                this.speedY = selectedType.speed + (Math.random() * 2);
                this.markedForDeletion = false;
                
                // 旋轉效果
                this.angle = Math.random() * Math.PI * 2;
                this.spinSpeed = (Math.random() - 0.5) * 0.1;
            }

            draw(context) {
                context.save();
                context.translate(this.x + this.width/2, this.y + this.height/2);
                context.rotate(this.angle);
                context.font = '50px Arial';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                // 水果發光效果
                context.shadowColor = 'rgba(255, 255, 255, 0.8)';
                context.shadowBlur = 10;
                context.fillText(this.emoji, 0, 0);
                context.restore();
            }

            update() {
                this.y += this.speedY;
                this.angle += this.spinSpeed;
                
                // 掉出畫面底部，標記刪除
                if (this.y > GAME_HEIGHT) {
                    this.markedForDeletion = true;
                }
            }
        }

        // 3. 輸入處理器 (支援鍵盤與虛擬按鍵)
        class InputHandler {
            constructor() {
                this.keys = [];
                this.touchLeft = false;
                this.touchRight = false;

                // 鍵盤事件
                window.addEventListener('keydown', (e) => {
                    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') && this.keys.indexOf(e.key) === -1) {
                        this.keys.push(e.key);
                    }
                });
                window.addEventListener('keyup', (e) => {
                    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        this.keys.splice(this.keys.indexOf(e.key), 1);
                    }
                });

                // 手機觸控事件
                const btnLeft = document.getElementById('btn-left');
                const btnRight = document.getElementById('btn-right');

                // 左鍵
                btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); this.touchLeft = true; });
                btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); this.touchLeft = false; });
                btnLeft.addEventListener('mousedown', (e) => { e.preventDefault(); this.touchLeft = true; });
                btnLeft.addEventListener('mouseup', (e) => { e.preventDefault(); this.touchLeft = false; });
                btnLeft.addEventListener('mouseleave', (e) => { this.touchLeft = false; });

                // 右鍵
                btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); this.touchRight = true; });
                btnRight.addEventListener('touchend', (e) => { e.preventDefault(); this.touchRight = false; });
                btnRight.addEventListener('mousedown', (e) => { e.preventDefault(); this.touchRight = true; });
                btnRight.addEventListener('mouseup', (e) => { e.preventDefault(); this.touchRight = false; });
                btnRight.addEventListener('mouseleave', (e) => { this.touchRight = false; });
            }
        }

        // 4. 動態分數特效 (加分時飄起的文字)
        class FloatingText {
            constructor(text, x, y) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.lifeSpan = 0;
                this.maxLife = 40;
                this.markedForDeletion = false;
            }
            draw(context) {
                context.save();
                context.font = 'bold 30px Nunito';
                context.fillStyle = `rgba(255, 215, 0, ${1 - this.lifeSpan/this.maxLife})`; // 金色，逐漸透明
                context.strokeStyle = `rgba(0, 0, 0, ${1 - this.lifeSpan/this.maxLife})`;
                context.lineWidth = 3;
                context.strokeText(this.text, this.x, this.y);
                context.fillText(this.text, this.x, this.y);
                context.restore();
            }
            update() {
                this.y -= 2; // 向上飄
                this.lifeSpan++;
                if (this.lifeSpan >= this.maxLife) this.markedForDeletion = true;
            }
        }

        // --- 遊戲主要管理邏輯 ---
        let basket;
        let fruits = [];
        let floatingTexts = [];
        let input;
        let score = 0;
        let missedFruits = 0;
        const maxMisses = 3; // 漏接三個就 GAME OVER
        let gameOver = false;
        let animationId;
        let fruitTimer = 0;
        let fruitInterval = 1000; // 每 1 秒生成一個水果 (會隨時間縮短)
        let lastTime = 0;

        function initGame() {
            basket = new Basket(GAME_WIDTH, GAME_HEIGHT);
            input = new InputHandler();
            fruits = [];
            floatingTexts = [];
            score = 0;
            missedFruits = 0;
            gameOver = false;
            fruitTimer = 0;
            fruitInterval = 1200; // 初始難度
            lastTime = performance.now();
            
            // 隱藏 UI
            overlay.classList.add('hidden');
            
            // 開始循環
            animate(0);
        }

        // 碰撞偵測 (AABB 簡化版，讓判定稍微小一點，更有真實感)
        function checkCollision(rect1, rect2) {
            const marginX = 20; // 容錯空間
            const marginY = 20;
            return (
                rect1.x < rect2.x + rect2.width - marginX &&
                rect1.x + rect1.width > rect2.x + marginX &&
                rect1.y < rect2.y + rect2.height - marginY &&
                rect1.y + rect1.height > rect2.y + marginY
            );
        }

        function drawStatusText(context) {
            context.save();
            // 分數
            context.font = 'bold 36px Nunito';
            context.fillStyle = '#333';
            context.shadowColor = 'white';
            context.shadowBlur = 4;
            context.fillText(`分數: ${score}`, 20, 50);

            // 生命值 (漏接次數)
            context.textAlign = 'right';
            context.fillStyle = '#d32f2f';
            let hearts = '';
            for(let i=0; i < (maxMisses - missedFruits); i++){ hearts += '❤️ '; }
            context.fillText(hearts, GAME_WIDTH - 20, 50);
            context.restore();
        }

        function animate(timeStamp) {
            const deltaTime = timeStamp - lastTime;
            lastTime = timeStamp;

            // 清除畫布
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 生成水果邏輯
            if (fruitTimer > fruitInterval) {
                fruits.push(new Fruit(GAME_WIDTH));
                fruitTimer = 0;
                // 隨著遊戲進行，逐漸加快掉落頻率 (最低 400ms)
                if (fruitInterval > 400) fruitInterval -= 15; 
            } else {
                fruitTimer += deltaTime;
            }

            // 更新並繪製物件
            basket.update(input);
            basket.draw(ctx);

            fruits.forEach(fruit => {
                fruit.update();
                fruit.draw(ctx);
                
                // 檢查是否漏接
                if (fruit.markedForDeletion && fruit.y > GAME_HEIGHT) {
                    missedFruits++;
                    if(missedFruits >= maxMisses) gameOver = true;
                }
                
                // 檢查碰撞
                if (!fruit.markedForDeletion && checkCollision(basket, fruit)) {
                    fruit.markedForDeletion = true;
                    score += fruit.points;
                    // 新增特效文字
                    floatingTexts.push(new FloatingText(`+${fruit.points}`, fruit.x, fruit.y));
                }
            });

            // 清理已標記刪除的水果
            fruits = fruits.filter(fruit => !fruit.markedForDeletion);

            // 更新並繪製飄浮文字特效
            floatingTexts.forEach(text => {
                text.update();
                text.draw(ctx);
            });
            floatingTexts = floatingTexts.filter(text => !text.markedForDeletion);

            drawStatusText(ctx);

            if (!gameOver) {
                animationId = requestAnimationFrame(animate);
            } else {
                // 遊戲結束處理
                menuTitle.innerText = "遊戲結束";
                menuTitle.classList.add('text-red-500');
                menuSubtitle.innerText = "哎呀！水果掉滿地了";
                finalScore.innerText = `最終得分: ${score}`;
                finalScore.classList.remove('hidden');
                startBtn.innerText = "再玩一次";
                overlay.classList.remove('hidden');
            }
        }

        // 綁定開始按鈕事件
        startBtn.addEventListener('click', () => {
            initGame();
        });
    };
</script>

<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
</html>
