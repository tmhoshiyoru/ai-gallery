window.__galleryStorage = (() => {
  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();
</script>

        body {

        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
            transform: translateY(-1px);

        /* Screen shake keyframes fallback */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, 0px) rotate(-1deg); }
            40% { transform: translate(2px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .shake-effect {
            animation: shake 0.25s ease-in-out;
        }
    </style>

    <script>
        // Sound System using Web Audio API for synthesized retro sound effects
        class RetroAudio {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, type, duration, gainVal = 0.1, rampDown = true) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    if (rampDown) {
                        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    }
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    // Ignore autoplay restrictions
                }
            }

            shoot() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch (e) {}
            }

            hit() {
                this.playTone(320, 'triangle', 0.06, 0.15);
            }

            explode() {
                if (!this.ctx) return;
                try {
                    // Synthesize noise-like explosion sound using low frequency sweep
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch (e) {}
            }

            damage() {
                this.playTone(120, 'square', 0.2, 0.25);
            }

            gameOver() {
                [220, 180, 140, 90].forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sawtooth', 0.2, 0.2), idx * 100);
                });
            }
        }

        const audio = new RetroAudio();

        // Game Configuration & Constants
        const CONFIG = {
            width: 500,
            height: 700,
            maxLives: 3,
            playerSpeed: 7,
            bulletSpeed: 12,
            fireCooldownMs: 150,
            enemySpawnRateMs: 1600, // 放慢生成間隔（原 1100ms）
            colors: {
                player: '#38bdf8',
                playerGlow: 'rgba(56, 189, 248, 0.6)',
                bullet: '#38bdf8',
                enemyNormal: '#f43f5e',
                enemyFast: '#fbbf24',
                enemyHeavy: '#c084fc',
                starNear: 'rgba(255, 255, 255, 0.8)',
                starFar: 'rgba(148, 163, 184, 0.3)'
            }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CONFIG.width;
        canvas.height = CONFIG.height;

        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const livesDisplay = document.getElementById('lives-display');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const statusIcon = document.getElementById('status-icon');
        const startBtn = document.getElementById('start-btn');
        const headerRestartBtn = document.getElementById('header-restart-btn');

        // Touch Control Elements
        const btnTouchLeft = document.getElementById('btn-touch-left');
        const btnTouchRight = document.getElementById('btn-touch-right');
        const btnTouchFire = document.getElementById('btn-touch-fire');

        // State variables
        let score = 0;
        let lives = CONFIG.maxLives;
        let highScore = window.__galleryStorage.getItem('space_vanguard_high_score') || 0;
        highScoreDisplay.textContent = highScore;

        let gameRunning = false;
        let animationId = null;
        let lastFireTime = 0;
        let lastEnemySpawnTime = 0;

        // Input Tracking
        const keys = {
            left: false,
            right: false,
            space: false
        };

        // Entities arrays
        let player = {
            x: CONFIG.width / 2,
            y: CONFIG.height - 70,
            width: 36,
            height: 42,
            vx: 0
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];

        // Create 2-layer parallax Starfield
        function initStars() {
            stars = [];
            for (let i = 0; i < 60; i++) {
                stars.push({
                    x: Math.random() * CONFIG.width,
                    y: Math.random() * CONFIG.height,
                    radius: Math.random() * 1.5 + 0.5,
                    speed: Math.random() * 1.5 + 0.5,
                    color: Math.random() > 0.5 ? CONFIG.colors.starNear : CONFIG.colors.starFar
                });
            }
        }

        function updateStars() {
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > CONFIG.height) {
                    s.y = 0;
                    s.x = Math.random() * CONFIG.width;
                }
            });
        }

        function drawStars() {
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.fill();
            });
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Engine Thruster Flame
            ctx.beginPath();
            ctx.moveTo(-6, player.height / 2);
            ctx.lineTo(0, player.height / 2 + (Math.random() * 12 + 10));
            ctx.lineTo(6, player.height / 2);
            ctx.fillStyle = '#22d3ee';
            ctx.shadowColor = '#06b6d4';
            ctx.shadowBlur = 12;
            ctx.fill();

            // Player Ship Geometry (Sci-Fi Fighter Vector)
            ctx.beginPath();
            ctx.moveTo(0, -player.height / 2); // Nose
            ctx.lineTo(player.width / 2, player.height / 2 - 4); // Right wing tip
            ctx.lineTo(player.width / 4, player.height / 2); // Right wing indent
            ctx.lineTo(-player.width / 4, player.height / 2); // Left wing indent
            ctx.lineTo(-player.width / 2, player.height / 2 - 4); // Left wing tip
            ctx.closePath();

            ctx.fillStyle = CONFIG.colors.player;
            ctx.shadowColor = CONFIG.colors.playerGlow;
            ctx.shadowBlur = 15;
            ctx.fill();

            // Cockpit Glow
            ctx.beginPath();
            ctx.ellipse(0, -player.height / 6, 4, 8, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.restore();
        }

        function spawnBullet() {
            const now = Date.now();
            if (now - lastFireTime >= CONFIG.fireCooldownMs) {
                audio.shoot();
                bullets.push({
                    x: player.x,
                    y: player.y - player.height / 2,
                    radius: 3,
                    speed: CONFIG.bulletSpeed
                });
                lastFireTime = now;
            }
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= b.speed;
                if (b.y < -10) {
                    bullets.splice(i, 1);
                }
            }
        }

        function drawBullets() {
            bullets.forEach(b => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = CONFIG.colors.bullet;
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 10;
                ctx.fill();

                // Bullet Laser Beam Effect
                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(b.x, b.y + 12);
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            });
        }

        function spawnEnemy() {
            const now = Date.now();
            // 放慢隨分數增加的加速曲線，最快生成頻率放寬至 700ms
            const currentSpawnRate = Math.max(700, CONFIG.enemySpawnRateMs - Math.floor(score / 50) * 50);

            if (now - lastEnemySpawnTime >= currentSpawnRate) {
                const rand = Math.random();
                let enemyType = 'normal';
                // 普通敵機下落速度降低為原先的 40% (約 1.2 ~ 2.0)
                let width = 32, height = 32, hp = 1, speed = 1.2 + Math.random() * 0.8, color = CONFIG.colors.enemyNormal;

                if (rand > 0.75) {
                    // 快速偵察機下落速度降低 (約 2.2 ~ 3.0)
                    enemyType = 'fast';
                    width = 24; height = 24; hp = 1; speed = 2.2 + Math.random() * 0.8; color = CONFIG.colors.enemyFast;
                } else if (rand > 0.55) {
                    // 重裝巡洋艦下落速度降低 (約 0.8 ~ 1.2)
                    enemyType = 'heavy';
                    width = 44; height = 44; hp = 2; speed = 0.8 + Math.random() * 0.4; color = CONFIG.colors.enemyHeavy;
                }

                enemies.push({
                    x: Math.random() * (CONFIG.width - width - 20) + width / 2 + 10,
                    y: -height,
                    width: width,
                    height: height,
                    hp: hp,
                    maxHp: hp,
                    speed: speed,
                    color: color,
                    type: enemyType
                });

                lastEnemySpawnTime = now;
            }
        }

        function updateEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;

                // Enemy breached bottom line -> Lose 1 Life
                if (e.y - e.height / 2 > CONFIG.height) {
                    enemies.splice(i, 1);
                    handleDamage();
                }
            }
        }

        function drawEnemies() {
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);

                ctx.beginPath();
                // Draw downward pointing enemy fighter triangle
                ctx.moveTo(0, e.height / 2);
                ctx.lineTo(-e.width / 2, -e.height / 2);
                ctx.lineTo(e.width / 2, -e.height / 2);
                ctx.closePath();

                ctx.fillStyle = e.color;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 10;
                ctx.fill();

                // Heavy enemy health indicator dot
                if (e.type === 'heavy' && e.hp < e.maxHp) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-8, -e.height / 2 - 6, (e.hp / e.maxHp) * 16, 3);
                }

                ctx.restore();
            });
        }

        function createExplosion(x, y, color, count = 18) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1.5,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.04 + 0.02
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();
            });
        }

        function triggerScreenShake() {
            container.classList.remove('shake-effect');
            // Force DOM reflow
            void container.offsetWidth;
            container.classList.add('shake-effect');
        }

        function handleDamage() {
            lives--;
            updateLivesDisplay();
            audio.damage();
            triggerScreenShake();

            if (lives <= 0) {
                gameOver();
            }
        }

        function checkCollisions() {
            // 1. Bullets vs Enemies Collision
            for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
                const b = bullets[bIdx];
                for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                    const e = enemies[eIdx];

                    // Simple AABB / Distance overlap
                    const dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < b.radius + e.width / 2) {
                        bullets.splice(bIdx, 1);
                        e.hp--;

                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, e.color, 20);
                            enemies.splice(eIdx, 1);
                            audio.explode();
                            score += 10;
                            scoreDisplay.textContent = score;

                            if (score > highScore) {
                                highScore = score;
                                highScoreDisplay.textContent = highScore;
                                window.__galleryStorage.setItem('space_vanguard_high_score', highScore);
                            }
                        } else {
                            createExplosion(b.x, b.y, '#38bdf8', 6);
                            audio.hit();
                        }
                        break;
                    }
                }
            }

            // 2. Enemies vs Player Spaceship Collision
            for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                const e = enemies[eIdx];
                const dist = Math.hypot(player.x - e.x, player.y - e.y);

                if (dist < (player.width / 2 + e.width / 2)) {
                    createExplosion(e.x, e.y, e.color, 25);
                    createExplosion(player.x, player.y, CONFIG.colors.player, 25);
                    enemies.splice(eIdx, 1);
                    handleDamage();
                }
            }
        }

        function updateLivesDisplay() {
            let shields = '';
            for (let i = 0; i < CONFIG.maxLives; i++) {
                shields += i < lives ? '🚀' : '💥';
            }
            livesDisplay.textContent = shields;
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === ' ' || e.key === 'Spacebar') {
                keys.space = true;
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === ' ' || e.key === 'Spacebar') keys.space = false;
        });

        // Touch Control Button Binding
        const bindTouchButton = (btn, actionOn, actionOff) => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); actionOn(); }, { passive: false });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); actionOff(); }, { passive: false });
            btn.addEventListener('mousedown', actionOn);
            btn.addEventListener('mouseup', actionOff);
        };

        bindTouchButton(btnTouchLeft, () => keys.left = true, () => keys.left = false);
        bindTouchButton(btnTouchRight, () => keys.right = true, () => keys.right = false);
        bindTouchButton(btnTouchFire, () => keys.space = true, () => keys.space = false);

        // Canvas Direct Touch/Mouse Drag Control
        function handlePointerMove(clientX) {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const canvasX = (clientX - rect.left) * scaleX;
            player.x = Math.max(player.width / 2, Math.min(CONFIG.width - player.width / 2, canvasX));
        }

        canvas.addEventListener('mousemove', (e) => handlePointerMove(e.clientX));
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX);
            e.preventDefault();
        }, { passive: false });

        function updatePlayerPosition() {
            if (keys.left) player.x -= CONFIG.playerSpeed;
            if (keys.right) player.x += CONFIG.playerSpeed;
            if (keys.space) spawnBullet();

            // Screen boundary clamping
            player.x = Math.max(player.width / 2, Math.min(CONFIG.width - player.width / 2, player.x));
        }

        function gameLoop() {
            if (!gameRunning) return;

            // Clear Screen
            ctx.fillStyle = '#060913';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update & Render Game Layers
            updateStars();
            drawStars();

            updatePlayerPosition();
            drawPlayer();

            updateBullets();
            drawBullets();

            spawnEnemy();
            updateEnemies();
            drawEnemies();

            updateParticles();
            drawParticles();

            checkCollisions();

            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            audio.init();
            score = 0;
            lives = CONFIG.maxLives;
            scoreDisplay.textContent = score;
            updateLivesDisplay();

            player.x = CONFIG.width / 2;
            bullets = [];
            enemies = [];
            particles = [];
            initStars();

            overlay.classList.add('opacity-0', 'pointer-events-none');
            gameRunning = true;

            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            audio.gameOver();

            statusIcon.textContent = '💥';
            overlayTitle.textContent = 'MISSION FAILED';
            overlayDesc.innerHTML = `護盾能量耗盡！<br>最終戰績: <span class="font-bold text-cyan-300">${score}</span> 分<br>點擊下方按鈕即可重新出擊！`;
            startBtn.textContent = 'RESTART MISSION';

            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        // Button Listeners
        startBtn.addEventListener('click', startGame);
        headerRestartBtn.addEventListener('click', startGame);

        // Initial Background Draw
        initStars();
        drawStars();
        drawPlayer();
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
