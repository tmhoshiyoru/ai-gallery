  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();

        let currentThemeIndex = 0;

        function applyTheme(theme) {
            currentTheme = theme;

            // 1. 全局背景與文字
            pageBody.style.backgroundImage = theme.bgGradient;
            
            // 2. 頁面 UI 元素適應主題
            appTitle.textContent = theme.title;
            appSubtitle.textContent = theme.subtitle;
            tagBadge.textContent = theme.tag;

            // 顏色與邊框設定
            mainHeader.style.borderColor = theme.cardBorder;
            canvasContainer.style.borderColor = theme.cardBorder;
            
            tagBadge.style.backgroundColor = theme.badgeBg;
            tagBadge.style.borderColor = theme.badgeBorder;
            tagBadge.style.color = theme.textColor;

            themeBadge.textContent = `STYLE: ${theme.name} ↺`;

            themeBadge.style.borderColor = theme.badgeBorder;
            themeBadge.style.color = theme.textColor;

            rateBadge.textContent = `${theme.itemName}掉落率 20%`;
            rateBadge.style.backgroundColor = theme.badgeBg;
            rateBadge.style.borderColor = theme.badgeBorder;
            rateBadge.style.color = theme.textColor;

            overlayCard.style.borderColor = theme.cardBorder;
            overlayCard.style.backgroundColor = theme.badgeBg;
            overlayTag.textContent = theme.tag;
            overlayTag.style.color = theme.textColor;
            overlayTitle.textContent = `開啟 ${theme.name} 旅程`;
            overlayTitle.style.color = theme.textColor;
            overlaySub.style.color = theme.textColor;
            
            startBtn.style.backgroundColor = theme.primaryColor;
            startBtn.style.color = '#ffffff';

            if (gameState !== 'START') {
                draw();
            }
        }

        function applyRandomTheme() {
            currentThemeIndex = Math.floor(Math.random() * themes.length);
            applyTheme(themes[currentThemeIndex]);
        }

        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(themes[currentThemeIndex]);
        }

        themeBadge.addEventListener('click', cycleTheme);

        const paddle = {
            baseWidth: 100,
            width: 100,
            height: 10,
            x: (canvas.width - 100) / 2,
            y: canvas.height - 32,
            speed: 8.5,
            isExpanded: false,
            expandTimer: null,
            expandEndTime: 0
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 48,
            radius: 6.5,
            speed: 4.95, // 精確鎖定原本速度 90%
            dx: 2.1,
            dy: -4.48
        };

        const brickRowCount = 4;
        const brickColumnCount = 7;
        const brickPadding = 12;
        const brickOffsetTop = 45;
        const brickOffsetLeft = 35;
        const brickHeight = 15;
        const brickWidth = (canvas.width - (brickOffsetLeft * 2) - (brickPadding * (brickColumnCount - 1))) / brickColumnCount;

        let bricks = [];
        let remainingBricks = 0;
        let items = [];
        let floatingTexts = [];
        let particles = [];

        let rightPressed = false;
        let leftPressed = false;

        function initParticles() {
            particles = [];
            for (let i = 0; i < 22; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedY: Math.random() * -0.25 - 0.08,
                    speedX: Math.random() * 0.2 - 0.1,
                    alpha: Math.random() * 0.35 + 0.15
                });
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') {
                rightPressed = true;
            } else if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') {
                leftPressed = true;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') {
                rightPressed = false;
            } else if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') {
                leftPressed = false;
            }
        });

        function handlePointerMove(e) {
            if (gameState !== 'PLAYING') return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const relativeX = (clientX - rect.left) * scaleX;
            
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, relativeX - paddle.width / 2));
            }
        }

        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('touchmove', (e) => {
            handlePointerMove(e);
            e.preventDefault();
        }, { passive: false });

        startBtn.addEventListener('click', startGame);

        function initBricks() {
            bricks = [];
            remainingBricks = brickRowCount * brickColumnCount;
            for (let r = 0; r < brickRowCount; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickColumnCount; c++) {
                    bricks[r][c] = { x: 0, y: 0, status: 1 };
                }
            }
        }

        function resetPaddleBuff() {
            if (paddle.expandTimer) {
                clearTimeout(paddle.expandTimer);
                paddle.expandTimer = null;
            }
            paddle.width = paddle.baseWidth;
            paddle.isExpanded = false;
            paddle.expandEndTime = 0;
        }

        function resetPositions() {
            resetPaddleBuff();
            paddle.x = (canvas.width - paddle.width) / 2;
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 48;
            
            const baseSpeed = 4.95; 
            const dir = Math.random() > 0.5 ? 1 : -1;
            const angle = (Math.random() * 0.35 + 0.25) * dir;
            
            ball.dx = baseSpeed * Math.sin(angle);
            ball.dy = -baseSpeed * Math.cos(angle);

            items = [];
            floatingTexts = [];
        }

        function startGame() {
            score = 0;
            scoreText.textContent = String(score).padStart(4, '0');
            applyRandomTheme();
            initBricks();
            initParticles();
            resetPositions();
            gameState = 'PLAYING';
            overlay.classList.add('opacity-0', 'pointer-events-none');
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function spawnItem(x, y) {
            if (Math.random() <= 0.20) {
                items.push({
                    x: x + brickWidth / 2,
                    y: y + brickHeight / 2,
                    radius: 11,
                    dy: 2.1,
                    type: currentTheme.itemType
                });
            }
        }

        function activateExpandBuff() {
            paddle.width = 150;
            paddle.isExpanded = true;

            const now = Date.now();
            if (paddle.expandEndTime > now) {
                paddle.expandEndTime += 5000;
            } else {
                paddle.expandEndTime = now + 5000;
            }

            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

            if (paddle.expandTimer) clearTimeout(paddle.expandTimer);
            const remainingMs = paddle.expandEndTime - now;
            
            paddle.expandTimer = setTimeout(() => {
                paddle.width = paddle.baseWidth;
                paddle.isExpanded = false;
                paddle.expandTimer = null;
                paddle.expandEndTime = 0;
            }, remainingMs);

            const totalSecs = Math.round(remainingMs / 1000);
            addFloatingText(`${currentTheme.itemBuffName} (+5s | 剩餘 ${totalSecs}s)`, paddle.x + paddle.width / 2, paddle.y - 15);
        }

        function addFloatingText(text, x, y) {
            floatingTexts.push({
                text: text,
                x: x,
                y: y,
                alpha: 1.0,
                dy: -1.0
            });
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            overlayTitle.textContent = '旅程靜享停歇';
            overlaySub.innerHTML = `平靜享受專注時光。最終得分：<b>${score}</b>`;
            startBtn.innerHTML = '<span>重新開啟</span>';
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            
            if (score > highScore) {
                highScore = score;
                window.__galleryStorage.setItem('breakout_clean_theme_score', highScore);
                highScoreText.textContent = String(highScore).padStart(4, '0');
            }
        }

        function gameWin() {
            gameState = 'WIN';
            overlayTitle.textContent = '滿載圓滿';
            overlaySub.innerHTML = `恭喜清空所有磚塊！<br>最終獲得分數：<b>${score}</b>`;
            startBtn.innerHTML = '<span>再次探索</span>';
            overlay.classList.remove('opacity-0', 'pointer-events-none');

            if (score > highScore) {
                highScore = score;
                window.__galleryStorage.setItem('breakout_clean_theme_score', highScore);
                highScoreText.textContent = String(highScore).padStart(4, '0');
            }
        }

        function checkCircleRectCollision(circleX, circleY, radius, rectX, rectY, rectWidth, rectHeight) {
            const nearestX = Math.max(rectX, Math.min(circleX, rectX + rectWidth));
            const nearestY = Math.max(rectY, Math.min(circleY, rectY + rectHeight));
            const deltaX = circleX - nearestX;
            const deltaY = circleY - nearestY;
            return (deltaX * deltaX + deltaY * deltaY) <= (radius * radius);
        }

        function collisionDetection() {
            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        if (
                            ball.x + ball.radius > b.x &&
                            ball.x - ball.radius < b.x + brickWidth &&
                            ball.y + ball.radius > b.y &&
                            ball.y - ball.radius < b.y + brickHeight
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            remainingBricks--;
                            score += 10;
                            scoreText.textContent = String(score).padStart(4, '0');

                            spawnItem(b.x, b.y);

                            ball.dy *= 1.008; 
                            ball.dx *= 1.008;

                            if (remainingBricks <= 0) {
                                gameWin();
                                return;
                            }
                        }
                    }
                }
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (rightPressed) {
                paddle.x = Math.min(canvas.width - paddle.width, paddle.x + paddle.speed);
            } else if (leftPressed) {
                paddle.x = Math.max(0, paddle.x - paddle.speed);
            }

            ball.x += ball.dx;
            ball.y += ball.dy;

            for (let p of particles) {
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y < 0) p.y = canvas.height;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
            }

            // 防卡牆邊界檢測
            if (ball.x - ball.radius <= 0) {
                if (ball.dx < 0) ball.dx = Math.abs(ball.dx);
                ball.x = ball.radius;
            } else if (ball.x + ball.radius >= canvas.width) {
                if (ball.dx > 0) ball.dx = -Math.abs(ball.dx);
                ball.x = canvas.width - ball.radius;
            }

            // 頂部與滑塊碰撞
            if (ball.y - ball.radius <= 0) {
                if (ball.dy < 0) ball.dy = Math.abs(ball.dy);
                ball.y = ball.radius;
            } 
            else if (ball.y + ball.radius >= paddle.y) {
                if (
                    ball.x >= paddle.x - ball.radius && 
                    ball.x <= paddle.x + paddle.width + ball.radius &&
                    ball.y - ball.radius <= paddle.y + paddle.height
                ) {
                    let collidePoint = ball.x - (paddle.x + paddle.width / 2);
                    collidePoint = collidePoint / (paddle.width / 2);

                    let angle = collidePoint * (Math.PI / 3);
                    let currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);

                    ball.dx = currentSpeed * Math.sin(angle);
                    ball.dy = -currentSpeed * Math.cos(angle);
                } 
                else if (ball.y - ball.radius > canvas.height) {
                    gameOver();
                }
            }

            // 道具碰撞檢測
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                const prevY = item.y;
                item.y += item.dy;

                let isCollected = false;
                const steps = 4;
                for (let s = 0; s <= steps; s++) {
                    const sampleY = prevY + (item.dy * (s / steps));
                    if (checkCircleRectCollision(item.x, sampleY, item.radius, paddle.x, paddle.y, paddle.width, paddle.height)) {
                        isCollected = true;
                        break;
                    }
                }

                if (isCollected) {
                    activateExpandBuff();
                    items.splice(i, 1);
                }
                else if (item.y - item.radius > canvas.height) {
                    items.splice(i, 1);
                }
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.dy;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }

            collisionDetection();
        }

        function drawItemSymbol(item) {
            ctx.fillStyle = currentTheme.textColor;
            const x = item.x;
            const y = item.y;

            if (item.type === 'CLOVER') {
                const cr = 2.2;
                const offset = 2.2;
                ctx.beginPath();
                ctx.arc(x - offset, y - offset, cr, 0, Math.PI * 2);
                ctx.arc(x + offset, y - offset, cr, 0, Math.PI * 2);
                ctx.arc(x - offset, y + offset, cr, 0, Math.PI * 2);
                ctx.arc(x + offset, y + offset, cr, 0, Math.PI * 2);
                ctx.fill();
            } else if (item.type === 'CLOUD') {
                ctx.beginPath();
                ctx.arc(x - 3, y + 1, 2.5, 0, Math.PI * 2);
                ctx.arc(x, y - 2, 3.2, 0, Math.PI * 2);
                ctx.arc(x + 3, y + 1, 2.5, 0, Math.PI * 2);
                ctx.fill();
            } else if (item.type === 'HEART') {
                ctx.beginPath();
                ctx.arc(x - 2, y - 1, 2.5, 0, Math.PI * 2);
                ctx.arc(x + 2, y - 1, 2.5, 0, Math.PI * 2);
                ctx.moveTo(x - 4.2, y);
                ctx.lineTo(x, y + 4.5);
                ctx.lineTo(x + 4.2, y);
                ctx.fill();
            } else if (item.type === 'STAR' || item.type === 'SPARKLE') {
                ctx.beginPath();
                ctx.arc(x, y, 2.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(x - 5, y - 0.7, 10, 1.4);
                ctx.fillRect(x - 0.7, y - 5, 1.4, 10);
            } else if (item.type === 'CITRUS') {
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = currentTheme.badgeBg;
                ctx.beginPath();
                ctx.arc(x, y, 2.2, 0, Math.PI * 2);
                ctx.fill();
            } else if (item.type === 'SAKURA') {
                for (let a = 0; a < 5; a++) {
                    const ang = (a * Math.PI * 2) / 5 - Math.PI / 2;
                    const px = x + Math.cos(ang) * 2.8;
                    const py = y + Math.sin(ang) * 2.8;
                    ctx.beginPath();
                    ctx.arc(px, py, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (item.type === 'BOLT') {
                ctx.beginPath();
                ctx.moveTo(x + 1, y - 5);
                ctx.lineTo(x - 3, y + 0.5);
                ctx.lineTo(x, y + 0.5);
                ctx.lineTo(x - 1, y + 5);
                ctx.lineTo(x + 3, y - 0.5);
                ctx.lineTo(x, y - 0.5);
                ctx.closePath();
                ctx.fill();
            } else if (item.type === 'SHELL') {
                ctx.beginPath();
                ctx.arc(x, y, 3.5, 0, Math.PI, true);
                ctx.lineTo(x, y + 3.5);
                ctx.closePath();
                ctx.fill();
            } else if (item.type === 'LEAF' || item.type === 'TEA_LEAF' || item.type === 'MINT_LEAF') {
                ctx.beginPath();
                ctx.arc(x - 1.5, y - 1.5, 3.5, 0, Math.PI * 0.7);
                ctx.arc(x + 1.5, y + 1.5, 3.5, Math.PI, Math.PI * 1.7);
                ctx.fill();
            } else if (item.type === 'BEAN') {
                ctx.beginPath();
                ctx.ellipse(x, y, 2.5, 4, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
            } else if (item.type === 'VINYL') {
                ctx.beginPath();
                ctx.arc(x, y, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = currentTheme.badgeBg;
                ctx.beginPath();
                ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            } else if (item.type === 'SNOWFLAKE') {
                ctx.beginPath();
                ctx.fillRect(x - 4.5, y - 0.8, 9, 1.6);
                ctx.fillRect(x - 0.8, y - 4.5, 1.6, 9);
                ctx.moveTo(x - 3, y - 3);
                ctx.lineTo(x + 3, y + 3);
                ctx.moveTo(x + 3, y - 3);
                ctx.lineTo(x - 3, y + 3);
                ctx.stroke();
            } else if (item.type === 'INK_DROP') {
                ctx.beginPath();
                ctx.arc(x, y + 1, 3.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x - 2.8, y + 0.5);
                ctx.lineTo(x, y - 4.5);
                ctx.lineTo(x + 2.8, y + 0.5);
                ctx.fill();
            } else if (item.type === 'CACTUS') {
                ctx.fillRect(x - 1.2, y - 4, 2.4, 8);
                ctx.fillRect(x - 3.5, y - 1, 7, 1.5);
                ctx.fillRect(x - 3.5, y - 3, 1.5, 2);
                ctx.fillRect(x + 2, y - 3, 1.5, 2);
            } else if (item.type === 'CANDY') {
                ctx.beginPath();
                ctx.arc(x, y, 2.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x - 2.5, y);
                ctx.lineTo(x - 5, y - 2.5);
                ctx.lineTo(x - 5, y + 2.5);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + 2.5, y);
                ctx.lineTo(x + 5, y - 2.5);
                ctx.lineTo(x + 5, y + 2.5);
                ctx.closePath();
                ctx.fill();
            } else if (item.type === 'PLANET') {
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x, y, 6, 2, Math.PI / 6, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function draw() {
            ctx.fillStyle = currentTheme.canvasBg || '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 幾何網格 (適應主題)
            ctx.strokeStyle = currentTheme.grid;
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // 2. 飄浮微光粒子
            const particleColorPrefix = currentTheme.particle;
            for (let p of particles) {
                ctx.fillStyle = `${particleColorPrefix}${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. 磚塊 (純色平塗 + 簡約點綴)
            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    if (bricks[r][c].status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        
                        bricks[r][c].x = brickX;
                        bricks[r][c].y = brickY;

                        const colorLight = currentTheme.bricks[r % currentTheme.bricks.length];

                        ctx.save();
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
                        ctx.fillStyle = colorLight;
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.04)';
                        ctx.shadowBlur = 2;
                        ctx.fill();

                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                        ctx.lineWidth = 1;
                        ctx.stroke();

                        ctx.clip();
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
                        ctx.beginPath();
                        ctx.arc(brickX + brickWidth - 10, brickY + brickHeight / 2, 2.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }
            }

            // 4. 滑塊
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 5);
            ctx.fillStyle = currentTheme.paddle;
            ctx.shadowColor = currentTheme.paddleGlow;
            ctx.shadowBlur = paddle.isExpanded ? 8 : 3;
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();

            // Buff 倒數時間條
            if (paddle.isExpanded) {
                const remainingTime = Math.max(0, paddle.expandEndTime - Date.now());
                const progress = Math.min(1.0, remainingTime / 5000);
                ctx.fillStyle = currentTheme.textColor;
                ctx.shadowColor = currentTheme.paddleGlow;
                ctx.shadowBlur = 3;
                ctx.fillRect(paddle.x, paddle.y + paddle.height + 3, paddle.width * progress, 2.5);
                ctx.shadowBlur = 0;
            }

            // 5. 純色球體 (無漸層)
            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = currentTheme.ball;
            ctx.shadowColor = currentTheme.ballGlow;
            ctx.shadowBlur = 3;
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            // 6. 風格道具圖騰
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                ctx.save();
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                
                ctx.fillStyle = currentTheme.badgeBg;
                ctx.shadowColor = currentTheme.paddleGlow;
                ctx.shadowBlur = 4;
                ctx.fill();

                ctx.strokeStyle = currentTheme.paddle;
                ctx.lineWidth = 1.2;
                ctx.stroke();

                drawItemSymbol(item);

                ctx.restore();
            }

            // 7. 飄浮提示文字
            for (let i = 0; i < floatingTexts.length; i++) {
                const ft = floatingTexts[i];
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = currentTheme.textColor;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
                ctx.shadowBlur = 3;
                ctx.font = '12px "Noto Serif TC", serif';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }
        }

        function gameLoop() {
            if (gameState === 'PLAYING') {
                update();
                draw();
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        applyTheme(themes[0]);
        initBricks();
        initParticles();
        draw();
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
