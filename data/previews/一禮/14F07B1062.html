window.__galleryStorage = (() => {
  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();

            famous: [

                { text: "翡冷翠義式餐廳", color: "#fb923c", active: true },

        const PALETTE = [
            "#ef4444", "#f97316", "#f59e0b", "#10b981", 
            "#06b6d4", "#3b82f6", "#6366f1", "#8b5cf6", 
            "#d946ef", "#ec4899", "#14b8a6", "#84cc16"
        ];

        // State Management
        let items = JSON.parse(window.__galleryStorage.getItem('dinner_wheel_v2_items')) || [...PRESETS.all];
        let isSpinning = false;
        let currentAngle = 0;
        let soundEnabled = true;

        // Sub-Wheel State
        let activeSubCategory = null;
        let subItems = [];
        let subAngle = 0;
        let isSubSpinning = false;

        // Audio Setup
        let synth = null, winSynth = null;
        function initAudio() {
            if (!synth && typeof Tone !== 'undefined') {
                try {
                    synth = new Tone.Synth({
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.005, decay: 0.05, sustain: 0, release: 0.05 }
                    }).toDestination();
                    synth.volume.value = -12;

                    winSynth = new Tone.PolySynth(Tone.Synth).toDestination();
                    winSynth.volume.value = -8;
                } catch (e) {}
            }
        }

        function playTickSound() {
            if (!soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                initAudio();
                if (synth) synth.triggerAttackRelease("C6", "8n");
            } catch (e) {}
        }

        function playWinSound() {
            if (!soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                initAudio();
                if (winSynth) {
                    const now = Tone.now();
                    winSynth.triggerAttackRelease(["C5", "E5", "G5"], "8n", now);
                    winSynth.triggerAttackRelease(["G5", "B5", "D6"], "8n", now + 0.15);
                    winSynth.triggerAttackRelease(["C6", "E6", "G6"], "4n", now + 0.3);
                }
            } catch (e) {}
        }

        // DOM Elements
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const subCanvas = document.getElementById('subWheelCanvas');
        const subCtx = subCanvas.getContext('2d');

        const spinBtn = document.getElementById('spinBtn');
        const spinBtnCenter = document.getElementById('spinBtnCenter');
        const optionsList = document.getElementById('optionsList');
        const addOptionForm = document.getElementById('addOptionForm');
        const newOptionInput = document.getElementById('newOptionInput');
        const subOptionsInput = document.getElementById('subOptionsInput');
        const itemCountBadge = document.getElementById('itemCountBadge');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const presetBtn = document.getElementById('presetBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        
        // Modal DOM Elements
        const subWheelModal = document.getElementById('subWheelModal');
        const subModalCard = document.getElementById('subModalCard');
        const subWheelCategoryTitle = document.getElementById('subWheelCategoryTitle');
        const subSpinBtn = document.getElementById('subSpinBtn');
        const subSpinBtnCenter = document.getElementById('subSpinBtnCenter');

        const resultModal = document.getElementById('resultModal');
        const modalCard = document.getElementById('modalCard');
        const resultTitle = document.getElementById('resultTitle');
        const resultSubtitle = document.getElementById('resultSubtitle');
        const googleMapsBtn = document.getElementById('googleMapsBtn');
        const foodpandaBtn = document.getElementById('foodpandaBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const spinAgainBtn = document.getElementById('spinAgainBtn');

        // Draw Generic Wheel Helper
        function drawGenericWheel(targetCtx, targetCanvas, itemList, angleOffset) {
            const numSegments = itemList.length;
            const centerX = targetCanvas.width / 2;
            const centerY = targetCanvas.height / 2;
            const radius = centerX - 8;

            targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

            if (numSegments === 0) {
                targetCtx.save();
                targetCtx.beginPath();
                targetCtx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                targetCtx.fillStyle = '#1e293b';
                targetCtx.fill();
                targetCtx.restore();
                return;
            }

            const arcSize = (2 * Math.PI) / numSegments;

            for (let i = 0; i < numSegments; i++) {
                const angle = angleOffset + i * arcSize;
                const item = itemList[i];

                targetCtx.save();
                targetCtx.beginPath();
                targetCtx.moveTo(centerX, centerY);
                targetCtx.arc(centerX, centerY, radius, angle, angle + arcSize);
                targetCtx.closePath();

                const grad = targetCtx.createRadialGradient(centerX, centerY, radius * 0.2, centerX, centerY, radius);
                grad.addColorStop(0, item.color);
                grad.addColorStop(1, adjustColorBrightness(item.color, -20));
                
                targetCtx.fillStyle = grad;
                targetCtx.fill();

                targetCtx.lineWidth = 2;
                targetCtx.strokeStyle = 'rgba(15, 23, 42, 0.6)';
                targetCtx.stroke();

                // Text
                targetCtx.save();
                targetCtx.translate(centerX, centerY);
                targetCtx.rotate(angle + arcSize / 2);
                targetCtx.textAlign = 'right';
                targetCtx.textBaseline = 'middle';
                targetCtx.fillStyle = '#ffffff';
                targetCtx.shadowColor = 'rgba(0,0,0,0.6)';
                targetCtx.shadowBlur = 4;
                
                let fontSize = 15;
                if (numSegments > 10) fontSize = 11;
                else if (numSegments > 6) fontSize = 13;

                targetCtx.font = `bold ${fontSize}px "Noto Sans TC", sans-serif`;

                let text = item.text;
                if (text.length > 9) text = text.substring(0, 8) + '..';

                targetCtx.fillText(text, radius - 18, 0);
                targetCtx.restore();

                targetCtx.restore();
            }

            // Ring
            targetCtx.save();
            targetCtx.beginPath();
            targetCtx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            targetCtx.lineWidth = 4;
            targetCtx.strokeStyle = '#38bdf8';
            targetCtx.stroke();
            targetCtx.restore();
        }

        function drawMainWheel() {
            const activeItems = items.filter(i => i.active);
            drawGenericWheel(ctx, canvas, activeItems, currentAngle);
        }

        function drawSubWheel() {
            drawGenericWheel(subCtx, subCanvas, subItems, subAngle);
        }

        function adjustColorBrightness(hex, percent) {
            let num = parseInt(hex.replace('#', ''), 16),
                amt = Math.round(2.55 * percent),
                R = (num >> 16) + amt,
                B = (num >> 8 & 0x00FF) + amt,
                G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 + (B < 255 ? B < 1 ? 0 : B : 255) * 0x100 + (G < 255 ? G < 1 ? 0 : G : 255)).toString(16).slice(1);
        }

        let lastMainSegment = -1;

        function spinMainWheel() {
            if (isSpinning) return;
            const activeItems = items.filter(i => i.active);
            if (activeItems.length === 0) {
                alert('請至少勾選一項晚餐選擇！');
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtnCenter.disabled = true;

            initAudio();

            const numSegments = activeItems.length;
            const arcSize = (2 * Math.PI) / numSegments;
            const winnerIndex = Math.floor(Math.random() * numSegments);

            const targetSegmentCenter = winnerIndex * arcSize + arcSize / 2;
            let targetAngle = -Math.PI / 2 - targetSegmentCenter;
            const fullSpins = (Math.floor(Math.random() * 3) + 5) * 2 * Math.PI;
            
            while (targetAngle < currentAngle) targetAngle += 2 * Math.PI;
            targetAngle += fullSpins;

            const startAngle = currentAngle;
            const totalRotation = targetAngle - startAngle;
            const duration = 4000;
            let startTime = null;

            lastMainSegment = -1;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);

                currentAngle = startAngle + totalRotation * easeProgress;
                drawMainWheel();

                const normalizedAngle = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
                const pointerAngle = (-Math.PI / 2 - normalizedAngle + 4 * Math.PI) % (2 * Math.PI);
                const currentSegment = Math.floor(pointerAngle / arcSize) % numSegments;

                if (currentSegment !== lastMainSegment) {
                    playTickSound();
                    lastMainSegment = currentSegment;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtnCenter.disabled = false;

                    const winner = activeItems[winnerIndex];
                    
                    // Check if winner has sub-options (Broad category)
                    if (winner.subOptions && winner.subOptions.length > 0) {
                        openSubWheelModal(winner);
                    } else {
                        showResultModal(winner.text);
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        // Sub-Wheel Spinning
        let lastSubSegment = -1;
        function spinSubWheel() {
            if (isSubSpinning || subItems.length === 0) return;

            isSubSpinning = true;
            subSpinBtn.disabled = true;
            subSpinBtnCenter.disabled = true;

            const numSegments = subItems.length;
            const arcSize = (2 * Math.PI) / numSegments;
            const winnerIndex = Math.floor(Math.random() * numSegments);

            const targetSegmentCenter = winnerIndex * arcSize + arcSize / 2;
            let targetAngle = -Math.PI / 2 - targetSegmentCenter;
            const fullSpins = (Math.floor(Math.random() * 3) + 4) * 2 * Math.PI;
            
            while (targetAngle < subAngle) targetAngle += 2 * Math.PI;
            targetAngle += fullSpins;

            const startAngle = subAngle;
            const totalRotation = targetAngle - startAngle;
            const duration = 3500;
            let startTime = null;

            lastSubSegment = -1;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);

                subAngle = startAngle + totalRotation * easeProgress;
                drawSubWheel();

                const normalizedAngle = (subAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
                const pointerAngle = (-Math.PI / 2 - normalizedAngle + 4 * Math.PI) % (2 * Math.PI);
                const currentSegment = Math.floor(pointerAngle / arcSize) % numSegments;

                if (currentSegment !== lastSubSegment) {
                    playTickSound();
                    lastSubSegment = currentSegment;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSubSpinning = false;
                    subSpinBtn.disabled = false;
                    subSpinBtnCenter.disabled = false;

                    const finalSubWinner = subItems[winnerIndex].text;
                    closeSubWheelModal();
                    setTimeout(() => {
                        showResultModal(finalSubWinner, `[${activeSubCategory.text}] 子選項結果`);
                    }, 300);
                }
            }

            requestAnimationFrame(animate);
        }

        function openSubWheelModal(categoryItem) {
            activeSubCategory = categoryItem;
            subWheelCategoryTitle.textContent = categoryItem.text;

            // Generate sub-items with palette colors
            subItems = categoryItem.subOptions.map((subName, i) => ({
                text: subName,
                color: PALETTE[i % PALETTE.length]
            }));

            subAngle = 0;
            drawSubWheel();

            subWheelModal.classList.remove('opacity-0', 'pointer-events-none');
            subModalCard.classList.remove('scale-90');
            subModalCard.classList.add('scale-100');
        }

        function closeSubWheelModal() {
            subWheelModal.classList.add('opacity-0', 'pointer-events-none');
            subModalCard.classList.remove('scale-100');
            subModalCard.classList.add('scale-90');
        }

        function showResultModal(foodName, subtitle = "命運的選擇出爐了！今晚就吃：") {
            playWinSound();
            
            resultTitle.textContent = foodName;
            resultSubtitle.textContent = subtitle;
            
            const encodedFood = encodeURIComponent(foodName);
            googleMapsBtn.href = `https://www.google.com/maps/search/${encodedFood}+附近/`;
            foodpandaBtn.href = `https://www.foodpanda.com.tw/search?q=${encodedFood}`;

            resultModal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-90');
            modalCard.classList.add('scale-100');

            if (typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        function closeModal() {
            resultModal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
        }

        function renderOptionsList() {
            optionsList.innerHTML = '';
            itemCountBadge.textContent = `${items.length} 項`;

            items.forEach((item, index) => {
                const hasSub = item.subOptions && item.subOptions.length > 0;
                const itemEl = document.createElement('div');
                itemEl.className = `flex flex-col p-3 rounded-xl glass-panel border transition-all ${item.active ? 'border-slate-700/60 bg-slate-800/40' : 'border-slate-800 opacity-50 bg-slate-900/40'}`;
                
                itemEl.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <label class="flex items-center gap-3 cursor-pointer select-none flex-grow overflow-hidden">
                            <input type="checkbox" data-index="${index}" ${item.active ? 'checked' : ''} class="toggle-active w-4 h-4 rounded accent-rose-500 cursor-pointer">
                            <span class="w-3 h-3 rounded-full shrink-0" style="background-color: ${item.color}"></span>
                            <span class="text-sm font-semibold truncate ${item.active ? 'text-slate-200' : 'text-slate-500 line-through'}">${escapeHTML(item.text)}</span>
                        </label>
                        <button data-index="${index}" class="delete-btn p-1.5 text-slate-500 hover:text-rose-400 rounded-lg hover:bg-slate-700/50 transition-colors">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    ${hasSub ? `<div class="mt-1.5 pl-7 text-[11px] text-slate-400 truncate">子選項: ${escapeHTML(item.subOptions.join(', '))}</div>` : ''}
                `;
                optionsList.appendChild(itemEl);
            });

            saveItemsToStorage();
            drawMainWheel();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function saveItemsToStorage() {
            window.__galleryStorage.setItem('dinner_wheel_v2_items', JSON.stringify(items));
        }

        // Add Option Form
        addOptionForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = newOptionInput.value.trim();
            const subText = subOptionsInput.value.trim();

            if (text) {
                const color = PALETTE[items.length % PALETTE.length];
                const subOptions = subText ? subText.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [];

                items.push({ text, color, active: true, subOptions });
                newOptionInput.value = '';
                subOptionsInput.value = '';
                renderOptionsList();
            }
        });

        // Toggle / Delete Listener
        optionsList.addEventListener('click', (e) => {
            const index = e.target.closest('[data-index]')?.dataset.index;
            if (index === undefined) return;

            if (e.target.classList.contains('toggle-active') || e.target.type === 'checkbox') {
                items[index].active = !items[index].active;
                renderOptionsList();
            } else if (e.target.closest('.delete-btn')) {
                items.splice(index, 1);
                renderOptionsList();
            }
        });

        clearAllBtn.addEventListener('click', () => {
            if (confirm('確定要清空所有選項嗎？')) {
                items = [];
                renderOptionsList();
            }
        });

        shuffleBtn.addEventListener('click', () => {
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            renderOptionsList();
        });

        document.querySelectorAll('.preset-tag').forEach(tag => {
            tag.addEventListener('click', () => {
                const presetKey = tag.dataset.preset;
                if (PRESETS[presetKey]) {
                    items = JSON.parse(JSON.stringify(PRESETS[presetKey]));
                    renderOptionsList();
                }
            });
        });

        presetBtn.addEventListener('click', () => {
            items = JSON.parse(JSON.stringify(PRESETS.all));
            renderOptionsList();
        });

        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = "fa-solid fa-volume-high text-amber-400";
                soundToggleBtn.querySelector('span').textContent = "音效 ON";
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-slate-500";
                soundToggleBtn.querySelector('span').textContent = "音效 OFF";
            }
        });

        // Event Listeners for Wheels
        spinBtn.addEventListener('click', spinMainWheel);
        spinBtnCenter.addEventListener('click', spinMainWheel);
        canvas.addEventListener('click', spinMainWheel);

        subSpinBtn.addEventListener('click', spinSubWheel);
        subSpinBtnCenter.addEventListener('click', spinSubWheel);
        subCanvas.addEventListener('click', spinSubWheel);

        closeModalBtn.addEventListener('click', closeModal);
        spinAgainBtn.addEventListener('click', () => {
            closeModal();
            setTimeout(spinMainWheel, 300);
        });

        window.onload = function() {
            renderOptionsList();
            drawMainWheel();
        };
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
