        body {

            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            overflow: hidden; /* Prevent scrolling completely */
            user-select: none;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px -1px rgba(0, 0, 0, 0.3);
        }

        .card-front {
            background: linear-gradient(145deg, #14b8a6, #0d9488);
            border: 2px solid #99f6e4;
        }

        .card-back {
            background: #ffffff;
            border: 2px solid #34d399;
            transform: rotateY(180deg);
        }

        .card-inner.matched .card-back {
            border-color: #f59e0b;
            background: #fef3c7;
            animation: pulse-match 0.4s ease-in-out;
        }

        @keyframes pulse-match {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.05); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .turn-active {
            box-shadow: 0 0 10px #f59e0b;
            border-color: #fbbf24 !important;
        }

        /* Container for flexible fit without scrolling */
        .board-container {
            display: grid;
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 150px);
            justify-content: center;
            align-content: center;
            gap: 0.5rem;
        }

        @media (min-height: 700px) {
            .board-container {
                gap: 0.625rem;
            }
        }

        let gameMode = 'single'; // 'single', 'ai', 'pvp'
        let difficulty = 'medium'; // 'easy' (12), 'medium' (20), 'hard' (28), 'expert' (36)
        let aiDifficulty = 'medium'; // 'easy', 'medium', 'hard'
        
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 0;
        let moves = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isBoardLocked = false;

        // Versus Mode State
        let currentPlayer = 1; // 1 or 2
        let p1Score = 0;
        let p2Score = 0;
        let aiMemory = []; // AI Memory cache [{index, id}]

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'flip') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(500, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'match') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.08);
                    osc.frequency.setValueAtTime(659.25, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'unmatch') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(160, now + 0.15);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + idx * 0.1);
                        g.gain.setValueAtTime(0.15, now + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.25);
                        o.start(now + idx * 0.1);
                        o.stop(now + idx * 0.1 + 0.25);
                    });
                }
            } catch (e) { console.error(e); }
        }

        function setGameMode(mode) {
            gameMode = mode;
            document.getElementById('mode-single').className = mode === 'single' ? "px-2 py-0.5 rounded-lg font-bold bg-amber-500 text-slate-900 shadow" : "px-2 py-0.5 rounded-lg font-bold bg-emerald-800 hover:bg-emerald-700 transition";
            document.getElementById('mode-ai').className = mode === 'ai' ? "px-2 py-0.5 rounded-lg font-bold bg-amber-500 text-slate-900 shadow" : "px-2 py-0.5 rounded-lg font-bold bg-emerald-800 hover:bg-emerald-700 transition";
            document.getElementById('mode-pvp').className = mode === 'pvp' ? "px-2 py-0.5 rounded-lg font-bold bg-amber-500 text-slate-900 shadow" : "px-2 py-0.5 rounded-lg font-bold bg-emerald-800 hover:bg-emerald-700 transition";

            const aiDiffContainer = document.getElementById('ai-difficulty-container');

            if (mode === 'single') {
                document.getElementById('dashboard-single').classList.remove('hidden');
                document.getElementById('dashboard-single').classList.add('flex');
                document.getElementById('dashboard-versus').classList.add('hidden');
                document.getElementById('dashboard-versus').classList.remove('grid');
                aiDiffContainer.classList.add('hidden');
                aiDiffContainer.classList.remove('flex');
            } else {
                document.getElementById('dashboard-single').classList.add('hidden');
                document.getElementById('dashboard-single').classList.remove('flex');
                document.getElementById('dashboard-versus').classList.remove('hidden');
                document.getElementById('dashboard-versus').classList.add('grid');

                if (mode === 'ai') {
                    aiDiffContainer.classList.remove('hidden');
                    aiDiffContainer.classList.add('flex');
                } else {
                    aiDiffContainer.classList.add('hidden');
                    aiDiffContainer.classList.remove('flex');
                }

                document.getElementById('p1-label').textContent = mode === 'ai' ? '玩家' : '玩家 1';
                document.getElementById('p2-label').textContent = mode === 'ai' ? `電腦 (${getAIDifficultyLabel()})` : '玩家 2';
                document.getElementById('p2-icon').textContent = mode === 'ai' ? '🤖' : '👨‍🌾';
            }

            resetGame();
        }

        function setAIDifficulty(level) {
            aiDifficulty = level;
            const buttons = ['easy', 'medium', 'hard'];
            buttons.forEach(b => {
                const btn = document.getElementById(`ai-diff-${b}`);
                if (b === level) {
                    btn.className = "px-1.5 py-0.5 rounded font-bold bg-amber-500 text-slate-900 shadow";
                } else {
                    btn.className = "px-1.5 py-0.5 rounded font-bold bg-emerald-800 transition";
                }
            });

            if (gameMode === 'ai') {
                document.getElementById('p2-label').textContent = `電腦 (${getAIDifficultyLabel()})`;
            }
            resetGame();
        }

        function setDifficulty(level) {
            difficulty = level;
            const buttons = ['easy', 'medium', 'hard', 'expert'];
            buttons.forEach(b => {
                const btn = document.getElementById(`btn-${b}`);
                if (b === level) {
                    btn.className = "px-2 py-0.5 rounded-lg font-bold bg-amber-500 text-slate-900 shadow";
                } else {
                    btn.className = "px-2 py-0.5 rounded-lg font-bold bg-emerald-800 hover:bg-emerald-700 transition";
                }
            });
            resetGame();
        }

        function resetGame() {
            clearInterval(timerInterval);
            timerInterval = null;
            secondsElapsed = 0;
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            isBoardLocked = false;
            currentPlayer = 1;
            p1Score = 0;
            p2Score = 0;
            aiMemory = [];

            document.getElementById('moves-count').textContent = '0';
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('p1-score').textContent = '0 對';
            document.getElementById('p2-score').textContent = '0 對';
            updateTurnBadges();

            let cardCount = 20; // default medium
            let cols = 5;
            let rows = 4;

            if (difficulty === 'easy') {
                cardCount = 12;
                cols = window.innerWidth < 640 ? 3 : 4;
                rows = cardCount / cols;
            } else if (difficulty === 'medium') {
                cardCount = 20;
                cols = window.innerWidth < 640 ? 4 : 5;
                rows = cardCount / cols;
            } else if (difficulty === 'hard') {
                cardCount = 28;
                cols = window.innerWidth < 640 ? 4 : 7;
                rows = cardCount / cols;
            } else if (difficulty === 'expert') {
                cardCount = 36;
                cols = window.innerWidth < 640 ? 6 : 6;
                rows = cardCount / cols;
            }

            totalPairs = cardCount / 2;
            document.getElementById('single-matches').textContent = `0 / ${totalPairs}`;

            const board = document.getElementById('game-board');
            board.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            
            // Calculate height aspect ratio dynamically to keep grid centered inside screen
            const availableHeight = window.innerHeight - 150;
            const maxCardHeight = Math.floor((availableHeight - (rows * 12)) / rows);
            const maxCardWidth = Math.floor((Math.min(window.innerWidth - 24, 1150) - (cols * 12)) / cols);
            const cardSize = Math.max(Math.min(maxCardHeight, maxCardWidth, 120), 45);

            const selectedTurtles = TURTLE_TYPES.slice(0, totalPairs);
            const deck = [...selectedTurtles, ...selectedTurtles];
            shuffleArray(deck);

            board.innerHTML = '';
            cards = deck.map((turtle, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'perspective-1000 flex items-center justify-center';
                cardEl.style.width = `${cardSize}px`;
                cardEl.style.height = `${cardSize}px`;

                cardEl.innerHTML = `
                    <div class="card-inner" data-index="${index}" data-id="${turtle.id}">
                        <div class="card-face card-front text-white text-2xl sm:text-3xl font-bold">
                            <span class="opacity-70">🐢</span>
                        </div>
                        <div class="card-face card-back flex flex-col items-center justify-between p-1 text-center">
                            <div class="w-full flex-1 flex items-center justify-center overflow-hidden">${turtle.svg}</div>
                            <span class="text-[10px] sm:text-[12px] font-extrabold text-emerald-950 truncate max-w-full leading-tight px-0.5 mt-0.5">${turtle.name}</span>
                        </div>
                    </div>
                `;

                const cardInner = cardEl.querySelector('.card-inner');
                cardInner.addEventListener('click', () => handleCardClick(cardInner));

                board.appendChild(cardEl);
                return cardInner;
            });
        }

        window.onresize = function() {
            resetGame();
        };

        function updateTurnBadges() {
            const p1Card = document.getElementById('player1-card');
            const p2Card = document.getElementById('player2-card');
            const p1Badge = document.getElementById('p1-turn-badge');
            const p2Badge = document.getElementById('p2-turn-badge');

            if (gameMode === 'single') return;

            if (currentPlayer === 1) {
                p1Card.classList.add('turn-active');
                p2Card.classList.remove('turn-active');
                p1Badge.classList.remove('hidden');
                p2Badge.classList.add('hidden');
            } else {
                p2Card.classList.add('turn-active');
                p1Card.classList.remove('turn-active');
                p2Badge.classList.remove('hidden');
                p1Badge.classList.add('hidden');
            }
        }

        function getAIDifficultyLabel() {
            if (aiDifficulty === 'easy') return '簡單';
            if (aiDifficulty === 'medium') return '中等';
            return '大師';
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function handleCardClick(cardInner) {
            initAudio();
            if (isBoardLocked) return;
            if (gameMode === 'ai' && currentPlayer === 2) return;

            const index = parseInt(cardInner.getAttribute('data-index'));
            const cardId = cardInner.getAttribute('data-id');

            if (cardInner.classList.contains('flipped') || cardInner.classList.contains('matched')) return;

            if (gameMode === 'single') startTimer();

            flipCard(cardInner, index, cardId);
        }

        function flipCard(cardInner, index, cardId) {
            playSound('flip');
            cardInner.classList.add('flipped');
            flippedCards.push({ element: cardInner, index, id: cardId });

            // Store in AI memory
            rememberCard(index, cardId);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves-count').textContent = moves;
                checkMatch();
            }
        }

        function rememberCard(index, cardId) {
            // Remove existing entry for same index if present
            aiMemory = aiMemory.filter(item => item.index !== index);
            aiMemory.push({ index, id: cardId });
        }

        function checkMatch() {
            isBoardLocked = true;
            const [card1, card2] = flippedCards;

            if (card1.id === card2.id) {
                // Match success!
                setTimeout(() => {
                    playSound('match');
                    card1.element.classList.add('matched');
                    card2.element.classList.add('matched');

                    // Remove matched cards from AI memory
                    aiMemory = aiMemory.filter(item => item.index !== card1.index && item.index !== card2.index);

                    matchedPairs++;

                    if (gameMode === 'single') {
                        document.getElementById('single-matches').textContent = `${matchedPairs} / ${totalPairs}`;
                    } else {
                        if (currentPlayer === 1) {
                            p1Score++;
                            document.getElementById('p1-score').textContent = `${p1Score} 對`;
                        } else {
                            p2Score++;
                            document.getElementById('p2-score').textContent = `${p2Score} 對`;
                        }
                    }

                    flippedCards = [];

                    if (matchedPairs === totalPairs) {
                        handleGameOver();
                    } else {
                        isBoardLocked = false;
                        // In versus mode, matching gives another turn!
                        if (gameMode === 'ai' && currentPlayer === 2) {
                            setTimeout(makeAIMove, 700);
                        }
                    }
                }, 300);
            } else {
                // Match fail
                setTimeout(() => {
                    playSound('unmatch');
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    flippedCards = [];

                    if (gameMode !== 'single') {
                        currentPlayer = currentPlayer === 1 ? 2 : 1;
                        updateTurnBadges();
                    }

                    isBoardLocked = false;

                    if (gameMode === 'ai' && currentPlayer === 2) {
                        setTimeout(makeAIMove, 700);
                    }
                }, 900);
            }
        }

        function makeAIMove() {
            if (matchedPairs === totalPairs || currentPlayer !== 2) return;

            isBoardLocked = true;
            const dots = document.getElementById('ai-thinking-dots');
            if (dots) dots.classList.remove('hidden');

            setTimeout(() => {
                if (dots) dots.classList.add('hidden');

                // Gather available un-flipped & un-matched cards
                const availableIndices = cards
                    .map((card, idx) => ({ card, idx }))
                    .filter(item => !item.card.classList.contains('flipped') && !item.card.classList.contains('matched'))
                    .map(item => item.idx);

                if (availableIndices.length < 2) return;

                let choice1 = null;
                let choice2 = null;

                // Determine memory accuracy threshold based on AI difficulty
                let recallChance = 0.35; // Easy
                if (aiDifficulty === 'medium') recallChance = 0.70;
                if (aiDifficulty === 'hard') recallChance = 1.00;

                // Filter AI memory based on recall chance
                const activeMemory = aiMemory.filter(() => Math.random() < recallChance);

                // Look for known pairs in memory
                const memoryGrouped = {};
                activeMemory.forEach(item => {
                    if (availableIndices.includes(item.index)) {
                        if (!memoryGrouped[item.id]) memoryGrouped[item.id] = [];
                        memoryGrouped[item.id].push(item.index);
                    }
                });

                let knownPairId = Object.keys(memoryGrouped).find(id => memoryGrouped[id].length >= 2);

                if (knownPairId) {
                    choice1 = memoryGrouped[knownPairId][0];
                    choice2 = memoryGrouped[knownPairId][1];
                } else {
                    // Pick 1st random card
                    choice1 = availableIndices[Math.floor(Math.random() * availableIndices.length)];

                    // Check if 1st card matches something in memory
                    const card1Id = cards[choice1].getAttribute('data-id');
                    const matchInMemory = activeMemory.find(item => item.id === card1Id && item.index !== choice1 && availableIndices.includes(item.index));

                    if (matchInMemory) {
                        choice2 = matchInMemory.index;
                    } else {
                        // Pick 2nd random card
                        const remaining = availableIndices.filter(i => i !== choice1);
                        choice2 = remaining[Math.floor(Math.random() * remaining.length)];
                    }
                }

                // Execute AI 1st Flip
                const card1Inner = cards[choice1];
                flipCard(card1Inner, choice1, card1Inner.getAttribute('data-id'));

                // Execute AI 2nd Flip after small pause
                setTimeout(() => {
                    const card2Inner = cards[choice2];
                    flipCard(card2Inner, choice2, card2Inner.getAttribute('data-id'));
                }, 600);

            }, 600);
        }

        function handleGameOver() {
            clearInterval(timerInterval);
            playSound('win');

            // Trigger Confetti effect
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            const modal = document.getElementById('victory-modal');
            const modalContent = document.getElementById('modal-content');
            const titleEl = document.getElementById('modal-title');
            const subtitleEl = document.getElementById('modal-subtitle');
            const emojiEl = document.getElementById('modal-emoji');
            const statsEl = document.getElementById('modal-stats');

            if (gameMode === 'single') {
                emojiEl.textContent = '🐢🎉';
                titleEl.textContent = '記憶大師！挑戰成功';
                subtitleEl.textContent = '太厲害了，所有烏龜都順利配對！';
                statsEl.innerHTML = `
                    <div class="flex justify-between"><span>⏱️ 所用時間:</span><span class="font-bold text-amber-300">${document.getElementById('timer').textContent}</span></div>
                    <div class="flex justify-between"><span>👣 翻牌步數:</span><span class="font-bold text-teal-300">${moves} 次</span></div>
                    <div class="flex justify-between"><span>🧩 總配對數:</span><span class="font-bold text-emerald-300">${totalPairs} 對</span></div>
                `;
            } else {
                if (p1Score > p2Score) {
                    emojiEl.textContent = '👑🥳';
                    titleEl.textContent = `${gameMode === 'ai' ? '玩家' : '玩家 1'} 獲得勝利！`;
                    subtitleEl.textContent = '展現了超強的記憶天賦！';
                } else if (p2Score > p1Score) {
                    emojiEl.textContent = gameMode === 'ai' ? '🤖⚡' : '👑🥳';
                    titleEl.textContent = `${gameMode === 'ai' ? `電腦 (${getAIDifficultyLabel()})` : '玩家 2'} 獲得勝利！`;
                    subtitleEl.textContent = gameMode === 'ai' ? '電腦成功推算出了所有卡牌位置！' : '精彩的翻牌對決！';
                } else {
                    emojiEl.textContent = '🤝🐢';
                    titleEl.textContent = '平手！勢均力敵';
                    subtitleEl.textContent = '雙方記憶力不相上下！';
                }

                statsEl.innerHTML = `
                    <div class="flex justify-between"><span>🧑‍🌾 ${gameMode === 'ai' ? '玩家' : '玩家 1'}:</span><span class="font-bold text-amber-300">${p1Score} 對</span></div>
                    <div class="flex justify-between"><span>${gameMode === 'ai' ? '🤖 電腦' : '👨‍🌾 玩家 2'}:</span><span class="font-bold text-teal-300">${p2Score} 對</span></div>
                    <div class="flex justify-between"><span>👣 總回合數:</span><span class="font-bold text-emerald-300">${moves} 回合</span></div>
                `;
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-90');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModalAndRestart() {
            const modal = document.getElementById('victory-modal');
            const modalContent = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
            setTimeout(() => {
                modal.classList.add('hidden');
                resetGame();
            }, 300);
        }

        // Initialize game on load
        window.onload = function() {
            resetGame();
        };
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
