    <script>
        class SoundController {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playSelect() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }
            playFound() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.3);
            }
            playWin() {
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const start = this.ctx.currentTime + idx * 0.1;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.2, start);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.25);
                });
            }
        }

        class WordSearchGame {
            constructor() {
                this.category = 'b2_l4_l6';
                this.difficulty = 'medium';
                this.gridSize = 10;
                this.grid = [];
                this.placedWords = [];
                this.isSelecting = false;
                this.selectionStart = null;
                this.currentSelection = [];
                this.hintsLeft = 3;
                
                this.timerInterval = null;
                this.secondsElapsed = 0;

                this.gridContainer = document.getElementById('grid-container');
                this.wordListContainer = document.getElementById('word-list');
                this.timerDisplay = document.getElementById('timer-display');
                this.progressDisplay = document.getElementById('progress-display');
                this.wordsFoundText = document.getElementById('words-found-text');
                this.hintCountDisplay = document.getElementById('hint-count');

                this.bindEvents();
                this.startNewGame();
            }

            bindEvents() {
                document.getElementById('category-select').addEventListener('change', (e) => {
                    this.category = e.target.value;
                    this.startNewGame();
                });

                document.getElementById('difficulty-select').addEventListener('change', (e) => {
                    this.difficulty = e.target.value;
                    this.startNewGame();
                });

                document.getElementById('btn-restart').addEventListener('click', () => this.startNewGame());
                document.getElementById('btn-modal-restart').addEventListener('click', () => {
                    this.hideVictoryModal();
                    this.startNewGame();
                });

                document.getElementById('btn-hint').addEventListener('click', () => this.giveHint());

                window.addEventListener('pointerup', () => this.endSelection());
                window.addEventListener('touchend', () => this.endSelection());
            }

            startNewGame() {
                this.stopTimer();
                this.secondsElapsed = 0;
                this.updateTimerDisplay();
                this.hintsLeft = this.difficulty === 'extreme' ? 5 : 3;
                this.hintCountDisplay.textContent = this.hintsLeft;

                if (this.difficulty === 'easy') this.gridSize = 8;
                else if (this.difficulty === 'medium') this.gridSize = 10;
                else if (this.difficulty === 'hard') this.gridSize = 12;
                else if (this.difficulty === 'extreme') this.gridSize = 25;

                this.generateBoard();
                this.renderBoard();
                this.renderWordList();
                this.updateProgress();
                this.startTimer();
            }

            generateBoard() {
                this.grid = Array(this.gridSize).fill(null).map(() => Array(this.gridSize).fill(''));
                this.placedWords = [];

                const pool = [...LUNGTENG_B2_WORDS[this.category].words];
                pool.sort(() => Math.random() - 0.5);
                
                let targetWordCount = 8;
                if (this.gridSize === 8) targetWordCount = 6;
                else if (this.gridSize === 10) targetWordCount = 8;
                else if (this.gridSize === 12) targetWordCount = 10;
                else if (this.gridSize === 25) targetWordCount = 15;

                const selectedWords = pool.filter(item => item.word.length <= this.gridSize).slice(0, targetWordCount);

                const directions = [
                    [0, 1],   // Right
                    [1, 0],   // Down
                    [1, 1],   // Diagonal Down-Right
                    [-1, 1],  // Diagonal Up-Right
                ];

                if (this.difficulty !== 'easy') {
                    directions.push([0, -1]);  // Left
                    directions.push([-1, 0]);  // Up
                    directions.push([-1, -1]); // Diagonal Up-Left
                    directions.push([1, -1]);  // Diagonal Down-Left
                }

                for (let item of selectedWords) {
                    const word = item.word;
                    let placed = false;
                    let attempts = 0;

                    while (!placed && attempts < 300) {
                        attempts++;
                        const dir = directions[Math.floor(Math.random() * directions.length)];
                        const [dr, dc] = dir;

                        const startR = Math.floor(Math.random() * this.gridSize);
                        const startC = Math.floor(Math.random() * this.gridSize);

                        let canPlace = true;
                        let path = [];

                        for (let i = 0; i < word.length; i++) {
                            const r = startR + dr * i;
                            const c = startC + dc * i;

                            if (r < 0 || r >= this.gridSize || c < 0 || c >= this.gridSize) {
                                canPlace = false;
                                break;
                            }

                            if (this.grid[r][c] !== '' && this.grid[r][c] !== word[i]) {
                                canPlace = false;
                                break;
                            }

                            path.push({ r, c });
                        }

                        if (canPlace) {
                            for (let i = 0; i < word.length; i++) {
                                const { r, c } = path[i];
                                this.grid[r][c] = word[i];
                            }
                            this.placedWords.push({
                                word: word,
                                translation: item.translation,
                                path: path,
                                found: false
                            });
                            placed = true;
                        }
                    }
                }

                const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        if (this.grid[r][c] === '') {
                            this.grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                        }
                    }
                }
            }

            renderBoard() {
                this.gridContainer.innerHTML = '';
                this.gridContainer.style.gridTemplateColumns = `repeat(${this.gridSize}, minmax(0, 1fr))`;

                let cellSizeClass = "w-7 h-7 text-xs sm:w-9 sm:h-9 sm:text-sm md:w-10 md:h-10 md:text-base";
                if (this.gridSize === 25) {
                    cellSizeClass = "w-4 h-4 text-[8px] sm:w-5 sm:h-5 sm:text-[10px] md:w-6 md:h-6 md:text-xs font-semibold p-0";
                    this.gridContainer.style.minWidth = "auto";
                } else {
                    this.gridContainer.style.minWidth = "auto";
                }

                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        const cell = document.createElement('div');
                        cell.className = `grid-cell ${cellSizeClass} bg-slate-800 text-slate-100 flex items-center justify-center rounded cursor-pointer border border-slate-700/40 shadow-sm`;
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.textContent = this.grid[r][c];

                        cell.addEventListener('pointerdown', (e) => this.startSelection(r, c, e));
                        cell.addEventListener('pointerenter', () => this.updateSelection(r, c));

                        this.gridContainer.appendChild(cell);
                    }
                }

                this.gridContainer.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!this.isSelecting) return;
                    const touch = e.touches[0];
                    const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (targetElement && targetElement.dataset.row !== undefined) {
                        const r = parseInt(targetElement.dataset.row);
                        const c = parseInt(targetElement.dataset.col);
                        this.updateSelection(r, c);
                    }
                }, { passive: false });
            }

            renderWordList() {
                this.wordListContainer.innerHTML = '';
                this.placedWords.forEach(item => {
                    const wordBadge = document.createElement('div');
                    wordBadge.id = `word-badge-${item.word}`;
                    wordBadge.className = 'flex items-center justify-between px-3 py-2 bg-slate-900/80 border border-slate-700/80 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300';
                    wordBadge.innerHTML = `
                        <div class="flex flex-col">
                            <span class="tracking-wider text-slate-200 font-bold">${item.word}</span>
                            <span class="text-[11px] text-slate-400 font-normal">${item.translation}</span>
                        </div>
                        <span class="check-icon text-slate-600">⚪</span>
                    `;
                    this.wordListContainer.appendChild(wordBadge);
                });
            }

            startSelection(r, c, e) {
                sound.init();
                this.isSelecting = true;
                this.selectionStart = { r, c };
                this.highlightCells([{ r, c }]);
                sound.playSelect();
            }

            updateSelection(targetR, targetC) {
                if (!this.isSelecting || !this.selectionStart) return;

                const startR = this.selectionStart.r;
                const startC = this.selectionStart.c;

                const dr = targetR - startR;
                const dc = targetC - startC;

                if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
                    const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
                    const stepC = dc === 0 ? 0 : dc / Math.abs(dc);
                    const steps = Math.max(Math.abs(dr), Math.abs(dc));

                    const linePath = [];
                    for (let i = 0; i <= steps; i++) {
                        linePath.push({
                            r: startR + stepR * i,
                            c: startC + stepC * i
                        });
                    }

                    if (JSON.stringify(linePath) !== JSON.stringify(this.currentSelection)) {
                        sound.playSelect();
                        this.highlightCells(linePath);
                    }
                }
            }

            highlightCells(path) {
                this.currentSelection = path;

                const allCells = this.gridContainer.querySelectorAll('.grid-cell');
                allCells.forEach(cell => {
                    if (!cell.classList.contains('found')) {
                        cell.classList.remove('selected');
                    }
                });

                path.forEach(({ r, c }) => {
                    const index = r * this.gridSize + c;
                    const cell = allCells[index];
                    if (cell && !cell.classList.contains('found')) {
                        cell.classList.add('selected');
                    }
                });
            }

            endSelection() {
                if (!this.isSelecting) return;
                this.isSelecting = false;

                if (this.currentSelection.length > 0) {
                    this.checkWordFound(this.currentSelection);
                }

                const allCells = this.gridContainer.querySelectorAll('.grid-cell');
                allCells.forEach(cell => cell.classList.remove('selected'));
                this.currentSelection = [];
            }

            checkWordFound(path) {
                const selectedLetters = path.map(({ r, c }) => this.grid[r][c]).join('');
                const reversedLetters = selectedLetters.split('').reverse().join('');

                const match = this.placedWords.find(item => 
                    !item.found && (item.word === selectedLetters || item.word === reversedLetters)
                );

                if (match) {
                    match.found = true;
                    sound.playFound();

                    const allCells = this.gridContainer.querySelectorAll('.grid-cell');
                    match.path.forEach(({ r, c }) => {
                        const index = r * this.gridSize + c;
                        const cell = allCells[index];
                        cell.classList.remove('selected', 'hint');
                        cell.classList.add('found');
                    });

                    const badge = document.getElementById(`word-badge-${match.word}`);
                    if (badge) {
                        badge.className = 'flex items-center justify-between px-3 py-2 bg-emerald-950/60 border border-emerald-500/40 rounded-xl text-xs sm:text-sm font-bold text-emerald-400 line-through transition-all duration-300';
                        badge.querySelector('.check-icon').textContent = '✅';
                    }

                    this.updateProgress();

                    if (this.placedWords.every(w => w.found)) {
                        this.handleVictory();
                    }
                }
            }

            giveHint() {
                if (this.hintsLeft <= 0) return;

                const unfoundWords = this.placedWords.filter(w => !w.found);
                if (unfoundWords.length === 0) return;

                const targetWord = unfoundWords[Math.floor(Math.random() * unfoundWords.length)];
                const startPos = targetWord.path[0];

                const index = startPos.r * this.gridSize + startPos.c;
                const cell = this.gridContainer.children[index];

                if (cell && !cell.classList.contains('found')) {
                    cell.classList.add('hint');
                    setTimeout(() => cell.classList.remove('hint'), 3000);
                }

                this.hintsLeft--;
                this.hintCountDisplay.textContent = this.hintsLeft;
            }

            startTimer() {
                this.timerInterval = setInterval(() => {
                    this.secondsElapsed++;
                    this.updateTimerDisplay();
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
            }

            updateTimerDisplay() {
                const mins = Math.floor(this.secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (this.secondsElapsed % 60).toString().padStart(2, '0');
                this.timerDisplay.textContent = `${mins}:${secs}`;
            }

            updateProgress() {
                const total = this.placedWords.length;
                const found = this.placedWords.filter(w => w.found).length;
                this.progressDisplay.textContent = `${found}/${total}`;
                
                const percentage = total > 0 ? Math.round((found / total) * 100) : 0;
                this.wordsFoundText.textContent = `${percentage}% 完成`;
            }

            handleVictory() {
                this.stopTimer();
                sound.playWin();

                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }

                document.getElementById('final-time').textContent = this.timerDisplay.textContent;
                document.getElementById('final-words').textContent = `${this.placedWords.length} 個單字`;

                this.showVictoryModal();
            }

            showVictoryModal() {
                const modal = document.getElementById('victory-modal');
                const content = document.getElementById('modal-content');
                modal.classList.remove('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-90');
                content.classList.add('scale-100');
            }

            hideVictoryModal() {
                const modal = document.getElementById('victory-modal');
                const content = document.getElementById('modal-content');
                modal.classList.add('opacity-0', 'pointer-events-none');
                content.classList.remove('scale-100');
                content.classList.add('scale-90');
            }
        }

        window.addEventListener('load', () => {
            new WordSearchGame();
        });
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
