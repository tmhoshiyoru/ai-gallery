window.__galleryStorage = (() => {
  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%); /* 溫暖的暖橘/米色調背景 */
            touch-action: manipulation;
        }

        .pet-container {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 100px;
            user-select: none;
            z-index: 10;
            padding-top: 20px; /* 讓寵物稍微往下靠向地毯 */
        }

        /* 寵物呼吸/待機動畫 */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05) translateY(-5px); }
        }
        .anim-breathe { animation: breathe 2s infinite ease-in-out; }

        /* 寵物睡覺動畫：側躺並呼吸 */
        @keyframes sleepAnim {
            0%, 100% { transform: translateY(15px) rotate(-80deg) scale(0.9); }
            50% { transform: translateY(15px) rotate(-80deg) scale(0.95, 0.85); }
        }
        .anim-sleep { animation: sleepAnim 3.5s infinite ease-in-out; filter: brightness(0.75); }

        /* 寵物走路動畫 */
        @keyframes walkAnim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(5deg); }
            75% { transform: translateY(-8px) rotate(-5deg); }
        }
        .anim-walk { animation: walkAnim 0.5s infinite ease-in-out; }

        /* 寵物生病發抖動畫 */
        @keyframes shiverAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px) rotate(-2deg); }
            75% { transform: translateX(3px) rotate(2deg); }
        }
        .anim-shiver { animation: shiverAnim 0.4s infinite; filter: saturate(0.4) brightness(0.9); }

        /* 特效動畫 (愛心、Zzz等) */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }
        .fx-element {
            position: absolute;
            font-size: 24px;
            animation: floatUp 1.5s ease-out forwards;
            pointer-events: none;
            z-index: 30;
        }

        /* 狀態條過渡效果 */
        .progress-bar {
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* 按鈕點擊效果 */
        .action-btn {
            transition: all 0.2s;
        }
        .action-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 玻璃擬態卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 40px 0 rgba(180, 140, 100, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        /* 場景主題 */
        .theme-home { background: linear-gradient(to bottom, #fff5e6 60%, #e6c280 60%); }
        .theme-park { background: linear-gradient(to bottom, #87CEEB 60%, #90EE90 60%); }

        /* 溫馨房間場景 */
        .room-scene {
            position: relative;
            width: 100%;
            height: 240px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.15);
            border: 4px solid #fff;
        }
        
        /* 牆紙紋理 */
        .wallpaper-pattern {
            position: absolute;
            top: 0; left: 0; right: 0; height: 60%;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(255,228,196,0.6) 15px, rgba(255,228,196,0.6) 30px);
        }

        /* 地毯 */
        .rug {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 190px;
            height: 55px;
            background: #d2a679;
            border-radius: 50%;
            border: 3px dashed #c09060;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* 房間裝飾物件 */
        .room-prop {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }

        /* 將原本 pet-container 的 flex 拔除，改由內部 wrapper 控制定位 */
        .pet-container {
            position: absolute;
            inset: 0;
            user-select: none;
            z-index: 20;
        }

        /* 突發狀況：大便道具特效 */
        .poop-item {
            position: absolute;
            font-size: 30px;
            bottom: 15px;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.2s;
            animation: dropIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            user-select: none;
        }
        .poop-item:hover { transform: scale(1.2); }
        @keyframes dropIn {
            0% { transform: translateY(-30px) scale(0); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* 狀態氣泡 */
        .status-bubble {
            position: absolute;
            top: -15px;
            right: -25px;
            font-size: 32px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #ddd;
            border-radius: 50% 50% 50% 5px; /* 對話框形狀 */
            padding: 4px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 20;
            transition: opacity 0.3s ease;
        }
    </style>

    <script>
        class PetGame {
            constructor() {
                this.maxStat = 100;
                this.tickRate = 1000; // 每秒更新一次
                this.loopInterval = null;
                this.dayInterval = null;
                this.eventInterval = null; // 隨機事件計時器
                this.petEmoji = '🐕'; 
                this.petName = '狗狗';
                this.foodEmoji = '🍖';
                this.playEmoji = '🎾';

                // 綁定 DOM 元素
                this.dom = {
                    hunger: document.getElementById('bar-hunger'),
                    happiness: document.getElementById('bar-happiness'),
                    energy: document.getElementById('bar-energy'),
                    health: document.getElementById('bar-health'),
                    valHunger: document.getElementById('val-hunger'),
                    valHappiness: document.getElementById('val-happiness'),
                    valEnergy: document.getElementById('val-energy'),
                    valHealth: document.getElementById('val-health'),
                    sprite: document.getElementById('pet-sprite'),
                    statusBubble: document.getElementById('status-bubble'),
                    container: document.getElementById('pet-container'),
                    wrapper: document.getElementById('pet-wrapper'),
                    flipper: document.getElementById('pet-flipper'),
                    emotionMark: document.getElementById('emotion-mark'),
                    message: document.getElementById('message-log'),
                    overlay: document.getElementById('game-over-overlay'),
                    selectionOverlay: document.getElementById('pet-selection-overlay'),
                    nameInput: document.getElementById('pet-name-input'), // 新增綁定輸入框
                    gameTitle: document.getElementById('game-title'),
                    daysLived: document.getElementById('days-lived'),
                    sceneContainer: document.getElementById('scene-container'),
                    propsHome: document.getElementById('props-home'),
                    propsPark: document.getElementById('props-park'),
                    sceneIcon: document.getElementById('scene-icon'),
                    sceneText: document.getElementById('scene-text'),
                    poopLayer: document.getElementById('poop-layer'),
                    btns: {
                        feed: document.getElementById('btn-feed'),
                        play: document.getElementById('btn-play'),
                        sleep: document.getElementById('btn-sleep'),
                        heal: document.getElementById('btn-heal'),
                        clean: document.getElementById('btn-clean')
                    }
                };
            }

            showSelection() {
                // 顯示選擇畫面，暫停所有計時
                if(this.loopInterval) clearInterval(this.loopInterval);
                if(this.dayInterval) clearInterval(this.dayInterval);
                if(this.wanderInterval) clearInterval(this.wanderInterval);
                if(this.eventInterval) clearInterval(this.eventInterval);
                
                // 顯示畫面時，清空上一次輸入的名字
                if(this.dom.nameInput) {
                    this.dom.nameInput.value = '';
                }

                // 確保顯示選擇覆蓋層
                this.dom.selectionOverlay.classList.remove('hidden');
                this.dom.selectionOverlay.classList.add('flex');
            }

            selectPet(emoji, defaultName) {
                // 讀取輸入框的值，若有輸入則使用玩家取的名字，否則使用預設名稱
                const customName = this.dom.nameInput.value.trim();
                
                // 寫入選擇的寵物資料
                this.petEmoji = emoji;
                this.petName = customName ? customName : defaultName;
                
                // 根據寵物設定專屬食物和玩具
                const config = {
                    '🐕': { food: '🦴', play: '🎾' },
                    '🐈': { food: '🐟', play: '🧶' },
                    '🐇': { food: '🥕', play: '🔔' },
                    '🐧': { food: '🦐', play: '🧊' }
                };
                const petData = config[emoji] || { food: '🍖', play: '🎾' };
                this.foodEmoji = petData.food;
                this.playEmoji = petData.play;

                // 動態更新 UI 按鈕圖示
                this.dom.btns.feed.innerHTML = `<span class="text-2xl mb-1">${this.foodEmoji}</span>餵食`;
                this.dom.btns.play.innerHTML = `<span class="text-2xl mb-1">${this.playEmoji}</span>玩耍`;
                
                // 隱藏選擇畫面
                this.dom.selectionOverlay.classList.add('hidden');
                this.dom.selectionOverlay.classList.remove('flex');
                
                // 更新遊戲標題
                this.dom.gameTitle.textContent = `${this.petName} 模擬器`;
                
                // 初始化遊戲數值
                this.initStats();
            }

            initStats() {
                this.stats = {
                    hunger: 100,
                    happiness: 100,
                    energy: 100,
                    health: 100,
                    days: 0,
                    isSleeping: false,
                    isDead: false
                };
                
                this.currentPetLeft = 50; // 紀錄目前位置百分比 (10% ~ 90%)
                this.isInteracting = false; // 是否正在進行互動 (餵食、玩耍等)
                this.currentScene = 'home'; // 預設場景
                this.poops = 0; // 累積便便數量

                this.dom.poopLayer.innerHTML = ''; // 清空大便
                this.updateUI();
                this.dom.overlay.classList.add('hidden');
                this.dom.overlay.classList.remove('flex');
                this.dom.sprite.textContent = this.petEmoji;
                this.dom.sprite.className = 'anim-breathe drop-shadow-xl';
                
                // 重置位置與方向
                this.dom.wrapper.style.left = '50%';
                this.dom.flipper.style.transform = 'scaleX(1)';

                this.dom.btns.sleep.innerHTML = '<span class="text-2xl mb-1">🛏️</span>睡覺';
                this.enableButtons();
                this.logMessage("你好！我是你的新寵物！");

                if(this.loopInterval) clearInterval(this.loopInterval);
                if(this.dayInterval) clearInterval(this.dayInterval);
                if(this.wanderInterval) clearInterval(this.wanderInterval);
                if(this.eventInterval) clearInterval(this.eventInterval);

                this.startLoops();
            }

            startLoops() {
                this.loopInterval = setInterval(() => this.gameTick(), this.tickRate);
                
                // 每隔幾秒嘗試讓寵物隨機走動
                this.wanderInterval = setInterval(() => this.wander(), 4000);
                
                // 每 6 秒觸發隨機事件檢查 (便便或找禮物)
                this.eventInterval = setInterval(() => this.randomEvent(), 6000);

                // 假設現實 10 秒 = 遊戲內 1 天
                this.dayInterval = setInterval(() => {
                    if (!this.stats.isDead) {
                        this.stats.days++;
                        this.dom.daysLived.textContent = this.stats.days;
                    }
                }, 10000);
            }

            gameTick() {
                if (this.stats.isDead) return;

                // 隨時間減少狀態
                if (this.stats.isSleeping) {
                    this.stats.energy += 5; // 睡覺時恢復體力
                    this.stats.hunger -= 0.5;
                    this.stats.happiness -= 0.5;
                } else {
                    this.stats.hunger -= 2;
                    this.stats.happiness -= 1.5;
                    this.stats.energy -= 1;
                }

                // 環境髒亂懲罰 (有便便的話)
                if (this.poops > 0) {
                    this.stats.happiness -= (0.5 * this.poops);
                    this.stats.health -= (0.2 * this.poops);
                    if (Math.random() < 0.1 && !this.stats.isSleeping) {
                        this.logMessage("好臭喔... 幫我清理啦💩");
                    }
                }

                // 邊界檢查
                this.clampStats();

                // 健康度計算 (如果飽食度或心情太低，健康會下降)
                if (this.stats.hunger < 20 || this.stats.happiness < 20 || this.stats.energy < 20) {
                    this.stats.health -= 2;
                    this.dom.sprite.textContent = '🤒'; // 生病表情
                } else if (this.stats.health < 100 && !this.stats.isSleeping) {
                    // 如果不是太糟糕，緩慢恢復健康
                    this.stats.health += 0.5;
                }

                // 如果健康度降為 0，遊戲結束
                if (this.stats.health <= 0) {
                    this.gameOver();
                } else {
                    // 更新表情
                    this.updateExpression();
                }

                this.updateUI();
            }

            clampStats() {
                for (let key in this.stats) {
                    if (key !== 'days' && key !== 'isSleeping' && key !== 'isDead') {
                        if (this.stats[key] > 100) this.stats[key] = 100;
                        if (this.stats[key] < 0) this.stats[key] = 0;
                    }
                }
            }

            wander() {
                if (this.stats.isDead || this.stats.isSleeping || this.isInteracting) return;
                
                // 20% 機率站在原地休息一下
                if (Math.random() < 0.2) return;

                // 決定新的 X 座標 (20% ~ 80% 之間)
                let targetLeft = Math.floor(Math.random() * 60) + 20;
                
                // 決定面向 (如果目標在左邊就面向左邊，反之亦然)
                if (targetLeft < this.currentPetLeft) {
                    this.dom.flipper.style.transform = 'scaleX(-1)';
                } else if (targetLeft > this.currentPetLeft) {
                    this.dom.flipper.style.transform = 'scaleX(1)';
                }

                // 更新座標紀錄並觸發 CSS 漸變動畫
                this.currentPetLeft = targetLeft;
                this.dom.wrapper.style.left = `${targetLeft}%`;
                
                // 加入微小的走路擺動效果
                this.dom.sprite.classList.remove('anim-breathe');
                this.dom.sprite.classList.add('anim-walk');
                
                // 走完後恢復站立呼吸動畫 (CSS 行走時間固定設為 3 秒)
                setTimeout(() => {
                    if(!this.stats.isSleeping && !this.stats.isDead && !this.isInteracting) {
                        this.dom.sprite.classList.remove('anim-walk');
                        this.dom.sprite.classList.add('anim-breathe');
                    }
                }, 3000);
            }

            updateUI() {
                // 更新進度條長度
                this.dom.hunger.style.width = `${this.stats.hunger}%`;
                this.dom.happiness.style.width = `${this.stats.happiness}%`;
                this.dom.energy.style.width = `${this.stats.energy}%`;
                this.dom.health.style.width = `${this.stats.health}%`;

                // 更新文字數值
                this.dom.valHunger.textContent = `${Math.floor(this.stats.hunger)}%`;
                this.dom.valHappiness.textContent = `${Math.floor(this.stats.happiness)}%`;
                this.dom.valEnergy.textContent = `${Math.floor(this.stats.energy)}%`;
                this.dom.valHealth.textContent = `${Math.floor(this.stats.health)}%`;

                // 改變顏色 (低於 30% 變紅色警告)
                this.setBarColor(this.dom.hunger, this.stats.hunger, 'bg-green-500');
                this.setBarColor(this.dom.happiness, this.stats.happiness, 'bg-blue-500');
                this.setBarColor(this.dom.energy, this.stats.energy, 'bg-yellow-400');
                this.setBarColor(this.dom.health, this.stats.health, 'bg-red-500');
            }

            setBarColor(element, value, defaultClass) {
                element.className = 'h-2.5 rounded-full progress-bar';
                if (value < 30) {
                    element.classList.add('bg-red-600', 'animate-pulse');
                } else {
                    element.classList.add(...defaultClass.split(' '));
                }
            }

            updateExpression() {
                if (this.stats.isDead || this.stats.health <= 0) return;
                
                let bubbleEmoji = '';
                let showBubble = true;
                let emotionMark = '';
                
                // 移除生病發抖動畫，稍後依情況加上
                this.dom.sprite.classList.remove('anim-shiver');

                // 根據狀態決定氣泡與情緒標記
                if (this.stats.isSleeping) {
                    bubbleEmoji = '😴';
                } else if (this.stats.health < 30) {
                    bubbleEmoji = '🤒';
                    emotionMark = '💧'; // 流汗
                    this.dom.sprite.classList.add('anim-shiver'); // 生病會發抖、臉色變差
                } else if (this.stats.hunger < 30) {
                    bubbleEmoji = this.foodEmoji;
                    emotionMark = '💭'; // 滿腦子想著吃
                } else if (this.stats.energy < 30) {
                    bubbleEmoji = '🥱';
                    emotionMark = '💧';
                } else if (this.stats.happiness < 30) {
                    bubbleEmoji = '🥺';
                    emotionMark = '💔';
                } else {
                    showBubble = false; // 狀態良好時隱藏對話氣泡
                    
                    // 情緒高漲時，或是環境髒亂時的情緒標記
                    if (this.poops > 0) {
                        emotionMark = '💢'; // 生氣/煩躁
                    } else if (this.stats.happiness >= 80) {
                        emotionMark = '✨'; // 開心閃亮
                    } else {
                        emotionMark = '';
                    }
                }

                // 顯示或隱藏對話氣泡
                if (showBubble) {
                    this.dom.statusBubble.textContent = bubbleEmoji;
                    this.dom.statusBubble.classList.remove('hidden');
                    setTimeout(() => this.dom.statusBubble.classList.remove('opacity-0'), 10);
                } else {
                    if (this.poops > 0 && !this.stats.isSleeping) {
                        this.dom.statusBubble.textContent = '🤢';
                        this.dom.statusBubble.classList.remove('hidden', 'opacity-0');
                    } else {
                        this.dom.statusBubble.classList.add('opacity-0');
                        setTimeout(() => this.dom.statusBubble.classList.add('hidden'), 300);
                    }
                }
                
                // 顯示或隱藏情緒標記 (頭上的小特效)
                if (emotionMark && !this.stats.isSleeping) {
                    this.dom.emotionMark.textContent = emotionMark;
                    this.dom.emotionMark.classList.remove('opacity-0');
                } else {
                    this.dom.emotionMark.classList.add('opacity-0');
                }
                
                // 保持寵物全身圖案不變
                this.dom.sprite.textContent = this.petEmoji;
            }

            feed() {
                if (this.stats.isDead || this.stats.isSleeping) return;
                
                if (this.stats.hunger >= 100) {
                    this.logMessage("肚子已經很飽了！");
                    return;
                }

                this.stats.hunger += 20;
                this.stats.energy -= 2;
                this.showFX(this.foodEmoji);
                this.logMessage("好吃好吃！");
                this.triggerActionAnim();
            }

            play() {
                if (this.stats.isDead || this.stats.isSleeping) return;
                
                if (this.stats.energy < 20) {
                    this.logMessage("太累了，跑不動了...");
                    return;
                }

                this.stats.happiness += 20;
                this.stats.energy -= 15;
                this.stats.hunger -= 5;
                this.showFX(this.playEmoji);
                this.logMessage("好好玩喔！");
                this.triggerActionAnim();
            }

            heal() {
                if (this.stats.isDead || this.stats.isSleeping) return;

                if (this.stats.health >= 100) {
                    this.logMessage("我很健康，不需要吃藥！");
                    return;
                }

                this.stats.health += 30;
                this.stats.happiness -= 10; // 吃藥會稍微不開心
                this.showFX('💊');
                this.logMessage("吃藥了，感覺舒服多了！");
                this.triggerActionAnim();
            }

            clean() {
                if (this.stats.isDead) return;

                if (this.poops === 0) {
                    this.logMessage("環境很乾淨，不需要打掃！");
                    return;
                }

                this.poops = 0;
                this.dom.poopLayer.innerHTML = ''; // 清空所有便便
                this.stats.happiness += 10;
                this.showFX('✨');
                this.logMessage("打掃乾淨了，環境真舒服！");
                this.updateUI();
                this.updateExpression();
            }

            petTheAnimal(event) {
                if (this.stats.isDead || this.stats.isSleeping || this.isInteracting) return;
                
                // 阻止事件冒泡 (避免點到背景)
                if (event) event.stopPropagation();

                if (this.stats.happiness >= 100) {
                    this.logMessage("好舒服～（超級開心！）");
                } else {
                    this.stats.happiness += 5; // 摸摸會增加心情
                    this.logMessage("被摸摸了！好開心！");
                }
                
                this.showFX('❤️');
                
                // 互動表現：歪頭開心的樣子
                this.isInteracting = true;
                this.dom.sprite.classList.remove('anim-breathe', 'anim-walk');
                this.dom.sprite.style.transform = 'scale(1.15) rotate(8deg)'; 
                
                setTimeout(() => {
                    this.dom.sprite.style.transform = '';
                    if(!this.stats.isSleeping && !this.stats.isDead) {
                        this.dom.sprite.classList.add('anim-breathe');
                    }
                    this.isInteracting = false;
                }, 400);

                this.updateUI();
                this.updateExpression();
            }

            toggleScene() {
                if(this.stats.isSleeping || this.stats.isDead || this.isInteracting) {
                    this.logMessage("現在不適合切換場景喔！");
                    return;
                }

                if (this.currentScene === 'home') {
                    // 去公園
                    this.currentScene = 'park';
                    this.dom.sceneContainer.classList.replace('theme-home', 'theme-park');
                    this.dom.propsHome.classList.replace('opacity-100', 'opacity-0');
                    this.dom.propsHome.classList.add('pointer-events-none');
                    this.dom.propsPark.classList.replace('opacity-0', 'opacity-100');
                    this.dom.propsPark.classList.remove('pointer-events-none');
                    this.dom.sceneIcon.textContent = '🏠';
                    this.dom.sceneText.textContent = '回家休息';
                    this.logMessage("來到公園散步囉！好開心！");
                    this.stats.happiness += 15; // 去公園心情變好
                    this.showFX('✨');
                } else {
                    // 回家
                    this.currentScene = 'home';
                    this.dom.sceneContainer.classList.replace('theme-park', 'theme-home');
                    this.dom.propsPark.classList.replace('opacity-100', 'opacity-0');
                    this.dom.propsPark.classList.add('pointer-events-none');
                    this.dom.propsHome.classList.replace('opacity-0', 'opacity-100');
                    this.dom.propsHome.classList.remove('pointer-events-none');
                    this.dom.sceneIcon.textContent = '🏞️';
                    this.dom.sceneText.textContent = '出門散步';
                    this.logMessage("回到溫暖的家了！");
                }
                this.triggerActionAnim();
            }

            randomEvent() {
                if(this.stats.isDead || this.stats.isSleeping || this.isInteracting) return;
                
                const rand = Math.random();
                
                // 事件 1: 隨機便便 (15%機率，場上最多累積3坨)
                if (rand < 0.15 && this.poops < 3) {
                    this.poops++;
                    const poop = document.createElement('div');
                    poop.className = 'poop-item drop-shadow-md';
                    poop.textContent = '💩';
                    // 隨機掉在地毯周圍
                    poop.style.left = `${Math.floor(Math.random() * 70) + 10}%`;
                    // 點擊便便也能直接清理
                    poop.onclick = () => this.clean();
                    this.dom.poopLayer.appendChild(poop);
                    
                    this.logMessage("哎呀！寵物大便了！快點擊清理！");
                    this.updateExpression();
                }
                // 事件 2: 撿到小確幸驚喜 (10%機率)
                else if (rand > 0.90) {
                    if (this.currentScene === 'park') {
                        this.stats.happiness += 20;
                        this.showFX('🦋');
                        this.logMessage("寵物在草叢裡追蝴蝶，超開心！");
                    } else {
                        this.stats.hunger += 15;
                        this.showFX(this.foodEmoji);
                        this.logMessage("寵物在角落找到了私房零食！");
                    }
                    this.triggerActionAnim(); // 觸發跳躍開心動畫
                }
            }

            toggleSleep() {
                if (this.stats.isDead) return;

                this.stats.isSleeping = !this.stats.isSleeping;
                
                if (this.stats.isSleeping) {
                    this.logMessage("呼嚕嚕... 睡著了");
                    this.dom.sprite.classList.remove('anim-breathe', 'anim-walk');
                    this.dom.sprite.className = 'anim-sleep drop-shadow-xl';
                    this.dom.btns.sleep.innerHTML = '<span class="text-2xl mb-1">☀️</span>喚醒';
                    this.disableButtons(true);
                    this.showFX('💤');
                } else {
                    this.logMessage("早安！睡飽了！");
                    this.dom.sprite.classList.remove('anim-sleep');
                    this.dom.sprite.className = 'anim-breathe drop-shadow-xl';
                    this.dom.btns.sleep.innerHTML = '<span class="text-2xl mb-1">🛏️</span>睡覺';
                    this.disableButtons(false);
                    this.updateExpression();
                }
                this.updateUI();
            }

            triggerActionAnim() {
                this.clampStats();
                this.updateUI();
                this.updateExpression();
                
                this.isInteracting = true; // 鎖定互動狀態，暫停自動走路

                // 彈跳動畫
                this.dom.sprite.classList.remove('anim-breathe', 'anim-walk');
                this.dom.sprite.style.transform = 'scale(1.2) translateY(-10px)';
                
                setTimeout(() => {
                    this.dom.sprite.style.transform = '';
                    if(!this.stats.isSleeping && !this.stats.isDead) {
                        this.dom.sprite.classList.add('anim-breathe');
                    }
                    this.isInteracting = false; // 解除鎖定
                }, 300);
            }

            showFX(emoji) {
                const fx = document.createElement('div');
                fx.className = 'fx-element';
                fx.textContent = emoji;
                
                // 相對目前寵物的位置產生偏移
                const offsetX = (Math.random() - 0.5) * 60;
                
                fx.style.left = `calc(50% + ${offsetX}px)`;
                fx.style.top = `-30px`; 
                
                this.dom.wrapper.appendChild(fx); // 加到 wrapper 中跟著寵物走
                
                // 動畫結束後移除
                setTimeout(() => {
                    fx.remove();
                }, 1500);
            }

            logMessage(msg) {
                this.dom.message.style.opacity = '0';
                setTimeout(() => {
                    this.dom.message.textContent = msg;
                    this.dom.message.style.opacity = '1';
                }, 150);
            }

            disableButtons(isSleeping) {
                this.dom.btns.feed.disabled = isSleeping;
                this.dom.btns.play.disabled = isSleeping;
                this.dom.btns.heal.disabled = isSleeping;
                this.dom.btns.clean.disabled = isSleeping;
            }

            enableButtons() {
                this.dom.btns.feed.disabled = false;
                this.dom.btns.play.disabled = false;
                this.dom.btns.heal.disabled = false;
                this.dom.btns.clean.disabled = false;
                this.dom.btns.sleep.disabled = false;
            }

            gameOver() {
                this.stats.isDead = true;
                this.stats.health = 0;
                clearInterval(this.loopInterval);
                clearInterval(this.dayInterval);
                clearInterval(this.wanderInterval);
                clearInterval(this.eventInterval);
                
                // 顯示幽靈氣泡
                this.dom.statusBubble.textContent = '👻';
                this.dom.statusBubble.classList.remove('hidden', 'opacity-0');
                
                // 寵物本體倒下變灰
                this.dom.sprite.textContent = this.petEmoji;
                this.dom.sprite.classList.remove('anim-breathe', 'anim-walk', 'anim-sleep');
                this.dom.sprite.className = 'drop-shadow-xl transition-all duration-1000'; // 移除動畫並加入平滑過渡
                this.dom.sprite.style.transform = 'rotate(90deg) scale(0.9)'; // 側躺
                this.dom.sprite.style.filter = 'grayscale(100%)';
                
                this.disableButtons(true);
                this.dom.btns.sleep.disabled = true;

                this.logMessage("你的寵物去了彩虹橋...");
                
                setTimeout(() => {
                    this.dom.overlay.classList.remove('hidden');
                    this.dom.overlay.classList.add('flex');
                }, 1500);
            }

            restart() {
                this.dom.sprite.style.transform = '';
                this.dom.sprite.style.filter = '';
                this.dom.statusBubble.classList.add('hidden', 'opacity-0');
                this.showSelection();
            }
        }

        // 當畫面載入完畢後初始化遊戲
        let petGame;
        window.onload = function() {
            petGame = new PetGame();
            petGame.showSelection();
        };
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
