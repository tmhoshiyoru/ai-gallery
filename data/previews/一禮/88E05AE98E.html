        function toggleSaveBook(bookId, e) {
            if (e) e.stopPropagation();
            const index = savedBookIds.indexOf(bookId);
            if (index > -1) {
                savedBookIds.splice(index, 1);
            } else {
                savedBookIds.push(bookId);
            }
            window.__galleryStorage.setItem('readnext_saved_books', JSON.stringify(savedBookIds));
            updateBadges();
            renderCurrentView();
        }

        function toggleReadBook(bookId, e) {
            if (e) e.stopPropagation();
            const index = readBookIds.indexOf(bookId);
            if (index > -1) {
                readBookIds.splice(index, 1);
            } else {
                readBookIds.push(bookId);
                // If marked as read, automatically remove from saved/want-to-read list if present
                const savedIndex = savedBookIds.indexOf(bookId);
                if (savedIndex > -1) {
                    savedBookIds.splice(savedIndex, 1);
                    window.__galleryStorage.setItem('readnext_saved_books', JSON.stringify(savedBookIds));
                }
            }
            window.__galleryStorage.setItem('readnext_read_books', JSON.stringify(readBookIds));
            updateBadges();
            renderCurrentView();
        }

        function applyFilters() {
            const lang = filterForm.querySelector('input[name="language"]:checked').value;
            const difficulty = filterForm.querySelector('input[name="difficulty"]:checked').value;
            const selectedGenres = Array.from(filterForm.querySelectorAll('input[name="genre"]:checked')).map(cb => cb.value);
            const searchKeyword = searchInput.value.toLowerCase().trim();
            const selectedPageRanges = Array.from(filterForm.querySelectorAll('input[name="pages"]:checked')).map(cb => cb.value);

            filteredBooks = BOOKS_DATA.filter(book => {
                if (lang !== 'all' && book.lang !== lang) return false;
                if (difficulty !== 'all' && book.difficulty !== difficulty) return false;
                if (selectedGenres.length > 0 && !selectedGenres.includes(book.genre)) return false;

                let matchesPage = false;
                if (selectedPageRanges.length === 0) matchesPage = true;
                if (selectedPageRanges.includes('short') && book.pages < 250) matchesPage = true;
                if (selectedPageRanges.includes('medium') && book.pages >= 250 && book.pages <= 400) matchesPage = true;
                if (selectedPageRanges.includes('long') && book.pages > 400) matchesPage = true;
                if (!matchesPage) return false;

                if (searchKeyword) {
                    const matchTitle = book.title.toLowerCase().includes(searchKeyword);
                    const matchAuthor = book.author.toLowerCase().includes(searchKeyword);
                    const matchSummary = book.summary.toLowerCase().includes(searchKeyword);
                    const matchSeries = book.series ? book.series.toLowerCase().includes(searchKeyword) : false;
                    if (!matchTitle && !matchAuthor && !matchSummary && !matchSeries) return false;
                }

                return true;
            });

            matchingCount.textContent = filteredBooks.length;
            syncWheelItemsWithFilteredBooks();
            renderCurrentView();
        }

                            請先在「書庫列表」中將您曾經讀過的書籍標記為 <span class="text-emerald-400 font-semibold"><i data-lucide="check-circle-2" class="w-3.5 h-3.5 inline"></i> 已閱讀完畢</span>。智慧推薦引擎將會分析您的喜好類型、語言與閱讀難度，為您精準推播！
                        </p>
                        <button onclick="switchMode('grid')" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-semibold transition inline-flex items-center gap-2">
                            <i data-lucide="book-open" class="w-4 h-4"></i> 前往書庫挑選標記
                        </button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Calculate reading preferences based on read books
            const genreScores = {};
            const langScores = {};
            const difficultyScores = {};
            const readAuthors = new Set();

            readBooks.forEach(b => {
                genreScores[b.genre] = (genreScores[b.genre] || 0) + 1;
                langScores[b.lang] = (langScores[b.lang] || 0) + 1;
                difficultyScores[b.difficulty] = (difficultyScores[b.difficulty] || 0) + 1;
                readAuthors.add(b.author);
            });

            // Find unread books and score them
            const unreadBooks = BOOKS_DATA.filter(b => !readBookIds.includes(b.id));

            const scoredRecommendations = unreadBooks.map(b => {
                let score = 0;
                let reasons = [];

                // Genre Match
                if (genreScores[b.genre]) {
                    score += genreScores[b.genre] * 3;
                    reasons.push(`偏好類型：${b.genre}`);
                }

                // Author Match
                if (readAuthors.has(b.author)) {
                    score += 5;
                    reasons.push(`同作者：${b.author}`);
                }

                // Language Match
                if (langScores[b.lang]) {
                    score += langScores[b.lang] * 1.5;
                }

                // Difficulty Level Match
                if (difficultyScores[b.difficulty]) {
                    score += difficultyScores[b.difficulty] * 1;
                }

                return {
                    book: b,
                    score,
                    reason: reasons.length > 0 ? reasons.join(' · ') : '熱門好書推薦'
                };
            });

            // Sort by recommendation score descending
            scoredRecommendations.sort((a, b) => b.score - a.score);

            if (scoredRecommendations.length === 0) {
                recommendationContent.innerHTML = `
                    <div class="glass-panel p-12 text-center rounded-2xl border border-slate-800 space-y-3">
                        <i data-lucide="trophy" class="w-12 h-12 text-amber-400 mx-auto stroke-1"></i>
                        <h4 class="text-base font-bold text-slate-200">太厲害了！您已讀完書庫中的所有書籍！</h4>
                        <p class="text-xs text-slate-400">目前沒有其他可推薦的未讀新書囉。</p>
                    </div>
                `;
            } else {
                recommendationContent.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                        ${scoredRecommendations.map(item => renderBookCardHtml(item.book, item.reason)).join('')}
                    </div>
                `;
            }

            lucide.createIcons();
        }

        function renderCurrentView() {
            if (currentMode === 'grid') renderGrid();
            else if (currentMode === 'spin') setupWheel();
            else if (currentMode === 'saved') renderSavedBooks();
            else if (currentMode === 'read') renderReadBooks();
            else if (currentMode === 'recommend') renderRecommendations();
        }

        function setupWheel() {
            const enabledItems = activeWheelItems.filter(item => item.enabled);
            renderWheelItemList();

            wheelCtx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);
            const centerX = wheelCanvas.width / 2;
            const centerY = wheelCanvas.height / 2;
            const radius = wheelCanvas.width / 2 - 5;

            if (enabledItems.length === 0) {
                wheelCtx.beginPath();
                wheelCtx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                wheelCtx.fillStyle = '#1e293b';
                wheelCtx.fill();
                wheelCtx.fillStyle = '#94a3b8';
                wheelCtx.font = '12px sans-serif';
                wheelCtx.textAlign = 'center';
                wheelCtx.fillText('請至少勾選一項選項', centerX, centerY);
                return;
            }

            const sliceAngle = (2 * Math.PI) / enabledItems.length;

            enabledItems.forEach((item, idx) => {
                const angle = idx * sliceAngle;
                wheelCtx.beginPath();
                wheelCtx.moveTo(centerX, centerY);
                wheelCtx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
                wheelCtx.closePath();
                wheelCtx.fillStyle = colors[idx % colors.length];
                wheelCtx.fill();
                wheelCtx.strokeStyle = '#0f172a';
                wheelCtx.lineWidth = 2;
                wheelCtx.stroke();

                // Draw Text label
                wheelCtx.save();
                wheelCtx.translate(centerX, centerY);
                wheelCtx.rotate(angle + sliceAngle / 2);
                wheelCtx.textAlign = 'right';
                wheelCtx.fillStyle = '#ffffff';
                wheelCtx.font = 'bold 11px sans-serif';
                const label = item.label.length > 14 ? item.label.substring(0, 12) + '...' : item.label;
                wheelCtx.fillText(label, radius - 15, 4);
                wheelCtx.restore();
            });
        }

        function renderWheelItemList() {
            wheelItemsContainer.innerHTML = activeWheelItems.map((item, idx) => `
                <div class="flex items-center justify-between gap-2 bg-slate-800/60 p-2 rounded-lg border border-slate-700/50">
                    <label class="flex items-center gap-2 cursor-pointer truncate flex-1">
                        <input type="checkbox" ${item.enabled ? 'checked' : ''} onchange="toggleWheelItem(${idx})" class="rounded border-slate-600 bg-slate-900 text-brand-600 focus:ring-0">
                        <span class="truncate font-medium text-slate-200 ${!item.enabled ? 'line-through text-slate-500' : ''}">${item.label}</span>
                    </label>
                    <button onclick="removeWheelItem(${idx})" class="text-slate-500 hover:text-rose-400 p-0.5">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function toggleWheelItem(index) {
            activeWheelItems[index].enabled = !activeWheelItems[index].enabled;
            setupWheel();
        }

        function removeWheelItem(index) {
            activeWheelItems.splice(index, 1);
            setupWheel();
        }

        function spinWheel() {
            if (isSpinning) return;
            const enabledItems = activeWheelItems.filter(item => item.enabled);
            if (enabledItems.length === 0) return;

            isSpinning = true;
            document.getElementById('spinResultContainer').classList.add('hidden');

            const selectedIndex = Math.floor(Math.random() * enabledItems.length);
            const sliceAngle = 360 / enabledItems.length;
            const targetSliceCenter = selectedIndex * sliceAngle + sliceAngle / 2;

            const degreesToRotate = 360 * 5 + (270 - targetSliceCenter);
            currentWheelRotation += degreesToRotate;

            wheelCanvas.style.transition = 'transform 4s cubic-bezier(0.15, 0.99, 0.18, 1)';
            wheelCanvas.style.transform = `rotate(${currentWheelRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const chosenItem = enabledItems[selectedIndex];
                const resultContainer = document.getElementById('spinResultContainer');
                const resultContent = document.getElementById('spinResultContent');

                if (chosenItem.isBook && chosenItem.bookRef) {
                    resultContent.innerHTML = renderBookCardHtml(chosenItem.bookRef);
                } else {
                    resultContent.innerHTML = `
                        <div class="glass-panel p-6 rounded-2xl border border-brand-500/40 text-center space-y-2">
                            <h4 class="text-xl font-bold text-white">${chosenItem.label}</h4>
                            <p class="text-xs text-slate-400">這是您自訂的轉盤結果！準備好開始這個好點子了嗎？</p>
                        </div>
                    `;
                }

                resultContainer.classList.remove('hidden');
                lucide.createIcons();
            }, 4000);
        }

        function openBookModal(bookId) {
            const book = BOOKS_DATA.find(b => b.id === bookId);
            if (!book) return;

            const isSaved = savedBookIds.includes(book.id);
            const isRead = readBookIds.includes(book.id);

            modalContent.innerHTML = `
                <div class="flex items-start justify-between gap-4">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-brand-500/20 text-brand-300 border border-brand-500/30">
                                ${book.genre}
                            </span>
                            ${getLangBadge(book.lang)}
                        </div>
                        <h2 class="text-2xl font-extrabold text-white mt-2">${book.title}</h2>
                        <p class="text-sm text-slate-400 font-medium">By ${book.author}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleReadBook('${book.id}', event); openBookModal('${book.id}');" class="p-2.5 rounded-xl ${isRead ? 'bg-emerald-600/30 text-emerald-400 border border-emerald-500/50' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'} transition flex items-center gap-1.5 text-xs font-bold">
                            <i data-lucide="check-circle-2" class="w-5 h-5 ${isRead ? 'fill-emerald-400/20' : ''}"></i>
                            <span>${isRead ? '已讀完' : '標為已讀'}</span>
                        </button>
                        <button onclick="toggleSaveBook('${book.id}', event); openBookModal('${book.id}');" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                            <i data-lucide="bookmark" class="w-5 h-5 ${isSaved ? 'fill-amber-400 text-amber-400' : ''}"></i>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3 bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 text-center">
                    <div>
                        <span class="block text-[10px] text-slate-500 uppercase">${book.lang === 'zh' ? '閱讀難易度' : 'Difficulty'}</span>
                        <span class="text-xs font-bold text-slate-200">${book.difficulty}</span>
                    </div>
                    <div>
                        <span class="block text-[10px] text-slate-500 uppercase">${book.lang === 'zh' ? '閱讀分級建議' : 'Lexile / Level'}</span>
                        <span class="text-xs font-bold text-slate-200 font-mono">${book.lexile}</span>
                    </div>
                    <div>
                        <span class="block text-[10px] text-slate-500 uppercase">${book.lang === 'zh' ? '全書頁數' : 'Page Count'}</span>
                        <span class="text-xs font-bold text-slate-200">${book.pages} pages</span>
                    </div>
                </div>

                ${book.series ? `
                    <div class="bg-amber-500/10 p-4 rounded-xl border border-amber-500/20 space-y-1.5">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-amber-300 flex items-center gap-1.5">
                            <i data-lucide="layers" class="w-4 h-4"></i> ${book.lang === 'zh' ? '作品系列與續集 (Series & Sequels)' : 'Series & Sequel Books'}
                        </h4>
                        <p class="text-xs font-bold text-slate-200">${book.series}</p>
                        ${book.sequels && book.sequels.length > 0 ? `
                            <ul class="text-xs text-slate-300 list-disc list-inside space-y-0.5 pt-1">
                                ${book.sequels.map(s => `<li>${s}</li>`).join('')}
                            </ul>
                        ` : '<p class="text-xs text-slate-400 italic">本作品為獨立單行本</p>'}
                    </div>
                ` : ''}

                <div class="space-y-2">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="file-text" class="w-4 h-4 text-brand-400"></i> ${book.lang === 'zh' ? '書籍內容簡介' : 'Plot Summary'}
                    </h4>
                    <p class="text-sm text-slate-300 leading-relaxed font-sans">${book.summary}</p>
                </div>

                <div class="space-y-2 bg-brand-950/30 p-4 rounded-xl border border-brand-800/40">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-brand-300 flex items-center gap-1.5">
                        <i data-lucide="graduation-cap" class="w-4 h-4 text-brand-400"></i> ${book.lang === 'zh' ? '為什麼適合高中生閱讀' : 'Why It\'s Great for High School Students'}
                    </h4>
                    <p class="text-xs text-slate-300 leading-relaxed font-sans">${book.whyRead}</p>
                </div>

                <div class="space-y-2">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="quote" class="w-4 h-4 text-amber-400"></i> ${book.lang === 'zh' ? '經典名言佳句' : 'Famous Quote'}
                    </h4>
                    <blockquote class="text-xs italic text-slate-200 bg-slate-950 p-3.5 rounded-xl border-l-4 border-amber-400">
                        "${book.quote}"
                    </blockquote>
                </div>
            `;

            bookModal.classList.remove('hidden');
            lucide.createIcons();
        }

        function switchMode(newMode) {
            currentMode = newMode;

            [modeGridBtn, modeSpinBtn, bookmarkTabBtn, readTabBtn, recommendTabBtn].forEach(btn => {
                btn.classList.remove('bg-brand-600', 'text-white', 'shadow', 'bg-emerald-600', 'bg-amber-600');
                btn.classList.add('text-slate-400');
            });

            gridSection.classList.add('hidden');
            spinSection.classList.add('hidden');
            savedSection.classList.add('hidden');
            readSection.classList.add('hidden');
            recommendSection.classList.add('hidden');

            // Toggle sidebar filter visibility (only useful in grid or spin)
            if (newMode === 'grid' || newMode === 'spin') {
                sidebarFilter.classList.remove('hidden');
                modeSwitchContainer.classList.remove('hidden');
            } else {
                sidebarFilter.classList.add('hidden');
                modeSwitchContainer.classList.add('hidden');
            }

            if (newMode === 'grid') {
                modeGridBtn.classList.add('bg-brand-600', 'text-white', 'shadow');
                modeGridBtn.classList.remove('text-slate-400');
                gridSection.classList.remove('hidden');
            } else if (newMode === 'spin') {
                modeSpinBtn.classList.add('bg-brand-600', 'text-white', 'shadow');
                modeSpinBtn.classList.remove('text-slate-400');
                spinSection.classList.remove('hidden');
            } else if (newMode === 'saved') {
                bookmarkTabBtn.classList.add('bg-brand-600', 'text-white', 'shadow');
                bookmarkTabBtn.classList.remove('text-slate-400');
                savedSection.classList.remove('hidden');
            } else if (newMode === 'read') {
                readTabBtn.classList.add('bg-emerald-600', 'text-white', 'shadow');
                readTabBtn.classList.remove('text-slate-400');
                readSection.classList.remove('hidden');
            } else if (newMode === 'recommend') {
                recommendTabBtn.classList.add('bg-amber-600', 'text-white', 'shadow');
                recommendTabBtn.classList.remove('text-slate-400');
                recommendSection.classList.remove('hidden');
            }

            renderCurrentView();
        }

        modeGridBtn.addEventListener('click', () => switchMode('grid'));
        modeSpinBtn.addEventListener('click', () => switchMode('spin'));
        bookmarkTabBtn.addEventListener('click', () => switchMode('saved'));
        readTabBtn.addEventListener('click', () => switchMode('read'));
        recommendTabBtn.addEventListener('click', () => switchMode('recommend'));

        filterForm.addEventListener('change', applyFilters);
        searchInput.addEventListener('input', applyFilters);

        resetFiltersBtn.addEventListener('click', () => {
            filterForm.reset();
            filterForm.querySelectorAll('input[name="genre"]').forEach(cb => cb.checked = true);
            filterForm.querySelectorAll('input[name="pages"]').forEach(cb => cb.checked = true);
            searchInput.value = '';
            applyFilters();
        });

        document.getElementById('spinActionBtn').addEventListener('click', spinWheel);

        addCustomOptionBtn.addEventListener('click', () => {
            const val = customOptionInput.value.trim();
            if (val) {
                activeWheelItems.push({
                    id: 'custom_' + Date.now(),
                    label: val,
                    isBook: false,
                    enabled: true
                });
                customOptionInput.value = '';
                setupWheel();
            }
        });

        resetWheelItemsBtn.addEventListener('click', () => {
            syncWheelItemsWithFilteredBooks();
            setupWheel();
        });

        closeModalBtn.addEventListener('click', () => bookModal.classList.add('hidden'));
        bookModal.addEventListener('click', (e) => {
            if (e.target === bookModal) bookModal.classList.add('hidden');
        });

        document.getElementById('clearSavedBtn').addEventListener('click', () => {
            savedBookIds = [];
            window.__galleryStorage.removeItem('readnext_saved_books');
            updateBadges();
            renderSavedBooks();
        });

        document.getElementById('clearReadBtn').addEventListener('click', () => {
            readBookIds = [];
            window.__galleryStorage.removeItem('readnext_read_books');
            updateBadges();
            renderReadBooks();
        });

        window.onload = function() {
            lucide.createIcons();
            updateBadges();
            applyFilters();
        };
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
