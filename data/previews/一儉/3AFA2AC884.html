            0%, 100% { color: #f8fafc; transform: scale(1); }

        /* 震動動畫 (答錯畫面震動) */

            0%, 100% { transform: translateX(0); }

    <script>
        /* 遊戲狀態與變數 */
        let score = 0;
        let level = 1;
        let correctCount = 0;
        let isPlaying = false;
        
        let currentQuestion = { text: '', answer: 0, points: 0 };
        let userInputString = "";
        
        // 計時器相關
        let timeDuration = 10000; // 初始 10 秒
        let timeRemaining = 0;
        let lastTime = 0;
        let reqAnimFrameId = null;

        // DOM 元素
        const screenStart = document.getElementById('screen-start');
        const screenGame = document.getElementById('screen-game');
        const screenGameover = document.getElementById('screen-gameover');
        
        const scoreDisplay = document.getElementById('score-display');
        const levelDisplay = document.getElementById('level-display');
        const questionText = document.getElementById('question-text');
        const userInputEl = document.getElementById('user-input');
        const timerBar = document.getElementById('timer-bar');
        const gameContainer = document.getElementById('game-container');
        
        const finalScoreEl = document.getElementById('final-score');
        const finalLevelEl = document.getElementById('final-level');

        const screenWin = document.getElementById('screen-win');
        const winFinalScoreEl = document.getElementById('win-final-score');
        const loseTauntEl = document.getElementById('lose-taunt');
        const winTauntEl = document.getElementById('win-taunt');

        // 失敗時的嘲諷語錄 (20種)
        const loseTaunts = [
            "你的數學老師在螢幕後面哭泣。", "這種運算速度，樹懶都覺得你慢。", "誠心建議，明天去報名小學一年級。", "你的大腦是不是還在撥接上網？",
            "連桌上的計算機看了都直搖頭。", "就這點能耐？我阿嬤閉著眼睛都按得比你對。", "你的算術能力，跟月底的錢包一樣空虛嗎？", "這麼簡單的題目也能卡住？真是骨骼精奇！",
            "剛剛那是手滑，還是腦袋滑了？", "把鍵盤撒把米，雞啄得都比你高分。", "放棄吧，這遊戲對你的大腦來說太硬核了。", "你的智商是不是被那條倒數計時器吃掉了？",
            "算這麼久，你是在心裡撥算盤嗎？", "笑死，菜就多練。", "答錯不丟臉，答這麼慢最後還錯才尷尬。", "難道你的大腦處理器是單核心的？",
            "恭喜你，成功解鎖「數學絕緣體」隱藏成就。", "機會給過你了，是你自己的神經傳導太慢。", "承認吧，這不是運氣差，這純粹是實力問題。", "還是去玩圈圈叉叉吧，那個比較適合你的配備。"
        ];

        // 勝利時的不屑語錄 (20種)
        const winTaunts = [
            "勉強算你過關啦，別開心得太早。", "贏了又怎樣？還不是只會算國小程度的加減乘除。", "運氣真好，今天出門是不是有踩到狗屎？", "這種哄小孩的難度也能贏，有什麼好驕傲的？",
            "才區區 15 題就腦力耗盡，耐久度真差。", "就算贏了這場遊戲，你明天還是得早起上班。", "居然讓你全矇中了，看來我的亂數系統該維修了。", "好吧，算你有兩下子，但也真的就只有兩下。",
            "這只是給菜鳥的熱身，別以為自己天下無敵了。", "勉強達到人類智慧的及格線，可喜可賀。", "既然贏了，就趕快關掉網頁去做點有意義的事吧。", "看來你今天把這輩子的運氣都透支在這裡了。",
            "贏得這麼驚險，我都替你的微血管捏把冷汗。", "這點程度，換作是我用腳趾頭寫程式都能贏。", "只是通關個小遊戲，別以為你的人生就此翻轉了。", "算你走狗屎運，下次我把時間限制改成一秒。",
            "過關了？看來我下次得加入微積分才行。", "雖然及格了，但你的反應速度依然令人發指。", "也不過就是個比較會按數字鍵盤的靈長類罷了。", "好了好了，全世界都知道你會算術了，跪安退下吧。"
        ];

        // 監聽實體鍵盤
        window.addEventListener('keydown', (e) => {
            if (!isPlaying) {
                if (e.key === 'Enter') {
                    if (!screenStart.classList.contains('hidden') || !screenGameover.classList.contains('hidden') || !screenWin.classList.contains('hidden')) {
                        startGame();
                    }
                }
                return;
            }
            
            if (e.key >= '0' && e.key <= '9') {
                handleInput(e.key);
            } else if (e.key === 'Backspace') {
                handleInput('DEL');
            } else if (e.key === 'Enter') {
                handleInput('ENTER');
            }
        });

        /* 產生題目 */
        function generateQuestion() {
            // 根據等級決定題型難度
            // 等級提高，時間縮短，數字變大，題型變雜
            let operators = ['+'];
            if (level >= 2) operators.push('-');
            if (level >= 4) operators.push('*');
            if (level >= 6) operators.push('/');

            const op = operators[Math.floor(Math.random() * operators.length)];
            let num1, num2, answer;
            
            const points = level * 10; // 基礎分數依等級提升

            switch(op) {
                case '+':
                    // 2~3 位數加法
                    let maxAdd = level < 3 ? 99 : 999;
                    let minAdd = level < 3 ? 10 : 50;
                    num1 = getRandomInt(minAdd, maxAdd);
                    num2 = getRandomInt(minAdd, maxAdd);
                    answer = num1 + num2;
                    break;
                case '-':
                    // 2~3 位數減法，確保結果為正整數
                    let maxSub = level < 4 ? 150 : 999;
                    let minSub = level < 4 ? 20 : 50;
                    num1 = getRandomInt(minSub, maxSub);
                    num2 = getRandomInt(10, num1); // num2 必小於等於 num1
                    answer = num1 - num2;
                    break;
                case '*':
                    // 答案小於 200 的乘法，避免 * 0 或 * 1 的無聊題目
                    // 找出所有可能的因數對
                    let possibleMuls = [];
                    for (let i = 2; i <= 50; i++) {
                        for (let j = 2; j <= 50; j++) {
                            if (i * j < 200) possibleMuls.push([i, j]);
                        }
                    }
                    let pair = possibleMuls[Math.floor(Math.random() * possibleMuls.length)];
                    num1 = pair[0];
                    num2 = pair[1];
                    answer = num1 * num2;
                    
                    // 稍微增加乘法的分數
                    return { text: `${num1} × ${num2}`, answer: answer, points: points + 5 };
                case '/':
                    // 答案小於 200 的除法，且為整除
                    let divAns = getRandomInt(2, 199);
                    let divDivisor = getRandomInt(2, 20);
                    // 為了避免超出 200 太多，稍微限制被除數 (雖無硬性規定，但維持遊戲節奏)
                    if (divAns * divDivisor > 800) {
                        divAns = getRandomInt(2, 40);
                    }
                    num1 = divAns * divDivisor;
                    num2 = divDivisor;
                    answer = divAns;
                    
                    return { text: `${num1} ÷ ${num2}`, answer: answer, points: points + 5 };
            }

            return { text: `${num1} ${op} ${num2}`, answer: answer, points: points };
        }

        /* 處理輸入 (實體/虛擬共用) */
        function handleInput(val) {
            if (!isPlaying) return;

            if (val === 'DEL') {
                userInputString = userInputString.slice(0, -1);
            } else if (val === 'ENTER') {
                checkAnswer();
                return;
            } else {
                // 限制長度避免溢出畫面
                if (userInputString.length < 5) {
                    userInputString += val;
                }
            }
            updateInputDisplay();
        }

        function updateInputDisplay() {
            userInputEl.textContent = userInputString;
        }

        /* 檢查答案 */
        function checkAnswer() {
            if (userInputString === "") return; // 空白不處理

            const userAns = parseInt(userInputString, 10);
            if (userAns === currentQuestion.answer) {
                // 答對
                score += currentQuestion.points;
                correctCount++;
                
                // 動態升級 (每答對 3 題升一級)
                if (correctCount % 3 === 0) {
                    level++;
                }

                // 視覺回饋 (加分)
                scoreDisplay.classList.remove('flash-green', 'flash-red');
                void scoreDisplay.offsetWidth; // 觸發 reflow 重新播放動畫
                scoreDisplay.classList.add('flash-green');

                if (correctCount >= 15) {
                    gameWin();
                } else {
                    nextQuestion();
                }
            } else {
                // 答錯
                score -= currentQuestion.points; // 扣除相同分數
                // 分數不低於 0
                if(score < 0) score = 0; 
                
                // 視覺回饋 (扣分閃爍與震動)
                scoreDisplay.classList.remove('flash-green', 'flash-red');
                gameContainer.classList.remove('shake-screen');
                
                void scoreDisplay.offsetWidth;
                void gameContainer.offsetWidth;
                
                scoreDisplay.classList.add('flash-red');
                gameContainer.classList.add('shake-screen');

                // 清空輸入框讓玩家重輸
                userInputString = "";
                updateInputDisplay();
                updateTopBar();
            }
        }

        /* 進入下一題 */
        function nextQuestion() {
            currentQuestion = generateQuestion();
            questionText.textContent = currentQuestion.text;
            
            userInputString = "";
            updateInputDisplay();
            updateTopBar();

            // 重新計算時間 (隨難度遞減)
            // 公式: 10000ms - (level-1)*800ms，最低下限 3000ms (3秒)
            timeDuration = Math.max(3000, 10000 - (level - 1) * 800);
            timeRemaining = timeDuration;
            lastTime = performance.now();
            
            // 計時器顏色恢復
            timerBar.className = 'h-full w-full shadow-[0_0_8px_rgba(16,185,129,0.8)] bg-emerald-500';

            if (!reqAnimFrameId) {
                reqAnimFrameId = requestAnimationFrame(gameLoop);
            }
        }

        /* 遊戲主迴圈 (處理計時器) */
        function gameLoop(timestamp) {
            if (!isPlaying) return;

            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            timeRemaining -= deltaTime;

            if (timeRemaining <= 0) {
                // 時間到，遊戲結束
                timeRemaining = 0;
                updateTimerUI();
                gameOver();
                return;
            }

            updateTimerUI();
            reqAnimFrameId = requestAnimationFrame(gameLoop);
        }

        function updateTimerUI() {
            const percentage = (timeRemaining / timeDuration) * 100;
            timerBar.style.width = `${percentage}%`;

            // 時間少於 30% 變紅色
            if (percentage < 30) {
                timerBar.classList.replace('bg-emerald-500', 'bg-red-500');
                timerBar.classList.replace('shadow-[0_0_8px_rgba(16,185,129,0.8)]', 'shadow-[0_0_8px_rgba(239,68,68,0.8)]');
            } else if (percentage < 60) {
                timerBar.classList.replace('bg-emerald-500', 'bg-yellow-400');
                timerBar.classList.replace('shadow-[0_0_8px_rgba(16,185,129,0.8)]', 'shadow-[0_0_8px_rgba(250,204,21,0.8)]');
            }
        }

        function updateTopBar() {
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
        }

        /* 控制流程 */
        function startGame() {
            score = 0;
            level = 1;
            correctCount = 0;
            isPlaying = true;
            
            screenStart.classList.add('hidden');
            screenGameover.classList.add('hidden');
            screenWin.classList.add('hidden');
            screenGame.classList.remove('hidden');

            scoreDisplay.classList.remove('flash-green', 'flash-red');
            gameContainer.classList.remove('shake-screen');

            nextQuestion();
        }

        function gameOver() {
            isPlaying = false;
            if (reqAnimFrameId) {
                cancelAnimationFrame(reqAnimFrameId);
                reqAnimFrameId = null;
            }

            // 更新結算畫面
            finalScoreEl.textContent = score;
            finalLevelEl.textContent = level;
            loseTauntEl.textContent = loseTaunts[Math.floor(Math.random() * loseTaunts.length)];

            screenGame.classList.add('hidden');
            screenGameover.classList.remove('hidden');
        }

        function gameWin() {
            isPlaying = false;
            if (reqAnimFrameId) {
                cancelAnimationFrame(reqAnimFrameId);
                reqAnimFrameId = null;
            }

            winFinalScoreEl.textContent = score;
            winTauntEl.textContent = winTaunts[Math.floor(Math.random() * winTaunts.length)];

            screenGame.classList.add('hidden');
            screenWin.classList.remove('hidden');
        }

        // 工具函數
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
