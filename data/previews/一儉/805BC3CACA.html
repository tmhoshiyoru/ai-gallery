<!DOCTYPE html>
<html lang="zh-TW">
<head><base href="../../../%E4%BD%9C%E5%93%81/%E7%AC%AC%E4%B8%80%E5%80%8BAI%E7%A8%8B%E5%BC%8F/%E4%B8%80%E5%84%89/"><script>
window.__galleryStorage = (() => {
  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade 經典貪食蛇</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d1a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 2.2rem;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .score-board {
            width: 400px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
        }

        .game-container {
            position: relative;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc, inset 0 0 15px #00ffcc;
            border-radius: 8px;
            background-color: #000;
        }

        canvas {
            display: block;
            background-color: #050510;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .overlay h2 {
            font-size: 2.5rem;
            color: #ff0055;
            text-shadow: 0 0 12px #ff0055;
            margin-bottom: 15px;
        }

        .overlay p {
            font-size: 1.1rem;
            color: #00ffcc;
            margin-bottom: 25px;
        }

        .btn {
            padding: 10px 25px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            color: #000;
            background-color: #00ffcc;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ffcc;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #ff007f;
            color: #fff;
            box-shadow: 0 0 20px #ff007f;
        }

        .hidden {
            display: none !important;
        }
    </style>
<style id="gallery-layout-support">
html { overflow-y: auto !important; }
body { height: auto !important; min-height: 100vh !important; overflow-y: auto !important; }
/* Full-height games need a definite containing height for percentage-sized canvases. */
body.h-full, body.h-screen { height: 100vh !important; }

body > header, body > main, body > footer, body > canvas { flex-shrink: 0; }

</style></head>
<body>

    <h1>RETRO SNAKE</h1>

    <div class="score-board">
        <div>SCORE: <span id="current-score">0</span></div>
        <div>HIGH SCORE: <span id="high-score">0</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div id="game-over-screen" class="overlay hidden">
            <h2>GAME OVER</h2>
            <p>最終得分: <span id="final-score">0</span></p>
            <button class="btn" onclick="resetGame()">重新開始</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('current-score');
        const highScoreElement = document.getElementById('high-score');
        const finalScoreElement = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over-screen');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let dx = gridSize;
        let dy = 0;
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = window.__galleryStorage.getItem('snakeHighScore') || 0;
        let gameInterval = null;
        let isChangingDirection = false;

        highScoreElement.textContent = highScore;

        function initGame() {
            snake = [
                { x: 160, y: 200 },
                { x: 140, y: 200 },
                { x: 120, y: 200 }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameOverScreen.classList.add('hidden');
            generateFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 100);
        }

        function gameLoop() {
            if (isGameOver()) {
                handleGameOver();
                return;
            }

            isChangingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 畫出 Arcade 復古微弱網格
            ctx.strokeStyle = '#111125';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#00ffcc' : '#00b386';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = index === 0 ? 10 : 0;
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0; // 重置發光效果
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // 檢查是否吃到蘋果
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    window.__galleryStorage.setItem('snakeHighScore', highScore);
                }
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;

            // 確保蘋果不會生長在蛇身上
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function isGameOver() {
            const head = snake[0];

            // 撞牆判定
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= canvas.width;
            const hitToptWall = head.y < 0;
            const hitBottomWall = head.y >= canvas.height;

            if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) {
                return true;
            }

            // 撞到身體判定
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }

            return false;
        }

        function handleGameOver() {
            clearInterval(gameInterval);
            finalScoreElement.textContent = score;
            gameOverScreen.classList.remove('hidden');
        }

        function resetGame() {
            initGame();
        }

        // 鍵盤操控與方向鎖定機制
        document.addEventListener('keydown', changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;

            if (isChangingDirection) return;

            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if (keyPressed === LEFT && !goingRight) {
                dx = -gridSize;
                dy = 0;
                isChangingDirection = true;
            }
            if (keyPressed === UP && !goingDown) {
                dx = 0;
                dy = -gridSize;
                isChangingDirection = true;
            }
            if (keyPressed === RIGHT && !goingLeft) {
                dx = gridSize;
                dy = 0;
                isChangingDirection = true;
            }
            if (keyPressed === DOWN && !goingUp) {
                dx = 0;
                dy = gridSize;
                isChangingDirection = true;
            }
        }

        // 啟動遊戲
        initGame();
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
</html>
