window.__galleryStorage = (() => {
  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();

    <script>
        /**
         * Web Audio Synthesizer for SFX
         * Generates sound effect waveforms dynamically.
         */
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playEat() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playSpecialEat() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playBadEat() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playDie() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }

            playClick() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }
        }

        /**
         * Particle System for visual impact
         */
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 4 + 2;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * Main Game Engine Class
         */
        class SnakeGame {
            constructor() {
                // Canvas setup
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                // Audio Manager
                this.sfx = new SoundEffects();

                // Grid Parameters
                this.gridSize = 20; // 20x20 Grid
                this.cellSize = 0; // Dynamic pixel size calculated on resize

                // Game State
                this.state = 'INIT'; // INIT, PLAYING, PAUSED, GAMEOVER
                this.score = 0;
                this.highScore = parseInt(window.__galleryStorage.getItem('neosnake_highscore') || '0');
                
                // Snake Data
                this.snake = [];
                this.direction = { x: 1, y: 0 };
                // Input Direction Queue for precise grid turning
                this.inputQueue = [];

                // Stat Counters
                this.eggStats = { normal: 0, golden: 0, rotten: 0 };

                // Foods Management (Multiple Eggs)
                this.foods = []; // List of { x, y, type, duration, createdAt }
                this.nextFoodSpawnTime = 0;
                this.obstacles = [];

                // Visual Effects
                this.particles = [];
                this.pulseAngle = 0;

                // Config
                this.difficulty = 'normal';
                this.mapMode = 'walled';
                this.baseSpeed = 120; // MS per tick
                this.lastTickTime = 0;

                // UI Elements Reference
                this.uiScore = document.getElementById('score');
                this.uiHighScore = document.getElementById('high-score');
                this.uiOverlay = document.getElementById('overlay');
                this.uiOverlayTitle = document.getElementById('overlay-title');
                this.uiOverlayDesc = document.getElementById('overlay-desc');
                this.uiOverlayIcon = document.getElementById('overlay-icon');
                this.uiBtnStartText = document.getElementById('btn-start-text');
                this.uiMenuOptions = document.getElementById('menu-options');
                this.uiGameStats = document.getElementById('game-stats');

                // Initialize listeners and viewport
                this.initResizeObserver();
                this.bindEvents();
                this.updateUI();
            }

            initResizeObserver() {
                const resize = () => {
                    const rect = this.canvas.getBoundingClientRect();
                    const dpr = window.devicePixelRatio || 1;
                    
                    this.canvas.width = rect.width * dpr;
                    this.canvas.height = rect.height * dpr;
                    this.ctx.scale(dpr, dpr);
                    
                    this.cellSize = rect.width / this.gridSize;
                };

                window.addEventListener('resize', resize);
                resize();
            }

            bindEvents() {
                // Keyboard Input
                window.addEventListener('keydown', (e) => {
                    this.sfx.init();
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                        e.preventDefault();
                    }

                    if (this.state === 'PLAYING') {
                        let newDir = null;
                        switch (e.code) {
                            case 'ArrowUp': case 'KeyW':
                                newDir = { x: 0, y: -1 }; break;
                            case 'ArrowDown': case 'KeyS':
                                newDir = { x: 0, y: 1 }; break;
                            case 'ArrowLeft': case 'KeyA':
                                newDir = { x: -1, y: 0 }; break;
                            case 'ArrowRight': case 'KeyD':
                                newDir = { x: 1, y: 0 }; break;
                        }
                        if (newDir) this.queueInput(newDir);
                    }
                });

                // Touch / Swipe Logic
                let startX = 0, startY = 0;
                this.canvas.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }, { passive: true });

                this.canvas.addEventListener('touchend', (e) => {
                    if (this.state !== 'PLAYING') return;
                    const diffX = e.changedTouches[0].clientX - startX;
                    const diffY = e.changedTouches[0].clientY - startY;

                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        if (Math.abs(diffX) > 30) {
                            this.queueInput({ x: diffX > 0 ? 1 : -1, y: 0 });
                        }
                    } else {
                        if (Math.abs(diffY) > 30) {
                            this.queueInput({ x: 0, y: diffY > 0 ? 1 : -1 });
                        }
                    }
                }, { passive: true });

                // Virtual D-Pad Buttons
                const bindDpad = (id, dir) => {
                    const btn = document.getElementById(id);
                    if (!btn) return;
                    const trigger = (e) => {
                        e.preventDefault();
                        this.sfx.init();
                        if (this.state === 'PLAYING') {
                            this.queueInput(dir);
                        }
                    };
                    btn.addEventListener('touchstart', trigger);
                    btn.addEventListener('mousedown', trigger);
                };

                bindDpad('ctrl-up', { x: 0, y: -1 });
                bindDpad('ctrl-down', { x: 0, y: 1 });
                bindDpad('ctrl-left', { x: -1, y: 0 });
                bindDpad('ctrl-right', { x: 1, y: 0 });

                // UI Controls
                document.getElementById('btn-start').addEventListener('click', () => {
                    this.sfx.init();
                    this.sfx.playClick();
                    if (this.state === 'PAUSED') {
                        this.resumeGame();
                    } else {
                        this.startGame();
                    }
                });

                document.getElementById('btn-pause').addEventListener('click', () => {
                    this.sfx.init();
                    this.sfx.playClick();
                    this.togglePause();
                });

                const soundBtn = document.getElementById('btn-sound');
                soundBtn.addEventListener('click', () => {
                    this.sfx.init();
                    this.sfx.muted = !this.sfx.muted;
                    soundBtn.innerHTML = this.sfx.muted 
                        ? '<i class="fa-solid fa-volume-xmark text-sm text-red-400"></i>' 
                        : '<i class="fa-solid fa-volume-high text-sm"></i>';
                });

                document.getElementById('select-difficulty').addEventListener('change', (e) => {
                    this.difficulty = e.target.value;
                });

                document.getElementById('select-map').addEventListener('change', (e) => {
                    this.mapMode = e.target.value;
                });
            }

            startGame() {
                // Settings Speed
                const speedMap = { easy: 150, normal: 110, hard: 75 };
                this.baseSpeed = speedMap[this.difficulty] || 110;

                // Reset State
                this.score = 0;
                this.snake = [
                    { x: 5, y: 10 },
                    { x: 4, y: 10 },
                    { x: 3, y: 10 }
                ];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.particles = [];
                this.foods = [];

                // Generate Map Obstacles
                this.generateObstacles();

                // Spawn Initial Egg
                this.spawnEgg();
                this.nextFoodSpawnTime = performance.now() + 1000 + Math.random() * 1500;

                // State Transition
                this.state = 'PLAYING';
                this.uiOverlay.classList.add('opacity-0', 'pointer-events-none');
                this.updateUI();

                // Start Main Loop
                this.lastTickTime = performance.now();
                requestAnimationFrame(this.loop.bind(this));
            }

            generateObstacles() {
                this.obstacles = [];
                if (this.mapMode !== 'obstacles') return;

                // Add central obstacles blocks
                const center = Math.floor(this.gridSize / 2);
                const blocks = [
                    { x: center - 4, y: center - 4 }, { x: center - 3, y: center - 4 },
                    { x: center + 4, y: center - 4 }, { x: center + 3, y: center - 4 },
                    { x: center - 4, y: center + 4 }, { x: center - 3, y: center + 4 },
                    { x: center + 4, y: center + 4 }, { x: center + 3, y: center + 4 }
                ];

                this.obstacles = blocks;
            }

            spawnEgg() {
                // Limit maximum simultaneous eggs on board to prevent crowding
                if (this.foods.length >= 6) return;

                // Calculate total available spaces to prevent infinite loops when almost full
                const totalCells = this.gridSize * this.gridSize;
                const occupiedCells = this.snake.length + this.obstacles.length + this.foods.length;
                if (totalCells - occupiedCells <= 1) return; // Not enough space left to spawn safely

                // Calculate current head's next tile direction
                const nextHeadX = this.snake[0] ? this.snake[0].x + this.direction.x : -1;
                const nextHeadY = this.snake[0] ? this.snake[0].y + this.direction.y : -1;

                let valid = false;
                let newX, newY;
                let attempts = 0;

                while (!valid && attempts < 200) {
                    attempts++;
                    newX = Math.floor(Math.random() * this.gridSize);
                    newY = Math.floor(Math.random() * this.gridSize);

                    // Avoid snake body
                    const onSnake = this.snake.some(s => s.x === newX && s.y === newY);
                    // Avoid obstacles
                    const onObstacle = this.obstacles.some(o => o.x === newX && o.y === newY);
                    // Avoid other foods
                    const onFood = this.foods.some(f => f.x === newX && f.y === newY);
                    // Avoid the tile directly in front of snake head
                    const isNextHeadTile = (newX === nextHeadX && newY === nextHeadY);

                    if (!onSnake && !onObstacle && !onFood && !isNextHeadTile) {
                        valid = true;
                    }
                }

                if (!valid) return;

                // Pick egg type based on probabilities
                const rand = Math.random();
                let type = 'normal';
                let duration = 60000; // 60s for normal white egg

                if (rand < 0.20) {
                    type = 'golden';
                    duration = 5000; // 5s for golden egg (+100)
                } else if (rand < 0.45) {
                    type = 'rotten';
                    duration = 10000; // 10s for rotten green egg (-20)
                }

                this.foods.push({
                    x: newX,
                    y: newY,
                    type: type,
                    duration: duration,
                    createdAt: performance.now()
                });
            }

            queueInput(dir) {
                // Limit queue capacity to prevent delayed inputs
                if (this.inputQueue.length >= 2) return;

                // Compare with the last queued direction or current direction
                const lastDir = this.inputQueue.length > 0 
                    ? this.inputQueue[this.inputQueue.length - 1] 
                    : this.direction;

                // Prevent 180-degree immediate reversal
                if (dir.x !== -lastDir.x || dir.y !== -lastDir.y) {
                    if (dir.x !== lastDir.x || dir.y !== lastDir.y) {
                        this.inputQueue.push(dir);
                    }
                }
            }

            startGame() {
                // Settings Speed
                const speedMap = { easy: 150, normal: 110, hard: 75 };
                this.baseSpeed = speedMap[this.difficulty] || 110;

                // Reset State
                this.score = 0;
                this.eggStats = { normal: 0, golden: 0, rotten: 0 };
                this.snake = [
                    { x: 5, y: 10 },
                    { x: 4, y: 10 },
                    { x: 3, y: 10 }
                ];
                this.direction = { x: 1, y: 0 };
                this.inputQueue = [];
                this.particles = [];
                this.foods = [];

                // Generate Map Obstacles
                this.generateObstacles();

                // Spawn Initial Egg
                this.spawnEgg();
                this.nextFoodSpawnTime = performance.now() + 1000 + Math.random() * 1500;

                // State Transition
                this.state = 'PLAYING';
                if (this.uiGameStats) this.uiGameStats.classList.add('hidden');
                this.uiOverlay.classList.add('opacity-0', 'pointer-events-none');
                this.updateUI();

                // Start Main Loop
                this.lastTickTime = performance.now();
                requestAnimationFrame(this.loop.bind(this));
            }
<!-- ... existing code ... discount Stats Overlay display on Game Over ... -->
            gameOver() {
                this.state = 'GAMEOVER';
                this.sfx.playDie();

                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    window.__galleryStorage.setItem('neosnake_highscore', this.highScore.toString());
                }

                this.showGameOverOverlay('<i class="fa-solid fa-skull text-pink-400"></i>', '遊戲結束');
            }

            gameWin() {
                this.state = 'GAMEOVER';
                this.sfx.playSpecialEat();

                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    window.__galleryStorage.setItem('neosnake_highscore', this.highScore.toString());
                }

                this.showGameOverOverlay('<i class="fa-solid fa-crown text-amber-400"></i>', 'Good Job!');
            }

            showGameOverOverlay(iconHtml, titleText) {
                this.uiOverlayIcon.innerHTML = iconHtml;
                this.uiOverlayTitle.innerText = titleText;
                
                const instructions = document.getElementById('game-instructions');
                if (instructions) instructions.classList.add('hidden');

                // Render Egg Stats Summary
                if (this.uiGameStats) {
                    const total = this.eggStats.normal + this.eggStats.golden + this.eggStats.rotten;
                    document.getElementById('stat-total-eggs').innerText = `共 ${total} 顆`;
                    document.getElementById('stat-normal-count').innerText = `${this.eggStats.normal} 顆`;
                    document.getElementById('stat-golden-count').innerText = `${this.eggStats.golden} 顆`;
                    document.getElementById('stat-rotten-count').innerText = `${this.eggStats.rotten} 顆`;
                    this.uiGameStats.classList.remove('hidden');
                }

                this.uiBtnStartText.innerText = '再次挑戰';
                this.uiMenuOptions.classList.remove('hidden');
                this.uiOverlay.classList.remove('opacity-0', 'pointer-events-none');
                this.updateUI();
            }

            createExplosion(x, y, color, count = 12) {
                const pixelX = (x + 0.5) * this.cellSize;
                const pixelY = (y + 0.5) * this.cellSize;
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(pixelX, pixelY, color));
                }
            }

            update(now) {
                // Spawn egg periodically (at least 1 second interval)
                if (now >= this.nextFoodSpawnTime) {
                    this.spawnEgg();
                    this.nextFoodSpawnTime = now + 1000 + Math.random() * 1500;
                }

                // Check expired eggs
                for (let i = this.foods.length - 1; i >= 0; i--) {
                    const egg = this.foods[i];
                    if (now - egg.createdAt >= egg.duration) {
                        this.foods.splice(i, 1);
                    }
                }

                // Ensure there is at least 1 egg on screen
                if (this.foods.length === 0) {
                    this.spawnEgg();
                }

                // Tick Controls
                if (now - this.lastTickTime >= this.baseSpeed) {
                    this.lastTickTime = now;
                    this.tick();
                }

                // Update Particles Animation
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.update();
                    if (p.alpha <= 0) this.particles.splice(i, 1);
                }

                this.pulseAngle += 0.05;
            }

            tick() {
                // Process the next queued direction on grid tick
                if (this.inputQueue.length > 0) {
                    this.direction = this.inputQueue.shift();
                }

                const head = { 
                    x: this.snake[0].x + this.direction.x, 
                    y: this.snake[0].y + this.direction.y 
                };

                // Border Handle (Walled)
                if (head.x < 0 || head.x >= this.gridSize || head.y < 0 || head.y >= this.gridSize) {
                    return this.gameOver();
                }

                // Self Collision
                if (this.snake.some(s => s.x === head.x && s.y === head.y)) {
                    return this.gameOver();
                }

                // Obstacle Collision
                if (this.obstacles.some(obs => obs.x === head.x && obs.y === head.y)) {
                    return this.gameOver();
                }

                // Move Forward
                this.snake.unshift(head);

                // Check Victory Condition: Body fills all available grid cells
                const totalCells = this.gridSize * this.gridSize;
                if (this.snake.length + this.obstacles.length >= totalCells) {
                    return this.gameWin();
                }

                // Check collisions with all eggs
                const eatenIndex = this.foods.findIndex(f => f.x === head.x && f.y === head.y);

                if (eatenIndex !== -1) {
                    const eaten = this.foods[eatenIndex];
                    this.foods.splice(eatenIndex, 1);

                    if (eaten.type === 'normal') {
                        this.score += 10;
                        this.eggStats.normal++;
                        this.sfx.playEat();
                        this.createExplosion(head.x, head.y, '#f8fafc');
                    } else if (eaten.type === 'golden') {
                        this.score += 100;
                        this.eggStats.golden++;
                        this.sfx.playSpecialEat();
                        this.createExplosion(head.x, head.y, '#fbbf24', 20);
                    } else if (eaten.type === 'rotten') {
                        this.score = Math.max(0, this.score - 20);
                        this.eggStats.rotten++;
                        this.sfx.playBadEat();
                        this.createExplosion(head.x, head.y, '#10b981', 15);
                    }

                    this.updateUI();
                } else {
                    this.snake.pop(); // Remove tail if no food eaten
                }
            }

            draw() {
                const rect = this.canvas.getBoundingClientRect();
                const width = rect.width;
                const height = rect.height;

                // Clear background
                this.ctx.clearRect(0, 0, width, height);

                // Draw Grid Layer
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
                this.ctx.lineWidth = 1;
                for (let i = 0; i <= this.gridSize; i++) {
                    const pos = i * this.cellSize;
                    this.ctx.beginPath();
                    this.ctx.moveTo(pos, 0);
                    this.ctx.lineTo(pos, height);
                    this.ctx.stroke();

                    this.ctx.beginPath();
                    this.ctx.moveTo(0, pos);
                    this.ctx.lineTo(width, pos);
                    this.ctx.stroke();
                }

                // Draw Obstacles
                this.obstacles.forEach(obs => {
                    this.ctx.fillStyle = '#475569';
                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                    this.ctx.shadowBlur = 8;
                    this.drawRoundedRect(
                        obs.x * this.cellSize + 2, 
                        obs.y * this.cellSize + 2, 
                        this.cellSize - 4, 
                        this.cellSize - 4, 
                        6
                    );
                    this.ctx.shadowBlur = 0;
                });

                // Draw Eggs (3 Types)
                const now = performance.now();
                this.foods.forEach(egg => {
                    const eggX = egg.x * this.cellSize + this.cellSize / 2;
                    const eggY = egg.y * this.cellSize + this.cellSize / 2;
                    
                    // Lifetime blinking effect when near expiration
                    const elapsed = now - egg.createdAt;
                    const remaining = egg.duration - elapsed;
                    if (remaining < 2000 && Math.floor(remaining / 200) % 2 === 0) {
                        return; // Blink hide briefly
                    }

                    const pulse = Math.sin(this.pulseAngle * (egg.type === 'golden' ? 2 : 1)) * 1.2;
                    const eggWidth = Math.max(2, (this.cellSize / 2 - 4) + pulse);
                    const eggHeight = eggWidth * 1.3;

                    this.ctx.save();

                    if (egg.type === 'normal') {
                        // 1. Normal White Egg (+10)
                        this.ctx.shadowColor = '#ffffff';
                        this.ctx.shadowBlur = 10;
                        this.ctx.fillStyle = '#f8fafc'; // Clean eggshell white
                        this.ctx.beginPath();
                        this.ctx.ellipse(eggX, eggY, eggWidth, eggHeight, 0, 0, Math.PI * 2);
                        this.ctx.fill();

                        // Highlight & Blush
                        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                        this.ctx.beginPath();
                        this.ctx.ellipse(eggX - eggWidth * 0.3, eggY - eggHeight * 0.3, eggWidth * 0.3, eggHeight * 0.2, -Math.PI / 4, 0, Math.PI * 2);
                        this.ctx.fill();

                        this.ctx.fillStyle = '#f472b6'; // Blush
                        this.ctx.beginPath();
                        this.ctx.arc(eggX - eggWidth * 0.35, eggY + eggHeight * 0.1, eggWidth * 0.12, 0, Math.PI * 2);
                        this.ctx.arc(eggX + eggWidth * 0.35, eggY + eggHeight * 0.1, eggWidth * 0.12, 0, Math.PI * 2);
                        this.ctx.fill();

                    } else if (egg.type === 'golden') {
                        // 2. Golden Egg (+100)
                        this.ctx.shadowColor = '#fbbf24';
                        this.ctx.shadowBlur = 20;
                        this.ctx.fillStyle = '#f59e0b';
                        this.ctx.beginPath();
                        this.ctx.ellipse(eggX, eggY, eggWidth * 1.1, eggHeight * 1.1, 0, 0, Math.PI * 2);
                        this.ctx.fill();

                        this.ctx.fillStyle = '#fef08a'; // Golden shine
                        this.ctx.beginPath();
                        this.ctx.ellipse(eggX - eggWidth * 0.3, eggY - eggHeight * 0.3, eggWidth * 0.35, eggHeight * 0.22, -Math.PI / 4, 0, Math.PI * 2);
                        this.ctx.fill();

                    } else if (egg.type === 'rotten') {
                        // 3. Rotten Green Stinky Egg (-20)
                        this.ctx.shadowColor = '#10b981';
                        this.ctx.shadowBlur = 14;
                        this.ctx.fillStyle = '#047857'; // Deep rotten green
                        this.ctx.beginPath();
                        this.ctx.ellipse(eggX, eggY, eggWidth, eggHeight, 0, 0, Math.PI * 2);
                        this.ctx.fill();

                        // Rotten spots
                        this.ctx.fillStyle = '#022c22';
                        this.ctx.beginPath();
                        this.ctx.arc(eggX - eggWidth * 0.2, eggY - eggHeight * 0.1, eggWidth * 0.18, 0, Math.PI * 2);
                        this.ctx.arc(eggX + eggWidth * 0.25, eggY + eggHeight * 0.2, eggWidth * 0.15, 0, Math.PI * 2);
                        this.ctx.fill();

                        // Stink wave lines above
                        this.ctx.strokeStyle = '#34d399';
                        this.ctx.lineWidth = 1.5;
                        this.ctx.beginPath();
                        this.ctx.arc(eggX - 3, eggY - eggHeight - 2, 3, 0, Math.PI);
                        this.ctx.stroke();
                    }

                    this.ctx.restore();
                });

                // Draw Snake Body & Head as a Single Continuous Smooth Curved Path
                if (this.snake.length > 0) {
                    this.ctx.save();
                    
                    // Render Continuous Snake Body
                    if (this.snake.length > 1) {
                        this.ctx.beginPath();
                        
                        // Convert grid coordinates to cell center points
                        const points = this.snake.map(s => ({
                            x: (s.x + 0.5) * this.cellSize,
                            y: (s.y + 0.5) * this.cellSize
                        }));

                        this.ctx.moveTo(points[0].x, points[0].y);

                        for (let i = 1; i < points.length; i++) {
                            this.ctx.lineTo(points[i].x, points[i].y);
                        }

                        // Smooth rounded body path styling
                        this.ctx.lineCap = 'round';
                        this.ctx.lineJoin = 'round';
                        this.ctx.lineWidth = this.cellSize * 0.85;
                        this.ctx.strokeStyle = '#6366f1';
                        this.ctx.shadowColor = '#818cf8';
                        this.ctx.shadowBlur = 12;
                        this.ctx.stroke();

                        // Inner lighter highlight layer for continuous 3D depth
                        this.ctx.beginPath();
                        this.ctx.moveTo(points[0].x, points[0].y);
                        for (let i = 1; i < points.length; i++) {
                            this.ctx.lineTo(points[i].x, points[i].y);
                        }
                        this.ctx.lineWidth = this.cellSize * 0.45;
                        this.ctx.strokeStyle = '#a5b4fc';
                        this.ctx.shadowBlur = 0;
                        this.ctx.stroke();
                    } else {
                        // Single cell head fallback
                        const headX = (this.snake[0].x + 0.5) * this.cellSize;
                        const headY = (this.snake[0].y + 0.5) * this.cellSize;
                        this.ctx.fillStyle = '#6366f1';
                        this.ctx.beginPath();
                        this.ctx.arc(headX, headY, this.cellSize * 0.42, 0, Math.PI * 2);
                        this.ctx.fill();
                    }

                    // Render Snake Head Details (Cute Animated Eyes on Top)
                    const head = this.snake[0];
                    const centerX = (head.x + 0.5) * this.cellSize;
                    const centerY = (head.y + 0.5) * this.cellSize;
                    const eyeOffset = this.cellSize * 0.22;
                    const eyeRadius = this.cellSize * 0.12;

                    let eyeX1 = centerX, eyeY1 = centerY;
                    let eyeX2 = centerX, eyeY2 = centerY;

                    if (this.direction.x === 1) { // Right
                        eyeX1 = centerX + eyeOffset; eyeY1 = centerY - eyeOffset;
                        eyeX2 = centerX + eyeOffset; eyeY2 = centerY + eyeOffset;
                    } else if (this.direction.x === -1) { // Left
                        eyeX1 = centerX - eyeOffset; eyeY1 = centerY - eyeOffset;
                        eyeX2 = centerX - eyeOffset; eyeY2 = centerY + eyeOffset;
                    } else if (this.direction.y === -1) { // Up
                        eyeX1 = centerX - eyeOffset; eyeY1 = centerY - eyeOffset;
                        eyeX2 = centerX + eyeOffset; eyeY2 = centerY - eyeOffset;
                    } else if (this.direction.y === 1) { // Down
                        eyeX1 = centerX - eyeOffset; eyeY1 = centerY + eyeOffset;
                        eyeX2 = centerX + eyeOffset; eyeY2 = centerY + eyeOffset;
                    }

                    // Outer White Eyes
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.beginPath();
                    this.ctx.arc(eyeX1, eyeY1, eyeRadius, 0, Math.PI * 2);
                    this.ctx.arc(eyeX2, eyeY2, eyeRadius, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Inner Black Pupils
                    this.ctx.fillStyle = '#0f172a';
                    this.ctx.beginPath();
                    this.ctx.arc(eyeX1, eyeY1, eyeRadius * 0.5, 0, Math.PI * 2);
                    this.ctx.arc(eyeX2, eyeY2, eyeRadius * 0.5, 0, Math.PI * 2);
                    this.ctx.fill();

                    this.ctx.restore();
                }

                // Draw Particles
                this.particles.forEach(p => p.draw(this.ctx));
            }

            drawRoundedRect(x, y, width, height, radius) {
                this.ctx.beginPath();
                this.ctx.moveTo(x + radius, y);
                this.ctx.arcTo(x + width, y, x + width, y + height, radius);
                this.ctx.arcTo(x + width, y + height, x, y + height, radius);
                this.ctx.arcTo(x, y + height, x, y, radius);
                this.ctx.arcTo(x, y, x + width, y, radius);
                this.ctx.closePath();
                this.ctx.fill();
            }

            updateUI() {
                this.uiScore.innerText = this.score;
                this.uiHighScore.innerText = this.highScore;
            }

            loop(now) {
                if (this.state === 'PLAYING') {
                    this.update(now);
                    this.draw();
                    requestAnimationFrame(this.loop.bind(this));
                }
            }
        }

        // Initialize Game Instance on Page Load
        window.addEventListener('load', () => {
            window.game = new SnakeGame();
        });
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
</script></body>
