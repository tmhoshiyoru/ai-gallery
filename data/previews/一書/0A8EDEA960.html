  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Cinzel:wght@700&display=swap');

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #050508;
            color: #d1d5db;
            overflow-x: hidden;
            user-select: none;
        }

        /* 恐怖暗黑風格滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* 血腥閃爍動畫 */
        @keyframes bloodPulse {
            0%, 100% { box-shadow: inset 0 0 30px rgba(185, 28, 28, 0.2); }
            50% { box-shadow: inset 0 0 70px rgba(185, 28, 28, 0.6); }
        }

        .blood-vignette {
            animation: bloodPulse 4s infinite ease-in-out;
        }

        /* 驚嚇紅光閃爍 */
        @keyframes jumpScareFlash {
            0% { background-color: rgba(220, 38, 38, 0.8); }
            100% { background-color: transparent; }
        }

        .scare-flash {
            animation: jumpScareFlash 0.4s ease-out forwards;
        }

        /* 打字機游標 */
        .typewriter-cursor::after {
            content: '❘';
            animation: blink 0.8s infinite;
            color: #ef4444;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 扭曲文字（高恐懼狀態） */
        .sanity-glitch {
            text-shadow: 2px 0 #ef4444, -2px 0 #3b82f6;
            animation: glitch 1s infinite alternate;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(-1px, -1px); }
            60% { transform: translate(1px, 1px); }
            80% { transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }

        /* 選項按鈕 hover 特效 */
        .choice-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

        .choice-btn:hover {
            transform: translateX(6px);
            border-color: #ef4444;
            background: linear-gradient(135deg, rgba(127, 29, 29, 0.4) 0%, rgba(31, 41, 55, 0.9) 100%);

    <script>
        // Web Audio API 恐怖音效合成器 (完全不用外部 MP3)
        class HorrorSoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.ambientOsc = null;
                this.ambientGain = null;
                this.isAmbientPlaying = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // 低頻陰森背景低鳴聲
            startAmbient() {
                if (!this.enabled || this.isAmbientPlaying) return;
                this.init();
                try {
                    this.ambientOsc = this.ctx.createOscillator();
                    const lfo = this.ctx.createOscillator();
                    this.ambientGain = this.ctx.createGain();
                    const lfoGain = this.ctx.createGain();

                    this.ambientOsc.type = 'sawtooth';
                    this.ambientOsc.frequency.setValueAtTime(55, this.ctx.currentTime); // 低音 A1

                    // LFO 顫音效果
                    lfo.frequency.setValueAtTime(0.2, this.ctx.currentTime);
                    lfoGain.gain.setValueAtTime(10, this.ctx.currentTime);

                    lfo.connect(this.ambientOsc.frequency);
                    
                    this.ambientGain.gain.setValueAtTime(0.03, this.ctx.currentTime);

                    this.ambientOsc.connect(this.ambientGain);
                    this.ambientGain.connect(this.ctx.destination);

                    this.ambientOsc.start();
                    lfo.start();
                    this.isAmbientPlaying = true;
                } catch(e) { console.log(e); }
            }

            stopAmbient() {
                if (this.ambientOsc && this.isAmbientPlaying) {
                    try {
                        this.ambientGain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 1);
                        setTimeout(() => {
                            if (this.ambientOsc) this.ambientOsc.stop();
                            this.isAmbientPlaying = false;
                        }, 1000);
                    } catch(e){}
                }
            }

            // 心跳聲 (理智低或緊張時)
            playHeartbeat() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                
                // 兩聲心跳 "咚-咚"
                [0, 0.25].forEach(delay => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(80, now + delay);
                    osc.frequency.exponentialRampToValueAtTime(30, now + delay + 0.12);

                    gain.gain.setValueAtTime(0.3, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.12);
                });
            }

            // 驚嚇高頻音 (Jump Scare Sting)
            playScareSting() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'sawtooth';
                osc2.type = 'square';

                osc1.frequency.setValueAtTime(800, now);
                osc1.frequency.exponentialRampToValueAtTime(120, now + 0.6);

                osc2.frequency.setValueAtTime(840, now); // 不和諧音階
                osc2.frequency.exponentialRampToValueAtTime(115, now + 0.6);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.6);
                osc2.stop(now + 0.6);
            }

            // 腳步聲 / 木地板吱呀聲
            playCreak() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(300, now + 0.15);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            // 八音盒清脆音樂 (提示或記憶片段)
            playMusicBoxTone() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                const note = notes[Math.floor(Math.random() * notes.length)];

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(note, now);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 1.2);
            }
        }

                choices: [
                    { text: '推開鐵門，進入前院', target: 'courtyard', costSanity: 0, timeAdd: 5 },

                ]
            },
            'mailbox': {
                location: '黑木古宅 - 舊信箱',
                tag: '微弱痕跡',
                text: '信箱已經鏽跡斑斑。你伸手摸索，裡面有一封發黃的信件與一支【微型手電筒】！信封上用鮮紅色的字跡寫著：「不要相信鐘聲...」',
                onEnter: () => addItem('微型手電筒', '照明設備，可在黑暗中看清隱蔽線索。', 'fa-flashlight'),
                choices: [
                    { text: '收好手電筒，推開鐵門進入前院', target: 'courtyard', costSanity: 0, timeAdd: 2 }
                ]
            },
            'courtyard': {
                location: '黑木古宅 - 前院',
                tag: '陰森死寂',
                text: '前院雜草叢生，中央有一座早已乾涸的噴泉，噴泉雕像是一尊失去頭部的天使。宅邸大門沉重而深黑，側邊似乎有一扇通往地下室的斜木門。突然，你似乎看到二樓窗戶後面有一道白色的影子一閃而過！',
                onEnter: () => audioEngine.playCreak(),

                    { text: '直接推開正門進入大廳', target: 'hall', costSanity: 5, timeAdd: 5 },

        function initCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.5 + 0.1,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: -Math.random() * 0.4 - 0.1

        function drawCanvas() {
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製陰森迷霧粒子
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.y < 0) p.y = canvas.height;
                if (p.x < 0 || p.x > canvas.width) p.x = Math.random() * canvas.width;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(180, 180, 200, ${p.alpha})`;
                ctx.fill();
            });

            // 根據理智值繪製幻影雜訊
            if (gameState.sanity < 40) {
                ctx.fillStyle = `rgba(239, 68, 68, ${0.1 + (40 - gameState.sanity) * 0.005})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            requestAnimationFrame(drawCanvas);

            if (typewriterTimeout) clearTimeout(typewriterTimeout);

            function type() {
                if (i < text.length) {
                    container.textContent += text.charAt(i);
                    i++;
                    if (i % 3 === 0) audioEngine.playCreak();
                    typewriterTimeout = setTimeout(type, speed);
                } else {
                    container.classList.remove('typewriter-cursor');
                    if (callback) callback();

    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
