window.__galleryStorage = (() => {
  try { const storage = window.localStorage; storage.getItem('__gallery_probe'); return storage; } catch {}
  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },
    removeItem: key => { values.delete(String(key)); }, clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; } };
})();
</script>

    <script>
        class Game2048 {
            constructor() {
                this.grid = Array(4).fill(null).map(() => Array(4).fill(0));
                this.score = 0;
                this.bestScore = parseInt(window.__galleryStorage.getItem('bestScore_light_mario')) || 0;
                this.won = false;
                this.keepPlaying = false;
                this.over = false;

                this.history = [];

                this.tileContainer = document.getElementById('tile-container');
                this.scoreElement = document.getElementById('score');
                this.bestScoreElement = document.getElementById('best-score');
                this.undoCountElement = document.getElementById('undo-count');
                this.undoBtn = document.getElementById('undo-btn');
                this.winOverlay = document.getElementById('win-overlay');
                this.gameOverOverlay = document.getElementById('game-over-overlay');

                this.bestScoreElement.textContent = this.bestScore;
                this.initListeners();
                this.restart();
            }

            saveState() {
                const currentState = {
                    grid: JSON.parse(JSON.stringify(this.grid)),
                    score: this.score,
                    won: this.won,
                    over: this.over
                };
                this.history.push(currentState);
                if (this.history.length > 2) {
                    this.history.shift();
                }
                this.updateUndoButton();
            }

            updateUndoButton() {
                const count = this.history.length;
                this.undoCountElement.textContent = count;
                this.undoBtn.disabled = count === 0;
            }

            undo() {
                if (this.history.length === 0) return;
                const prevState = this.history.pop();
                this.grid = prevState.grid;
                this.score = prevState.score;
                this.won = prevState.won;
                this.over = prevState.over;

                this.winOverlay.classList.add('hidden');
                this.gameOverOverlay.classList.add('hidden');
                this.updateView();
                this.updateUndoButton();
            }

            restart() {
                this.history = [];
                this.grid = Array(4).fill(null).map(() => Array(4).fill(0));
                this.score = 0;
                this.won = false;
                this.keepPlaying = false;
                this.over = false;
                this.winOverlay.classList.add('hidden');
                this.gameOverOverlay.classList.add('hidden');

                this.addRandomTile();
                this.addRandomTile();
                this.updateView();
                this.updateUndoButton();
            }

            addRandomTile() {
                const emptyCells = [];
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.grid[r][c] === 0) {
                            emptyCells.push({ r, c });
                        }
                    }
                }
                if (emptyCells.length > 0) {
                    const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
                }
            }

            updateView() {
                this.scoreElement.textContent = this.score;
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    window.__galleryStorage.setItem('bestScore_light_mario', this.bestScore);
                    this.bestScoreElement.textContent = this.bestScore;
                }

                this.tileContainer.innerHTML = '';

                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const value = this.grid[r][c];
                        if (value > 0) {
                            const tile = document.createElement('div');
                            tile.className = `flex items-center justify-center font-black rounded-xl shadow-md transition-all duration-100 tile-${value <= 2048 ? value : 'super'}`;
                            tile.style.gridColumnStart = c + 1;
                            tile.style.gridRowStart = r + 1;
                            tile.textContent = value;
                            this.tileContainer.appendChild(tile);
                        }
                    }
                }
            }

            slide(row) {
                let arr = row.filter(val => val !== 0);
                let addedScore = 0;

                for (let i = 0; i < arr.length - 1; i++) {
                    if (arr[i] === arr[i + 1]) {
                        arr[i] *= 2;
                        addedScore += arr[i];
                        arr[i + 1] = 0;
                        if (arr[i] === 2048 && !this.won && !this.keepPlaying) {
                            this.won = true;
                            this.winOverlay.classList.remove('hidden');
                        }
                    }
                }

                arr = arr.filter(val => val !== 0);
                while (arr.length < 4) {
                    arr.push(0);
                }

                return { row: arr, addedScore };
            }

            move(direction) {
                if (this.over) return;
                let moved = false;
                let newGrid = JSON.parse(JSON.stringify(this.grid));
                let totalAddedScore = 0;

                if (direction === 'left') {
                    for (let r = 0; r < 4; r++) {
                        const res = this.slide(newGrid[r]);
                        newGrid[r] = res.row;
                        totalAddedScore += res.addedScore;
                        if (JSON.stringify(this.grid[r]) !== JSON.stringify(newGrid[r])) moved = true;
                    }
                } else if (direction === 'right') {
                    for (let r = 0; r < 4; r++) {
                        const reversed = [...newGrid[r]].reverse();
                        const res = this.slide(reversed);
                        const originalRow = res.row.reverse();
                        totalAddedScore += res.addedScore;
                        if (JSON.stringify(this.grid[r]) !== JSON.stringify(originalRow)) moved = true;
                        newGrid[r] = originalRow;
                    }
                } else if (direction === 'up') {
                    for (let c = 0; c < 4; c++) {
                        let col = [this.grid[0][c], this.grid[1][c], this.grid[2][c], this.grid[3][c]];
                        const res = this.slide(col);
                        totalAddedScore += res.addedScore;
                        for (let r = 0; r < 4; r++) {
                            if (newGrid[r][c] !== res.row[r]) moved = true;
                            newGrid[r][c] = res.row[r];
                        }
                    }
                } else if (direction === 'down') {
                    for (let c = 0; c < 4; c++) {
                        let col = [this.grid[0][c], this.grid[1][c], this.grid[2][c], this.grid[3][c]].reverse();
                        const res = this.slide(col);
                        const originalCol = res.row.reverse();
                        totalAddedScore += res.addedScore;
                        for (let r = 0; r < 4; r++) {
                            if (newGrid[r][c] !== originalCol[r]) moved = true;
                            newGrid[r][c] = originalCol[r];
                        }
                    }
                }

                if (moved) {
                    this.saveState();
                    this.grid = newGrid;
                    this.score += totalAddedScore;
                    this.addRandomTile();
                    this.updateView();

                    if (this.isGameOver()) {
                        this.over = true;
                        this.gameOverOverlay.classList.remove('hidden');
                    }
                }
            }

            isGameOver() {
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.grid[r][c] === 0) return false;
                    }
                }
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const val = this.grid[r][c];
                        if (c < 3 && val === this.grid[r][c + 1]) return false;
                        if (r < 3 && val === this.grid[r + 1][c]) return false;
                    }
                }
                return true;
            }

            initListeners() {
                window.addEventListener('keydown', (e) => {
                    if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); this.move('up'); }
                    else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); this.move('down'); }
                    else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); this.move('left'); }
                    else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); this.move('right'); }
                });

                let touchStartX = 0;
                let touchStartY = 0;
                const board = document.querySelector('.relative.bg-indigo-950\\/10');

                board.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                board.addEventListener('touchend', (e) => {
                    if (!touchStartX || !touchStartY) return;
                    let touchEndX = e.changedTouches[0].clientX;
                    let touchEndY = e.changedTouches[0].clientY;

                    let xDiff = touchEndX - touchStartX;
                    let yDiff = touchEndY - touchStartY;

                    if (Math.abs(xDiff) > Math.abs(yDiff)) {
                        if (xDiff > 30) this.move('right');
                        else if (xDiff < -30) this.move('left');
                    } else {
                        if (yDiff > 30) this.move('down');
                        else if (yDiff < -30) this.move('up');
                    }

                    touchStartX = 0;
                    touchStartY = 0;
                }, { passive: true });

                document.getElementById('undo-btn').addEventListener('click', () => this.undo());
                document.getElementById('restart-btn').addEventListener('click', () => this.restart());
                document.getElementById('win-restart-btn').addEventListener('click', () => this.restart());
                document.getElementById('game-over-restart-btn').addEventListener('click', () => this.restart());
                document.getElementById('keep-playing-btn').addEventListener('click', () => {
                    this.keepPlaying = true;
                    this.winOverlay.classList.add('hidden');
                });
            }
        }

        window.onload = () => {
            window.game = new Game2048();
        };
    </script>
<script>
addEventListener('message', async event => {
  if (event.source !== parent || event.data?.type !== 'gallery-measure') return;
  await document.fonts.ready;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const root = document.scrollingElement || document.documentElement;
  const bodyStyle = getComputedStyle(document.body);
  const bodyPadding = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const flowHeight = Math.max(0, ...[...document.body.children].filter(element => ['static', 'relative'].includes(getComputedStyle(element).position)).map(element => element.getBoundingClientRect().height + bodyPadding));
  let overflow = 0;
  for (const element of [...document.querySelectorAll('body *')].slice(0, 3000)) {
    const rect = element.getBoundingClientRect();
    if (rect.height < 200 || rect.width < 150) continue;
    const style = getComputedStyle(element);
    if (!['absolute', 'fixed'].includes(style.position) && style.overflowY !== 'hidden') continue;
    const childHeight = Math.max(0, ...[...element.children].map(child => child.getBoundingClientRect().height));
    overflow = Math.max(overflow, element.scrollHeight - element.clientHeight, childHeight + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) - element.clientHeight);
  }
  parent.postMessage({ type: 'gallery-size', request: event.data.request, height: Math.max(root.scrollHeight, document.body.scrollHeight, innerHeight, flowHeight) + Math.max(0, overflow) }, '*');
});
