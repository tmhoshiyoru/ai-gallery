  const values = new Map();
  return { getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => { values.set(String(key), String(value)); },

    <script>
        // ==========================================
        // Web Audio API Retro Sound Effects
        // ==========================================
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playJump() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.12);
                    
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch(e) {}
            }

            playScore() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(750, now);
                    osc.frequency.setValueAtTime(1000, now + 0.08);

                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.16);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(now + 0.16);
                } catch(e) {}
            }

            playHit() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.25);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch(e) {}
            }

            playThunder() {
                if (this.muted || !this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * 0.4;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 300;

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    noise.start();
                } catch(e) {}
            }
        }

        const soundFX = new SoundFX();

        // Canvas Setup
        const canvas = document.getElementById('dinoCanvas');
        const ctx = canvas.getContext('2d');

        // Virtual internal dimensions
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 200;
        const GROUND_Y = 165;

        // Game State Variables
        let isRunning = false;
        let isGameOver = false;
        let score = 0;
        let highScore = parseInt(window.__galleryStorage.getItem('dino_high_score') || '0', 10);
        let speed = 6.0;
        const INITIAL_SPEED = 6.0;
        const MAX_SPEED = 14.0;
        let frameCount = 0;
        let dayNightSetting = '400'; // Default cycle interval
        let weatherSetting = 'auto'; // Weather setting
        let currentWeather = 'clear'; // Active weather

        // Dino Skin Palette Definitions
        const DINO_SKINS = {
            emerald: { body: '#22c55e', belly: '#86efac', eye: '#0f172a', cheek: '#f43f5e', accent: '#15803d' },
            cyan:    { body: '#06b6d4', belly: '#a5f3fc', eye: '#0f172a', cheek: '#f43f5e', accent: '#0891b2' },
            coral:   { body: '#f43f5e', belly: '#fbcfe8', eye: '#0f172a', cheek: '#fb7185', accent: '#be123c' },
            amber:   { body: '#f59e0b', belly: '#fef08a', eye: '#0f172a', cheek: '#f97316', accent: '#b45309' },
            purple:  { body: '#a855f7', belly: '#e9d5ff', eye: '#0f172a', cheek: '#f43f5e', accent: '#7e22ce' },
            classic: { body: null, belly: null, eye: null, cheek: null, accent: null } // Uses ambient night/day color
        };
        let currentSkin = 'emerald';

        // UI DOM Elements
        const overlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const overlayIcon = document.getElementById('overlay-icon');
        const btnStart = document.getElementById('btn-start');
        const btnSound = document.getElementById('btn-sound');
        const selectDayNight = document.getElementById('select-daynight');
        const selectWeather = document.getElementById('select-weather');
        const selectSkin = document.getElementById('select-skin');

        // ==========================================
        // Dino Player Class
        // ==========================================
        class Dino {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = 50;
                this.width = 44;
                this.height = 48;
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.gravity = 0.75;
                this.jumpPower = -12.5;
                this.isJumping = false;
                this.isDucking = false;
                this.legFrame = 0;
                this.animTimer = 0;
            }

            jump() {
                if (!this.isJumping && !this.isDucking) {
                    this.vy = this.jumpPower;
                    this.isJumping = true;
                    soundFX.playJump();
                }
            }

            duck(ducking) {
                if (this.isJumping) return;
                this.isDucking = ducking;
                if (ducking) {
                    this.width = 54;
                    this.height = 30;
                    this.y = GROUND_Y - this.height;
                } else {
                    this.width = 44;
                    this.height = 48;
                    this.y = GROUND_Y - this.height;
                }
            }

            update() {
                if (this.isJumping) {
                    this.vy += this.gravity;
                    this.y += this.vy;

                    if (this.y >= GROUND_Y - this.height) {
                        this.y = GROUND_Y - this.height;
                        this.vy = 0;
                        this.isJumping = false;
                    }
                }

                this.animTimer++;
                if (this.animTimer % 6 === 0) {
                    this.legFrame = (this.legFrame + 1) % 2;
                }
            }

            draw(envDrawColor, envBgColor) {
                ctx.save();
                const skin = DINO_SKINS[currentSkin];
                const mainColor = skin.body || envDrawColor;
                const bellyColor = skin.belly || (mainColor === '#1e293b' ? '#334155' : '#cbd5e1');
                const eyeColor = skin.eye || envBgColor;
                const cheekColor = skin.cheek || '#f43f5e';
                const accentColor = skin.accent || mainColor;

                if (this.isDucking) {
                    // Ducking Dino
                    ctx.fillStyle = mainColor;
                    ctx.fillRect(this.x, this.y + 8, 42, 16); // Body
                    ctx.fillRect(this.x + 30, this.y, 22, 16); // Head lowered

                    // Belly accent
                    ctx.fillStyle = bellyColor;
                    ctx.fillRect(this.x + 8, this.y + 16, 22, 6);

                    // Snout
                    ctx.fillStyle = mainColor;
                    ctx.fillRect(this.x + 48, this.y + 8, 6, 6);

                    // Eye
                    ctx.fillStyle = eyeColor;
                    ctx.fillRect(this.x + 42, this.y + 3, 4, 4);

                    // Cheek blush
                    if (skin.cheek) {
                        ctx.fillStyle = cheekColor;
                        ctx.fillRect(this.x + 38, this.y + 9, 4, 3);
                    }

                    // Back Spikes
                    ctx.fillStyle = accentColor;
                    ctx.fillRect(this.x - 2, this.y + 10, 4, 4);

                    // Legs animation
                    ctx.fillStyle = mainColor;
                    if (this.legFrame === 0) {
                        ctx.fillRect(this.x + 12, this.y + 24, 6, 6);
                        ctx.fillRect(this.x + 28, this.y + 24, 6, 4);
                    } else {
                        ctx.fillRect(this.x + 12, this.y + 24, 6, 4);
                        ctx.fillRect(this.x + 28, this.y + 24, 6, 6);
                    }
                } else {
                    // Standing Dino
                    ctx.fillStyle = mainColor;
                    ctx.fillRect(this.x + 18, this.y, 24, 18); // Head
                    ctx.fillRect(this.x + 36, this.y + 8, 8, 10); // Snout

                    // Eye
                    ctx.fillStyle = eyeColor;
                    ctx.fillRect(this.x + 32, this.y + 4, 4, 4);

                    // Cheek blush
                    if (skin.cheek) {
                        ctx.fillStyle = cheekColor;
                        ctx.fillRect(this.x + 26, this.y + 10, 5, 3);
                    }

                    // Body
                    ctx.fillStyle = mainColor;
                    ctx.fillRect(this.x + 8, this.y + 16, 26, 20);

                    // Belly
                    ctx.fillStyle = bellyColor;
                    ctx.fillRect(this.x + 18, this.y + 20, 14, 12);

                    // Tail & Spikes
                    ctx.fillStyle = mainColor;
                    ctx.fillRect(this.x, this.y + 18, 10, 8);
                    ctx.fillRect(this.x - 4, this.y + 16, 6, 6);

                    ctx.fillStyle = accentColor;
                    ctx.fillRect(this.x + 6, this.y + 14, 4, 4);
                    ctx.fillRect(this.x + 10, this.y + 10, 4, 4);

                    // Tiny arm
                    ctx.fillStyle = mainColor;
                    ctx.fillRect(this.x + 30, this.y + 22, 6, 4);

                    // Legs
                    if (this.isJumping) {
                        ctx.fillRect(this.x + 12, this.y + 36, 6, 10);
                        ctx.fillRect(this.x + 24, this.y + 36, 6, 10);
                    } else {
                        if (this.legFrame === 0) {
                            ctx.fillRect(this.x + 12, this.y + 36, 6, 12);
                            ctx.fillRect(this.x + 24, this.y + 36, 6, 6);
                        } else {
                            ctx.fillRect(this.x + 12, this.y + 36, 6, 6);
                            ctx.fillRect(this.x + 24, this.y + 36, 6, 12);
                        }
                    }
                }
                ctx.restore();
            }
        }

        // ==========================================
        // Clouds & Obstacles Classes
        // ==========================================
        class Cloud {
            constructor() {
                this.x = GAME_WIDTH + 20;
                this.y = Math.random() * 80 + 20;
                this.speed = Math.random() * 0.8 + 0.5;
                this.width = Math.random() * 30 + 40;
                this.markedForDeletion = false;
            }

            update() {
                this.x -= this.speed;
                if (this.x < -this.width) this.markedForDeletion = true;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
                ctx.arc(this.x + 10, this.y - 5, 12, 0, Math.PI * 2);
                ctx.arc(this.x + 22, this.y, 10, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Obstacle {
            constructor() {
                this.x = GAME_WIDTH + 20;
                this.markedForDeletion = false;
                
                const canSpawnFlyer = score > 100;
                this.type = (canSpawnFlyer && Math.random() < 0.35) ? 'pterodactyl' : 'cactus';

                if (this.type === 'cactus') {
                    this.width = Math.random() < 0.5 ? 20 : 36;
                    this.height = Math.random() * 15 + 35;
                    this.y = GROUND_Y - this.height;
                } else {
                    this.width = 46;
                    this.height = 32;
                    const levels = [GROUND_Y - 32, GROUND_Y - 50, GROUND_Y - 70];
                    this.y = levels[Math.floor(Math.random() * levels.length)];
                    this.wingFrame = 0;
                    this.animTimer = 0;
                }
            }

            update(currentSpeed) {
                this.x -= currentSpeed;
                if (this.x < -this.width - 20) this.markedForDeletion = true;

                if (this.type === 'pterodactyl') {
                    this.animTimer++;
                    if (this.animTimer % 10 === 0) {
                        this.wingFrame = (this.wingFrame + 1) % 2;
                    }
                }
            }

            draw(color, bgColor) {
                ctx.fillStyle = color;
                if (this.type === 'cactus') {
                    ctx.fillRect(this.x + (this.width / 2) - 4, this.y, 8, this.height);
                    if (this.width > 25) {
                        ctx.fillRect(this.x, this.y + 10, 6, 12);
                        ctx.fillRect(this.x, this.y + 10, 12, 4);
                        ctx.fillRect(this.x + this.width - 6, this.y + 16, 6, 12);
                        ctx.fillRect(this.x + this.width - 12, this.y + 16, 12, 4);
                    } else {
                        ctx.fillRect(this.x, this.y + 12, 6, 10);
                        ctx.fillRect(this.x, this.y + 12, 10, 4);
                    }
                } else {
                    // Pterodactyl Winged Dinosaur
                    ctx.fillRect(this.x, this.y + 12, 18, 8); // Beak
                    ctx.fillRect(this.x + 12, this.y + 8, 12, 12); // Head
                    ctx.fillRect(this.x + 22, this.y + 4, 8, 6); // Crest

                    ctx.fillStyle = bgColor;
                    ctx.fillRect(this.x + 14, this.y + 10, 3, 3);

                    ctx.fillStyle = color;
                    ctx.fillRect(this.x + 20, this.y + 14, 20, 10);
                    ctx.fillRect(this.x + 38, this.y + 16, 8, 4);

                    if (this.wingFrame === 0) {

                        ctx.moveTo(this.x + 22, this.y + 14);
                        ctx.lineTo(this.x + 30, this.y - 8);
                        ctx.lineTo(this.x + 38, this.y + 14);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(this.x + 22, this.y + 16);
                        ctx.lineTo(this.x + 30, this.y + 32);
                        ctx.lineTo(this.x + 38, this.y + 16);

        }

        const dino = new Dino();
        let obstacles = [];
        let clouds = [];

        let rainParticles = [];

        let fogPatches = [];

        function initWeatherParticles() {
            rainParticles = [];
            snowParticles = [];
            sandParticles = [];
            fogPatches = [];
            lightningFlashTimer = 0;
            rainbowTimer = 0;

            for (let i = 0; i < 60; i++) {
                rainParticles.push({
                    x: Math.random() * (GAME_WIDTH + 100),
                    y: Math.random() * GAME_HEIGHT,
                    speedX: -2 - Math.random() * 2,
                    speedY: 10 + Math.random() * 6,
                    length: 10 + Math.random() * 8,

                });

            for (let i = 0; i < 35; i++) {
                snowParticles.push({
                    x: Math.random() * GAME_WIDTH,
                    y: Math.random() * GAME_HEIGHT,
                    speedY: 0.8 + Math.random() * 1.2,

            for (let i = 0; i < 40; i++) {
                sandParticles.push({
                    x: Math.random() * GAME_WIDTH,

                    speedX: 8 + Math.random() * 6,
                    size: 1 + Math.random() * 2
                });
            }

            for (let i = 0; i < 5; i++) {
                fogPatches.push({
                    x: Math.random() * GAME_WIDTH,
                    y: GROUND_Y - 20 - Math.random() * 40,

                    speed: 0.3 + Math.random() * 0.4
                });

        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 40; i++) {
                stars.push({
                    x: Math.random() * GAME_WIDTH,
                    y: Math.random() * (GAME_HEIGHT - 70),
                    size: Math.random() * 2 + 1,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        }

        function updateWeather() {
            // Determine active weather
            if (weatherSetting === 'auto') {
                const weatherCycle = [
                    { type: 'clear', span: 250 },
                    { type: 'rain', span: 180 },
                    { type: 'thunderstorm', span: 150 },
                    { type: 'clear', span: 200 },
                    { type: 'snow', span: 180 },
                    { type: 'fog', span: 150 },
                    { type: 'sandstorm', span: 180 }
                ];
                const totalSpan = weatherCycle.reduce((acc, curr) => acc + curr.span, 0);
                const currentPos = Math.floor(score) % totalSpan;
                
                let accumulated = 0;
                let found = 'clear';
                for (const w of weatherCycle) {
                    accumulated += w.span;
                    if (currentPos < accumulated) {
                        found = w.type;
                        break;
                    }
                }
                
                if (currentWeather === 'rain' && found === 'clear') {
                    rainbowTimer = 180; // Trigger rainbow when rain stops!
                }
                currentWeather = found;
            } else {
                currentWeather = weatherSetting;
            }

            if (rainbowTimer > 0) rainbowTimer--;

            // Update Rain / Lightning
            if (currentWeather === 'rain' || currentWeather === 'thunderstorm') {
                rainParticles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.y >= GROUND_Y) {
                        p.splash = 3;
                        p.y = Math.random() * -30;
                        p.x = Math.random() * (GAME_WIDTH + 100);
                    }
                });

                if (currentWeather === 'thunderstorm') {
                    if (lightningFlashTimer > 0) {
                        lightningFlashTimer--;
                    } else if (Math.random() < 0.008) {
                        lightningFlashTimer = Math.floor(Math.random() * 5) + 3;
                        soundFX.playThunder();
                    }
                }
            }

            // Update Snow
            if (currentWeather === 'snow') {
                snowParticles.forEach(p => {
                    p.swing += 0.03;
                    p.x += Math.sin(p.swing) * 0.8 - 0.5;
                    p.y += p.speedY;

                    if (p.y >= GROUND_Y + 5) {
                        p.y = -10;
                        p.x = Math.random() * GAME_WIDTH;
                    }
                });
            }

            // Update Sandstorm
            if (currentWeather === 'sandstorm') {
                sandParticles.forEach(p => {
                    p.x -= p.speedX;
                    p.y += Math.sin(frameCount * 0.1) * 0.3;

                    if (p.x < -20) {
                        p.x = GAME_WIDTH + Math.random() * 50;
                        p.y = Math.random() * (GAME_HEIGHT - 20);
                    }
                });
            }

            // Update Fog
            if (currentWeather === 'fog') {
                fogPatches.forEach(f => {
                    f.x -= f.speed;
                    if (f.x + f.width < -50) {
                        f.x = GAME_WIDTH + 50;
                    }
                });
            }
        }

        function drawWeatherVisuals(env) {
            // Thunderstorm Lightning Sky Flash Overlay
            if (currentWeather === 'thunderstorm' && lightningFlashTimer > 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            }

            // Draw Rainbow after rain
            if (rainbowTimer > 0) {
                const alpha = Math.min(1.0, rainbowTimer / 60) * 0.45;
                ctx.save();
                ctx.globalAlpha = alpha;
                const colors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8', '#818cf8'];
                for (let i = 0; i < colors.length; i++) {
                    ctx.beginPath();
                    ctx.strokeStyle = colors[i];
                    ctx.lineWidth = 3;
                    ctx.arc(GAME_WIDTH * 0.75, GROUND_Y + 20, 130 - (i * 3), Math.PI, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Draw Rain
            if (currentWeather === 'rain' || currentWeather === 'thunderstorm') {
                ctx.strokeStyle = currentWeather === 'thunderstorm' ? 'rgba(203, 213, 225, 0.7)' : 'rgba(186, 230, 253, 0.55)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                rainParticles.forEach(p => {
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + p.speedX * 0.8, p.y + p.length);
                });
                ctx.stroke();

                // Rain splashes on ground
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                rainParticles.forEach(p => {
                    if (p.splash > 0) {
                        ctx.fillRect(p.x - 2, GROUND_Y - 1, 4, 1);
                        p.splash--;
                    }
                });
            }

            // Draw Snow
            if (currentWeather === 'snow') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                snowParticles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Draw Sandstorm Particles & Ambient Tint
            if (currentWeather === 'sandstorm') {
                ctx.fillStyle = 'rgba(217, 119, 6, 0.18)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                ctx.fillStyle = 'rgba(251, 191, 36, 0.7)';
                sandParticles.forEach(p => {
                    ctx.fillRect(p.x, p.y, p.size * 2, p.size);
                });
            }

            // Draw Fog
            if (currentWeather === 'fog') {
                ctx.fillStyle = 'rgba(241, 245, 249, 0.22)';
                fogPatches.forEach(f => {
                    ctx.beginPath();
                    ctx.ellipse(f.x + f.width / 2, f.y, f.width / 2, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        // Ground Data
        let groundX = 0;
        const groundBumpData = Array.from({ length: 120 }, () => ({
            x: Math.random() * GAME_WIDTH * 2,
            size: Math.floor(Math.random() * 3) + 1
        }));

        function drawGround(color) {
            ctx.fillStyle = color;
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 2);

            groundBumpData.forEach(bump => {
                const drawX = (bump.x - groundX) % (GAME_WIDTH * 1.5);
                const finalX = drawX < 0 ? drawX + GAME_WIDTH * 1.5 : drawX;
                if (finalX < GAME_WIDTH) {
                    ctx.fillRect(finalX, GROUND_Y + 6 + (bump.size * 2), bump.size * 2, 2);
                }
            });
        }

        // Parallax Mountain Dunes
        let duneX = 0;
        function drawParallaxDunes(duneColor) {
            duneX += speed * 0.15;
            ctx.fillStyle = duneColor;
            ctx.globalAlpha = 0.25;

            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            for (let x = 0; x <= GAME_WIDTH; x += 20) {
                const wave1 = Math.sin((x + duneX) * 0.008) * 20;
                const wave2 = Math.cos((x + duneX * 0.5) * 0.015) * 10;
                ctx.lineTo(x, GROUND_Y - 25 + wave1 + wave2);
            }
            ctx.lineTo(GAME_WIDTH, GROUND_Y);
            ctx.closePath();
            ctx.fill();

            ctx.globalAlpha = 1.0;
        }

        // Collision Check
        function checkCollision(dinoObj, obs) {
            const dinoHitbox = {
                x: dinoObj.x + 6,
                y: dinoObj.y + 4,
                width: dinoObj.width - 12,
                height: dinoObj.height - 8
            };

            const obsHitbox = {
                x: obs.x + 4,
                y: obs.y + 4,
                width: obs.width - 8,
                height: obs.height - 6
            };

            return (
                dinoHitbox.x < obsHitbox.x + obsHitbox.width &&
                dinoHitbox.x + dinoHitbox.width > obsHitbox.x &&
                dinoHitbox.y < obsHitbox.y + obsHitbox.height &&
                dinoHitbox.y + dinoHitbox.height > obsHitbox.y
            );
        }

        // ==========================================
        // Dynamic Sky Color Cycle Interpolation Engine
        // ==========================================
        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const num = parseInt(hex, 16);
            return [num >> 16, (num >> 8) & 255, num & 255];
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, '0')).join('');
        }

        function lerpColor(color1, color2, factor) {
            const rgb1 = hexToRgb(color1);
            const rgb2 = hexToRgb(color2);
            const r = rgb1[0] + factor * (rgb2[0] - rgb1[0]);
            const g = rgb1[1] + factor * (rgb2[1] - rgb1[1]);
            const b = rgb1[2] + factor * (rgb2[2] - rgb1[2]);
            return rgbToHex(r, g, b);
        }

        function getEnvironmentState(progress) {
            let p = progress % 1.0;
            if (p < 0) p += 1.0;

            let topSky, bottomSky, drawColor, celestialType, celestialX, celestialY, celestialColor, starOpacity, duneColor;

            if (p < 0.20) {
                // Sunrise Transition (日出)
                const t = p / 0.20;
                topSky = lerpColor('#0f172a', '#4c1d95', t);
                bottomSky = lerpColor('#1e1b4b', '#f97316', t);
                drawColor = lerpColor('#e2e8f0', '#1e293b', t);
                duneColor = lerpColor('#312e81', '#c2410c', t);
                celestialType = 'sun';
                celestialX = 80 + t * 140;
                celestialY = 140 - t * 80;
                celestialColor = '#fde047';
                starOpacity = Math.max(0, 1 - t * 1.5);
            } else if (p < 0.55) {
                // Daytime (藍天白雲)
                const t = (p - 0.20) / 0.35;
                topSky = lerpColor('#0284c7', '#38bdf8', Math.sin(t * Math.PI));
                bottomSky = lerpColor('#bae6fd', '#e0f2fe', Math.sin(t * Math.PI));
                drawColor = '#1e293b';
                duneColor = '#0284c7';
                celestialType = 'sun';
                celestialX = 220 + t * 360;
                celestialY = 60 - Math.sin(t * Math.PI) * 25;
                celestialColor = '#facc15';
                starOpacity = 0;
            } else if (p < 0.75) {
                // Sunset Transition (夕陽/黃昏)
                const t = (p - 0.55) / 0.20;
                topSky = lerpColor('#0284c7', '#581c87', t);
                bottomSky = lerpColor('#fdba74', '#ea580c', t);
                drawColor = lerpColor('#1e293b', '#f8fafc', t * 0.7);
                duneColor = lerpColor('#ea580c', '#431407', t);
                celestialType = 'sun';
                celestialX = 580 + t * 140;
                celestialY = 60 + t * 80;
                celestialColor = lerpColor('#facc15', '#f43f5e', t);
                starOpacity = Math.max(0, (t - 0.5) * 2);
            } else {
                // Nighttime (滿天星空與月亮)
                const t = (p - 0.75) / 0.25;
                topSky = lerpColor('#020617', '#0f172a', Math.sin(t * Math.PI));
                bottomSky = lerpColor('#0f172a', '#1e293b', Math.sin(t * Math.PI));
                drawColor = '#f8fafc';
                duneColor = '#0f172a';
                celestialType = 'moon';
                celestialX = 100 + t * 600;
                celestialY = 60 - Math.sin(t * Math.PI) * 20;
                celestialColor = '#f1f5f9';
                starOpacity = 1;
            }

            // Weather Sky Adjustments (Storm / Sandstorm Atmosphere)
            if (currentWeather === 'thunderstorm') {
                topSky = lerpColor(topSky, '#1e293b', 0.7);
                bottomSky = lerpColor(bottomSky, '#334155', 0.7);
                drawColor = '#f8fafc';
            } else if (currentWeather === 'sandstorm') {
                topSky = lerpColor(topSky, '#78350f', 0.5);
                bottomSky = lerpColor(bottomSky, '#d97706', 0.5);
                drawColor = '#fef3c7';
            }

            return {
                topSky, bottomSky, drawColor, duneColor,
                celestialType, celestialX, celestialY, celestialColor,
                starOpacity
            };
        }

        function startGame() {
            soundFX.init();
            resetGame();
            isRunning = true;
            isGameOver = false;
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        function resetGame() {
            score = 0;
            speed = INITIAL_SPEED;
            frameCount = 0;
            obstacles = [];
            clouds = [];
            dino.reset();
            initStars();
            initWeatherParticles();
        }

        function triggerGameOver() {
            soundFX.playHit();
            isRunning = false;
            isGameOver = true;

            const currentScore = Math.floor(score);
            if (currentScore > highScore) {
                highScore = currentScore;
                window.__galleryStorage.setItem('dino_high_score', highScore);
            }

            overlayTitle.textContent = 'GAME OVER';
            overlaySubtitle.textContent = `得分: ${currentScore} 分 | 歷史最高: ${highScore} 分`;
            overlayIcon.textContent = '💥';
            btnStart.textContent = '重新開始 (Space)';
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        // ==========================================
        // Game Engine Loop & Updates
        // ==========================================
        function update() {
            if (!isRunning || isGameOver) return;

            frameCount++;
            score += 0.15;

            if (speed < MAX_SPEED) {
                speed += 0.0015;
            }

            // Update Weather Engine
            updateWeather();

            // Milestone Audio Beep
            if (Math.floor(score) > 0 && Math.floor(score) % 100 === 0 && Math.floor(score - 0.15) % 100 !== 0) {
                soundFX.playScore();
            }

            groundX += speed;
            dino.update();

            // Clouds
            if (frameCount % 100 === 0 && Math.random() < 0.6) {
                clouds.push(new Cloud());
            }
            clouds.forEach(c => c.update());
            clouds = clouds.filter(c => !c.markedForDeletion);

            // Obstacles Spawner
            const minGap = 220 + speed * 12;
            const lastObs = obstacles[obstacles.length - 1];
            if (!lastObs || (GAME_WIDTH - lastObs.x >= minGap && Math.random() < 0.04)) {
                obstacles.push(new Obstacle());
            }

            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                obs.update(speed);

                if (checkCollision(dino, obs)) {
                    triggerGameOver();
                    break;
                }
            }
            obstacles = obstacles.filter(o => !o.markedForDeletion);
        }

        function draw() {
            // Determine progress in cycle (0.0 to 1.0)
            let cycleProgress = 0;

            if (dayNightSetting === 'fixed_sunrise') cycleProgress = 0.10;
            else if (dayNightSetting === 'fixed_day') cycleProgress = 0.35;
            else if (dayNightSetting === 'fixed_sunset') cycleProgress = 0.65;
            else if (dayNightSetting === 'fixed_night') cycleProgress = 0.85;
            else {
                const interval = parseInt(dayNightSetting, 10) || 400;
                cycleProgress = (score % interval) / interval;
            }

            // Get dynamically interpolated sky environment values
            const env = getEnvironmentState(cycleProgress);

            // Draw Dynamic Sky Gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            skyGradient.addColorStop(0, env.topSky);
            skyGradient.addColorStop(1, env.bottomSky);
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Draw Celestial Body (Sun / Moon)
            if (env.celestialType === 'sun' && currentWeather !== 'thunderstorm') {
                // Sun Glow
                const sunGlow = ctx.createRadialGradient(env.celestialX, env.celestialY, 5, env.celestialX, env.celestialY, 35);
                sunGlow.addColorStop(0, env.celestialColor);
                sunGlow.addColorStop(1, 'transparent');
                ctx.fillStyle = sunGlow;
                ctx.beginPath();
                ctx.arc(env.celestialX, env.celestialY, 35, 0, Math.PI * 2);
                ctx.fill();

                // Sun Core
                ctx.fillStyle = env.celestialColor;
                ctx.beginPath();
                ctx.arc(env.celestialX, env.celestialY, 14, 0, Math.PI * 2);
                ctx.fill();
            } else if (env.celestialType === 'moon' && currentWeather !== 'thunderstorm') {
                // Crescent Moon
                ctx.fillStyle = env.celestialColor;
                ctx.beginPath();
                ctx.arc(env.celestialX, env.celestialY, 12, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = env.topSky;
                ctx.beginPath();
                ctx.arc(env.celestialX - 4, env.celestialY - 3, 10, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Night Twinkling Stars
            if (env.starOpacity > 0 && currentWeather !== 'thunderstorm') {
                stars.forEach(s => {
                    s.twinkle += 0.05;
                    const alpha = env.starOpacity * (0.4 + Math.sin(s.twinkle) * 0.4);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });
            }

            // Draw Distant Parallax Dunes
            drawParallaxDunes(env.duneColor);

            // Draw Soft Clouds
            clouds.forEach(c => c.draw());

            // Render Weather Visuals (Rain, Snow, Thunderstorms, Sandstorm, Rainbow)
            drawWeatherVisuals(env);

            // Draw Ground Lines
            drawGround(env.drawColor);

            // Draw Obstacles
            obstacles.forEach(o => o.draw(env.drawColor, env.bottomSky));

            // Draw Dino
            dino.draw(env.drawColor, env.bottomSky);

            // Draw Pixel Score Display
            ctx.fillStyle = env.drawColor;
            ctx.font = '12px "Press Start 2P", monospace';
            ctx.textAlign = 'right';

            const formattedScore = String(Math.floor(score)).padStart(5, '0');
            const formattedHigh = String(highScore).padStart(5, '0');
            
            ctx.fillText(`HI ${formattedHigh}  ${formattedScore}`, GAME_WIDTH - 20, 30);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!isRunning || isGameOver) {
                    startGame();
                } else {
                    dino.jump();
                }
            }

            if (e.code === 'ArrowDown') {
                e.preventDefault();
                if (isRunning && !isGameOver) {
                    dino.duck(true);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                dino.duck(false);
            }
        });

        // Mobile Touch Listeners
        const btnTouchJump = document.getElementById('btn-touch-jump');
        const btnTouchDuck = document.getElementById('btn-touch-duck');

        btnTouchJump.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isRunning || isGameOver) startGame();
            else dino.jump();
        });

        btnTouchJump.addEventListener('click', () => {
            if (!isRunning || isGameOver) startGame();
            else dino.jump();
        });

        btnTouchDuck.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isRunning && !isGameOver) dino.duck(true);
        });

        btnTouchDuck.addEventListener('touchend', (e) => {
            e.preventDefault();
            dino.duck(false);
        });

        btnTouchDuck.addEventListener('mousedown', () => {
            if (isRunning && !isGameOver) dino.duck(true);
        });

        btnTouchDuck.addEventListener('mouseup', () => {
            dino.duck(false);
        });

        btnStart.addEventListener('click', startGame);

        btnSound.addEventListener('click', () => {
            soundFX.init();
            soundFX.muted = !soundFX.muted;
            btnSound.textContent = soundFX.muted ? '🔇' : '🔊';
        });

        selectDayNight.addEventListener('change', (e) => {
            dayNightSetting = e.target.value;
            if (!isRunning) draw();
        });

        selectWeather.addEventListener('change', (e) => {
            weatherSetting = e.target.value;
            if (!isRunning) {
                updateWeather();
                draw();
            }
        });

        selectSkin.addEventListener('change', (e) => {
            currentSkin = e.target.value;
            if (!isRunning) draw();
        });

        // Initialize Game
        initStars();
        initWeatherParticles();
        gameLoop();
