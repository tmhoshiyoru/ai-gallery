<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for Sound Effects -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
            touch-action: manipulation;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.4);
        }
        ::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 4px;
        }

        /* Heart particle effects */
        .heart-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.8) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-110px) scale(1.4) rotate(25deg);
            }
        }

        /* Glassmorphism containers */
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.7);
        }

        /* Character Avatar Bounce & Animation */
        .character-avatar-wrap {
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .character-avatar-wrap:hover {
            transform: scale(1.04);
        }

        .avatar-svg {
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.15));
        }

        /* Speech bubble animation */
        .speech-bubble {
            position: absolute;
            bottom: 85%;
            left: 50%;
            transform: translateX(-50%);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        /* Glow effects */
        .btn-glow {
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.4);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(244, 114, 182, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>

    <script>
        // Audio Synthesizer Toggle
        let soundEnabled = true;
        let synth = null;

        function playToneSound(type) {
            if (!soundEnabled) return;
            try {
                if (!synth) {
                    synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    synth.volume.value = -12;
                }
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }

                if (type === 'click') {
                    synth.triggerAttackRelease("C5", "8n");
                } else if (type === 'correct') {
                    synth.triggerAttackRelease(["E5", "G5", "C6"], "8n");
                } else if (type === 'wrong') {
                    synth.triggerAttackRelease(["A3", "F3"], "8n");
                } else if (type === 'confess') {
                    synth.triggerAttackRelease(["C4", "E4", "G4", "B4", "C5"], "4n");
                }
            } catch (e) {
                console.log("Audio note:", e);
            }
        }

            icon.className = soundEnabled ? 'fa-solid fa-volume-high text-sm md:text-base' : 'fa-solid fa-volume-xmark text-sm md:text-base';

                        { q: '歐洲歷史上的「文藝復興」運動最早發源於哪一個國家？', options: ['義大利', '英國', '西班牙', '希臘'], answer: 0, hint: '佛羅倫斯是其興起重鎮。' },
                        { q: '台灣歷史上的「日治時期」始於哪一年簽訂的《馬關條約》？', options: ['1895年', '1911年', '1945年', '1860年'], answer: 0, hint: '甲午戰爭後簽訂。' },
                        { q: '美國《獨立宣言》簽署發表於哪一年？', options: ['1776年', '1789年', '1861年', '1812年'], answer: 0, hint: '美國國慶日 7月4日 的由來。' },
                        { q: '絲綢之路的開闢，始於漢朝哪一位使者出使西域？', options: ['張騫', '班超', '鄭和', '玄奘'], answer: 0, hint: '「鑿空」西域第一人。' },
                        { q: '法國大革命爆發的標誌性事件是攻占哪座建築？', options: ['巴士底監獄', '凡爾賽宮', '盧浮宮', '巴黎聖母院'], answer: 0, hint: '1789年7月14日爆發。' }
                    ],
                    level3: [
                        { q: '漢武帝時期採納了哪位學者的建議，「罷黜百家，獨尊儒術」？', options: ['董仲舒', '司馬遷', '張騫', '主父堰'], answer: 0, hint: '確立儒家為正統思想的關鍵人物。' },
                        { q: '第一次世界大戰的導火線是哪一個歷史事件？', options: ['塞拉耶佛事件', '凡爾賽條約', '珍珠港事件', '波士頓傾茶事件'], answer: 0, hint: '奧匈帝國皇儲斐迪南大公遇刺。' },
                        { q: '麥哲倫船隊在歷史上的偉大創舉是？', options: ['首次完成環球航行', '發現美洲新大陸', '開闢印度的香料航線', '發現南極洲'], answer: 0, hint: '證實了地球是圓的。' },
                        { q: '古希臘時期，以實行民主政治著稱的城邦是？', options: ['雅典', '斯巴達', '特洛伊', '馬其頓'], answer: 0, hint: '西方民主制度的發源地。' },
                        { q: '北宋時期著名政治家司馬光主編的編年體通史巨著是？', options: ['《資治通鑑》', '《史記》', '《漢書》', '《尚書》'], answer: 0, hint: '鑑於往事，有資於治道。' }
                    ]
                }
            }
        ];

        let state = {
            selectedChar: null,
            affinity: {
                chinese: 0,
                math: 0,
                english: 0,
                physics: 0,
                history: 0
            },
            currentQuestion: null,
            usedQuestionKeys: new Set(),
            isAnsweringLocked: false // Prevents double-clicking options
        };

        function loadProgress() {
            try {
                const saved = localStorage.getItem('study_love_affinity_v3');
                if (saved) {
                    state.affinity = JSON.parse(saved);
                }
            } catch (e) {
                console.log("Storage load note:", e);
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('study_love_affinity_v3', JSON.stringify(state.affinity));
            } catch (e) {
                console.log("Storage save note:", e);
            }
        }

        function renderCharacterSelection() {
            const grid = document.getElementById('characterGrid');
            grid.innerHTML = '';

            CHARACTERS.forEach(char => {
                const aff = state.affinity[char.id] || 0;
                const card = document.createElement('div');
                card.className = `bg-white/90 rounded-3xl p-3 shadow-md border-2 border-pink-100 hover:border-pink-400 flex flex-col items-center justify-between cursor-pointer transition duration-300 transform hover:-translate-y-1`;
                
                card.onclick = () => selectCharacter(char.id);

                card.innerHTML = `
                    <div class="w-full flex justify-between items-center mb-1">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full text-white ${char.badgeBg}">${char.subject}</span>
                        <span class="text-xs text-pink-500 font-bold"><i class="fa-solid fa-heart mr-0.5"></i>${aff}</span>
                    </div>
                    <div class="w-20 h-20 my-1 flex items-center justify-center">
                        ${generatePersonaSvg(char.id, aff >= 100 ? 'blush' : 'normal')}
                    </div>
                    <div class="text-center mb-2">
                        <div class="font-black text-gray-800 text-xs md:text-sm">${char.name}</div>
                        <div class="text-[10px] text-gray-500 line-clamp-1">${char.title}</div>
                    </div>
                    <button class="w-full bg-pink-100 hover:bg-pink-500 hover:text-white text-pink-600 text-xs font-bold py-1 rounded-xl transition duration-200">
                        開啟對話
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function selectCharacter(charId) {
            playToneSound('click');
            const char = CHARACTERS.find(c => c.id === charId);
            if (!char) return;

            state.selectedChar = char;
            state.isAnsweringLocked = false;

            // Update Header & Avatar
            document.getElementById('charSubjectBadge').innerText = char.subject;
            document.getElementById('charSubjectBadge').className = `text-[11px] px-2.5 py-0.5 rounded-full font-bold text-white ${char.badgeBg}`;
            document.getElementById('charName').innerText = char.name;
            document.getElementById('charTitle').innerText = `「${char.title}」`;
            document.getElementById('dialogueText').innerText = char.dialogue.start;

            updateAvatarExpression('normal');
            updateAffinityDisplay();

            // Hide speech bubble on entry
            hideSpeechBubble();

            // Switch View
            document.getElementById('selectView').classList.add('hidden');
            document.getElementById('dateView').classList.remove('hidden');

            loadNextQuestion();
        }

        function updateAvatarExpression(emotion) {
            if (!state.selectedChar) return;
            const svgBox = document.getElementById('svgAvatarBox');
            svgBox.innerHTML = generatePersonaSvg(state.selectedChar.id, emotion);
        }

        function backToSelect() {
            playToneSound('click');
            hideSpeechBubble();
            document.getElementById('dateView').classList.add('hidden');
            document.getElementById('selectView').classList.remove('hidden');
            renderCharacterSelection();
        }

        function updateAffinityDisplay() {
            if (!state.selectedChar) return;
            const score = state.affinity[state.selectedChar.id] || 0;
            document.getElementById('affinityScore').innerText = score;

            // Update difficulty indicator badge based on affinity score
            const diffBadge = document.getElementById('difficultyBadge');
            const diffLabel = document.getElementById('diffLabel');

            if (score < 35) {
                diffLabel.innerText = "Level 1 基礎知識";
                diffBadge.className = "bg-emerald-100 border border-emerald-300 text-emerald-800 text-[11px] font-bold px-3 py-1 rounded-2xl shadow flex items-center gap-1";
            } else if (score < 70) {
                diffLabel.innerText = "Level 2 進階挑戰";
                diffBadge.className = "bg-amber-100 border border-amber-300 text-amber-800 text-[11px] font-bold px-3 py-1 rounded-2xl shadow flex items-center gap-1";
            } else {
                diffLabel.innerText = "Level 3 學霸高難考題";
                diffBadge.className = "bg-rose-100 border border-rose-300 text-rose-800 text-[11px] font-bold px-3 py-1 rounded-2xl shadow flex items-center gap-1";
            }
        }

        function loadNextQuestion() {
            state.isAnsweringLocked = false;
            hideSpeechBubble();

            const char = state.selectedChar;
            const score = state.affinity[char.id] || 0;

            let levelKey = 'level1';
            if (score >= 70) levelKey = 'level3';
            else if (score >= 35) levelKey = 'level2';

            const pool = char.questions[levelKey];
            
            // Pick a question that hasn't been shown recently if possible
            let availableQs = pool.filter(q => !state.usedQuestionKeys.has(q.q));
            if (availableQs.length === 0) {
                // Reset cache for this level if all were answered
                pool.forEach(q => state.usedQuestionKeys.delete(q.q));
                availableQs = pool;
            }

            const chosenQ = availableQs[Math.floor(Math.random() * availableQs.length)];
            state.usedQuestionKeys.add(chosenQ.q);
            state.currentQuestion = chosenQ;

            renderQuestionUI(chosenQ);
        }

        function renderQuestionUI(qObj) {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            // Display question in the visual novel dialogue box
            document.getElementById('dialogueText').innerHTML = `
                <div>
                    <span class="font-bold text-pink-600 text-[11px] block mb-0.5">【學霸隨堂問】</span>
                    <span>${qObj.q}</span>
                </div>
            `;

            qObj.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left bg-white hover:bg-pink-50 border border-pink-200 hover:border-pink-400 p-2.5 rounded-2xl text-xs text-gray-700 font-bold transition duration-200 flex items-center justify-between shadow-sm`;
                
                btn.innerHTML = `
                    <span>${optText}</span>
                    <i class="fa-solid fa-circle-chevron-right text-xs text-pink-300"></i>
                `;

                btn.onclick = () => handleAnswer(idx, qObj.answer, qObj.hint, btn);
                container.appendChild(btn);
            });
        }

        function showSpeechBubble(text) {
            const bubble = document.getElementById('characterOverlayBubble');
            const bubbleText = document.getElementById('characterOverlayText');
            bubbleText.innerText = text;
            bubble.classList.remove('hidden');
        }

        function hideSpeechBubble() {
            const bubble = document.getElementById('characterOverlayBubble');
            bubble.classList.add('hidden');
        }

        function handleAnswer(selectedIndex, correctIndex, hint, clickedBtn) {
            // Lock options immediately to prevent multi-clicking
            if (state.isAnsweringLocked) return;
            state.isAnsweringLocked = true;

            const char = state.selectedChar;
            const isCorrect = selectedIndex === correctIndex;

            // Disable all option buttons visually and functionally
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.add('cursor-not-allowed', 'opacity-60');
                if (idx === correctIndex) {
                    btn.classList.remove('opacity-60', 'bg-white', 'border-pink-200');
                    btn.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-800');
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.remove('opacity-60', 'bg-white', 'border-pink-200');
                    btn.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-800');
                }
            });

            if (isCorrect) {
                playToneSound('correct');
                // Increase affinity
                const currentScore = state.affinity[char.id] || 0;
                let addPoints = 15;
                if (currentScore >= 70) addPoints = 10; // Level 3 challenge
                
                state.affinity[char.id] = Math.min(100, currentScore + addPoints);
                saveProgress();
                updateAffinityDisplay();

                // Emotion Reaction
                updateAvatarExpression('happy');
                spawnHeartEffect();

                // Random overlay quote from character
                const quotes = char.overlayQuotes.correct;
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                showSpeechBubble(randomQuote);

                document.getElementById('dialogueText').innerText = char.dialogue.correct;

                // Check confession trigger
                if (state.affinity[char.id] >= 100) {
                    updateAvatarExpression('blush');
                    setTimeout(() => {
                        triggerConfession(char);
                    }, 1400);
                    return;
                }

            } else {
                playToneSound('wrong');
                updateAvatarExpression('puzzled');

                // Random overlay wrong quote from character
                const quotes = char.overlayQuotes.wrong;
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                showSpeechBubble(randomQuote);

                document.getElementById('dialogueText').innerText = `${char.dialogue.wrong}（提示：${hint}）`;
            }

            // Next Question Transition
            setTimeout(() => {
                updateAvatarExpression('normal');
                loadNextQuestion();
            }, 2600);
        }

        function interactCharacter() {
            if (state.isAnsweringLocked) return;
            playToneSound('click');
            spawnHeartEffect();
            if (state.selectedChar) {
                updateAvatarExpression('blush');
                showSpeechBubble('💕 💕 💕');
                document.getElementById('dialogueText').innerText = state.selectedChar.dialogue.click;
                setTimeout(() => {
                    updateAvatarExpression('normal');
                    hideSpeechBubble();
                }, 2000);
            }
        }

        function spawnHeartEffect() {
            const svgBox = document.getElementById('svgAvatarBox');
            const rect = svgBox.getBoundingClientRect();

            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle text-pink-500 text-xl md:text-2xl';
                heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
                
                const offsetX = (Math.random() - 0.5) * 100;
                const offsetY = (Math.random() - 0.5) * 50;
                
                heart.style.left = `${rect.left + rect.width / 2 + offsetX}px`;
                heart.style.top = `${rect.top + offsetY}px`;

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 2500);
            }
        }

        function triggerConfession(char) {
            playToneSound('confess');
            document.getElementById('confessionCharName').innerText = `${char.name} (${char.subject})`;
            document.getElementById('confessionText').innerText = char.confession;
            document.getElementById('endingModal').classList.remove('hidden');
        }

        function closeEndingModal() {
            playToneSound('click');
            document.getElementById('endingModal').classList.add('hidden');
            backToSelect();
        }

        function openGallery() {
            playToneSound('click');
            const galleryList = document.getElementById('galleryList');
            galleryList.innerHTML = '';

            CHARACTERS.forEach(char => {
                const aff = state.affinity[char.id] || 0;
                const isUnlocked = aff >= 100;

                const item = document.createElement('div');
                item.className = `p-3 rounded-2xl border flex items-center justify-between ${isUnlocked ? 'bg-pink-50 border-pink-300' : 'bg-gray-50 border-gray-200'}`;

                item.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <div class="w-12 h-12 flex-shrink-0">
                            ${generatePersonaSvg(char.id, isUnlocked ? 'blush' : 'normal')}
                        </div>
                        <div>
                            <div class="font-bold text-gray-800 text-xs md:text-sm">${char.name} <span class="text-[10px] font-normal text-gray-500">(${char.subject})</span></div>
                            <div class="text-[11px] text-pink-600 font-semibold mt-0.5">
                                ${isUnlocked ? '❤️ 已解鎖告白誓言' : `好感度：${aff} / 100`}
                            </div>
                        </div>
                    </div>
                    ${isUnlocked ? `
                        <button onclick='viewConfessionDirect("${char.id}")' class="bg-pink-500 text-white text-[11px] px-3 py-1 rounded-xl font-bold shadow hover:bg-pink-600 transition">
                            告白回顧
                        </button>
                    ` : `
                        <span class="text-[10px] text-gray-400 italic">未解鎖</span>
                    `}
                `;
                galleryList.appendChild(item);
            });

            document.getElementById('galleryModal').classList.remove('hidden');
        }

        function viewConfessionDirect(charId) {
            closeGallery();
            const char = CHARACTERS.find(c => c.id === charId);
            if (char) {
                triggerConfession(char);
            }
        }

        function closeGallery() {
            playToneSound('click');
            document.getElementById('galleryModal').classList.add('hidden');
        }

        window.onload = function() {
            loadProgress();
            renderCharacterSelection();
        };
    </script>
</body>
</html>
