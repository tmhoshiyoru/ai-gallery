<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 太空巡航駕駛：星穹極速 (3D Space Cruiser FX)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tone.js for Audio Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            background-color: #030014;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .glow-cyan {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.5);
        }
        .glow-red {
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.8), 0 0 20px rgba(255, 0, 85, 0.5);
        }
        .glass-hud {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .btn-action {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:active {
            transform: scale(0.92);
        }
        /* Red Warning Vignette Flash on Damage/Boss */
        #warning-flash {
            pointer-events: none;
            transition: opacity 0.2s ease-out;
            background: radial-gradient(circle, transparent 60%, rgba(239, 68, 68, 0.5) 100%);
        }
    </style>
</head>
<body class="text-white relative overflow-hidden">

    <!-- 3D Three.js WebGL Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Danger Vignette Overlay -->
    <div id="warning-flash" class="absolute inset-0 z-10 opacity-0"></div>

    <!-- HUD Top Header -->
    <div id="hud-top" class="absolute top-4 left-4 right-4 flex justify-between items-start pointer-events-none z-20">
        <!-- Score & Multiplier -->
        <div class="glass-hud p-4 rounded-2xl flex flex-col gap-1 min-w-[160px]">
            <div class="flex items-center justify-between text-xs text-cyan-400 font-bold tracking-wider">
                <span>SCORE 得分</span>
                <span id="multiplier-tag" class="text-amber-400 font-black bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/30">x1.0</span>
            </div>
            <div id="score-val" class="text-3xl font-black tracking-tight text-white glow-cyan">0</div>
            <div class="text-[11px] text-purple-300 flex items-center justify-between mt-0.5">
                <span>最高紀錄:</span>
                <span id="high-score-val" class="font-bold text-amber-300">0</span>
            </div>
        </div>

        <!-- Boss Health Bar (Appears during Boss Fight) -->
        <div id="boss-hud" class="glass-hud p-3.5 rounded-2xl flex-1 max-w-xs mx-4 flex flex-col gap-1.5 hidden border-rose-500/50 animate-pulse">
            <div class="flex justify-between items-center text-xs font-black text-rose-400">
                <span><i class="fa-solid fa-skull mr-1"></i> BOSS 巨型星際母艦</span>
                <span id="boss-hp-text">100%</span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-rose-500/40 p-0.5">
                <div id="boss-hp-bar" class="bg-gradient-to-r from-rose-600 via-red-500 to-amber-500 h-full rounded-full transition-all duration-150 w-full"></div>
            </div>
        </div>

        <!-- Ship Health, Boost & Laser Ammo -->
        <div class="glass-hud p-4 rounded-2xl flex flex-col gap-2.5 min-w-[210px]">
            <!-- Shield -->
            <div class="space-y-1">
                <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-cyan-400 flex items-center gap-1"><i class="fa-solid fa-shield-halved"></i> 飛船護盾</span>
                    <span id="shield-text" class="text-cyan-300 font-mono">100%</span>
                </div>
                <div class="w-full bg-slate-900/90 rounded-full h-2.5 overflow-hidden border border-cyan-500/30 p-0.5">
                    <div id="shield-bar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full rounded-full transition-all duration-200 w-full shadow-[0_0_8px_rgba(6,182,212,0.6)]"></div>
                </div>
            </div>

            <!-- Boost Capacity -->
            <div class="space-y-1">
                <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-amber-400 flex items-center gap-1"><i class="fa-solid fa-bolt"></i> 超光速加速 (Space)</span>
                    <span id="boost-text" class="text-amber-300 font-mono">READY</span>
                </div>
                <div class="w-full bg-slate-900/90 rounded-full h-2 overflow-hidden border border-amber-500/30 p-0.5">
                    <div id="boost-bar" class="bg-gradient-to-r from-amber-500 to-yellow-300 h-full rounded-full transition-all duration-100 w-full shadow-[0_0_8px_rgba(245,158,11,0.6)]"></div>
                </div>
            </div>

            <!-- Laser Energy -->
            <div class="flex justify-between items-center text-[11px] font-bold text-slate-300 pt-1 border-t border-slate-700/50">
                <span class="text-rose-400 flex items-center gap-1"><i class="fa-solid fa-crosshairs"></i> 雷射彈藥 (Shift/J)</span>
                <span id="ammo-text" class="font-mono text-rose-300">⚡ INF</span>
            </div>
        </div>
    </div>

    <!-- On-screen Action Buttons for Mobile/Tablet Controls -->
    <div id="mobile-controls" class="absolute bottom-6 left-6 right-6 flex justify-between items-end pointer-events-auto z-20 sm:hidden">
        <!-- Touch Virtual D-Pad / Move Pad Area -->
        <div id="touch-pad" class="w-28 h-28 glass-hud rounded-full flex items-center justify-center border-2 border-cyan-500/30 active:border-cyan-400 text-cyan-400">
            <i class="fa-solid fa-arrows-up-down-left-right text-2xl opacity-60"></i>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-3">
            <button id="btn-fire-mobile" class="btn-action w-16 h-16 rounded-2xl glass-hud border-2 border-rose-500/80 bg-rose-600/30 flex flex-col items-center justify-center text-rose-300 shadow-lg">
                <i class="fa-solid fa-crosshairs text-2xl"></i>
                <span class="text-[9px] font-bold mt-0.5">開火</span>
            </button>
            <button id="btn-boost-mobile" class="btn-action w-16 h-16 rounded-2xl glass-hud border-2 border-amber-500/80 bg-amber-600/30 flex flex-col items-center justify-center text-amber-300 shadow-lg">
                <i class="fa-solid fa-bolt text-2xl"></i>
                <span class="text-[9px] font-bold mt-0.5">加速</span>
            </button>
        </div>
    </div>

    <!-- Start / Main Menu Overlay -->
    <div id="start-screen" class="absolute inset-0 flex items-center justify-center bg-slate-950/85 backdrop-blur-xl z-30 p-4">
        <div class="glass-hud p-8 rounded-3xl max-w-lg w-full text-center border border-cyan-500/30 shadow-2xl space-y-6">
            <div class="inline-block p-4 rounded-2xl bg-gradient-to-tr from-cyan-500/20 to-indigo-500/20 text-cyan-400 border border-cyan-500/30 shadow-inner">
                <i class="fa-solid fa-rocket text-5xl animate-bounce"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-400 to-indigo-300">
                    3D 太空巡航：星穹極速
                </h1>
                <p class="text-slate-300 text-xs mt-2.5 leading-relaxed">
                    駕駛極速巡航飛船穿梭於銀河隧道！收集晶體補給、發射重型雷射擊碎隕石、擊退巨型星際母艦！
                </p>
            </div>

            <div class="bg-slate-900/90 p-4 rounded-2xl text-left text-xs space-y-2 border border-slate-800 text-slate-300">
                <div class="font-bold text-cyan-400 border-b border-slate-800 pb-1.5 flex items-center gap-2">
                    <i class="fa-solid fa-gamepad"></i> 駕駛控制說明：
                </div>
                <div class="flex items-center justify-between"><span class="text-slate-400">飛船移動控制</span><span class="px-2 py-0.5 bg-slate-800 rounded font-mono text-cyan-300">W A S D / 方向鍵</span></div>
                <div class="flex items-center justify-between"><span class="text-slate-400">發射主砲雷射</span><span class="px-2 py-0.5 bg-slate-800 rounded font-mono text-rose-300">Shift / J 鍵</span></div>
                <div class="flex items-center justify-between"><span class="text-slate-400">超光速推進加速</span><span class="px-2 py-0.5 bg-slate-800 rounded font-mono text-amber-300">Space 空白鍵</span></div>
            </div>

            <button id="start-btn" class="w-full py-4 rounded-2xl font-black text-base bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:brightness-110 text-white shadow-xl shadow-cyan-500/30 active:scale-95 transition pointer-events-auto">
                <i class="fa-solid fa-play mr-2"></i>啟動引擎・出擊
            </button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over-screen" class="absolute inset-0 flex items-center justify-center bg-slate-950/90 backdrop-blur-xl z-30 hidden p-4">
        <div class="glass-hud p-8 rounded-3xl max-w-md w-full text-center border border-rose-500/30 shadow-2xl space-y-6">
            <div class="inline-block p-4 rounded-2xl bg-rose-500/10 text-rose-400 border border-rose-500/30">
                <i class="fa-solid fa-burst text-5xl"></i>
            </div>
            <div>
                <h2 class="text-3xl font-black text-rose-400 tracking-wide">巡航任務失敗！</h2>
                <p class="text-slate-400 text-xs mt-1">飛船在星雲區遭受嚴重撞擊墜毀。</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
                    <div class="text-[11px] text-slate-400">本次巡航得分</div>
                    <div id="final-score" class="text-2xl font-black text-cyan-400 mt-0.5">0</div>
                </div>
                <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
                    <div class="text-[11px] text-slate-400">最高紀錄</div>
                    <div id="final-high-score" class="text-2xl font-black text-amber-400 mt-0.5">0</div>
                </div>
            </div>

            <button id="restart-btn" class="w-full py-4 rounded-2xl font-black text-base bg-gradient-to-r from-rose-600 to-red-600 hover:brightness-110 text-white shadow-xl shadow-rose-900/40 active:scale-95 transition pointer-events-auto">
                <i class="fa-solid fa-rotate-right mr-2"></i>重新部署出航
            </button>
        </div>
    </div>

    <script>
        // Three.js Core Game Objects
        let scene, camera, renderer;
        let playerShip, shipEngineGlow, shipShieldMesh;
        let obstacles = [];
        let crystals = [];
        let lasers = [];
        let enemyProjectiles = [];
        let starParticles, nebulaTunnel;
        let explosionParticles = [];

        // Boss Entity
        let bossMesh = null;
        let bossHp = 100, maxBossHp = 100;
        let isBossActive = false;
        let bossAttackTimer = 0;

        // Game State Variables
        let isGameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('space_cruiser_pro_highscore') || 0;
        let shield = 100;
        let boostCharge = 100;
        let isBoosting = false;
        let gameSpeed = 1.3;
        let distanceTraveled = 0;

        // Cooldowns
        let laserCooldown = 0;

        // Player Motion Controls
        const keys = { W: false, A: false, S: false, D: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false, Shift: false, j: false };
        let shipTargetPos = { x: 0, y: 0 };
        let shipCurrentPos = { x: 0, y: 0 };

        // Audio System via Tone.js
        let synth, noiseSynth, laserSynth, bossSynth;
        let soundInitialized = false;

        function initAudio() {
            try {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.set({ volume: -8, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } });

                noiseSynth = new Tone.NoiseSynth({ noise: { type: 'brown' }, envelope: { attack: 0.01, decay: 0.35, sustain: 0 } }).toDestination();
                noiseSynth.volume.value = -4;

                laserSynth = new Tone.Synth({ oscillator: { type: 'sawtooth' }, envelope: { attack: 0.001, decay: 0.08, sustain: 0 } }).toDestination();
                laserSynth.volume.value = -10;

                soundInitialized = true;
            } catch (e) {
                console.log('Audio init fallback');
            }
        }

        function playSound(type) {
            if (!soundInitialized) return;
            try {
                if (type === 'crystal') synth.triggerAttackRelease(["E5", "A5"], "16n");
                if (type === 'powerup') synth.triggerAttackRelease(["C5", "G5", "C6"], "12n");
                if (type === 'laser') laserSynth.triggerAttackRelease("A4", "32n");
                if (type === 'hit') noiseSynth.triggerAttack();
            } catch(e){}
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030014, 0.007);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 12);

            const canvas = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f3ff, 1.5);
            dirLight.position.set(5, 12, 8);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x38bdf8, 2, 60);
            pointLight.position.set(0, 0, -10);
            scene.add(pointLight);

            // Construct 3D World
            createPlayerShip();
            createSpaceTunnel();
            createStarfield();

            window.addEventListener('resize', onWindowResize);
            document.getElementById('high-score-val').innerText = highScore;
        }

        function createPlayerShip() {
            playerShip = new THREE.Group();

            // Cockpit Main Body
            const bodyGeo = new THREE.ConeGeometry(0.85, 3.4, 5);
            bodyGeo.rotateX(Math.PI / 2);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                metalness: 0.85,
                roughness: 0.15,
                flatShading: true
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            playerShip.add(body);

            // Glass Canopy
            const glassGeo = new THREE.SphereGeometry(0.48, 12, 12);
            glassGeo.scale(0.9, 0.6, 1.8);
            const glassMat = new THREE.MeshStandardMaterial({
                color: 0x00f3ff,
                emissive: 0x00aaff,
                emissiveIntensity: 0.6,
                metalness: 0.9,
                transparent: true,
                opacity: 0.85
            });
            const glass = new THREE.Mesh(glassGeo, glassMat);
            glass.position.set(0, 0.22, 0.2);
            playerShip.add(glass);

            // Wing Extrusions
            const wingShape = new THREE.Shape();
            wingShape.moveTo(0, 0);
            wingShape.lineTo(2.4, -1.3);
            wingShape.lineTo(2.1, -2.2);
            wingShape.lineTo(0, -1.4);
            wingShape.closePath();

            const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.1, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05 });
            wingGeo.rotateX(Math.PI / 2);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8, roughness: 0.2 });

            const leftWing = new THREE.Mesh(wingGeo, wingMat);
            leftWing.position.set(0, 0, 0.5);
            playerShip.add(leftWing);

            const rightWing = new THREE.Mesh(wingGeo, wingMat);
            rightWing.scale.set(-1, 1, 1);
            rightWing.position.set(0, 0, 0.5);
            playerShip.add(rightWing);

            // Engine Thrusters Glow
            const engineGeo = new THREE.CylinderGeometry(0.32, 0.1, 0.7, 12);
            engineGeo.rotateX(Math.PI / 2);
            const engineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            shipEngineGlow = new THREE.Mesh(engineGeo, engineMat);
            shipEngineGlow.position.set(0, 0, 1.7);
            playerShip.add(shipEngineGlow);

            // Shield Visual Energy Sphere (hidden by default)
            const shieldGeo = new THREE.SphereGeometry(2.2, 16, 16);
            const shieldMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0 });
            shipShieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
            playerShip.add(shipShieldMesh);

            scene.add(playerShip);
        }

        function createSpaceTunnel() {
            const tunnelGeo = new THREE.CylinderGeometry(22, 22, 350, 24, 70, true);
            tunnelGeo.rotateX(Math.PI / 2);

            const wireframeMat = new THREE.MeshBasicMaterial({
                color: 0x1e1b4b,
                wireframe: true,
                transparent: true,
                opacity: 0.35
            });

            nebulaTunnel = new THREE.Mesh(tunnelGeo, wireframeMat);
            nebulaTunnel.position.z = -120;
            scene.add(nebulaTunnel);
        }

        function createStarfield() {
            const count = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 140;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 140;
                positions[i * 3 + 2] = -Math.random() * 450;

                const c = new THREE.Color();
                const rand = Math.random();
                if (rand > 0.85) c.setHex(0xf43f5e);
                else if (rand > 0.5) c.setHex(0x38bdf8);
                else c.setHex(0xffffff);

                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({ size: 0.65, vertexColors: true, transparent: true, opacity: 0.85 });
            starParticles = new THREE.Points(geometry, material);
            scene.add(starParticles);
        }

        function spawnObstacle() {
            if (!isGameRunning) return;

            const isAsteroid = Math.random() > 0.3;
            let mesh;

            if (isAsteroid) {
                const radius = 1.2 + Math.random() * 1.6;
                const geo = new THREE.DodecahedronGeometry(radius, 1);

                const pos = geo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const v = new THREE.Vector3().fromBufferAttribute(pos, i);
                    v.addScalar((Math.random() - 0.5) * 0.45);
                    pos.setXYZ(i, v.x, v.y, v.z);
                }
                geo.computeVertexNormals();

                const mat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.85, flatShading: true });
                mesh = new THREE.Mesh(geo, mat);
                mesh.userData = { type: 'asteroid', hp: Math.floor(radius * 2), radius: radius * 0.85, rotSpeed: (Math.random() - 0.5) * 0.06 };
            } else {
                const geo = new THREE.BoxGeometry(5 + Math.random() * 3, 0.7, 0.7);
                const mat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0xe11d48, emissiveIntensity: 0.8 });
                mesh = new THREE.Mesh(geo, mat);
                mesh.userData = { type: 'barrier', hp: 3, radius: 1.6, rotSpeed: (Math.random() - 0.5) * 0.03 };
            }

            mesh.position.x = (Math.random() - 0.5) * 24;
            mesh.position.y = (Math.random() - 0.5) * 15;
            mesh.position.z = -280;

            scene.add(mesh);
            obstacles.push(mesh);
        }

        function spawnCrystalOrPowerup() {
            if (!isGameRunning) return;

            const rand = Math.random();
            let geo, mat, type;

            if (rand < 0.65) { // Score Crystal
                type = 'crystal';
                geo = new THREE.OctahedronGeometry(0.7, 0);
                mat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xeab308, emissiveIntensity: 0.7 });
            } else if (rand < 0.85) { // Shield Repair Powerup
                type = 'shield_repair';
                geo = new THREE.IcosahedronGeometry(0.8, 0);
                mat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.8 });
            } else { // Bomb Clear
                type = 'bomb';
                geo = new THREE.DodecahedronGeometry(0.8, 0);
                mat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0xe11d48, emissiveIntensity: 0.9 });
            }

            const item = new THREE.Mesh(geo, mat);
            item.position.x = (Math.random() - 0.5) * 22;
            item.position.y = (Math.random() - 0.5) * 14;
            item.position.z = -280;
            item.userData = { type, radius: 1.3 };

            scene.add(item);
            crystals.push(item);
        }

        function fireLaser() {
            if (!isGameRunning || laserCooldown > 0) return;

            laserCooldown = 0.12; // Firing rate limiter
            playSound('laser');

            const geo = new THREE.CylinderGeometry(0.12, 0.12, 3, 6);
            geo.rotateX(Math.PI / 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });

            // Dual Lasers from left & right wings
            [-1.4, 1.4].forEach(offsetX => {
                const laser = new THREE.Mesh(geo, mat);
                laser.position.set(playerShip.position.x + offsetX, playerShip.position.y, playerShip.position.z - 1.5);
                scene.add(laser);
                lasers.push(laser);
            });
        }

        function spawnBoss() {
            if (isBossActive) return;
            isBossActive = true;
            bossHp = 120;
            maxBossHp = 120;

            document.getElementById('boss-hud').classList.remove('hidden');

            const group = new THREE.Group();
            // Boss Main Frame
            const geo = new THREE.ConeGeometry(5, 12, 6);
            geo.rotateX(-Math.PI / 2);
            const mat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.2 });
            const body = new THREE.Mesh(geo, mat);
            group.add(body);

            // Boss Glowing Core
            const coreGeo = new THREE.SphereGeometry(2, 16, 16);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.z = -1;
            group.add(core);

            group.position.set(0, 0, -180);
            scene.add(group);
            bossMesh = group;

            flashDanger();
        }

        function updateBoss(delta) {
            if (!bossMesh || !isBossActive) return;

            // Move Boss into screen position
            if (bossMesh.position.z < -45) {
                bossMesh.position.z += delta * 30;
            } else {
                // Hover Movement Pattern
                bossMesh.position.x = Math.sin(performance.now() * 0.0015) * 8;
                bossMesh.position.y = Math.cos(performance.now() * 0.002) * 4;
            }

            // Boss Shooting Pattern
            bossAttackTimer += delta;
            if (bossAttackTimer > 1.8 && bossMesh.position.z >= -50) {
                bossAttackTimer = 0;
                // Fire Energy Orbs
                const pGeo = new THREE.SphereGeometry(0.8, 8, 8);
                const pMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
                const orb = new THREE.Mesh(pGeo, pMat);
                orb.position.copy(bossMesh.position);
                scene.add(orb);

                // Aim Vector towards Player
                const dir = new THREE.Vector3().subVectors(playerShip.position, bossMesh.position).normalize();
                orb.userData = { dir, speed: 45 };
                enemyProjectiles.push(orb);
            }
        }

        function createExplosion(pos, colorHex = 0xf43f5e, scale = 1) {
            const count = Math.floor(25 * scale);
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;

                velocities.push(new THREE.Vector3(
                    (Math.random() - 0.5) * 1.2 * scale,
                    (Math.random() - 0.5) * 1.2 * scale,
                    (Math.random() - 0.5) * 1.2 * scale
                ));
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ size: 0.5 * scale, color: colorHex, transparent: true, opacity: 1 });

            const pSystem = new THREE.Points(geo, mat);
            pSystem.userData = { velocities, life: 1.0 };
            scene.add(pSystem);
            explosionParticles.push(pSystem);
        }

        function updateExplosions(delta) {
            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                const pSystem = explosionParticles[i];
                const positions = pSystem.geometry.attributes.position.array;
                const vels = pSystem.userData.velocities;

                pSystem.userData.life -= delta * 2.2;

                for (let j = 0; j < vels.length; j++) {
                    positions[j * 3] += vels[j].x;
                    positions[j * 3 + 1] += vels[j].y;
                    positions[j * 3 + 2] += vels[j].z;
                }

                pSystem.geometry.attributes.position.needsUpdate = true;
                pSystem.material.opacity = Math.max(0, pSystem.userData.life);

                if (pSystem.userData.life <= 0) {
                    scene.remove(pSystem);
                    pSystem.geometry.dispose();
                    pSystem.material.dispose();
                    explosionParticles.splice(i, 1);
                }
            }
        }

        function flashDanger() {
            const el = document.getElementById('warning-flash');
            el.style.opacity = '1';
            setTimeout(() => el.style.opacity = '0', 300);
        }

        let lastTime = performance.now();
        let obstacleTimer = 0;
        let crystalTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            const currentTime = performance.now();
            const delta = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;

            if (isGameRunning) {
                laserCooldown = Math.max(0, laserCooldown - delta);
                updatePlayerControls(delta);
                updateGameEntities(delta);
                checkCollisions();
                updateUI();
            }

            if (nebulaTunnel) nebulaTunnel.rotation.z += 0.001;

            renderer.render(scene, camera);
        }

        function updatePlayerControls(delta) {
            if (keys.Space && boostCharge > 5) {
                isBoosting = true;
                boostCharge = Math.max(0, boostCharge - delta * 45);
            } else {
                isBoosting = false;
                boostCharge = Math.min(100, boostCharge + delta * 18);
            }

            if (keys.Shift || keys.j) {
                fireLaser();
            }

            const currentSpeed = gameSpeed * (isBoosting ? 2.3 : 1.0);
            distanceTraveled += currentSpeed * delta * 22;
            score = Math.floor(distanceTraveled);

            // Spawn Boss at 2500 score interval
            if (score > 2500 && !isBossActive && !bossMesh) {
                spawnBoss();
            }

            const moveSpeed = 22 * delta;
            let dx = 0, dy = 0;

            if (keys.A || keys.ArrowLeft) dx -= 1;
            if (keys.D || keys.ArrowRight) dx += 1;
            if (keys.W || keys.ArrowUp) dy += 1;
            if (keys.S || keys.ArrowDown) dy -= 1;

            shipTargetPos.x += dx * moveSpeed * 1.25;
            shipTargetPos.y += dy * moveSpeed * 1.25;

            shipTargetPos.x = THREE.MathUtils.clamp(shipTargetPos.x, -12.5, 12.5);
            shipTargetPos.y = THREE.MathUtils.clamp(shipTargetPos.y, -7.5, 7.5);

            shipCurrentPos.x += (shipTargetPos.x - shipCurrentPos.x) * 0.18;
            shipCurrentPos.y += (shipTargetPos.y - shipCurrentPos.y) * 0.18;

            playerShip.position.x = shipCurrentPos.x;
            playerShip.position.y = shipCurrentPos.y;

            // Bank Rotation FX
            playerShip.rotation.z = -(shipTargetPos.x - shipCurrentPos.x) * 0.28;
            playerShip.rotation.x = (shipTargetPos.y - shipCurrentPos.y) * 0.18;

            camera.position.x = shipCurrentPos.x * 0.32;
            camera.position.y = 3 + shipCurrentPos.y * 0.32;
            camera.lookAt(shipCurrentPos.x * 0.45, shipCurrentPos.y * 0.45, -20);

            if (shipEngineGlow) {
                const scale = isBoosting ? 2.2 + Math.random() * 0.4 : 1.0;
                shipEngineGlow.scale.set(scale, scale, scale * (isBoosting ? 2.2 : 1.0));
                shipEngineGlow.material.color.setHex(isBoosting ? 0xfacc15 : 0x00ffff);
            }
        }

        function updateGameEntities(delta) {
            const effectiveSpeed = gameSpeed * (isBoosting ? 2.3 : 1.0) * 65 * delta;
            gameSpeed += delta * 0.004;

            obstacleTimer += delta;
            crystalTimer += delta;

            if (obstacleTimer > Math.max(0.35, 1.1 - gameSpeed * 0.12)) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            if (crystalTimer > 0.75) {
                spawnCrystalOrPowerup();
                crystalTimer = 0;
            }

            if (nebulaTunnel) {
                nebulaTunnel.position.z += effectiveSpeed * 0.8;
                if (nebulaTunnel.position.z > 0) nebulaTunnel.position.z = -120;
            }

            if (starParticles) {
                const positions = starParticles.geometry.attributes.position.array;
                for (let i = 0; i < positions.length / 3; i++) {
                    positions[i * 3 + 2] += effectiveSpeed * 1.6;
                    if (positions[i * 3 + 2] > 10) positions[i * 3 + 2] = -400;
                }
                starParticles.geometry.attributes.position.needsUpdate = true;
            }

            // Move Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i];
                l.position.z -= delta * 180;
                if (l.position.z < -280) {
                    scene.remove(l);
                    lasers.splice(i, 1);
                }
            }

            // Move Boss Projectiles
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                const orb = enemyProjectiles[i];
                orb.position.addScaledVector(orb.userData.dir, orb.userData.speed * delta);
                if (orb.position.z > 15) {
                    scene.remove(orb);
                    enemyProjectiles.splice(i, 1);
                }
            }

            // Move Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += effectiveSpeed;
                obs.rotation.x += obs.userData.rotSpeed;
                obs.rotation.y += obs.userData.rotSpeed;

                if (obs.position.z > 15) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Move Crystals
            for (let i = crystals.length - 1; i >= 0; i--) {
                const cry = crystals[i];
                cry.position.z += effectiveSpeed;
                cry.rotation.y += 0.05;

                if (cry.position.z > 15) {
                    scene.remove(cry);
                    crystals.splice(i, 1);
                }
            }

            updateBoss(delta);
            updateExplosions(delta);
        }

        function checkCollisions() {
            const shipPos = playerShip.position;

            // 1. Lasers hitting Obstacles or Boss
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i];

                // Check Boss Hit
                if (isBossActive && bossMesh && l.position.distanceTo(bossMesh.position) < 6) {
                    bossHp -= 3;
                    createExplosion(l.position, 0x38bdf8, 0.8);
                    scene.remove(l);
                    lasers.splice(i, 1);

                    if (bossHp <= 0) {
                        createExplosion(bossMesh.position, 0xf43f5e, 3.5);
                        scene.remove(bossMesh);
                        bossMesh = null;
                        isBossActive = false;
                        document.getElementById('boss-hud').classList.add('hidden');
                        distanceTraveled += 1000;
                    }
                    continue;
                }

                // Check Obstacle Hit
                for (let j = obstacles.length - 1; j >= 0; j--) {
                    const obs = obstacles[j];
                    if (l.position.distanceTo(obs.position) < obs.userData.radius + 0.6) {
                        obs.userData.hp -= 1;
                        createExplosion(l.position, 0xfacc15, 0.6);

                        scene.remove(l);
                        lasers.splice(i, 1);

                        if (obs.userData.hp <= 0) {
                            createExplosion(obs.position, 0xf43f5e, 1.2);
                            scene.remove(obs);
                            obstacles.splice(j, 1);
                        }
                        break;
                    }
                }
            }

            // 2. Player Collision with Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                if (shipPos.distanceTo(obs.position) < obs.userData.radius + 0.85) {
                    createExplosion(obs.position, 0xf43f5e, 1.5);
                    playSound('hit');
                    flashDanger();

                    shield -= 25;
                    scene.remove(obs);
                    obstacles.splice(i, 1);

                    if (shield <= 0) gameOver();
                }
            }

            // 3. Player Collision with Boss Projectiles
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                const orb = enemyProjectiles[i];
                if (shipPos.distanceTo(orb.position) < 1.6) {
                    createExplosion(orb.position, 0xf43f5e, 1.2);
                    playSound('hit');
                    flashDanger();

                    shield -= 20;
                    scene.remove(orb);
                    enemyProjectiles.splice(i, 1);

                    if (shield <= 0) gameOver();
                }
            }

            // 4. Player Pickups
            for (let i = crystals.length - 1; i >= 0; i--) {
                const cry = crystals[i];
                if (shipPos.distanceTo(cry.position) < cry.userData.radius + 0.85) {
                    const type = cry.userData.type;

                    if (type === 'crystal') {
                        createExplosion(cry.position, 0xfacc15, 1.0);
                        playSound('crystal');
                        distanceTraveled += 180;
                    } else if (type === 'shield_repair') {
                        createExplosion(cry.position, 0x38bdf8, 1.2);
                        playSound('powerup');
                        shield = Math.min(100, shield + 25);
                    } else if (type === 'bomb') { // Clear Screen Bomb
                        createExplosion(cry.position, 0xf43f5e, 2.5);
                        playSound('hit');
                        obstacles.forEach(o => { createExplosion(o.position, 0xf43f5e); scene.remove(o); });
                        obstacles = [];
                    }

                    scene.remove(cry);
                    crystals.splice(i, 1);
                }
            }
        }

        function updateUI() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('shield-text').innerText = `${Math.max(0, Math.floor(shield))}%`;
            document.getElementById('shield-bar').style.width = `${Math.max(0, shield)}%`;

            document.getElementById('boost-bar').style.width = `${boostCharge}%`;
            document.getElementById('boost-text').innerText = isBoosting ? "SUPERCHARGE" : "READY";

            if (isBossActive) {
                document.getElementById('boss-hp-text').innerText = `${Math.max(0, Math.floor((bossHp / maxBossHp) * 100))}%`;
                document.getElementById('boss-hp-bar').style.width = `${Math.max(0, (bossHp / maxBossHp) * 100)}%`;
            }
        }

        function startGame() {
            score = 0;
            shield = 100;
            boostCharge = 100;
            gameSpeed = 1.3;
            distanceTraveled = 0;
            isBossActive = false;
            if (bossMesh) { scene.remove(bossMesh); bossMesh = null; }

            obstacles.forEach(o => scene.remove(o));
            crystals.forEach(c => scene.remove(c));
            lasers.forEach(l => scene.remove(l));
            enemyProjectiles.forEach(p => scene.remove(p));

            obstacles = [];
            crystals = [];
            lasers = [];
            enemyProjectiles = [];

            isGameRunning = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('boss-hud').classList.add('hidden');

            if (Tone && Tone.context.state !== 'running') Tone.start();
            initAudio();
        }

        function gameOver() {
            isGameRunning = false;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('space_cruiser_pro_highscore', highScore);
                document.getElementById('high-score-val').innerText = highScore;
            }

            document.getElementById('final-score').innerText = score;
            document.getElementById('final-high-score').innerText = highScore;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupControls() {
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.W = true;
                if (k === 's') keys.S = true;
                if (k === 'a') keys.A = true;
                if (k === 'd') keys.D = true;
                if (e.key === 'ArrowUp') keys.ArrowUp = true;
                if (e.key === 'ArrowDown') keys.ArrowDown = true;
                if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
                if (e.key === 'ArrowRight') keys.ArrowRight = true;
                if (e.code === 'Space') keys.Space = true;
                if (e.key === 'Shift' || k === 'j') keys.Shift = true;
            });

            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.W = false;
                if (k === 's') keys.S = false;
                if (k === 'a') keys.A = false;
                if (k === 'd') keys.D = false;
                if (e.key === 'ArrowUp') keys.ArrowUp = false;
                if (e.key === 'ArrowDown') keys.ArrowDown = false;
                if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
                if (e.key === 'ArrowRight') keys.ArrowRight = false;
                if (e.code === 'Space') keys.Space = false;
                if (e.key === 'Shift' || k === 'j') keys.Shift = false;
            });

            // Mobile Touch Pad Drag
            const touchPad = document.getElementById('touch-pad');
            let touchStartX = 0, touchStartY = 0;

            touchPad.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            }, { passive: true });

            touchPad.addEventListener('touchmove', (e) => {
                if (!isGameRunning || e.touches.length === 0) return;
                const dx = (e.touches[0].clientX - touchStartX) * 0.08;
                const dy = -(e.touches[0].clientY - touchStartY) * 0.08;

                shipTargetPos.x += dx;
                shipTargetPos.y += dy;

                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            // Mobile Action Buttons
            const btnFire = document.getElementById('btn-fire-mobile');
            const btnBoost = document.getElementById('btn-boost-mobile');

            btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); keys.Shift = true; });
            btnFire.addEventListener('touchend', (e) => { e.preventDefault(); keys.Shift = false; });

            btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); keys.Space = true; });
            btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); keys.Space = false; });

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', startGame);
        }

        window.onload = function() {
            initScene();
            setupControls();
            animate();
        };
    </script>
</body>
</html>
