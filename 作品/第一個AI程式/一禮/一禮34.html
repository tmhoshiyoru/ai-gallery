<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyberpunk Breakout - 賽博打磚塊</title>
    <style>
        :root {
            --bg-color: #0a0a12;
            --panel-bg: rgba(18, 18, 32, 0.75);
            --border-glow: rgba(0, 243, 255, 0.4);
            --primary-cyan: #00f3ff;
            --primary-pink: #ff0055;
            --primary-purple: #b026ff;
            --primary-gold: #ffd700;
            --text-color: #e0f6ff;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(176, 38, 255, 0.1) 0%, transparent 80%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-color);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px;
            max-width: 100vw;
        }

        /* 抬頭顯示器 (HUD) */
        .hud-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px 24px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15), inset 0 0 10px rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(8px);
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #8a99ad;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-cyan);
            text-shadow: 0 0 8px var(--primary-cyan);
        }

        .lives-container {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .heart {
            width: 16px;
            height: 16px;
            background-color: var(--primary-pink);
            transform: rotate(-45deg);
            display: inline-block;
            position: relative;
            box-shadow: 0 0 8px var(--primary-pink);
            transition: opacity 0.3s, transform 0.3s;
        }
        .heart::before, .heart::after {
            content: "";
            width: 16px;
            height: 16px;
            background-color: var(--primary-pink);
            border-radius: 50%;
            position: absolute;
        }
        .heart::before { top: -8px; left: 0; }
        .heart::after { left: 8px; top: 0; }
        .heart.lost {
            opacity: 0.2;
            transform: rotate(-45deg) scale(0.8);
            box-shadow: none;
        }

        /* 畫布容器 */
        .canvas-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-glow);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0, 0, 0, 0.8);
            background-color: rgba(5, 5, 10, 0.95);
        }

        canvas {
            display: block;
            cursor: none;
        }

        /* UI 蓋板 (Start, Pause, Game Over, Win) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple), var(--primary-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            text-align: center;
        }

        .subtitle {
            font-size: 1rem;
            color: #a0aec0;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            color: #000;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 14px 36px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* 提示資訊說明 */
        .controls-hint {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: #718096;
            margin-top: 4px;
        }

        .key {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        @media (max-width: 600px) {
            .hud-container {
                padding: 8px 12px;
            }
            .hud-value {
                font-size: 1.1rem;
            }
            .title {
                font-size: 2rem;
            }
            .controls-hint {
                font-size: 0.75rem;
                flex-direction: column;
                gap: 4px;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- 抬頭顯示器 -->
    <div class="hud-container">
        <div class="hud-item">
            <span class="hud-label">Score</span>
            <span class="hud-value" id="scoreDisplay">0000</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">High Score</span>
            <span class="hud-value" id="highScoreDisplay">0000</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">Lives</span>
            <div class="lives-container" id="livesDisplay">
                <div class="heart"></div>
                <div class="heart"></div>
                <div class="heart"></div>
            </div>
        </div>
    </div>

    <!-- 遊戲畫布與 UI 蓋板 -->
    <div class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas" width="800" height="550"></canvas>

        <!-- 開始畫面 -->
        <div class="overlay" id="startOverlay">
            <h1 class="title">CYBER BREAKOUT</h1>
            <p class="subtitle">打碎所有霓虹磚塊，擊垮防線！<br>使用方向鍵或滑鼠/觸控滑動控制底盤。</p>
            <button class="btn" id="startBtn">開始遊戲</button>
        </div>

        <!-- 暫停畫面 -->
        <div class="overlay hidden" id="pauseOverlay">
            <h1 class="title">PAUSED</h1>
            <p class="subtitle">遊戲已暫停</p>
            <button class="btn" id="resumeBtn">繼續遊戲</button>
        </div>

        <!-- 遊戲結束畫面 -->
        <div class="overlay hidden" id="gameOverOverlay">
            <h1 class="title" style="background: linear-gradient(135deg, #ff0055, #ff5e00); -webkit-background-clip: text;">SYSTEM FAILURE</h1>
            <p class="subtitle" id="gameOverSub">球體已墜落！最終得分：<span id="finalScore" style="color:var(--primary-cyan);">0</span></p>
            <button class="btn" id="restartBtn">重新開始</button>
        </div>

        <!-- 勝利畫面 -->
        <div class="overlay hidden" id="winOverlay">
            <h1 class="title" style="background: linear-gradient(135deg, #00f3ff, #00ff66); -webkit-background-clip: text;">STAGE CLEARED</h1>
            <p class="subtitle">太強了！你清空了所有防禦磚塊！<br>最終得分：<span id="winScore" style="color:var(--primary-gold);">0</span></p>
            <button class="btn" id="playAgainBtn">再次挑戰</button>
        </div>
    </div>

    <!-- 控制提示 -->
    <div class="controls-hint">
        <span>控制：<span class="key">←</span> <span class="key">→</span> 或 <span class="key">A</span> <span class="key">D</span> / 滑鼠拖曳</span>
        <span>暫停：<span class="key">P</span> 或 <span class="key">ESC</span></span>
    </div>
</div>

<script>
    // --- Web Audio API 音效合成器 ---
    class SoundEffects {
        constructor() {
            this.ctx = null;
        }

        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        playTone(freq, type, duration, startVol = 0.1, endVol = 0) {
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(Math.max(endVol, 0.0001), this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch (e) {
                console.error(e);
            }
        }

        paddleHit() {
            this.playTone(320, 'sine', 0.1, 0.2);
        }

        wallHit() {
            this.playTone(220, 'triangle', 0.08, 0.15);
        }

        brickHit(pitchMultiplier = 1) {
            this.playTone(440 * pitchMultiplier, 'square', 0.12, 0.15, 0.001);
        }

        loseLife() {
            if (!this.ctx) return;
            this.playTone(180, 'sawtooth', 0.3, 0.3);
            setTimeout(() => this.playTone(110, 'sawtooth', 0.4, 0.3), 150);
        }

        win() {
            if (!this.ctx) return;
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    this.playTone(freq, 'triangle', 0.25, 0.25);
                }, idx * 120);
            });
        }
    }

    // --- 主遊戲邏輯 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const sound = new SoundEffects();

    // DOM 元素
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    
    const startOverlay = document.getElementById('startOverlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const winOverlay = document.getElementById('winOverlay');

    const startBtn = document.getElementById('startBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const restartBtn = document.getElementById('restartBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const finalScore = document.getElementById('finalScore');
    const winScore = document.getElementById('winScore');

    // 遊戲參數變數
    let score = 0;
    let highScore = localStorage.getItem('cyber_breakout_highscore') || 0;
    let lives = 3;
    let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER, WIN
    let animationFrameId = null;

    // 畫面震動變數
    let shakeDuration = 0;
    let shakeMagnitude = 0;

    // 按鍵狀態
    const keys = {
        left: false,
        right: false
    };

    // 滑塊 (Paddle) 物件
    const paddle = {
        width: 120,
        height: 14,
        x: (canvas.width - 120) / 2,
        y: canvas.height - 35,
        speed: 8,
        dx: 0,
        color: '#00f3ff'
    };

    // 球體 (Ball) 物件
    const ball = {
        x: canvas.width / 2,
        y: canvas.height - 50,
        radius: 7,
        speed: 6,
        dx: 4,
        dy: -4,
        trail: [],
        maxTrail: 10
    };

    // 磚塊配置 (Bricks Config)
    const brickConfig = {
        rows: 5,
        cols: 8,
        padding: 12,
        offsetTop: 60,
        offsetLeft: 35,
        height: 22,
        colors: [
            { main: '#ff0055', glow: 'rgba(ff, 0, 85, 0.6)', pts: 50 },  // 紅/粉
            { main: '#ff00aa', glow: 'rgba(ff, 0, 170, 0.6)', pts: 40 }, // 紫紅
            { main: '#b026ff', glow: 'rgba(176, 38, 255, 0.6)', pts: 30 },// 亮紫
            { main: '#00f3ff', glow: 'rgba(0, 243, 255, 0.6)', pts: 20 }, // 綠青
            { main: '#00ff66', glow: 'rgba(0, 255, 102, 0.6)', pts: 10 }  // 螢光綠
        ]
    };

    let bricks = [];
    let particles = [];

    // 計算磚塊寬度以填滿畫布
    const brickWidth = Math.floor(
        (canvas.width - (brickConfig.offsetLeft * 2) - (brickConfig.padding * (brickConfig.cols - 1))) / brickConfig.cols
    );

    // 初始化磚塊矩陣
    function initBricks() {
        bricks = [];
        for (let r = 0; r < brickConfig.rows; r++) {
            bricks[r] = [];
            for (let c = 0; c < brickConfig.cols; c++) {
                const bx = brickConfig.offsetLeft + c * (brickWidth + brickConfig.padding);
                const by = brickConfig.offsetTop + r * (brickConfig.height + brickConfig.padding);
                bricks[r][c] = {
                    x: bx,
                    y: by,
                    status: 1,
                    colorInfo: brickConfig.colors[r % brickConfig.colors.length]
                };
            }
        }
    }

    // 觸發畫面震動效果
    function triggerShake(duration = 10, magnitude = 4) {
        shakeDuration = duration;
        shakeMagnitude = magnitude;
    }

    // 建立碰撞爆炸粒子特效
    function createExplosion(x, y, color) {
        const particleCount = 14;
        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 1;
            particles.push({
                x: x,
                y: y,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                radius: Math.random() * 3 + 1,
                color: color,
                alpha: 1,
                decay: Math.random() * 0.03 + 0.015
            });
        }
    }

    // 更新粒子狀態
    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.dx;
            p.y += p.dy;
            p.alpha -= p.decay;
            if (p.alpha <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    // 繪製粒子特效
    function drawParticles() {
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });
    }

    // 重置球體與滑塊至中央
    function resetBallAndPaddle() {
        paddle.x = (canvas.width - paddle.width) / 2;
        ball.x = canvas.width / 2;
        ball.y = paddle.y - ball.radius - 2;
        
        // 隨機初始彈射角度 (偏向上方)
        const angle = (Math.random() * Math.PI / 3) - (Math.PI / 6); // -30deg ~ +30deg
        const speed = 6.5;
        ball.dx = speed * Math.sin(angle);
        ball.dy = -speed * Math.cos(angle);
        ball.trail = [];
    }

    // 更新 HUD 顯示
    function updateHUD() {
        scoreDisplay.textContent = score.toString().padStart(4, '0');
        highScoreDisplay.textContent = highScore.toString().padStart(4, '0');
        
        // 更新生命值心型狀態
        const hearts = livesDisplay.querySelectorAll('.heart');
        hearts.forEach((heart, index) => {
            if (index < lives) {
                heart.classList.remove('lost');
            } else {
                heart.classList.add('lost');
            }
        });
    }

    // 繪製背景微弱網格
    function drawGrid() {
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.04)';
        ctx.lineWidth = 1;
        const step = 40;
        for (let x = 0; x < canvas.width; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += step) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
    }

    // 繪製磚塊
    function drawBricks() {
        for (let r = 0; r < brickConfig.rows; r++) {
            for (let c = 0; c < brickConfig.cols; c++) {
                const b = bricks[r][c];
                if (b.status === 1) {
                    ctx.save();
                    ctx.fillStyle = b.colorInfo.main;
                    ctx.shadowColor = b.colorInfo.glow;
                    ctx.shadowBlur = 10;
                    
                    // 圓角矩形磚塊
                    const radius = 4;
                    ctx.beginPath();
                    ctx.roundRect(b.x, b.y, brickWidth, brickConfig.height, radius);
                    ctx.fill();

                    // 磚塊內層高光細節
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.beginPath();
                    ctx.roundRect(b.x + 2, b.y + 2, brickWidth - 4, 3, 2);
                    ctx.fill();

                    ctx.restore();
                }
            }
        }
    }

    // 繪製滑塊
    function drawPaddle() {
        ctx.save();
        ctx.fillStyle = paddle.color;
        ctx.shadowColor = paddle.color;
        ctx.shadowBlur = 15;

        const radius = 7;
        ctx.beginPath();
        ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, radius);
        ctx.fill();

        // 滑塊中央核心高光線條
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(paddle.x + paddle.width / 2 - 15, paddle.y + 3, 30, 3);

        ctx.restore();
    }

    // 繪製球體與霓虹尾跡
    function drawBall() {
        // 繪製尾跡
        for (let i = 0; i < ball.trail.length; i++) {
            const pt = ball.trail[i];
            const ratio = i / ball.trail.length;
            ctx.save();
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, ball.radius * ratio, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 243, 255, ${ratio * 0.4})`;
            ctx.fill();
            ctx.restore();
        }

        // 繪製主球體
        ctx.save();
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.restore();
    }

    // 球體與磚塊碰撞檢測
    function collisionDetection() {
        let activeBricks = 0;

        for (let r = 0; r < brickConfig.rows; r++) {
            for (let c = 0; c < brickConfig.cols; c++) {
                const b = bricks[r][c];
                if (b.status === 1) {
                    activeBricks++;

                    // AABB 矩形與圓形接近碰撞檢查
                    if (
                        ball.x + ball.radius > b.x &&
                        ball.x - ball.radius < b.x + brickWidth &&
                        ball.y + ball.radius > b.y &&
                        ball.y - ball.radius < b.y + brickConfig.height
                    ) {
                        ball.dy = -ball.dy; // 反彈
                        b.status = 0; // 磚塊消失
                        score += b.colorInfo.pts;

                        // 更新最高分
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('cyber_breakout_highscore', highScore);
                        }

                        updateHUD();
                        sound.brickHit(1 + (brickConfig.rows - r) * 0.1);
                        createExplosion(ball.x, ball.y, b.colorInfo.main);
                        triggerShake(8, 3);

                        // 判斷是否通關 Victory
                        if (activeBricks - 1 === 0) {
                            gameWin();
                        }
                    }
                }
            }
        }
    }

    // 主更新邏輯
    function update() {
        if (gameState !== 'PLAYING') return;

        // 移動滑塊
        if (keys.left && paddle.x > 0) {
            paddle.x -= paddle.speed;
        }
        if (keys.right && paddle.x < canvas.width - paddle.width) {
            paddle.x += paddle.speed;
        }

        // 更新球體尾跡
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > ball.maxTrail) {
            ball.trail.shift();
        }

        // 移動球體
        ball.x += ball.dx;
        ball.y += ball.dy;

        // 碰撞左右牆壁
        if (ball.x + ball.radius > canvas.width) {
            ball.x = canvas.width - ball.radius;
            ball.dx = -ball.dx;
            sound.wallHit();
        } else if (ball.x - ball.radius < 0) {
            ball.x = ball.radius;
            ball.dx = -ball.dx;
            sound.wallHit();
        }

        // 碰撞天花板
        if (ball.y - ball.radius < 0) {
            ball.y = ball.radius;
            ball.dy = -ball.dy;
            sound.wallHit();
        } 
        // 碰撞底部邊界（扣血/Game Over）
        else if (ball.y + ball.radius > canvas.height) {
            lives--;
            updateHUD();
            sound.loseLife();
            triggerShake(18, 7);

            if (lives <= 0) {
                gameOver();
            } else {
                resetBallAndPaddle();
            }
        }

        // 碰撞滑塊 (Paddle)
        if (
            ball.y + ball.radius >= paddle.y &&
            ball.y - ball.radius <= paddle.y + paddle.height &&
            ball.x >= paddle.x &&
            ball.x <= paddle.x + paddle.width
        ) {
            // 根據撞擊滑塊的位置計算反射角度
            const hitPoint = ball.x - (paddle.x + paddle.width / 2);
            const normalizedHitPoint = hitPoint / (paddle.width / 2); // -1 到 1 之間的比例
            const maxAngle = Math.PI / 3; // 最大 60 度角度
            const angle = normalizedHitPoint * maxAngle;
            const speed = Math.hypot(ball.dx, ball.dy);

            ball.dx = speed * Math.sin(angle);
            ball.dy = -speed * Math.cos(angle);
            
            // 防止球體黏在滑塊內
            ball.y = paddle.y - ball.radius - 1;
            
            sound.paddleHit();
            createExplosion(ball.x, ball.y, '#00f3ff');
        }

        // 磚塊碰撞檢查
        collisionDetection();

        // 粒子更新
        updateParticles();
    }

    // 繪製遊戲畫面
    function render() {
        ctx.save();

        // 處理畫面震動效果
        if (shakeDuration > 0) {
            const offsetX = (Math.random() - 0.5) * shakeMagnitude;
            const offsetY = (Math.random() - 0.5) * shakeMagnitude;
            ctx.translate(offsetX, offsetY);
            shakeDuration--;
        }

        // 清空畫布
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 繪製遊戲元件
        drawGrid();
        drawBricks();
        drawPaddle();
        drawBall();
        drawParticles();

        ctx.restore();
    }

    // 主遊戲循環 Loop
    function gameLoop() {
        update();
        render();
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // 開始新遊戲
    function startGame() {
        sound.init();
        score = 0;
        lives = 3;
        updateHUD();
        initBricks();
        resetBallAndPaddle();
        
        gameState = 'PLAYING';
        hideOverlays();
    }

    // 遊戲結束
    function gameOver() {
        gameState = 'GAMEOVER';
        finalScore.textContent = score;
        gameOverOverlay.classList.remove('hidden');
    }

    // 通關勝利
    function gameWin() {
        gameState = 'WIN';
        winScore.textContent = score;
        sound.win();
        winOverlay.classList.remove('hidden');
    }

    // 切換暫停狀態
    function togglePause() {
        if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
            pauseOverlay.classList.remove('hidden');
        } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
            pauseOverlay.classList.add('hidden');
        }
    }

    // 隱藏所有 UI Overlay 蓋板
    function hideOverlays() {
        startOverlay.classList.add('hidden');
        pauseOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
        winOverlay.classList.add('hidden');
    }

    // --- 事件監聽器 (Controls & Inputs) ---

    // 鍵盤按下事件
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            keys.left = true;
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            keys.right = true;
        } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
            togglePause();
        }
    });

    // 鍵盤放開事件
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            keys.left = false;
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            keys.right = false;
        }
    });

    // 滑鼠移動控制滑塊
    canvas.addEventListener('mousemove', (e) => {
        if (gameState !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, mouseX - paddle.width / 2));
    });

    // 觸控拖曳控制滑塊 (Mobile Touch Support)
    canvas.addEventListener('touchmove', (e) => {
        if (gameState !== 'PLAYING') return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touchX = e.touches[0].clientX - rect.left;
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, touchX - paddle.width / 2));
    }, { passive: false });

    // 按鈕點擊綁定
    startBtn.addEventListener('click', startGame);
    resumeBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', startGame);
    playAgainBtn.addEventListener('click', startGame);

    // 初始化最高分數 display
    highScoreDisplay.textContent = highScore.toString().padStart(4, '0');

    // 啟動主渲染 loop
    window.onload = () => {
        initBricks();
        render(); // 繪製初始背景
        gameLoop();
    };
</script>
</body>
</html>
