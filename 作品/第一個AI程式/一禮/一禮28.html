<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚餐吃什麼？美味大抉擇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Plus Jakarta Sans', sans-serif;
            background: #f7f3ef;
            color: #3d2c23;
            min-height: 100vh;
        }

        /* 莫蘭迪奶茶粉暖色調配盤 */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(180, 140, 110, 0.18);
        }

        .wheel-container {
            position: relative;
            filter: drop-shadow(0 10px 20px rgba(120, 80, 50, 0.12));
        }

        @keyframes pointerPulse {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .pointer-anim {
            animation: pointerPulse 1.8s infinite ease-in-out;
        }

        /* 籤枝互動動畫 */
        .interactive-stick {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
            transform-origin: bottom center;
        }
        .interactive-stick:hover {
            transform: translateY(-16px) scale(1.06) !important;
            filter: drop-shadow(0 6px 12px rgba(100, 60, 30, 0.25));
            z-index: 30 !important;
        }
        .interactive-stick.selected-stick {
            transform: translateY(-50px) scale(1.1) !important;
            z-index: 40 !important;
        }

        /* 3D 翻牌動畫 */
        .perspective-1000 { perspective: 1000px; }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.875rem;
        }
        .flip-card-back { transform: rotateY(180deg); }

        @keyframes modalPop {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate {
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(160, 120, 90, 0.25); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(140, 90, 60, 0.4); }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-3 sm:p-5">

    <!-- 頂部頁頭 -->
    <header class="text-center max-w-2xl mx-auto mb-3">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-900/10 text-amber-950 text-xs font-semibold mb-1 shadow-xs">
            <i class="fa-solid fa-mug-hot text-amber-800"></i> 美味大抉擇
        </div>
        <h1 class="text-2xl sm:text-4xl font-black text-amber-950 tracking-tight">
            晚餐吃什麼？
        </h1>
    </header>

    <div class="max-w-3xl mx-auto w-full flex-1 flex flex-col gap-3">
        
        <!-- 1. 情境懶人包區塊 -->
        <section class="glass-card p-3 rounded-2xl shadow-xs">
            <div class="text-[11px] font-bold text-amber-950 mb-2 flex items-center justify-between">
                <span><i class="fa-solid fa-wand-magic-sparkles text-amber-800 mr-1"></i> 情境懶人包（一鍵切換）：</span>
                <span class="text-[10px] text-stone-500 font-normal">快速載入風格菜單</span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <button class="preset-btn active p-2 rounded-xl bg-white hover:bg-amber-50 border border-amber-900/20 shadow-2xs flex items-center gap-2 text-left transition-all" data-preset="taiwanese">
                    <span class="text-base shrink-0">🇹🇼</span>
                    <div class="overflow-hidden">
                        <div class="text-xs font-bold text-amber-950 truncate">經典台式</div>
                        <div class="text-[9px] text-stone-500 truncate">牛肉麵、便當、鹽酥雞</div>
                    </div>
                </button>
                <button class="preset-btn p-2 rounded-xl bg-white/70 hover:bg-amber-50 border border-stone-200/80 shadow-2xs flex items-center gap-2 text-left transition-all" data-preset="asian">
                    <span class="text-base shrink-0">🇯🇵</span>
                    <div class="overflow-hidden">
                        <div class="text-xs font-bold text-amber-950 truncate">日韓美味</div>
                        <div class="text-[9px] text-stone-500 truncate">拉麵、壽司、韓式炸雞</div>
                    </div>
                </button>
                <button class="preset-btn p-2 rounded-xl bg-white/70 hover:bg-amber-50 border border-stone-200/80 shadow-2xs flex items-center gap-2 text-left transition-all" data-preset="healthy">
                    <span class="text-base shrink-0">🥗</span>
                    <div class="overflow-hidden">
                        <div class="text-xs font-bold text-amber-950 truncate">健康輕食</div>
                        <div class="text-[9px] text-stone-500 truncate">沙拉、Poké 波奇碗</div>
                    </div>
                </button>
                <button class="preset-btn p-2 rounded-xl bg-white/70 hover:bg-amber-50 border border-stone-200/80 shadow-2xs flex items-center gap-2 text-left transition-all" data-preset="lateNight">
                    <span class="text-base shrink-0">🌙</span>
                    <div class="overflow-hidden">
                        <div class="text-xs font-bold text-amber-950 truncate">罪惡宵夜</div>
                        <div class="text-[9px] text-stone-500 truncate">串燒、麻辣燙、豆漿</div>
                    </div>
                </button>
            </div>
        </section>

        <!-- 2. 預算篩選列 -->
        <section class="glass-card p-3 rounded-2xl shadow-xs">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[11px] font-bold text-amber-950 flex items-center gap-1">
                    <i class="fa-solid fa-coins text-amber-800"></i> 選擇預算考量：
                </span>
                <span id="priceFilterLabel" class="text-[10px] font-extrabold text-amber-900 bg-amber-100/80 px-2 py-0.5 rounded border border-amber-900/10">
                    全不限
                </span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                <button data-price="all" class="price-btn active p-2 rounded-xl text-left border flex items-center justify-between shadow-2xs bg-amber-950 border-amber-950 text-amber-50 transition-all">
                    <div>
                        <div class="text-xs font-bold text-amber-100">全不限</div>
                        <div class="text-[9px] opacity-80">想吃什麼就吃</div>
                    </div>
                    <i class="fa-solid fa-circle-check text-[10px] opacity-90"></i>
                </button>
                <button data-price="under100" class="price-btn p-2 rounded-xl text-left border flex items-center justify-between shadow-2xs bg-white text-stone-700 hover:bg-amber-50 border-stone-200 transition-all">
                    <div>
                        <div class="text-xs font-bold text-amber-950">銅板美味</div>
                        <div class="text-[9px] text-stone-500">月底沒錢急需 (≤100)</div>
                    </div>
                    <i class="fa-solid fa-circle-check text-[10px] opacity-0"></i>
                </button>
                <button data-price="200-300" class="price-btn p-2 rounded-xl text-left border flex items-center justify-between shadow-2xs bg-white text-stone-700 hover:bg-amber-50 border-stone-200 transition-all">
                    <div>
                        <div class="text-xs font-bold text-amber-950">日常簡便</div>
                        <div class="text-[9px] text-stone-500">日常簡便晚餐 (200~300)</div>
                    </div>
                    <i class="fa-solid fa-circle-check text-[10px] opacity-0"></i>
                </button>
                <button data-price="over400" class="price-btn p-2 rounded-xl text-left border flex items-center justify-between shadow-2xs bg-white text-stone-700 hover:bg-amber-50 border-stone-200 transition-all">
                    <div>
                        <div class="text-xs font-bold text-amber-950">高級獎勵</div>
                        <div class="text-[9px] text-stone-500">今天很棒獎勵 (≥400)</div>
                    </div>
                    <i class="fa-solid fa-circle-check text-[10px] opacity-0"></i>
                </button>
            </div>
        </section>

        <!-- 3. 遊戲互動核心區 -->
        <main class="glass-card p-4 rounded-3xl shadow-md flex flex-col items-center relative overflow-hidden">
            
            <!-- 模式切換 Tabs -->
            <div class="w-full max-w-sm mb-3 flex bg-stone-200/60 p-1 rounded-xl border border-stone-300/50">
                <button id="modeWheelBtn" class="mode-tab-btn flex-1 py-1.5 rounded-lg text-xs font-bold transition-all bg-amber-950 text-amber-50 shadow-xs flex items-center justify-center gap-1">
                    <i class="fa-solid fa-arrows-spin"></i> 幸運大輪盤
                </button>
                <button id="modeFlipBtn" class="mode-tab-btn flex-1 py-1.5 rounded-lg text-xs font-bold transition-all text-stone-600 hover:text-amber-950 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-clone"></i> 命運翻牌卡
                </button>
                <button id="modeStickBtn" class="mode-tab-btn flex-1 py-1.5 rounded-lg text-xs font-bold transition-all text-stone-600 hover:text-amber-950 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-vihara"></i> 自選幸運籤
                </button>
            </div>

            <!-- 模式一：轉盤 -->
            <div id="gameViewWheel" class="game-view w-full flex flex-col items-center my-2">
                <div class="wheel-container my-1 relative flex justify-center items-center">
                    <div class="absolute -top-3 z-20 pointer-anim flex flex-col items-center">
                        <div class="w-7 h-9 bg-amber-900 shadow-sm flex items-center justify-center rounded-t-xs" style="clip-path: polygon(100% 0, 0 0, 50% 100%);"></div>
                    </div>

                    <!-- Canvas 尺寸彈性調整，在高 DPI 螢幕上由 JS 修正畫質 -->
                    <canvas id="wheelCanvas" class="w-[320px] h-[320px] sm:w-[360px] sm:h-[360px] cursor-pointer rounded-full"></canvas>

                    <button id="centerSpinBtn" class="absolute z-10 w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-br from-amber-900 to-amber-950 hover:from-amber-800 hover:to-amber-900 border-2 border-white shadow-lg flex flex-col items-center justify-center font-bold text-amber-50 hover:scale-105 active:scale-95 transition-all">
                        <span class="text-[9px] text-amber-200/80 tracking-widest">START</span>
                        <span class="text-sm sm:text-base">開轉！</span>
                    </button>
                </div>
            </div>

            <!-- 模式二：翻牌卡 -->
            <div id="gameViewFlip" class="game-view w-full hidden flex flex-col items-center justify-center my-4">
                <p class="text-xs text-stone-500 mb-3 font-semibold text-center">憑直覺點擊一張命運卡片：</p>
                <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 w-full max-w-sm min-h-[220px]"></div>
                <button id="reshuffleCardsBtn" class="mt-3 px-3 py-1.5 rounded-lg bg-amber-900/10 hover:bg-amber-900/20 text-amber-950 text-xs font-bold transition-all border border-amber-900/15">
                    <i class="fa-solid fa-shuffle mr-1"></i> 重新洗牌
                </button>
            </div>

            <!-- 模式三：自選籤枝 -->
            <div id="gameViewStick" class="game-view w-full hidden flex flex-col items-center justify-center my-2">
                <p class="text-xs text-stone-600 mb-2 font-bold text-center">
                    直接點擊靈感觸動的那一支籤：
                </p>
                <div class="relative w-full max-w-xs h-56 flex flex-col items-center justify-end">
                    <div id="interactiveSticksContainer" class="absolute top-0 w-full h-40 flex justify-center items-end pb-2"></div>
                    <div class="w-36 h-24 bg-gradient-to-b from-amber-900 to-amber-950 border-2 border-amber-800 rounded-b-2xl rounded-t-sm shadow-xl relative z-20 flex flex-col items-center justify-center p-2">
                        <div class="w-full h-1.5 bg-amber-700/50 rounded-full mb-1"></div>
                        <div class="text-amber-100 text-[11px] font-bold tracking-widest border border-amber-500/40 px-2.5 py-0.5 rounded">求籤筒</div>
                    </div>
                </div>
                <button id="shuffleSticksBtn" class="mt-3 px-3 py-1.5 rounded-lg bg-amber-900/10 hover:bg-amber-900/20 text-amber-950 text-xs font-bold transition-all border border-amber-900/15">
                    <i class="fa-solid fa-arrows-rotate mr-1"></i> 重新擺籤
                </button>
            </div>

            <!-- 底部動作按鈕 -->
            <div class="w-full max-w-sm flex items-center gap-2 mt-2 pt-2 border-t border-stone-200/60">
                <button id="primaryActionBtn" class="flex-1 py-3 px-4 rounded-xl bg-amber-950 hover:bg-amber-900 text-amber-50 font-bold text-sm border border-amber-900 shadow-xs active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play text-amber-200" id="primaryActionIcon"></i> 
                    <span id="primaryActionText">開始抽晚餐</span>
                </button>
                <button id="soundToggleBtn" class="py-3 px-3.5 rounded-xl bg-stone-100 hover:bg-stone-200/80 border border-stone-200 text-stone-700 active:scale-95 transition-all flex items-center justify-center" title="音效開關">
                    <i class="fa-solid fa-volume-high text-amber-900" id="soundIcon"></i>
                </button>
            </div>
        </main>

        <!-- 4. 簡易清單與新增選單 (折疊簡化版) -->
        <section class="glass-card p-3.5 rounded-2xl shadow-xs">
            <div class="flex items-center justify-between border-b border-stone-200/80 pb-2 mb-2">
                <span class="text-xs font-bold text-amber-950 flex items-center gap-1.5">
                    <i class="fa-solid fa-list-check text-amber-800"></i> 當前菜單列表
                </span>
                <span id="itemCountBadge" class="text-[10px] bg-amber-900/10 text-amber-950 px-2 py-0.5 rounded-full font-bold">0 個選項</span>
            </div>

            <!-- 新增項目表單 -->
            <form id="addItemForm" class="flex gap-1.5 mb-2">
                <input type="text" id="newItemInput" placeholder="新增品項 (如: 泰式打拋豬)" maxlength="15" required class="flex-1 bg-white border border-stone-200 focus:border-amber-700 rounded-lg px-2.5 py-1.5 text-xs text-stone-800 outline-none">
                <select id="newItemPriceSelect" class="bg-white border border-stone-200 rounded-lg px-2 py-1.5 text-xs text-stone-700 outline-none">
                    <option value="under100">銅板 (≤100)</option>
                    <option value="200-300" selected>日常 (200~300)</option>
                    <option value="over400">高級 (≥400)</option>
                </select>
                <button type="submit" class="px-3 py-1.5 bg-amber-950 hover:bg-amber-900 text-amber-50 text-xs font-bold rounded-lg shrink-0 transition-all">
                    新增
                </button>
            </form>

            <!-- 項目 Tag 展示區 (取代佔空間的列表) -->
            <div id="itemList" class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto py-1"></div>

            <div class="pt-2 border-t border-stone-200/60 flex justify-between items-center text-[11px]">
                <button id="resetDefaultBtn" class="text-stone-500 hover:text-amber-900 font-semibold transition-colors">
                    <i class="fa-solid fa-rotate-left mr-1"></i> 還原預設
                </button>
                <button id="clearAllBtn" class="text-amber-900/80 hover:text-amber-900 font-semibold transition-colors">
                    <i class="fa-solid fa-trash-can mr-1"></i> 清空
                </button>
            </div>
        </section>

        <!-- 5. 歷史紀錄 -->
        <section class="glass-card p-3 rounded-2xl shadow-xs">
            <div class="flex items-center justify-between mb-1.5">
                <span class="text-[11px] font-bold text-stone-600 flex items-center gap-1">
                    <i class="fa-solid fa-clock-rotate-left text-amber-900"></i> 近期命定美食紀錄
                </span>
                <button id="clearHistoryBtn" class="text-[10px] text-stone-400 hover:text-stone-600">清除</button>
            </div>
            <div id="historyList" class="flex flex-wrap gap-1 text-xs">
                <span class="text-stone-400 text-[11px] italic">尚無紀錄</span>
            </div>
        </section>
    </div>

    <!-- 抽中美食 Modal -->
    <div id="resultModal" class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/30 backdrop-blur-xs p-4 hidden">
        <div class="bg-white border border-stone-200 w-full max-w-xs rounded-2xl p-5 text-center shadow-xl relative modal-animate">
            <div class="w-12 h-12 bg-amber-900/10 text-amber-950 rounded-full flex items-center justify-center text-xl mx-auto mb-2">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <p class="text-[10px] font-bold text-amber-900 tracking-widest uppercase mb-0.5">Tonight's Special</p>
            <h3 class="text-xs text-stone-400 mb-2">命運選定之晚餐：</h3>
            
            <div class="bg-amber-50/80 py-3 px-2 rounded-xl border border-amber-900/10 mb-3 shadow-2xs flex flex-col items-center gap-1">
                <div id="resultFoodName" class="text-xl font-black text-amber-950">日式拉麵</div>
                <span id="resultFoodPriceBadge" class="text-[10px] font-bold bg-amber-900/10 text-amber-950 px-2 py-0.5 rounded">
                    日常簡便
                </span>
            </div>

            <p id="resultFortuneMessage" class="text-xs text-stone-600 mb-3 italic">「熱騰騰的湯頭能撫平今日的疲憊！」</p>

            <div class="space-y-1.5">
                <a id="googleSearchBtn" href="#" target="_blank" class="w-full py-2.5 px-3 rounded-lg bg-amber-950 hover:bg-amber-900 text-amber-50 font-bold text-xs transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-map-location-dot text-amber-200"></i> 搜尋附近店家
                </a>
                <div class="grid grid-cols-2 gap-1.5">
                    <button id="modalSpinAgainBtn" class="py-2 px-2 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-bold transition-all">
                        再選一次
                    </button>
                    <button id="modalRemoveBtn" class="py-2 px-2 rounded-lg bg-amber-900/10 hover:bg-amber-900/20 text-amber-950 text-xs font-bold transition-all">
                        剔除此項
                    </button>
                </div>
            </div>

            <button id="closeModalBtn" class="absolute top-3 right-3 text-stone-400 hover:text-stone-600">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>
    </div>

    <footer class="text-center text-[11px] text-stone-400 mt-4">
        <p>Made with <i class="fa-solid fa-coffee text-amber-900"></i> 美味不猶豫</p>
    </footer>

        const COLOR_PALETTE = [
            '#f2e6dc', '#e6d0bf', '#d8ba9e', '#c8a482',
            '#e8ceb5', '#be9b7b', '#f7ede2', '#a6805b'
        ];

        // 全域狀態
        let rawItems = [];
        try {
            const saved = localStorage.getItem('food_wheel_items_v4');
            rawItems = saved ? JSON.parse(saved) : [...PRESETS.taiwanese];
        } catch (e) {
            rawItems = [...PRESETS.taiwanese];
        }

        let currentPriceFilter = 'all';
        let filteredItems = [];
        let history = [];
        try {
            const savedHist = localStorage.getItem('food_wheel_history_v4');
            history = savedHist ? JSON.parse(savedHist) : [];
        } catch (e) { history = []; }

        let isAudioMuted = false;
        let currentGameMode = 'wheel';
        let currentAngle = 0;
        let isSpinning = false;

        // DOM 元素引用
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        const primaryActionBtn = document.getElementById('primaryActionBtn');
        const primaryActionText = document.getElementById('primaryActionText');
        const primaryActionIcon = document.getElementById('primaryActionIcon');
        const centerSpinBtn = document.getElementById('centerSpinBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const itemList = document.getElementById('itemList');
        const addItemForm = document.getElementById('addItemForm');
        const newItemInput = document.getElementById('newItemInput');
        const newItemPriceSelect = document.getElementById('newItemPriceSelect');
        const resetDefaultBtn = document.getElementById('resetDefaultBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const itemCountBadge = document.getElementById('itemCountBadge');
        const priceFilterLabel = document.getElementById('priceFilterLabel');

        const gameViewWheel = document.getElementById('gameViewWheel');
        const gameViewFlip = document.getElementById('gameViewFlip');
        const gameViewStick = document.getElementById('gameViewStick');
        const cardsGrid = document.getElementById('cardsGrid');
        const reshuffleCardsBtn = document.getElementById('reshuffleCardsBtn');
        const interactiveSticksContainer = document.getElementById('interactiveSticksContainer');
        const shuffleSticksBtn = document.getElementById('shuffleSticksBtn');

        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        const resultModal = document.getElementById('resultModal');
        const resultFoodName = document.getElementById('resultFoodName');
        const resultFoodPriceBadge = document.getElementById('resultFoodPriceBadge');
        const resultFortuneMessage = document.getElementById('resultFortuneMessage');
        const googleSearchBtn = document.getElementById('googleSearchBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalSpinAgainBtn = document.getElementById('modalSpinAgainBtn');
        const modalRemoveBtn = document.getElementById('modalRemoveBtn');

        // 音效引擎
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (isAudioMuted) return;
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.035);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.035);
            } catch (e) {}
        }

        function playWinSound() {
            if (isAudioMuted) return;
            try {
                initAudio();
                if (!audioCtx) return;
                const notes = [392, 493, 587, 783];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.07);
                    gain.gain.setValueAtTime(0.18, audioCtx.currentTime + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.07 + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.07);
                    osc.stop(audioCtx.currentTime + idx * 0.07 + 0.22);
                });
            } catch (e) {}
        }

        // 高 DPI (Retina) Canvas 清晰度優化繪製
        function setupCanvasHighDPI() {
            if (!canvas || !ctx) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }

        function updateFilteredItems() {
            if (currentPriceFilter === 'all') {
                filteredItems = [...rawItems];
            } else {
                filteredItems = rawItems.filter(item => item.price === currentPriceFilter);
            }
            renderItemList();
            if (currentGameMode === 'flip') renderFlipCards();
            if (currentGameMode === 'stick') renderInteractiveSticks();
        }

        function drawWheel() {
            if (!ctx || !canvas) return;
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 8;

            ctx.clearRect(0, 0, width, height);

            const numItems = filteredItems.length;

            if (numItems === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#f7f3ef';
                ctx.fill();
                ctx.strokeStyle = '#d8ba9e';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#7a5a40';
                ctx.font = '600 13px "Noto Sans TC"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('無對應預算餐點，請新增或切換預算', centerX, centerY);
                return;
            }

            const arcSize = (2 * Math.PI) / numItems;

            for (let i = 0; i < numItems; i++) {
                const angle = currentAngle + i * arcSize;
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.fillStyle = COLOR_PALETTE[i % COLOR_PALETTE.length];
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#3d2c23';
                
                const text = filteredItems[i].name;
                let fontSize = numItems > 12 ? 11 : (numItems > 8 ? 13 : 15);
                ctx.font = `700 ${fontSize}px "Noto Sans TC"`;
                
                ctx.fillText(text, radius - 16, 0);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#a6805b';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function spinWheel() {
            if (isSpinning) return;
            if (filteredItems.length === 0) {
                alert('當前預算範圍沒有餐點可抽取喔！');
                return;
            }

            isSpinning = true;
            primaryActionBtn.disabled = true;
            centerSpinBtn.disabled = true;

            const totalRotation = (Math.floor(Math.random() * 4) + 5) * 360 + Math.random() * 360;
            const targetAngleRad = currentAngle + (totalRotation * Math.PI / 180);
            const startAngleRad = currentAngle;
            
            const duration = 4000;
            const startTime = performance.now();

            let lastTickIndex = -1;
            const numItems = filteredItems.length;
            const arcSize = (2 * Math.PI) / numItems;

            function animateSpin(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);

                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngleRad + (targetAngleRad - startAngleRad) * easeOut;

                const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
                const pointerAngle = (normalizedAngle + 1.5 * Math.PI) % (2 * Math.PI);
                const currentTickIndex = Math.floor(pointerAngle / arcSize);

                if (currentTickIndex !== lastTickIndex) {
                    playTickSound();
                    lastTickIndex = currentTickIndex;
                }

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    primaryActionBtn.disabled = false;
                    centerSpinBtn.disabled = false;
                    onSpinComplete();
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function onSpinComplete() {
            const numItems = filteredItems.length;
            if (numItems === 0) return;
            const arcSize = (2 * Math.PI) / numItems;

            let twoPi = Math.PI * 2;
            let normalizedAngle = (currentAngle % twoPi + twoPi) % twoPi;
            let pointerAngle = (1.5 * Math.PI - normalizedAngle + twoPi) % twoPi;
            
            const selectedIndex = Math.floor(pointerAngle / arcSize) % numItems;
            const selectedItem = filteredItems[selectedIndex];

            finishSelection(selectedItem);
        }

        // 翻牌卡模式繪製
        function renderFlipCards() {
            cardsGrid.innerHTML = '';
            if (filteredItems.length === 0) {
                cardsGrid.innerHTML = `<div class="col-span-full text-center text-stone-400 text-xs py-6">當前預算無餐點</div>`;
                return;
            }

            let shuffled = [...filteredItems].sort(() => 0.5 - Math.random());
            let displayCount = Math.min(shuffled.length, 6);
            let selectedCards = shuffled.slice(0, displayCount);

            selectedCards.forEach((item, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'flip-card perspective-1000 h-28 cursor-pointer';
                cardEl.innerHTML = `
                    <div class="flip-card-inner">
                        <div class="flip-card-front bg-gradient-to-br from-amber-900 to-amber-950 text-amber-100 flex flex-col items-center justify-center p-2 shadow-xs border border-amber-800">
                            <i class="fa-solid fa-mug-hot text-lg text-amber-300 mb-1"></i>
                            <span class="text-[10px] font-bold tracking-widest opacity-80">CARD #${idx + 1}</span>
                        </div>
                        <div class="flip-card-back bg-amber-50 border border-amber-900/20 text-amber-950 flex flex-col items-center justify-center p-2 shadow-sm">
                            <h4 class="font-bold text-xs text-center">${escapeHtml(item.name)}</h4>
                        </div>
                    </div>
                `;

                cardEl.addEventListener('click', () => {
                    if (cardEl.classList.contains('flipped') || isSpinning) return;
                    isSpinning = true;
                    playTickSound();
                    cardEl.classList.add('flipped');
                    
                    setTimeout(() => {
                        isSpinning = false;
                        finishSelection(item);
                    }, 600);
                });

                cardsGrid.appendChild(cardEl);
            });
        }

        // 扇形籤枝渲染
        function renderInteractiveSticks() {
            interactiveSticksContainer.innerHTML = '';
            if (filteredItems.length === 0) {
                interactiveSticksContainer.innerHTML = `<div class="text-xs text-stone-400">當前預算無籤枝</div>`;
                return;
            }

            let displayCount = Math.min(filteredItems.length, 7);
            let shuffledList = [...filteredItems].sort(() => 0.5 - Math.random()).slice(0, displayCount);

            const totalDegree = 36;
            const stepDegree = displayCount > 1 ? totalDegree / (displayCount - 1) : 0;
            const startDegree = -totalDegree / 2;

            shuffledList.forEach((item, idx) => {
                const stickEl = document.createElement('div');
                const rotateDeg = startDegree + (idx * stepDegree);
                
                stickEl.className = 'interactive-stick absolute cursor-pointer w-6 h-36 bg-gradient-to-b from-amber-100 to-amber-200 border border-amber-800/80 rounded-t-md shadow-xs flex flex-col items-center pt-1.5 select-none';
                stickEl.style.transform = `rotate(${rotateDeg}deg)`;
                stickEl.style.left = `calc(50% - 12px + ${rotateDeg * 2}px)`;

                const numKanji = ['一', '二', '三', '四', '五', '六', '七'][idx] || (idx + 1);
                
                stickEl.innerHTML = `
                    <div class="w-3.5 h-3.5 rounded-full bg-amber-900 text-amber-100 text-[8px] font-bold flex items-center justify-center mb-1 shrink-0">${numKanji}</div>
                    <span class="text-[9px] font-black text-amber-950 writing-vertical tracking-widest">吉籤</span>
                `;

                stickEl.addEventListener('click', () => {
                    if (isSpinning) return;
                    isSpinning = true;
                    playTickSound();
                    stickEl.classList.add('selected-stick');

                    setTimeout(() => {
                        isSpinning = false;
                        finishSelection(item);
                        setTimeout(() => renderInteractiveSticks(), 400);
                    }, 650);
                });

                interactiveSticksContainer.appendChild(stickEl);
            });
        }

        function finishSelection(item) {
            playWinSound();
            addHistory(item);
            showResultModal(item);
        }

        function showResultModal(item) {
            resultFoodName.textContent = item.name;
            resultFoodPriceBadge.textContent = PRICE_LABELS[item.price] || '日常簡便';
            
            const randomFortune = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
            resultFortuneMessage.textContent = randomFortune;

            const searchUrl = `https://www.google.com/maps/search/${encodeURIComponent('附近 ' + item.name)}`;
            googleSearchBtn.href = searchUrl;

            modalRemoveBtn.dataset.foodName = item.name;
            resultModal.classList.remove('hidden');
        }

        function hideResultModal() {
            resultModal.classList.add('hidden');
        }

        // 清單展示 (Tag 化極簡 UI)
        function renderItemList() {
            itemList.innerHTML = '';
            itemCountBadge.textContent = `${filteredItems.length} 個選項`;

            if (filteredItems.length === 0) {
                itemList.innerHTML = `<span class="text-xs text-stone-400 py-1">目前無選項</span>`;
            } else {
                filteredItems.forEach((item, idx) => {
                    const tagEl = document.createElement('span');
                    tagEl.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white border border-stone-200/80 text-xs font-semibold text-stone-700 shadow-2xs group';
                    tagEl.innerHTML = `
                        <span class="w-2 h-2 rounded-full" style="background-color: ${COLOR_PALETTE[idx % COLOR_PALETTE.length]}"></span>
                        <span>${escapeHtml(item.name)}</span>
                        <button class="delete-item-btn text-stone-400 hover:text-amber-900 ml-0.5" data-name="${escapeHtml(item.name)}" title="刪除">
                            <i class="fa-solid fa-xmark text-[10px]"></i>
                        </button>
                    `;
                    itemList.appendChild(tagEl);
                });
            }

            setupCanvasHighDPI();
            drawWheel();
            saveItemsToStorage();
        }

        function saveItemsToStorage() {
            try {
                localStorage.setItem('food_wheel_items_v4', JSON.stringify(rawItems));
            } catch (e) {}
        }

        function addHistory(item) {
            history.unshift({ 
                name: item.name, 
                price: item.price,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
            });
            if (history.length > 6) history.pop();
            try {
                localStorage.setItem('food_wheel_history_v4', JSON.stringify(history));
            } catch (e) {}
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<span class="text-stone-400 text-[11px] italic">尚無紀錄</span>';
                return;
            }
            historyList.innerHTML = history.map(h => `
                <span class="px-2 py-0.5 rounded bg-amber-50 border border-amber-900/10 text-stone-700 font-medium text-[11px]">
                    <span class="font-bold text-amber-950">${escapeHtml(h.name)}</span>
                </span>
            `).join('');
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function setGameMode(mode) {
            currentGameMode = mode;
            
            document.querySelectorAll('.mode-tab-btn').forEach(btn => {
                btn.className = 'mode-tab-btn flex-1 py-1.5 rounded-lg text-xs font-bold transition-all text-stone-600 hover:text-amber-950 flex items-center justify-center gap-1';
            });

            gameViewWheel.classList.add('hidden');
            gameViewFlip.classList.add('hidden');
            gameViewStick.classList.add('hidden');

            if (mode === 'wheel') {
                document.getElementById('modeWheelBtn').className = 'mode-tab-btn flex-1 py-1.5 rounded-lg text-xs font-bold transition-all bg-amber-950 text-amber-50 shadow-xs flex items-center justify-center gap-1';
                gameViewWheel.classList.remove('hidden');
                primaryActionText.textContent = '開始抽晚餐';
                primaryActionIcon.className = 'fa-solid fa-arrows-spin text-amber-200';
                setupCanvasHighDPI();
                drawWheel();
            } else if (mode === 'flip') {
                document.getElementById('modeFlipBtn').className = 'mode-tab-btn flex-1 py-1.5 rounded-lg text-xs font-bold transition-all bg-amber-950 text-amber-50 shadow-xs flex items-center justify-center gap-1';
                gameViewFlip.classList.remove('hidden');
                primaryActionText.textContent = '洗牌卡片';
                primaryActionIcon.className = 'fa-solid fa-shuffle text-amber-200';
                renderFlipCards();
            } else if (mode === 'stick') {
                document.getElementById('modeStickBtn').className = 'mode-tab-btn flex-1 py-1.5 rounded-lg text-xs font-bold transition-all bg-amber-950 text-amber-50 shadow-xs flex items-center justify-center gap-1';
                gameViewStick.classList.remove('hidden');
                primaryActionText.textContent = '重新排籤';
                primaryActionIcon.className = 'fa-solid fa-arrows-rotate text-amber-200';
                renderInteractiveSticks();
            }
        }

        // 事件監聽繫結
        primaryActionBtn.addEventListener('click', () => {
            initAudio();
            if (currentGameMode === 'wheel') spinWheel();
            else if (currentGameMode === 'flip') renderFlipCards();
            else if (currentGameMode === 'stick') renderInteractiveSticks();
        });

        centerSpinBtn.addEventListener('click', () => { initAudio(); spinWheel(); });
        reshuffleCardsBtn.addEventListener('click', renderFlipCards);
        shuffleSticksBtn.addEventListener('click', renderInteractiveSticks);

        document.getElementById('modeWheelBtn').addEventListener('click', () => setGameMode('wheel'));
        document.getElementById('modeFlipBtn').addEventListener('click', () => setGameMode('flip'));
        document.getElementById('modeStickBtn').addEventListener('click', () => setGameMode('stick'));

        // 頂部預設懶人包按鈕
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.preset-btn').forEach(b => {
                    b.className = 'preset-btn p-2 rounded-xl bg-white/70 hover:bg-amber-50 border border-stone-200/80 shadow-2xs flex items-center gap-2 text-left transition-all';
                });
                btn.className = 'preset-btn active p-2 rounded-xl bg-white hover:bg-amber-50 border border-amber-900/20 shadow-2xs flex items-center gap-2 text-left transition-all ring-1 ring-amber-900/20';
                
                const presetKey = btn.dataset.preset;
                if (PRESETS[presetKey]) {
                    rawItems = [...PRESETS[presetKey]];
                    updateFilteredItems();
                }
            });
        });

        // 預算篩選按鈕
        document.querySelectorAll('.price-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.price-btn').forEach(b => {
                    b.className = 'price-btn p-2 rounded-xl text-left border flex items-center justify-between shadow-2xs bg-white text-stone-700 hover:bg-amber-50 border-stone-200 transition-all';
                    const titleEl = b.querySelector('.text-xs');
                    if (titleEl) {
                        titleEl.classList.replace('text-amber-100', 'text-amber-950');
                    }
                    const icon = b.querySelector('.fa-circle-check');
                    if (icon) icon.classList.replace('opacity-90', 'opacity-0');
                });
                
                btn.className = 'price-btn active p-2 rounded-xl text-left border flex items-center justify-between shadow-2xs bg-amber-950 border-amber-950 text-amber-50 transition-all';
                const activeTitle = btn.querySelector('.text-xs');
                if (activeTitle) {
                    activeTitle.classList.replace('text-amber-950', 'text-amber-100');
                }
                const checkIcon = btn.querySelector('.fa-circle-check');
                if (checkIcon) checkIcon.classList.replace('opacity-0', 'opacity-90');
                
                currentPriceFilter = btn.dataset.price;
                priceFilterLabel.textContent = PRICE_LABELS[currentPriceFilter];
                updateFilteredItems();
            });
        });

        soundToggleBtn.addEventListener('click', () => {
            isAudioMuted = !isAudioMuted;
            soundIcon.className = isAudioMuted 
                ? 'fa-solid fa-volume-xmark text-amber-700' 
                : 'fa-solid fa-volume-high text-amber-900';
        });

        addItemForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = newItemInput.value.trim();
            const selectedPrice = newItemPriceSelect.value;
            
            if (text) {
                rawItems.push({ name: text, price: selectedPrice });
                newItemInput.value = '';
                updateFilteredItems();
            }
        });

        itemList.addEventListener('click', (e) => {
            const btn = e.target.closest('.delete-item-btn');
            if (btn) {
                const targetName = btn.dataset.name;
                rawItems = rawItems.filter(item => item.name !== targetName);
                updateFilteredItems();
            }
        });

        resetDefaultBtn.addEventListener('click', () => {
            if (confirm('確定要還原為預設菜單嗎？')) {
                rawItems = [...PRESETS.taiwanese];
                updateFilteredItems();
            }
        });

        clearAllBtn.addEventListener('click', () => {
            if (confirm('確定要清空所有選項嗎？')) {
                rawItems = [];
                updateFilteredItems();
            }
        });

        clearHistoryBtn.addEventListener('click', () => {
            history = [];
            try { localStorage.removeItem('food_wheel_history_v4'); } catch (e) {}
            renderHistory();
        });

        closeModalBtn.addEventListener('click', hideResultModal);
        
        modalSpinAgainBtn.addEventListener('click', () => {
            hideResultModal();
            if (currentGameMode === 'wheel') spinWheel();
            else if (currentGameMode === 'flip') renderFlipCards();
            else if (currentGameMode === 'stick') renderInteractiveSticks();
        });

        modalRemoveBtn.addEventListener('click', () => {
            const foodName = modalRemoveBtn.dataset.foodName;
            if (foodName) {
                rawItems = rawItems.filter(item => item.name !== foodName);
                updateFilteredItems();
            }
            hideResultModal();
        });

        window.addEventListener('load', () => {
            setupCanvasHighDPI();
            updateFilteredItems();
            renderHistory();
        });

        window.addEventListener('resize', () => {
            setupCanvasHighDPI();
            drawWheel();
        });
    </script>
</body>
</html>
