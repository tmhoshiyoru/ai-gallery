<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nature Baseball Breakout - 自然野球ブロック崩し</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Natural Illustration Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #2d5a3f;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(143, 196, 126, 0.3) 0%, rgba(35, 73, 49, 0.95) 100%),
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            color: #f7f9f5;
            user-select: none;
            touch-action: none;
        }

        .font-fredoka {
            font-family: 'Fredoka', sans-serif;
        }

        .illustrated-card {
            background: rgba(33, 61, 44, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 3px solid #e0c38c;
            box-shadow: 0 8px 20px rgba(12, 31, 19, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.2);
            border-radius: 20px;
        }

        .wood-button {
            background: linear-gradient(180deg, #e5a95a 0%, #c48234 100%);
            border: 2px solid #804a17;
            box-shadow: 0 5px 0 #61360d, 0 8px 12px rgba(0,0,0,0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        .wood-button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #61360d, 0 4px 6px rgba(0,0,0,0.2);
        }

        canvas {
            display: block;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(10, 28, 17, 0.5), 0 0 0 4px #e0c38c;
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .bounce-effect {
            animation: gentle-bounce 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6 overflow-x-hidden">

    <!-- Game Header -->
    <header class="w-full max-w-3xl flex flex-col sm:flex-row justify-between items-center my-1 gap-3 z-10">
        <div class="text-center sm:text-left">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-wide text-amber-200 font-fredoka drop-shadow-md flex items-center justify-center sm:justify-start gap-2">
                ⚾ 自然野球ブロック崩し
            </h1>
            <p class="text-xs text-emerald-200/80 tracking-wider font-semibold">Illustrated Baseball Breakout</p>
        </div>

        <!-- Audio Toggle Button -->
        <div class="flex items-center gap-3">
            <button id="soundToggleBtn" class="illustrated-card hover:bg-emerald-800 text-amber-200 px-4 py-2 rounded-xl transition flex items-center gap-2 text-sm font-bold">
                <span id="soundIcon">🔊</span> <span id="soundText">効果音: オン</span>
            </button>
        </div>
    </header>

    <!-- Score Panel -->
    <div class="w-full max-w-3xl illustrated-card p-3 mb-3 grid grid-cols-2 sm:grid-cols-4 gap-2 text-center z-10">
        <div class="flex flex-col">
            <span class="text-xs font-bold uppercase tracking-wider text-amber-200/80">スコア (SCORE)</span>
            <span id="scoreDisplay" class="text-2xl sm:text-3xl font-bold font-fredoka text-amber-300">0</span>
        </div>
        <div class="flex flex-col border-l sm:border-l-0 border-emerald-700/60">
            <span class="text-xs font-bold uppercase tracking-wider text-amber-200/80">スピード (SPEED)</span>
            <span id="speedDisplay" class="text-2xl sm:text-3xl font-bold font-fredoka text-amber-300">1.0x</span>
        </div>
        <div class="flex flex-col border-t sm:border-t-0 sm:border-x border-emerald-700/60 pt-1 sm:pt-0">
            <span class="text-xs font-bold uppercase tracking-wider text-amber-200/80">ライフ (LIVES)</span>
            <div id="livesContainer" class="flex justify-center items-center gap-1.5 mt-1 text-red-400 text-lg">
                <span>❤️</span><span>❤️</span><span>❤️</span>
            </div>
        </div>
        <div class="flex flex-col border-t sm:border-t-0 border-emerald-700/60 pt-1 sm:pt-0">
            <span class="text-xs font-bold uppercase tracking-wider text-amber-200/80">ハイスコア (BEST)</span>
            <span id="highScoreDisplay" class="text-2xl sm:text-3xl font-bold font-fredoka text-yellow-300">0</span>
        </div>
    </div>

    <!-- Main Game Canvas Container -->
    <main class="relative w-full max-w-3xl flex justify-center items-center my-auto">
        <!-- Canvas Element -->
        <canvas id="gameCanvas" width="800" height="550" class="bg-emerald-900 border-4 border-amber-200 w-full h-auto max-h-[70vh] object-contain"></canvas>

        <!-- Start / Pause / Game Over Modal Overlay -->
        <div id="modalOverlay" class="absolute inset-0 illustrated-card rounded-2xl flex flex-col justify-center items-center text-center p-6 z-20 transition-all duration-300">
            <div id="modalContent" class="max-w-md w-full flex flex-col items-center">
                <h2 id="modalTitle" class="text-4xl sm:text-5xl font-bold font-fredoka text-amber-300 mb-3 bounce-effect drop-shadow">
                    野球場へようこそ！
                </h2>
                <p id="modalDescription" class="text-emerald-100 mb-6 text-sm sm:text-base leading-relaxed font-semibold">
                    用木棒擊球打碎上方看板磚塊！<br>
                    擊碎磚塊有 <span class="text-amber-300 font-bold">20% 機率</span> 掉落加長道具（可讓木棒變長 5 秒）。
                </p>
                <button id="startBtn" class="wood-button px-8 py-3.5 text-stone-900 font-bold font-fredoka text-xl rounded-2xl cursor-pointer hover:brightness-110 transition">
                    試合開始 (START)
                </button>
            </div>
        </div>
    </main>

    <!-- Mobile Touch Controls -->
    <div class="w-full max-w-3xl grid grid-cols-2 gap-4 mt-3 sm:hidden z-10">
        <button id="touchLeftBtn" class="illustrated-card active:bg-emerald-800 py-3.5 rounded-xl text-center font-fredoka font-bold text-amber-200 text-lg border border-amber-300/40 select-none">
            ◀ 左へ
        </button>
        <button id="touchRightBtn" class="illustrated-card active:bg-emerald-800 py-3.5 rounded-xl text-center font-fredoka font-bold text-amber-200 text-lg border border-amber-300/40 select-none">
            右へ ▶
        </button>
    </div>

    <!-- Key Controls Helper Info -->
    <footer class="w-full max-w-3xl mt-3 text-center text-xs text-emerald-200/80 flex flex-wrap justify-center gap-4 py-2 border-t border-emerald-800/80 font-semibold">
        <div class="flex items-center gap-1.5">
            <span class="px-2 py-0.5 bg-emerald-800 border border-emerald-700 rounded text-amber-200 font-mono">←</span>
            <span class="px-2 py-0.5 bg-emerald-800 border border-emerald-700 rounded text-amber-200 font-mono">→</span>
            <span>或</span>
            <span class="px-2 py-0.5 bg-emerald-800 border border-emerald-700 rounded text-amber-200 font-mono">A</span>
            <span class="px-2 py-0.5 bg-emerald-800 border border-emerald-700 rounded text-amber-200 font-mono">D</span>
            <span>控制木棒</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="px-2 py-0.5 bg-emerald-800 border border-emerald-700 rounded text-amber-200 font-mono">Space</span>
            <span>暫停 / 繼續</span>
        </div>
        <div class="flex items-center gap-1.5">
            <span>支援滑鼠與觸控螢幕</span>
        </div>
    </footer>

    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
            }

            playBeep(freq, type = 'sine', duration = 0.08, vol = 0.1) {
                if (!this.enabled || !this.ctx) return;
                try {
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    // Ignore audio playback exceptions
                }
            }

            hitPaddle() { this.playBeep(260, 'triangle', 0.12, 0.25); }
            hitWall() { this.playBeep(330, 'sine', 0.06, 0.1); }
            breakBrick(row) {
                const freqs = [523.25, 659.25, 783.99];
                this.playBeep(freqs[row % freqs.length] || 523.25, 'sine', 0.1, 0.2);
            }
            getItem() {
                if (!this.enabled || !this.ctx) return;
                [440, 554.37, 659.25, 880].forEach((freq, idx) => {
                    setTimeout(() => this.playBeep(freq, 'triangle', 0.1, 0.2), idx * 60);
                });
            }
            loseLife() { this.playBeep(160, 'sawtooth', 0.25, 0.2); }
            speedUp() {
                if (!this.enabled || !this.ctx) return;
                this.playBeep(440, 'sine', 0.08, 0.2);
                setTimeout(() => this.playBeep(554.37, 'sine', 0.08, 0.2), 80);
                setTimeout(() => this.playBeep(659.25, 'sine', 0.12, 0.25), 160);
            }
            gameOver() {
                if (!this.enabled || !this.ctx) return;
                setTimeout(() => this.playBeep(220, 'triangle', 0.2, 0.2), 0);
                setTimeout(() => this.playBeep(180, 'triangle', 0.2, 0.2), 150);
                setTimeout(() => this.playBeep(140, 'triangle', 0.4, 0.25), 300);
            }
            win() {
                if (!this.enabled || !this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    setTimeout(() => this.playBeep(freq, 'sine', 0.2, 0.2), idx * 120);
                });
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sound = new SoundFX();

        const scoreDisplay = document.getElementById('scoreDisplay');
        const speedDisplay = document.getElementById('speedDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const livesContainer = document.getElementById('livesContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalDescription = document.getElementById('modalDescription');
        const startBtn = document.getElementById('startBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundText = document.getElementById('soundText');

        const touchLeftBtn = document.getElementById('touchLeftBtn');
        const touchRightBtn = document.getElementById('touchRightBtn');

        let gameState = 'MENU'; // 'MENU', 'PLAYING', 'PAUSED', 'GAMEOVER', 'WIN'
        let score = 0;
        let lives = 3;
        let speedMultiplier = 1.0;
        let highScore = localStorage.getItem('breakout_high_score') || 0;
        highScoreDisplay.textContent = highScore;

        const keys = { left: false, right: false };

        const normalPaddleWidth = 120;
        const expandedPaddleWidth = 180;
        let paddleTimer = null;

        const paddle = {
            width: normalPaddleWidth,
            height: 16,
            x: (canvas.width - normalPaddleWidth) / 2,
            y: canvas.height - 35,
            speed: 8.5
        };

        let items = [];

        class Item {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 13;
                this.vy = 2.2;
                this.rotation = 0;
            }

            update() {
                this.y += this.vy;
                this.rotation += 0.05;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.shadowColor = '#52b788';
                ctx.shadowBlur = 10;

                ctx.fillStyle = '#40916c';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#d8f3dc';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.rotate(this.rotation);
                ctx.fillStyle = '#fefae0';
                ctx.font = 'bold 12px Fredoka, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⚡', 0, 1);

                ctx.restore();
            }
        }

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 12,
            speed: 6.5,
            dx: 4.5 * (Math.random() > 0.5 ? 1 : -1),
            dy: -5.5,
            history: [],
            maxHistory: 6,
            rotation: 0
        };

        const brickConfig = {
            rows: 3,
            cols: 8,
            padding: 12,
            offsetTop: 65,
            offsetLeft: 35,
            height: 26,
            colors: [
                { fill: '#f4a261', stroke: '#e76f51', topHighlight: '#f8c090', shadow: '#9c4127' },
                { fill: '#e9c46a', stroke: '#d4a373', topHighlight: '#f2da9d', shadow: '#a3783a' },
                { fill: '#4ea8de', stroke: '#2b7fff', topHighlight: '#8ac7f1', shadow: '#1a54b3' }
            ]
        };

        brickConfig.width = (canvas.width - (brickConfig.offsetLeft * 2) - (brickConfig.padding * (brickConfig.cols - 1))) / brickConfig.cols;

        let bricks = [];
        let particles = [];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3.5 + 2;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initBricks() {
            bricks = [];
            for (let r = 0; r < brickConfig.rows; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickConfig.cols; c++) {
                    const brickX = brickConfig.offsetLeft + c * (brickConfig.width + brickConfig.padding);
                    const brickY = brickConfig.offsetTop + r * (brickConfig.height + brickConfig.padding);
                    bricks[r][c] = {
                        x: brickX,
                        y: brickY,
                        status: 1,
                        row: r,
                        colorInfo: brickConfig.colors[r % brickConfig.colors.length]
                    };
                }
            }
        }

        function setupEventListeners() {
            window.addEventListener('keydown', (e) => {
                sound.init();
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    keys.left = true;
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    keys.right = true;
                } else if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    togglePause();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    keys.left = false;
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    keys.right = false;
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                if (gameState !== 'PLAYING') return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const mouseX = (e.clientX - rect.left) * scaleX;
                paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, mouseX - paddle.width / 2));
            });

            let isTouching = false;
            canvas.addEventListener('touchstart', (e) => {
                sound.init();
                if (e.touches.length > 0) {
                    isTouching = true;
                    movePaddleTouch(e.touches[0]);
                }
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                if (isTouching && e.touches.length > 0) {
                    movePaddleTouch(e.touches[0]);
                }
            }, { passive: true });

            canvas.addEventListener('touchend', () => { isTouching = false; });

            function movePaddleTouch(touch) {
                if (gameState !== 'PLAYING') return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const touchX = (touch.clientX - rect.left) * scaleX;
                paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, touchX - paddle.width / 2));
            }

            const bindTouchBtn = (btn, keyName) => {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    sound.init();
                    keys[keyName] = true;
                });
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    keys[keyName] = false;
                });
                btn.addEventListener('mousedown', () => { keys[keyName] = true; });
                btn.addEventListener('mouseup', () => { keys[keyName] = false; });
            };

            bindTouchBtn(touchLeftBtn, 'left');
            bindTouchBtn(touchRightBtn, 'right');

            soundToggleBtn.addEventListener('click', () => {
                sound.init();
                sound.enabled = !sound.enabled;
                soundIcon.textContent = sound.enabled ? '🔊' : '🔇';
                soundText.textContent = sound.enabled ? '効果音: オン' : '効果音: オフ';
                soundToggleBtn.classList.toggle('opacity-50', !sound.enabled);
            });

            startBtn.addEventListener('click', () => {
                sound.init();
                if (gameState === 'MENU' || gameState === 'GAMEOVER' || gameState === 'WIN') {
                    resetGame();
                    startGame();
                } else if (gameState === 'PAUSED') {
                    resumeGame();
                }
            });
        }

        function updateSpeedDisplay() {
            if (speedDisplay) {
                speedDisplay.textContent = speedMultiplier.toFixed(1) + 'x';
            }
        }

        function resetBallAndPaddle() {
            if (paddleTimer) {
                clearTimeout(paddleTimer);
                paddleTimer = null;
            }
            paddle.width = normalPaddleWidth;
            paddle.x = (canvas.width - paddle.width) / 2;
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 50;
            
            const angle = (Math.random() * 0.6 - 0.3);
            const speed = ball.speed * speedMultiplier;
            ball.dx = speed * Math.sin(angle) + (Math.random() > 0.5 ? 3 : -3);
            ball.dy = -Math.abs(speed * Math.cos(angle));
            ball.history = [];
        }

        function resetGame() {
            score = 0;
            lives = 3;
            speedMultiplier = 1.0;
            items = [];
            updateSpeedDisplay();
            updateScoreboard();
            initBricks();
            resetBallAndPaddle();
            particles = [];
        }

        function startGame() {
            gameState = 'PLAYING';
            modalOverlay.classList.add('hidden');
        }

        function resumeGame() {
            gameState = 'PLAYING';
            modalOverlay.classList.add('hidden');
        }

        function activatePaddleExpand() {
            sound.getItem();
            paddle.width = expandedPaddleWidth;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

            if (paddleTimer) clearTimeout(paddleTimer);

            paddleTimer = setTimeout(() => {
                paddle.width = normalPaddleWidth;
                paddleTimer = null;
            }, 5000);
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                modalTitle.textContent = 'タイムアウト';
                modalDescription.textContent = '遊戲暫停中。點擊下方按鈕或按空白鍵繼續。';
                startBtn.textContent = '試合再開 (RESUME)';
                modalOverlay.classList.remove('hidden');
            } else if (gameState === 'PAUSED') {
                resumeGame();
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            sound.gameOver();
            modalTitle.textContent = 'ゲームオーバー';
            modalTitle.className = "text-4xl sm:text-5xl font-bold font-fredoka text-amber-400 mb-3 drop-shadow";
            modalDescription.innerHTML = `棒球掉落邊界！比賽結束！<br>最終獲得分數：<span class="text-amber-300 font-bold text-xl">${score}</span> 分`;
            startBtn.textContent = 'リトライ (RETRY)';
            modalOverlay.classList.remove('hidden');
        }

        function triggerVictory() {
            gameState = 'WIN';
            sound.win();
            modalTitle.textContent = 'ホームラン！勝利！';
            modalTitle.className = "text-4xl sm:text-5xl font-bold font-fredoka text-yellow-300 mb-3 drop-shadow";
            modalDescription.innerHTML = `恭喜清除所有磚塊！精彩的表現！<br>總共獲得：<span class="text-amber-300 font-bold text-xl">${score}</span> 分`;
            startBtn.textContent = 'もう一度遊ぶ (PLAY AGAIN)';
            modalOverlay.classList.remove('hidden');
        }

        function updateScoreboard() {
            scoreDisplay.textContent = score;
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('breakout_high_score', highScore);
            }

            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('span');
                heart.textContent = '❤️';
                heart.className = i < lives ? 'opacity-100 scale-100 transition-all' : 'opacity-25 scale-75 transition-all';
                livesContainer.appendChild(heart);
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 14; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Paddle Movement
            if (keys.left) paddle.x -= paddle.speed;
            if (keys.right) paddle.x += paddle.speed;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

            // Trail History
            ball.history.push({ x: ball.x, y: ball.y });
            if (ball.history.length > ball.maxHistory) ball.history.shift();

            // Ball Physics & Baseball Rotation
            ball.x += ball.dx;
            ball.y += ball.dy;
            ball.rotation += Math.hypot(ball.dx, ball.dy) * 0.03;

            // Wall Collisions
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.dx = -ball.dx;
                sound.hitWall();
            } else if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.dx = -ball.dx;
                sound.hitWall();
            }

            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.dy = -ball.dy;
                sound.hitWall();
            }

            // Bottom Boundary (Life Loss)
            if (ball.y + ball.radius > canvas.height) {
                lives--;
                sound.loseLife();
                updateScoreboard();

                if (lives <= 0) {
                    triggerGameOver();
                } else {
                    resetBallAndPaddle();
                }
                return;
            }

            // Paddle Collision
            if (
                ball.y + ball.radius >= paddle.y &&
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width &&
                ball.dy > 0
            ) {
                sound.hitPaddle();
                const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                const maxAngle = Math.PI / 3;
                const bounceAngle = hitPoint * maxAngle;
                const speed = Math.hypot(ball.dx, ball.dy);
                
                ball.dx = speed * Math.sin(bounceAngle);
                ball.dy = -speed * Math.cos(bounceAngle);
                ball.y = paddle.y - ball.radius - 1;
            }

            // Bricks Collision
            let remainingBricks = 0;

            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        remainingBricks++;

                        if (
                            ball.x + ball.radius > b.x &&
                            ball.x - ball.radius < b.x + brickConfig.width &&
                            ball.y + ball.radius > b.y &&
                            ball.y - ball.radius < b.y + brickConfig.height
                        ) {
                            b.status = 0;
                            score += 10;
                            updateScoreboard();
                            sound.breakBrick(r);

                            createExplosion(
                                b.x + brickConfig.width / 2,
                                b.y + brickConfig.height / 2,
                                b.colorInfo.fill
                            );

                            // 20% Chance to drop item
                            if (Math.random() < 0.20) {
                                items.push(new Item(b.x + brickConfig.width / 2, b.y + brickConfig.height / 2));
                            }

                            const prevX = ball.x - ball.dx;
                            if (prevX + ball.radius <= b.x || prevX - ball.radius >= b.x + brickConfig.width) {
                                ball.dx = -ball.dx;
                            } else {
                                ball.dy = -ball.dy;
                            }

                            remainingBricks--;

                            // Check speed boost condition (When half bricks are destroyed)
                            if (remainingBricks <= 12 && speedMultiplier === 1.0) {
                                speedMultiplier = 1.5;
                                ball.dx *= 1.5;
                                ball.dy *= 1.5;
                                sound.speedUp();
                                updateSpeedDisplay();
                            }
                            break;
                        }
                    }
                }
            }

            // Update Dropped Items
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.update();

                if (
                    item.y + item.radius >= paddle.y &&
                    item.y - item.radius <= paddle.y + paddle.height &&
                    item.x >= paddle.x &&
                    item.x <= paddle.x + paddle.width
                ) {
                    activatePaddleExpand();
                    createExplosion(item.x, item.y, '#52b788');
                    items.splice(i, 1);
                    continue;
                }

                if (item.y - item.radius > canvas.height) {
                    items.splice(i, 1);
                }
            }

            if (remainingBricks === 0) {
                triggerVictory();
            }

            // Update Particle Engine
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }
        }

        function drawBaseballField() {
            ctx.fillStyle = '#2d6a4f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            const stripeWidth = 50;
            for (let x = 0; x < canvas.width; x += stripeWidth * 2) {
                ctx.fillRect(x, 0, stripeWidth, canvas.height);
            }

            ctx.save();
            ctx.fillStyle = '#b07d5b';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height + 120, 320, Math.PI, 0, false);
            ctx.fill();

            ctx.strokeStyle = '#f4f1de';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, canvas.height - 30);
            ctx.lineTo(60, 100);
            ctx.moveTo(canvas.width / 2, canvas.height - 30);
            ctx.lineTo(canvas.width - 60, 100);
            ctx.stroke();

            ctx.fillStyle = '#523d2e';
            ctx.fillRect(0, 0, canvas.width, 35);
            ctx.fillStyle = '#83624c';
            ctx.fillRect(0, 30, canvas.width, 5);

            ctx.restore();
        }

        function drawPaddle() {
            ctx.save();

            if (paddleTimer) {
                ctx.shadowColor = '#ffe66d';
                ctx.shadowBlur = 12;
            }

            const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.width, paddle.y);
            grad.addColorStop(0, '#8c5023');
            grad.addColorStop(0.2, '#d49b58');
            grad.addColorStop(0.8, '#e5aa65');
            grad.addColorStop(1, '#9e5b29');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fill();

            ctx.strokeStyle = '#42220c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(paddle.x + 18, paddle.y);
            ctx.lineTo(paddle.x + 18, paddle.y + paddle.height);
            ctx.moveTo(paddle.x + 24, paddle.y);
            ctx.lineTo(paddle.x + 24, paddle.y + paddle.height);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            ctx.roundRect(paddle.x + 25, paddle.y + 2, paddle.width - 32, 3, 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBall() {
            ctx.save();

            for (let i = 0; i < ball.history.length; i++) {
                const pos = ball.history[i];
                const alpha = (i + 1) / ball.history.length * 0.25;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, ball.radius * 0.8, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.rotation);

            ctx.fillStyle = '#fefae0';
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#4a5759';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.strokeStyle = '#e63946';
            ctx.lineWidth = 2;

            const r = ball.radius;
            ctx.beginPath();
            ctx.arc(-r * 0.55, 0, r * 0.82, -Math.PI * 0.35, Math.PI * 0.35);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(r * 0.55, 0, r * 0.82, Math.PI * 0.65, Math.PI * 1.35);
            ctx.stroke();

            ctx.strokeStyle = '#d62828';
            ctx.lineWidth = 1.2;
            const numStitches = 4;
            for (let i = 0; i < numStitches; i++) {
                const angle = -Math.PI * 0.25 + (i * (Math.PI * 0.5 / (numStitches - 1)));
                
                const lx = -r * 0.55 + r * 0.82 * Math.cos(angle);
                const ly = r * 0.82 * Math.sin(angle);
                if (Math.hypot(lx, ly) <= r - 1) {
                    ctx.beginPath();
                    ctx.moveTo(lx - 1.8, ly - 1.8);
                    ctx.lineTo(lx + 1.8, ly + 1.8);
                    ctx.stroke();
                }

                const rx = r * 0.55 + r * 0.82 * Math.cos(angle + Math.PI);
                const ry = r * 0.82 * Math.sin(angle + Math.PI);
                if (Math.hypot(rx, ry) <= r - 1) {
                    ctx.beginPath();
                    ctx.moveTo(rx - 1.8, ry + 1.8);
                    ctx.lineTo(rx + 1.8, ry - 1.8);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        function drawBricks() {
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        ctx.save();

                        ctx.fillStyle = b.colorInfo.fill;
                        ctx.beginPath();
                        ctx.roundRect(b.x, b.y, brickConfig.width, brickConfig.height, 6);
                        ctx.fill();

                        ctx.fillStyle = b.colorInfo.topHighlight;
                        ctx.beginPath();
                        ctx.roundRect(b.x + 2, b.y + 2, brickConfig.width - 4, 4, 3);
                        ctx.fill();

                        ctx.strokeStyle = b.colorInfo.stroke;
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        ctx.restore();
                    }
                }
            }
        }

        function render() {
            drawBaseballField();
            drawBricks();
            items.forEach(item => item.draw());
            drawPaddle();
            drawBall();
            particles.forEach(p => p.draw());
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            initBricks();
            setupEventListeners();
            updateScoreboard();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
