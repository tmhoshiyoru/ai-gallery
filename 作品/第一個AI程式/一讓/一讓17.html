<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-950 text-emerald-400">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Retro Snake - 經典復古貪食蛇</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Retro Arcade Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive, monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            background-color: #05050a;
        }

        /* CRT Screen Scanline Effect */
        .crt-overlay::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Retro Arcade Neon Shadows */
        .glow-green {
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5), inset 0 0 10px rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
        }

        .text-glow-green {
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.8), 0 0 15px rgba(34, 197, 94, 0.4);
        }

        .text-glow-red {
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.8), 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .text-glow-yellow {
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.8), 0 0 15px rgba(234, 179, 8, 0.4);
        }

        /* Pixelated canvas rendering */
        canvas {
            image-rendering: pixelated;
        }

        /* Custom D-Pad Touch Buttons */
        .dpad-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #22c55e;
            color: #22c55e;
            box-shadow: 0 4px 0 #15803d, 0 0 10px rgba(34, 197, 94, 0.3);
        }
        .dpad-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #15803d, 0 0 15px rgba(34, 197, 94, 0.8);
            background: rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between items-center p-2 md:p-4 text-xs select-none">

    <!-- Top Bar / Arcade Cabinet Header -->
    <header class="w-full max-w-xl mx-auto flex items-center justify-between border-b-4 border-emerald-500/50 pb-3 pt-1 z-20">
        <div class="flex items-center gap-2">
            <span class="inline-block w-3 h-3 bg-red-500 animate-ping"></span>
            <h1 class="text-xs md:text-sm text-glow-green text-emerald-400 tracking-wider">
                RETRO<span class="text-red-500">SNAKE</span>
            </h1>
        </div>

        <!-- Real-time Score Display -->
        <div class="flex items-center gap-4 text-[10px] md:text-xs">
            <div class="text-right">
                <div class="text-slate-400 mb-1">SCORE</div>
                <div id="scoreDisplay" class="text-emerald-400 text-glow-green font-bold">0000</div>
            </div>
            <div class="text-right">
                <div class="text-slate-400 mb-1">HIGH</div>
                <div id="highScoreDisplay" class="text-yellow-400 text-glow-yellow font-bold">0000</div>
            </div>
            <button id="audioToggle" class="p-1.5 rounded border border-emerald-500/50 hover:bg-emerald-950/50 text-emerald-400 transition" title="Toggle Sound">
                <svg id="soundIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M17.535 6.464a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Game Frame -->
    <main class="relative my-auto w-full max-w-xl flex flex-col items-center justify-center">
        
        <!-- Canvas Container with CRT Effect -->
        <div id="canvasWrapper" class="crt-overlay relative w-full aspect-square max-w-[480px] bg-black rounded-lg border-4 border-emerald-500 glow-green overflow-hidden flex items-center justify-center shadow-2xl">
            
            <canvas id="gameCanvas" class="w-full h-full block bg-slate-950"></canvas>

            <!-- Start Overlay -->
            <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-30">
                <div class="text-sm md:text-lg text-emerald-400 text-glow-green mb-4 leading-relaxed animate-pulse">
                    PRESS START
                </div>
                <p class="text-[9px] md:text-[10px] text-slate-300 mb-8 leading-loose max-w-xs">
                    使用方向鍵 <kbd class="text-emerald-400">↑ ↓ ← →</kbd> 控制蛇的移動方向。<br>
                    吃掉紅色蘋果得 10 分並增加長度！
                </p>
                <button id="startBtn" class="px-6 py-3 rounded bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs tracking-wider transition transform hover:scale-105 active:scale-95 shadow-[0_0_15px_rgba(34,197,94,0.8)]">
                    INSERT COIN & PLAY
                </button>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameOverOverlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-30">
                <div class="text-lg md:text-2xl text-red-500 text-glow-red mb-3 animate-bounce">
                    GAME OVER
                </div>
                <p id="gameOverReason" class="text-[9px] text-slate-400 mb-6">撞到牆壁了！</p>
                
                <div class="bg-slate-900 border-2 border-emerald-500/50 rounded-lg p-3 mb-6 min-w-[180px] text-center">
                    <div class="text-[8px] text-slate-400 mb-1">FINAL SCORE</div>
                    <div id="finalScore" class="text-sm text-emerald-400 text-glow-green font-bold">0</div>
                </div>

                <button id="restartBtn" class="px-6 py-3 rounded bg-red-500 hover:bg-red-400 text-white font-bold text-xs tracking-wider transition transform hover:scale-105 active:scale-95 shadow-[0_0_15px_rgba(239,68,68,0.8)]">
                    TRY AGAIN
                </button>
            </div>

            <!-- Pause Modal -->
            <div id="pauseOverlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 z-30">
                <div class="text-sm text-yellow-400 text-glow-yellow tracking-widest mb-4 animate-pulse">PAUSED</div>
                <p class="text-[8px] text-slate-400 mb-6">按下 ESC 或 P 繼續遊戲</p>
                <button id="resumeBtn" class="px-5 py-2.5 rounded bg-yellow-500 text-slate-950 font-bold text-xs hover:bg-yellow-400 transition">
                    RESUME
                </button>
            </div>

        </div>

        <!-- Onscreen Touch D-Pad for Mobile Users -->
        <div class="md:hidden mt-4 grid grid-cols-3 gap-2 w-48 h-36 mx-auto z-20">
            <div></div>
            <button id="btnUp" class="dpad-btn rounded-t-lg flex items-center justify-center text-lg font-bold">▲</button>
            <div></div>
            <button id="btnLeft" class="dpad-btn rounded-l-lg flex items-center justify-center text-lg font-bold">◄</button>
            <div class="flex items-center justify-center text-[8px] text-slate-600 font-bold">DPAD</div>
            <button id="btnRight" class="dpad-btn rounded-r-lg flex items-center justify-center text-lg font-bold">►</button>
            <div></div>
            <button id="btnDown" class="dpad-btn rounded-b-lg flex items-center justify-center text-lg font-bold">▼</button>
            <div></div>
        </div>

    </main>

    <!-- Footer Controls Hint -->
    <footer class="w-full max-w-xl mx-auto pt-2 text-center text-[8px] md:text-[10px] text-slate-500 z-20">
        控制：<span class="text-emerald-400">↑ ↓ ← →</span> 或 <span class="text-emerald-400">W A S D</span> | 按 <span class="text-emerald-400">P / ESC</span> 暫停
    </footer>

    <script>
        // Web Audio API Retro Chiptune Sound Synthesizer
        class ChiptuneAudio {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playEat() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square'; // Classic NES Chiptune sound
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.setValueAtTime(600, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playDie() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }

            playMove() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.03);
            }

            playStart() {
                if (this.muted || !this.ctx) return;
                const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        if (!this.ctx) return;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.1);
                    }, i * 70);
                });
            }
        }

        const audio = new ChiptuneAudio();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Fixed Grid Resolution
        const GRID_SIZE = 20; // 20x20 Grid
        const CANVAS_SIZE = 400; // Logical 400x400
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;
        const CELL_SIZE = CANVAS_SIZE / GRID_SIZE; // 20px per cell

        // State Variables
        let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER
        let score = 0;
        let highScore = localStorage.getItem('snake_arcade_highscore') || 0;
        let gameSpeed = 110; // ms per tick
        let gameInterval = null;

        // Snake Data Structure
        let snake = [];
        let dir = { x: 1, y: 0 };      // Current direction
        let nextDir = { x: 1, y: 0 };  // Input buffer to prevent self-collision on fast double-taps

        // Food & Particle Systems
        let food = { x: 0, y: 0 };
        let particles = [];
        let applePulse = 0;

        document.getElementById('highScoreDisplay').innerText = String(highScore).padStart(4, '0');

        const audioBtn = document.getElementById('audioToggle');
        const soundIcon = document.getElementById('soundIcon');
        audioBtn.addEventListener('click', () => {
            audio.init();
            audio.muted = !audio.muted;
            if (audio.muted) {
                soundIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />`;
                audioBtn.classList.add('opacity-50');
            } else {
                soundIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M17.535 6.464a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />`;
                audioBtn.classList.remove('opacity-50');
            }
        });

        function changeDirection(newX, newY) {
            // Prevent 180-degree immediate reversal into snake's own neck
            if (newX === -dir.x && newY === 0) return;
            if (newY === -dir.y && newX === 0) return;
            nextDir = { x: newX, y: newY };
        }

        window.addEventListener('keydown', (e) => {
            if (gameState !== 'PLAYING' && e.key === ' ') {
                if (gameState === 'START' || gameState === 'GAMEOVER') startGame();
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection(1, 0);
                    break;
                case 'Escape':
                case 'p':
                case 'P':
                    togglePause();
                    break;
            }
        });

        // D-Pad Button Events for Touch Devices
        document.getElementById('btnUp').addEventListener('click', () => changeDirection(0, -1));
        document.getElementById('btnDown').addEventListener('click', () => changeDirection(0, 1));
        document.getElementById('btnLeft').addEventListener('click', () => changeDirection(-1, 0));
        document.getElementById('btnRight').addEventListener('click', () => changeDirection(1, 0));

        // Touch Swipe Gestures for Canvas
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (gameState !== 'PLAYING') return;
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 20) changeDirection(1, 0);
                else if (diffX < -20) changeDirection(-1, 0);
            } else {
                if (diffY > 20) changeDirection(0, 1);
                else if (diffY < -20) changeDirection(0, -1);
            }
        }, { passive: true });

        function spawnFood() {
            let valid = false;
            while (!valid) {
                const rx = Math.floor(Math.random() * GRID_SIZE);
                const ry = Math.floor(Math.random() * GRID_SIZE);
                
                // Ensure food does not spawn on top of snake body
                const onSnake = snake.some(segment => segment.x === rx && segment.y === ry);
                if (!onSnake) {
                    food = { x: rx, y: ry };
                    valid = true;
                }
            }
        }

        function createPixelParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x * CELL_SIZE + CELL_SIZE / 2,
                    y: y * CELL_SIZE + CELL_SIZE / 2,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1
                });
            }
        }

        function startGame() {
            audio.init();
            audio.playStart();

            // Reset Snake to Center
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            
            score = 0;
            gameSpeed = 110;
            particles = [];

            updateScoreDisplay();
            spawnFood();

            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            document.getElementById('pauseOverlay').classList.add('hidden');

            gameState = 'PLAYING';

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameStep, gameSpeed);
        }

        function updateScoreDisplay() {
            document.getElementById('scoreDisplay').innerText = String(score).padStart(4, '0');
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_arcade_highscore', highScore);
                document.getElementById('highScoreDisplay').innerText = String(highScore).padStart(4, '0');
            }
        }

        function gameStep() {
            if (gameState !== 'PLAYING') return;

            // Apply buffered direction
            dir = { ...nextDir };

            // Calculate new head position
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            // 1. Collision with Walls
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                triggerGameOver("撞到牆壁了！");
                return;
            }

            // 2. Collision with Self
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                triggerGameOver("撞到自己了！");
                return;
            }

            // Move Snake Head
            snake.unshift(head);

            // 3. Collision with Food (Apple)
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScoreDisplay();
                audio.playEat();
                createPixelParticles(food.x, food.y, '#ef4444');
                spawnFood();

                // Dynamic speed increase (caps at 50ms)
                if (gameSpeed > 50 && score % 50 === 0) {
                    gameSpeed -= 5;
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameStep, gameSpeed);
                }
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }

            audio.playMove();
        }

        function triggerGameOver(reason) {
            gameState = 'GAMEOVER';
            audio.playDie();
            clearInterval(gameInterval);

            document.getElementById('gameOverReason').innerText = reason;
            document.getElementById('finalScore').innerText = String(score).padStart(4, '0');
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                document.getElementById('pauseOverlay').classList.remove('hidden');
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                document.getElementById('pauseOverlay').classList.add('hidden');
            }
        }

        // Button Click Handlers
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);

        function render() {
            applePulse += 0.08;

            // Clear Background
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw Arcade Grid Lines
            ctx.strokeStyle = 'rgba(34, 197, 94, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= CANVAS_SIZE; i += CELL_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, CANVAS_SIZE);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(CANVAS_SIZE, i);
                ctx.stroke();
            }

            // Render Apple (Food) with Retro Pulse & Leaf
            if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                const fx = food.x * CELL_SIZE;
                const fy = food.y * CELL_SIZE;
                const pulseOffset = Math.sin(applePulse) * 1.5;

                // Glowing Apple Shadow
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 10;

                // Red Body
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(
                    fx + 3 - pulseOffset / 2,
                    fy + 4 - pulseOffset / 2,
                    CELL_SIZE - 6 + pulseOffset,
                    CELL_SIZE - 6 + pulseOffset
                );

                // Green Leaf Notch
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(fx + CELL_SIZE / 2, fy + 1, 3, 3);
            }

            // Render Snake Body & Head
            snake.forEach((segment, index) => {
                const sx = segment.x * CELL_SIZE;
                const sy = segment.y * CELL_SIZE;

                if (index === 0) {
                    // Head - Bright Neon Green
                    ctx.shadowColor = '#22c55e';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#4ade80';
                    ctx.fillRect(sx + 1, sy + 1, CELL_SIZE - 2, CELL_SIZE - 2);

                    // Eyes
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#05050a';
                    if (dir.x === 1) { // Right
                        ctx.fillRect(sx + 12, sy + 4, 3, 3);
                        ctx.fillRect(sx + 12, sy + 13, 3, 3);
                    } else if (dir.x === -1) { // Left
                        ctx.fillRect(sx + 4, sy + 4, 3, 3);
                        ctx.fillRect(sx + 4, sy + 13, 3, 3);
                    } else if (dir.y === -1) { // Up
                        ctx.fillRect(sx + 4, sy + 4, 3, 3);
                        ctx.fillRect(sx + 13, sy + 4, 3, 3);
                    } else { // Down
                        ctx.fillRect(sx + 4, sy + 12, 3, 3);
                        ctx.fillRect(sx + 13, sy + 12, 3, 3);
                    }
                } else {
                    // Body Segments Gradient
                    ctx.shadowColor = '#16a34a';
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = index % 2 === 0 ? '#22c55e' : '#16a34a';
                    ctx.fillRect(sx + 2, sy + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                }
            });

            // Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life -= 0.04;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        // Start render loop
        render();
