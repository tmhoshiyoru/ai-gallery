<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星際守護者 - 2D太空射擊遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', 'Orbitron', sans-serif;
            background-color: #05050d;
            color: #ffffff;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.5);
        }

        .neon-text-red {
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.8), 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .neon-box-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4), inset 0 0 15px rgba(6, 182, 212, 0.2);
            border: 1px solid rgba(6, 182, 212, 0.6);
        }

        /* Canvas container aspect ratio styling */
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 860px;
            margin: 0 auto;
            overflow: hidden;
            background: #090a16;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Screen shake animation */
        .shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-950 p-0 sm:p-4">

    <div id="game-wrapper" class="relative sm:rounded-2xl border-0 sm:border border-cyan-500/30 flex flex-col justify-between">
        
        <!-- Canvas Layer -->
        <canvas id="gameCanvas" class="absolute inset-0 z-0"></canvas>

        <!-- UI HUD Overlay (Top Bar) -->
        <div id="hud" class="relative z-10 p-4 flex justify-between items-center pointer-events-none select-none">
            <!-- Score & Level -->
            <div class="flex flex-col">
                <span class="text-xs text-cyan-400 font-orbitron tracking-widest uppercase">Score</span>
                <span id="score-display" class="text-3xl font-black font-orbitron text-white neon-text-cyan">0</span>
            </div>

            <!-- Health Bar / Hearts -->
            <div class="flex flex-col items-end">
                <span class="text-xs text-red-400 font-orbitron tracking-widest uppercase mb-1">Shield Status</span>
                <div id="hp-container" class="flex gap-1.5 text-red-500 text-lg">
                    <i class="fa-solid fa-heart animate-pulse"></i>
                    <i class="fa-solid fa-heart animate-pulse"></i>
                    <i class="fa-solid fa-heart animate-pulse"></i>
                </div>
            </div>
        </div>

        <!-- Middle Overlay Messages / Popups -->
        <div id="message-container" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-6 text-center pointer-events-none">
            <!-- Dynamic popups will appear here -->
        </div>

        <!-- Start Screen Modal -->
        <div id="start-screen" class="absolute inset-0 z-30 flex flex-col items-center justify-center p-6 bg-slate-950/85 backdrop-blur-md text-center transition-opacity duration-300">
            <div class="mb-6">
                <div class="inline-block p-3 rounded-full bg-cyan-500/10 border border-cyan-400/30 mb-3 animate-bounce">
                    <i class="fa-solid fa-shuttle-space text-4xl text-cyan-400 transform -rotate-45"></i>
                </div>
                <h1 class="text-4xl font-extrabold font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-200 to-indigo-400 mb-2">
                    GALAXY DEFENDER
                </h1>
                <p class="text-slate-400 text-sm">太空防禦戰：擊退入侵敵機</p>
            </div>

            <div class="w-full max-w-xs bg-slate-900/80 p-4 rounded-xl border border-slate-800 mb-8 text-left text-xs text-slate-300 space-y-2.5">
                <div class="flex items-center gap-3">
                    <kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-cyan-400 font-mono">←</kbd>
                    <kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-cyan-400 font-mono">→</kbd>
                    <span>或 <kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-cyan-400 font-mono">A/D</kbd> 左右移動飛船</span>
                </div>
                <div class="flex items-center gap-3">
                    <kbd class="px-3 py-1 bg-slate-800 border border-slate-700 rounded text-cyan-400 font-mono">Space</kbd>
                    <span>發射雷射子彈</span>
                </div>
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-bullseye text-cyan-400 w-5 text-center"></i>
                    <span>每擊毀敵機得分 <strong class="text-yellow-400">+10</strong></span>
                </div>
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-triangle-exclamation text-red-400 w-5 text-center"></i>
                    <span>敵機撞擊或越過底部扣損 <strong class="text-red-400">1 HP</strong></span>
                </div>
            </div>

            <button id="start-btn" class="w-full max-w-xs py-3.5 px-6 rounded-xl font-orbitron font-bold text-lg bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white shadow-lg shadow-cyan-500/30 transform active:scale-95 transition-all pointer-events-auto cursor-pointer">
                START MISSION
            </button>
        </div>

        <!-- Game Over Screen Modal -->
        <div id="gameover-screen" class="absolute inset-0 z-30 flex flex-col items-center justify-center p-6 bg-slate-950/90 backdrop-blur-md text-center hidden">
            <div class="mb-4">
                <div class="inline-block p-3 rounded-full bg-red-500/10 border border-red-500/30 mb-2">
                    <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500"></i>
                </div>
                <h2 class="text-3xl font-black font-orbitron text-red-500 neon-text-red">MISSION FAILED</h2>
                <p class="text-slate-400 text-xs mt-1">戰機防禦網已被敵軍突破</p>
            </div>

            <div class="w-full max-w-xs bg-slate-900/90 p-5 rounded-xl border border-slate-800 my-6 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">本次得分</span>
                    <span id="final-score" class="text-2xl font-bold font-orbitron text-cyan-400">0</span>
                </div>
                <div class="h-px bg-slate-800 w-full"></div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">歷史最高分</span>
                    <span id="high-score" class="text-lg font-bold font-orbitron text-yellow-400">0</span>
                </div>
            </div>

            <button id="restart-btn" class="w-full max-w-xs py-3.5 px-6 rounded-xl font-orbitron font-bold text-lg bg-gradient-to-r from-red-500 to-orange-600 hover:from-red-400 hover:to-orange-500 text-white shadow-lg shadow-red-500/30 transform active:scale-95 transition-all pointer-events-auto cursor-pointer">
                RETRY MISSION
            </button>
        </div>

        <!-- On-Screen Touch Controls (Mobile Friendly) -->
        <div id="touch-controls" class="relative z-20 p-4 pb-6 flex justify-between items-center gap-4 select-none pointer-events-auto sm:hidden">
            <div class="flex gap-2">
                <button id="btn-left" class="w-16 h-16 rounded-2xl bg-slate-800/70 border border-cyan-500/30 text-cyan-400 text-2xl active:bg-cyan-500/30 active:scale-95 transition flex items-center justify-center">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <button id="btn-right" class="w-16 h-16 rounded-2xl bg-slate-800/70 border border-cyan-500/30 text-cyan-400 text-2xl active:bg-cyan-500/30 active:scale-95 transition flex items-center justify-center">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            <button id="btn-fire" class="w-20 h-16 rounded-2xl bg-gradient-to-r from-red-600 to-amber-600 border border-red-400/40 text-white text-xl font-bold active:scale-95 transition shadow-lg shadow-red-600/30 flex items-center justify-center gap-1">
                <i class="fa-solid fa-crosshairs"></i>
            </button>
        </div>

    </div>

    <script>
        /* Modern Web Audio Synthesizer for self-contained SFX without external audio files */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            shoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.12);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            explosion() {
                if (!this.ctx) return;
                // Create audio noise buffer
                const bufferSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start();
                noise.stop(this.ctx.currentTime + 0.3);
            }

            hit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        }

        const sfx = new SoundFX();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('game-wrapper');

        // UI elements
        const scoreDisplay = document.getElementById('score-display');
        const hpContainer = document.getElementById('hp-container');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreDisplay = document.getElementById('final-score');
        const highScoreDisplay = document.getElementById('high-score');

        // Game Settings
        let gameWidth = 480;
        let gameHeight = 800;
        let scale = 1;

        let isPlaying = false;
        let score = 0;
        let maxHp = 3;
        let hp = maxHp;
        let lastTime = 0;
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 1000; // ms

        // Input state
        const keys = {
            left: false,
            right: false,
            space: false
        };

        // Resize Canvas dynamically keeping proper DPR
        function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            gameWidth = rect.width;
            gameHeight = rect.height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();


        // 1. Starfield Background Particle
        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * gameWidth;
                this.y = initial ? Math.random() * gameHeight : -10;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.8 + 0.2;
            }

            update() {
                this.y += this.speed;
                if (this.y > gameHeight) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.save();
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 2. Player Spaceship
        class Player {
            constructor() {
                this.width = 44;
                this.height = 48;
                this.x = gameWidth / 2;
                this.y = gameHeight - 90;
                this.speed = 360; // px/sec
                this.lastShot = 0;
                this.shootCooldown = 150; // ms
                this.invulnerable = false;
                this.invulnerableTimer = 0;
            }

            reset() {
                this.x = gameWidth / 2;
                this.y = gameHeight - 90;
                this.invulnerable = false;
            }

            update(deltaTime) {
                // Movement
                if (keys.left) {
                    this.x -= this.speed * deltaTime;
                }
                if (keys.right) {
                    this.x += this.speed * deltaTime;
                }

                // Clamp within bounds
                const margin = this.width / 2;
                if (this.x < margin) this.x = margin;
                if (this.x > gameWidth - margin) this.x = gameWidth - margin;

                // Firing logic
                if (keys.space) {
                    this.shoot();
                }

                // Invulnerability blink timer
                if (this.invulnerable) {
                    this.invulnerableTimer -= deltaTime;
                    if (this.invulnerableTimer <= 0) {
                        this.invulnerable = false;
                    }
                }
            }

            shoot() {
                const now = performance.now();
                if (now - this.lastShot >= this.shootCooldown) {
                    bullets.push(new Bullet(this.x, this.y - this.height / 2));
                    this.lastShot = now;
                    sfx.shoot();
                    
                    // Add subtle recoil thruster effect
                    for(let i = 0; i < 3; i++) {
                        particles.push(new Particle(
                            this.x + (Math.random() - 0.5) * 10,
                            this.y + this.height / 2,
                            (Math.random() - 0.5) * 30,
                            Math.random() * 100 + 100,
                            '#00f3ff',
                            Math.random() * 3 + 2,
                            0.2
                        ));
                    }
                }
            }

            hit() {
                if (this.invulnerable) return false;
                this.invulnerable = true;
                this.invulnerableTimer = 1.5; // 1.5s iframe
                return true;
            }

            draw() {
                if (this.invulnerable && Math.floor(performance.now() / 100) % 2 === 0) {
                    return; // Blink when invulnerable
                }

                ctx.save();
                ctx.translate(this.x, this.y);

                // Engine Flame Effect
                const flameHeight = Math.random() * 12 + 10;
                const gradientFlame = ctx.createLinearGradient(0, this.height / 2, 0, this.height / 2 + flameHeight);
                gradientFlame.addColorStop(0, '#00f3ff');
                gradientFlame.addColorStop(0.5, '#ff0055');
                gradientFlame.addColorStop(1, 'transparent');

                ctx.fillStyle = gradientFlame;
                ctx.beginPath();
                ctx.moveTo(-8, this.height / 2 - 2);
                ctx.lineTo(8, this.height / 2 - 2);
                ctx.lineTo(0, this.height / 2 + flameHeight);
                ctx.closePath();
                ctx.fill();

                // Wings Outer Glow
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 12;

                // Ship Body
                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = '#00f3ff';
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2); // Nose
                ctx.lineTo(this.width / 2, this.height / 2); // Right wing tip
                ctx.lineTo(this.width / 4, this.height / 3); // Right inner wing
                ctx.lineTo(-this.width / 4, this.height / 3); // Left inner wing
                ctx.lineTo(-this.width / 2, this.height / 2); // Left wing tip
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Cockpit Glass
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.ellipse(0, -5, 5, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // 3. Player Laser Bullet
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speed = 700; // px/sec
                this.radius = 3;
                this.height = 16;
                this.markedForDeletion = false;
            }

            update(deltaTime) {
                this.y -= this.speed * deltaTime;
                if (this.y < -20) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#ffffff';

                ctx.beginPath();
                ctx.roundRect(this.x - this.radius, this.y - this.height, this.radius * 2, this.height, 3);
                ctx.fill();
                ctx.restore();
            }
        }

        // 4. Enemy Spaceship
        class Enemy {
            constructor() {
                this.radius = Math.random() * 8 + 16; // size
                this.x = Math.random() * (gameWidth - this.radius * 2) + this.radius;
                this.y = -this.radius * 2;
                this.speed = Math.random() * 80 + 120 + (score * 0.5); // Scales up with score
                this.hp = Math.random() < 0.2 ? 2 : 1; // 20% heavy enemy
                this.maxHp = this.hp;
                this.color = this.hp > 1 ? '#f43f5e' : '#a855f7'; // Red vs Purple
                this.markedForDeletion = false;
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 3;
            }

            update(deltaTime) {
                this.y += this.speed * deltaTime;
                this.rotation += this.rotSpeed * deltaTime;

                // Reached bottom: player loses HP
                if (this.y - this.radius > gameHeight) {
                    this.markedForDeletion = true;
                    takeDamage('敵機越過防線！');
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.strokeStyle = this.color;
                ctx.fillStyle = '#0f172a';
                ctx.lineWidth = 2.5;

                // Draw Polygon shape
                ctx.beginPath();
                const sides = this.maxHp > 1 ? 6 : 4;
                for (let i = 0; i < sides; i++) {
                    const angle = (i * 2 * Math.PI) / sides;
                    const px = Math.cos(angle) * this.radius;
                    const py = Math.sin(angle) * this.radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Core light
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }


        // 5. Explosion Particle Effect
        class Particle {
            constructor(x, y, vx, vy, color, radius, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.radius = radius;
                this.maxLife = life;
                this.life = life;
                this.markedForDeletion = false;
            }

            update(deltaTime) {
                this.x += this.vx * deltaTime;
                this.y += this.vy * deltaTime;
                this.vx *= 0.96; // drag
                this.vy *= 0.96;
                this.life -= deltaTime;
                if (this.life <= 0) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;

                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.radius * alpha), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 6. Expanding Shockwave Effect
        class Shockwave {
            constructor(x, y, maxRadius, color) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.maxRadius = maxRadius;
                this.color = color;
                this.life = 0.3; // sec
                this.maxLife = 0.3;
                this.markedForDeletion = false;
            }

            update(deltaTime) {
                this.life -= deltaTime;
                const progress = 1 - (this.life / this.maxLife);
                this.radius = progress * this.maxRadius;
                if (this.life <= 0) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }


        let stars = Array.from({ length: 60 }, () => new Star());
        let player = new Player();
        let bullets = [];
        let enemies = [];
        let particles = [];
        let shockwaves = [];

        // Helper: Create juicy explosion
        function createExplosion(x, y, color = '#ff9900', count = 25) {
            sfx.explosion();
            shockwaves.push(new Shockwave(x, y, 45, color));

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 250 + 50;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const radius = Math.random() * 4 + 2;
                const life = Math.random() * 0.4 + 0.3;
                const particleColor = i % 2 === 0 ? color : '#ffffff';

                particles.push(new Particle(x, y, vx, vy, particleColor, radius, life));
            }
        }

        // Trigger Screen Shake
        function triggerShake() {
            wrapper.classList.remove('shake');
            void wrapper.offsetWidth; // force reflow
            wrapper.classList.add('shake');
            setTimeout(() => wrapper.classList.remove('shake'), 300);
        }

        // Take Damage logic
        function takeDamage(msg) {
            if (!isPlaying) return;
            
            const hitSuccess = player.hit();
            if (!hitSuccess) return;

            hp--;
            sfx.hit();
            triggerShake();
            updateHpUI();

            if (msg) showFloatingText(msg, player.x, player.y - 40, '#f43f5e');

            if (hp <= 0) {
                gameOver();
            }
        }

        // Display Score / Status Text Popups
        function showFloatingText(text, x, y, color = '#38bdf8') {
            const el = document.createElement('div');
            el.className = 'absolute font-bold font-orbitron text-sm pointer-events-none transition-all duration-700 ease-out transform -translate-x-1/2 -translate-y-1/2';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            el.style.textShadow = `0 0 8px ${color}`;
            el.innerText = text;

            const container = document.getElementById('message-container');
            container.appendChild(el);

            requestAnimationFrame(() => {
                el.style.top = `${y - 35}px`;
                el.style.opacity = '0';
            });

            setTimeout(() => el.remove(), 700);
        }

        // Update Hearts HUD
        function updateHpUI() {
            hpContainer.innerHTML = '';
            for (let i = 0; i < maxHp; i++) {
                const heart = document.createElement('i');
                if (i < hp) {
                    heart.className = 'fa-solid fa-heart animate-pulse text-red-500';
                } else {
                    heart.className = 'fa-regular fa-heart text-slate-700';
                }
                hpContainer.appendChild(heart);
            }
        }


        // Collision Check Helper (Circle/Box or Circle/Circle)
        function checkCollision(circle1, circle2) {
            const dx = circle1.x - circle2.x;
            const dy = circle1.y - circle2.y;
            const distance = Math.hypot(dx, dy);
            return distance < circle1.radius + circle2.radius;
        }

        function updateGame(deltaTime) {
            // Update Stars
            stars.forEach(star => star.update());

            // Update Player
            player.update(deltaTime);

            // Spawn Enemies
            enemySpawnTimer += deltaTime * 1000;
            const currentInterval = Math.max(350, enemySpawnInterval - score * 5); // Speed up spawns over time
            if (enemySpawnTimer >= currentInterval) {
                enemies.push(new Enemy());
                enemySpawnTimer = 0;
            }

            // Update Bullets
            bullets.forEach(b => b.update(deltaTime));

            // Update Enemies & Check Collisions
            enemies.forEach(enemy => {
                enemy.update(deltaTime);

                // Check collision with Player
                const playerCircle = { x: player.x, y: player.y, radius: player.width / 2 };
                if (checkCollision(enemy, playerCircle)) {
                    enemy.markedForDeletion = true;
                    createExplosion(enemy.x, enemy.y, enemy.color, 20);
                    takeDamage('撞擊！');
                }

                // Check collision with Bullets
                bullets.forEach(bullet => {
                    if (!bullet.markedForDeletion && !enemy.markedForDeletion) {
                        const bulletCircle = { x: bullet.x, y: bullet.y, radius: bullet.radius };
                        if (checkCollision(enemy, bulletCircle)) {
                            bullet.markedForDeletion = true;
                            enemy.hp--;

                            // Small hit spark
                            for (let i = 0; i < 4; i++) {
                                particles.push(new Particle(bullet.x, bullet.y, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100, '#ffea00', 2, 0.15));
                            }

                            if (enemy.hp <= 0) {
                                enemy.markedForDeletion = true;
                                createExplosion(enemy.x, enemy.y, enemy.color, 25);
                                score += 10;
                                scoreDisplay.innerText = score;
                                showFloatingText('+10', enemy.x, enemy.y, '#eab308');
                            }
                        }
                    }
                });
            });

            // Update Particles & Shockwaves
            particles.forEach(p => p.update(deltaTime));
            shockwaves.forEach(sw => sw.update(deltaTime));

            // Clean up inactive objects
            bullets = bullets.filter(b => !b.markedForDeletion);
            enemies = enemies.filter(e => !e.markedForDeletion);
            particles = particles.filter(p => !p.markedForDeletion);
            shockwaves = shockwaves.filter(sw => !sw.markedForDeletion);
        }

        function render() {
            // Clear Frame
            ctx.fillStyle = '#090a16';
            ctx.fillRect(0, 0, gameWidth, gameHeight);

            // Draw Layered Stars
            stars.forEach(star => star.draw());

            // Draw Particles & Effects
            shockwaves.forEach(sw => sw.draw());
            particles.forEach(p => p.draw());

            // Draw Game Objects
            bullets.forEach(b => b.draw());
            enemies.forEach(e => e.draw());
            if (isPlaying) player.draw();
        }

        // Main Animation Loop
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const deltaTime = Math.min((timestamp - lastTime) / 1000, 0.1); // Clamp delta
            lastTime = timestamp;

            if (isPlaying) {
                updateGame(deltaTime);
            } else {
                stars.forEach(star => star.update());
            }

            render();
            requestAnimationFrame(gameLoop);
        }


        // Keyboard Control Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space') {
                keys.space = true;
                // Unlock audio context on user gesture
                sfx.init();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'Space') keys.space = false;
        });

        // Touch Control Listeners (Mobile HUD Buttons)
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnFire = document.getElementById('btn-fire');

        const bindTouch = (elem, keyName) => {
            elem.addEventListener('touchstart', (e) => {
                e.preventDefault();
                sfx.init();
                keys[keyName] = true;
            });
            elem.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[keyName] = false;
            });
        };

        bindTouch(btnLeft, 'left');
        bindTouch(btnRight, 'right');
        bindTouch(btnFire, 'space');

        // Direct Touch Dragging on Canvas for Smooth Mobile Flight
        let isDragging = false;
        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            sfx.init();
            isDragging = true;
            keys.space = true; // Auto-fire while dragging
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isPlaying || !isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            player.x = touchX;
        });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            keys.space = false;
        });

        // Start Game
        function startGame() {
            sfx.init();
            score = 0;
            hp = maxHp;
            scoreDisplay.innerText = score;
            updateHpUI();
            bullets = [];
            enemies = [];
            particles = [];
            shockwaves = [];
            player.reset();

            isPlaying = true;
            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
        }

        // Game Over
        function gameOver() {
            isPlaying = false;
            createExplosion(player.x, player.y, '#00f3ff', 50);

            // High score storage
            const savedHighScore = localStorage.getItem('defender_high_score') || 0;
            if (score > savedHighScore) {
                localStorage.setItem('defender_high_score', score);
                highScoreDisplay.innerText = score;
            } else {
                highScoreDisplay.innerText = savedHighScore;
            }

            finalScoreDisplay.innerText = score;

            setTimeout(() => {
                gameoverScreen.classList.remove('hidden');
            }, 600);
        }

        // Event Listeners for Modals
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Initialize Animation Engine
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
