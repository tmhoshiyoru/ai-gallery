<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>課堂打磚塊 - Classroom Breakout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      touch-action: manipulation;
      user-select: none;
    }
    body {
      font-family: 'Fredoka One', 'Noto Sans TC', sans-serif;
      background-color: #f5f0e6;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(255, 253, 230, 0.8) 0%, transparent 60%),
        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px, 24px 24px;
    }
    
    /* 日光燈閃爍動畫 */
    @keyframes fluorescentFlicker {
      0%, 100% { opacity: 0.98; }
      2% { opacity: 0.75; }
      3.5% { opacity: 0.95; }
      4% { opacity: 0.5; }
      5% { opacity: 0.98; }
      80% { opacity: 0.98; }
      81% { opacity: 0.82; }
      82% { opacity: 0.99; }
    }
    .fluorescent-overlay {
      animation: fluorescentFlicker 10s infinite;
      background: linear-gradient(180deg, rgba(255, 254, 235, 0.45) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
    }

    /* 黑板手寫微光 */
    .chalk-text {
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.6), 1px 1px 2px rgba(0,0,0,0.5);
    }
    .wood-border {
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4), 0 10px 25px rgba(0,0,0,0.15);
      border: 12px solid #8B5A2B;
      border-image: linear-gradient(to bottom right, #a66a38, #5c3a19) 12;
    }
    
    /* 彈出視窗動畫 */
    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.88) translateY(15px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-modal {
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-center p-2 sm:p-5 overflow-x-hidden relative">

  <!-- 日光燈頂部光暈 */ -->
  <div class="fixed top-0 left-0 w-full h-full fluorescent-overlay z-0"></div>

  <div class="w-full max-w-3xl flex flex-col items-center z-10 relative">
    
    <!-- Header / HUD Panel (木質黑板設計) -->
    <header class="w-full mb-3 px-4 py-3 bg-[#244232] text-amber-100 rounded-xl border-4 border-[#8B5A2B] shadow-md flex items-center justify-between">
      <div class="flex items-center space-x-2 sm:space-x-3">
        <div class="w-3 h-3 rounded-full bg-yellow-300 animate-pulse"></div>
        <h1 class="text-base sm:text-xl font-black tracking-wide text-amber-200 chalk-text">
          🏫 課堂打磚塊
        </h1>
      </div>
      
      <div class="flex items-center space-x-3 sm:space-x-6">
        <div class="text-right">
          <div class="text-[10px] sm:text-xs text-emerald-200 font-bold tracking-widest uppercase">SCORE</div>
          <div id="scoreText" class="text-lg sm:text-2xl font-black text-amber-200 chalk-text">0</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] sm:text-xs text-amber-300/80 font-bold tracking-widest uppercase">BEST</div>
          <div id="highScoreText" class="text-lg sm:text-2xl font-black text-yellow-300 chalk-text">0</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] sm:text-xs text-rose-300 font-bold tracking-widest uppercase">LIVES</div>
          <div id="livesText" class="text-lg sm:text-2xl font-bold text-rose-400">❤️❤️❤️</div>
        </div>
        <button id="headerRestartBtn" class="p-2 bg-[#1b3327] hover:bg-[#152a20] text-amber-200 hover:text-white rounded-lg border border-emerald-600/50 transition-colors focus:outline-none" title="重新開始遊戲">
          🔄
        </button>
        <button id="soundToggleBtn" class="p-2 bg-[#1b3327] hover:bg-[#152a20] text-amber-200 rounded-lg border border-emerald-600/50 transition-colors focus:outline-none" title="音效設定">
          🔊
        </button>
      </div>
    </header>

    <!-- Canvas Frame (綠色黑板風格) -->
    <div class="relative w-full aspect-[4/3] bg-[#1e392a] rounded-xl wood-border overflow-hidden flex items-center justify-center">
      
      <!-- 黑板畫布 -->
      <canvas id="gameCanvas" width="800" height="600" class="w-full h-full block cursor-none"></canvas>

      <!-- Modal: Start Screen -->
      <div id="startModal" class="absolute inset-0 bg-[#1e392a]/95 backdrop-blur-xs flex flex-col items-center justify-center p-6 text-center z-10 text-amber-100">
        <div class="w-16 h-16 mb-2 rounded-full bg-amber-500/20 border-2 border-amber-300 flex items-center justify-center text-3xl">
          ✏️
        </div>
        <h2 class="text-3xl sm:text-5xl font-black text-amber-200 mb-2 chalk-text">
          CLASSROOM BREAKOUT
        </h2>
        <p class="text-emerald-100/80 text-xs sm:text-sm max-w-md mb-6 leading-relaxed">
          用「課堂木椅」接住發光的粉筆！擊碎各科課本磚塊。掉落底部扣 1 滴血，共有 3 滴生命。
        </p>
        <button id="startBtn" class="px-8 py-3 bg-amber-400 hover:bg-amber-300 text-slate-900 font-black text-lg tracking-wider rounded-xl shadow-lg transform hover:scale-105 active:scale-95 transition-all border-2 border-amber-100">
          上課打磚塊！
        </button>
      </div>

      <!-- Modal: Game Over Screen -->
      <div id="gameOverModal" class="hidden absolute inset-0 bg-[#192b20]/95 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20 animate-modal text-amber-100">
        <div class="w-16 h-16 mb-3 rounded-full bg-rose-500/20 border-2 border-rose-400 flex items-center justify-center text-3xl">
          🔔
        </div>
        <h2 class="text-4xl sm:text-5xl font-black text-rose-400 chalk-text mb-1">
          下課了！ (Game Over)
        </h2>
        <p id="finalScoreMsg" class="text-amber-100 text-lg mb-6">最終得分: <span class="text-yellow-300 font-bold">0</span></p>
        <button id="restartBtn" class="px-8 py-3 bg-rose-500 hover:bg-rose-400 text-white font-black text-lg tracking-wider rounded-xl shadow-lg transform hover:scale-105 active:scale-95 transition-all border-2 border-rose-200">
          重新上課 (Play Again)
        </button>
      </div>

      <!-- Modal: Victory Screen -->
      <div id="victoryModal" class="hidden absolute inset-0 bg-[#192b20]/95 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20 animate-modal text-amber-100">
        <div class="w-16 h-16 mb-3 rounded-full bg-yellow-500/20 border-2 border-yellow-300 flex items-center justify-center text-3xl">
          💯
        </div>
        <h2 class="text-4xl sm:text-5xl font-black text-yellow-300 chalk-text mb-1">
          滿分學霸！
        </h2>
        <p class="text-amber-100 text-lg mb-6">恭喜清空所有課本！得分: <span id="victoryScoreMsg" class="text-yellow-300 font-bold">0</span></p>
        <button id="victoryRestartBtn" class="px-8 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black text-lg tracking-wider rounded-xl shadow-lg transform hover:scale-105 active:scale-95 transition-all border-2 border-emerald-200">
          挑戰下一節課
        </button>
      </div>
    </div>

    <!-- Operating Footer -->
    <footer class="w-full mt-3 flex flex-wrap justify-between items-center text-xs text-slate-700 font-bold gap-2 px-2">
      <div class="flex items-center space-x-2">
        <span class="px-2 py-1 bg-white rounded shadow-xs border border-slate-300 text-slate-800 font-mono">←</span>
        <span class="px-2 py-1 bg-white rounded shadow-xs border border-slate-300 text-slate-800 font-mono">→</span>
        <span>或</span>
        <span class="px-2 py-1 bg-white rounded shadow-xs border border-slate-300 text-slate-800 font-mono">A</span>
        <span class="px-2 py-1 bg-white rounded shadow-xs border border-slate-300 text-slate-800 font-mono">D</span>
        <span>移動課堂椅子</span>
      </div>
      <div class="flex items-center space-x-1">
        <span>支援</span>
        <span class="px-2 py-1 bg-amber-100 rounded border border-amber-300 text-amber-900">滑鼠 / 觸控拖曳</span>
      </div>
    </footer>
  </div>

  <script>
    // Web Audio 音效合成器
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
      }

      // 木椅/邊框撞擊聲
      playBounce(freq = 300, type = 'sine', duration = 0.06) {
        if (!this.enabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + duration);
          
          gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      // 粉筆撞擊課本聲
      playBrickHit() {
        if (!this.enabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.1);

          gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch (e) {}
      }

      // 課堂下課鐘聲 (Game Over / Loss)
      playGameOver() {
        if (!this.enabled || !this.ctx) return;
        try {
          const notes = [392, 330, 349, 261]; // 簡單的下課鐘聲短節錄
          notes.forEach((freq, idx) => {
            setTimeout(() => {
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
              gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.4);
            }, idx * 220);
          });
        } catch (e) {}
      }

      // 滿分勝利讚美音樂
      playVictory() {
        if (!this.enabled || !this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playBounce(freq, 'sine', 0.25);
          }, idx * 120);
        });
      }

      // 吃到道具音效
      playPowerup() {
        if (!this.enabled || !this.ctx) return;
        try {
          const notes = [440, 554.37, 659.25, 880];
          notes.forEach((freq, idx) => {
            setTimeout(() => {
              this.playBounce(freq, 'sine', 0.08);
            }, idx * 60);
          });
        } catch (e) {}
      }
    }

    const sound = new SoundSynth();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI 動態元素
    const scoreText = document.getElementById('scoreText');
    const highScoreText = document.getElementById('highScoreText');
    const livesText = document.getElementById('livesText');
    const startModal = document.getElementById('startModal');
    const gameOverModal = document.getElementById('gameOverModal');
    const victoryModal = document.getElementById('victoryModal');
    const finalScoreMsg = document.getElementById('finalScoreMsg');
    const victoryScoreMsg = document.getElementById('victoryScoreMsg');

    // 遊戲分數與最高紀錄 Persistence
    let score = 0;
    let lives = 3;
    let highScore = localStorage.getItem('classroom_breakout_high_score') || 0;
    highScoreText.innerText = highScore;

    function updateLivesDisplay() {
      if (lives <= 0) {
        livesText.innerText = '💀';
      } else {
        livesText.innerText = '❤️'.repeat(lives);
      }
    }

    let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER', 'VICTORY'
    let animationFrameId = null;

    // 課堂木椅 (Paddle) 設置
    const basePaddleWidth = 125;
    const expandedPaddleWidth = 185;
    const paddle = {
      width: basePaddleWidth,
      height: 24,
      x: (canvas.width - basePaddleWidth) / 2,
      y: canvas.height - 40,
      speed: 9,
      dx: 0
    };

    // 發光粉筆 (Ball) 設置（調慢初始速度 30%：從 5.0 降至 3.5）
    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 65,
      radius: 8,
      length: 22,
      speed: 5,
      dx: 3.5,
      dy: -3.5,
      angle: 0,
      dustParticles: []
    };

    // 道具掉落機制變數
    let powerUps = [];
    let powerupEndTime = 0;

    function activateWidePaddle() {
      paddle.width = expandedPaddleWidth;
      // 若加寬後滑塊右端超出邊界，自動調整位置推回畫布內
      if (paddle.x + paddle.width > canvas.width) {
        paddle.x = canvas.width - paddle.width;
      }
      powerupEndTime = Date.now() + 5000; // 5 秒時效
      sound.playPowerup();
    }

    // 各科課本磚塊 (Bricks) 設置
    const brickConfig = {
      rows: 3,
      cols: 8,
      padding: 12,
      offsetTop: 60,
      offsetLeft: 35,
      height: 28,
      subjects: [
        { name: '數學', main: '#e11d48', label: '＋−×', border: '#f43f5e' }, // 第一排：紅色數學
        { name: '自然', main: '#0284c7', label: '🔬', border: '#38bdf8' },   // 第二排：藍色自然
        { name: '英文', main: '#059669', label: 'ABC', border: '#34d399' }   // 第三排：綠色英文
      ]
    };

    let bricks = [];
    let particles = [];

    const keys = { right: false, left: false };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    });

    // 滑鼠與觸控拖曳操作
    function handlePointerMove(e) {
      if (gameState !== 'PLAYING') return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const relativeX = (clientX - rect.left) * (canvas.width / rect.width);
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, relativeX - paddle.width / 2));
    }

    canvas.addEventListener('mousemove', handlePointerMove);
    canvas.addEventListener('touchmove', handlePointerMove, { passive: true });

    // 音效開關按鈕
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    soundToggleBtn.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      soundToggleBtn.innerText = sound.enabled ? '🔊' : '🔇';
    });

    function initBricks() {
      bricks = [];
      const brickWidth = (canvas.width - (brickConfig.offsetLeft * 2) - ((brickConfig.cols - 1) * brickConfig.padding)) / brickConfig.cols;
      
      for (let r = 0; r < brickConfig.rows; r++) {
        bricks[r] = [];
        const subj = brickConfig.subjects[r % brickConfig.subjects.length];
        for (let c = 0; c < brickConfig.cols; c++) {
          const x = brickConfig.offsetLeft + c * (brickWidth + brickConfig.padding);
          const y = brickConfig.offsetTop + r * (brickConfig.height + brickConfig.padding);
          bricks[r][c] = {
            x, y,
            width: brickWidth,
            height: brickConfig.height,
            status: 1, // 1: 存活, 0: 被粉筆擊碎
            subj: subj
          };
        }
      }
    }

    // 粉筆灰屑與爆炸粒子特效
    function createChalkExplosion(x, y, colorHex) {
      for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 4 + 2,
          color: colorHex,
          alpha: 1,
          life: Math.random() * 20 + 15
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 1 / p.life;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // 更新粉筆移動時產生的粉筆灰
      for (let i = ball.dustParticles.length - 1; i >= 0; i--) {
        const d = ball.dustParticles[i];
        d.x += d.vx;
        d.y += d.vy;
        d.alpha -= 0.04;
        if (d.alpha <= 0) {
          ball.dustParticles.splice(i, 1);
        }
      }
    }

    function updatePhysics() {
      // 木椅鍵盤移動
      if (keys.right) {
        paddle.x += paddle.speed;
      } else if (keys.left) {
        paddle.x -= paddle.speed;
      }
      
      // 嚴格限制滑塊不超出畫布左右邊界
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

      // 生成發光粉筆飛行過程中的「粉筆灰 (Chalk Dust)」
      if (Math.random() < 0.6) {
        ball.dustParticles.push({
          x: ball.x + (Math.random() * 6 - 3),
          y: ball.y + (Math.random() * 6 - 3),
          vx: (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8,
          size: Math.random() * 3 + 1,
          alpha: 0.8
        });
      }

      // 粉筆移動
      ball.x += ball.dx;
      ball.y += ball.dy;
      ball.angle = Math.atan2(ball.dy, ball.dx);

      // 牆壁碰撞 (左右黑板框)
      if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
        ball.dx *= -1;
        sound.playBounce(320, 'sine', 0.05);
      }

      // 頂部牆壁碰撞
      if (ball.y - ball.radius < 0) {
        ball.dy *= -1;
        sound.playBounce(380, 'sine', 0.05);
      }

      // 底部邊界 - 扣血機制
      if (ball.y + ball.radius > canvas.height) {
        lives--;
        updateLivesDisplay();

        if (lives <= 0) {
          triggerGameOver();
        } else {
          sound.playBounce(160, 'sawtooth', 0.15);
          resetBallAndPaddle();
        }
        return;
      }

      // 課堂木椅 (Paddle) 撞擊檢測
      if (
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <= paddle.y + paddle.height &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width
      ) {
        // 根據擊中椅子的位置改變反彈角度
        const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
        const maxAngle = Math.PI / 3; // 60 度最大角度
        const bounceAngle = hitPoint * maxAngle;

        const currentSpeed = Math.hypot(ball.dx, ball.dy);
        ball.dx = currentSpeed * Math.sin(bounceAngle);
        ball.dy = -currentSpeed * Math.cos(bounceAngle);

        sound.playBounce(260, 'triangle', 0.08);
      }

      // 課本磚塊撞擊檢測
      let activeBricksLeft = 0;
      for (let r = 0; r < brickConfig.rows; r++) {
        for (let c = 0; c < brickConfig.cols; c++) {
          const b = bricks[r][c];
          if (b.status === 1) {
            activeBricksLeft++;
            if (
              ball.x + ball.radius > b.x &&
              ball.x - ball.radius < b.x + b.width &&
              ball.y + ball.radius > b.y &&
              ball.y - ball.radius < b.y + b.height
            ) {
              b.status = 0;
              ball.dy *= -1;
              score += 10;
              scoreText.innerText = score;

              // 更新最高分紀錄 High Score
              if (score > highScore) {
                highScore = score;
                highScoreText.innerText = highScore;
                localStorage.setItem('classroom_breakout_high_score', highScore);
              }

              createChalkExplosion(b.x + b.width / 2, b.y + b.height / 2, b.subj.border);
              sound.playBrickHit();

              // 20% 機率掉落加寬道具 (📏 直尺)
              if (Math.random() < 0.20) {
                powerUps.push({
                  x: b.x + b.width / 2,
                  y: b.y + b.height / 2,
                  vy: 2.2,
                  radius: 12,
                  type: 'EXPAND_PADDLE',
                  label: '📏'
                });
              }

              activeBricksLeft--;
            }
          }
        }
      }

      // 更新與碰撞檢測：掉落道具 (Power-ups)
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.vy;

        // 檢測與木椅碰撞
        if (
          p.y + p.radius >= paddle.y &&
          p.y - p.radius <= paddle.y + paddle.height &&
          p.x + p.radius >= paddle.x &&
          p.x - p.radius <= paddle.x + paddle.width
        ) {
          activateWidePaddle();
          powerUps.splice(i, 1);
          continue;
        }

        // 超出底部邊界移除
        if (p.y - p.radius > canvas.height) {
          powerUps.splice(i, 1);
        }
      }

      // 檢測道具時效 (5 秒後恢復原寬度)
      if (powerupEndTime > 0) {
        if (Date.now() > powerupEndTime) {
          paddle.width = basePaddleWidth;
          powerupEndTime = 0;
        }
      }

      // 勝利條件 (清空所有課本)
      if (activeBricksLeft === 0) {
        triggerVictory();
      }

      updateParticles();
    }

    function render() {
      // 清空畫布 (維持黑板綠底)
      ctx.fillStyle = '#1e392a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 繪製黑板格線與微粉筆刷紋理
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // 1. 繪製各科課本磚塊 (Bricks)
      for (let r = 0; r < brickConfig.rows; r++) {
        for (let c = 0; c < brickConfig.cols; c++) {
          const b = bricks[r][c];
          if (b.status === 1) {
            // 課本封皮
            ctx.fillStyle = b.subj.main;
            ctx.beginPath();
            ctx.roundRect(b.x, b.y, b.width, b.height, 5);
            ctx.fill();

            // 課本白色書脊邊框 (Chalk Border Style)
            ctx.strokeStyle = b.subj.border;
            ctx.lineWidth = 2;
            ctx.stroke();

            // 課本上的學科標籤文字
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.subj.name + ' ' + b.subj.label, b.x + b.width / 2, b.y + b.height / 2 + 1);
          }
        }
      }

      // 2. 繪製粉筆粒子特效 (Chalk Dust)
      ball.dustParticles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 繪製掉落道具 (Power-ups)
      powerUps.forEach(p => {
        ctx.save();
        // 外發光環
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 10;

        // 圓形背景膠囊
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 道具圖標
        ctx.shadowBlur = 0;
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.label, p.x, p.y + 1);
        ctx.restore();
      });

      // 3. 繪製「課堂木椅 (Classroom Chair Paddle)」
      const px = paddle.x;
      const py = paddle.y;
      const pw = paddle.width;
      const ph = paddle.height;

      // 椅子金屬腳架側欄
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.roundRect(px, py + ph - 4, 12, 8, 2);
      ctx.roundRect(px + pw - 12, py + ph - 4, 12, 8, 2);
      ctx.fill();

      // 木質椅面 (Wooden Chair Plank) - 道具效果時呈金黃發光
      const isPowerupActive = powerupEndTime > Date.now();
      const seatGradient = ctx.createLinearGradient(px, py, px, py + ph);
      if (isPowerupActive) {
        seatGradient.addColorStop(0, '#f59e0b');
        seatGradient.addColorStop(0.5, '#d97706');
        seatGradient.addColorStop(1, '#92400e');
      } else {
        seatGradient.addColorStop(0, '#d97706');
        seatGradient.addColorStop(0.5, '#b45309');
        seatGradient.addColorStop(1, '#78350f');
      }

      ctx.fillStyle = seatGradient;
      ctx.beginPath();
      ctx.roundRect(px + 4, py, pw - 8, ph - 2, 6);
      ctx.fill();

      // 道具加寬效果外光暈邊框
      if (isPowerupActive) {
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 顯示剩餘秒數提示
        const remainingSec = Math.ceil((powerupEndTime - Date.now()) / 1000);
        ctx.fillStyle = '#fef08a';
        ctx.font = 'bold 12px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`📏 椅子加寬中 (${remainingSec}s)`, px + pw / 2, py - 10);
      }

      // 椅子木質椅背橫桿
      ctx.fillStyle = '#92400e';
      ctx.beginPath();
      ctx.roundRect(px + 8, py + 3, pw - 16, 4, 2);
      ctx.fill();

      // 木紋裝飾線
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px + 12, py + 10);
      ctx.lineTo(px + pw - 12, py + 10);
      ctx.stroke();

      // 4. 繪製「發光粉筆 (Glowing Chalk Ball)」
      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.rotate(ball.angle);

      // 粉筆白色外發光
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 12;

      // 圓角粉筆本體
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(-ball.length / 2, -ball.radius, ball.length, ball.radius * 2, 4);
      ctx.fill();

      // 粉筆夾手色環
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(-ball.length / 2, -ball.radius, 5, ball.radius * 2);

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function gameLoop() {
      if (gameState === 'PLAYING') {
        updatePhysics();
        render();
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function resetBallAndPaddle() {
      paddle.width = basePaddleWidth;
      powerupEndTime = 0;
      paddle.x = (canvas.width - paddle.width) / 2;
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 65;
      ball.dx = 3.5 * (Math.random() > 0.5 ? 1 : -1);
      ball.dy = -3.5;
      ball.dustParticles = [];
    }

    function resetGame() {
      score = 0;
      lives = 3;
      powerUps = [];
      powerupEndTime = 0;
      paddle.width = basePaddleWidth;
      scoreText.innerText = '0';
      updateLivesDisplay();
      
      resetBallAndPaddle();
      particles = [];
      initBricks();
    }

    function startGame() {
      sound.init();
      resetGame();
      gameState = 'PLAYING';
      
      startModal.classList.add('hidden');
      gameOverModal.classList.add('hidden');
      victoryModal.classList.add('hidden');

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      gameLoop();
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      sound.playGameOver();
      finalScoreMsg.innerHTML = `最終得分: <span class="text-amber-300 font-bold">${score}</span>`;
      gameOverModal.classList.remove('hidden');
    }

    function triggerVictory() {
      gameState = 'VICTORY';
      sound.playVictory();
      victoryScoreMsg.innerText = score;
      victoryModal.classList.remove('hidden');
    }

    // 按鈕監聽事件
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('victoryRestartBtn').addEventListener('click', startGame);
    document.getElementById('headerRestartBtn').addEventListener('click', () => {
      if (gameState === 'PLAYING' || gameState === 'GAMEOVER' || gameState === 'VICTORY') {
        startGame();
      }
    });

    // 初始繪製黑板背景
    initBricks();
    render();
  </script>
</body>
</html>
