<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>for × if 數字探照燈</title><style>
:root{--ink:#493e58;--purple:#73508b;--line:#e2d9e9}*{box-sizing:border-box}body{margin:0;background:#faf7fc;color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:29px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}.kicker{font:12px monospace;letter-spacing:.12em;color:var(--purple)}.lead{color:#72637c;margin:8px 0 22px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:14px;align-items:end}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}label{font-size:14px}input{display:block;width:100%;font:inherit;padding:9px;border:1px solid #af99bd;border-radius:8px}button{font:inherit;border:1px solid var(--purple);border-radius:9px;background:var(--purple);color:white;padding:9px 14px;cursor:pointer}button.secondary{background:white;color:var(--purple)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #cf9a29;outline-offset:3px}.hint{font-size:12px;color:#72637c}.error{color:#ac3228}.error:empty{display:none}.code-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.code{padding:16px;background:#302939;color:#f7edff;border-radius:12px;font:14px/1.9 ui-monospace,monospace;white-space:pre-wrap;margin:0;overflow-wrap:anywhere}.code b{color:#f9cf77}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;margin-top:15px}.cell{display:grid;place-items:center;min-height:42px;border:1px solid var(--line);border-radius:8px;font:600 15px ui-monospace,monospace;position:relative}.cell.outside{color:#aaa0ae;background:#f5f2f7}.cell.miss{background:#ede7f1;color:#7b6d82}.cell.hit{background:#efd27d;border-color:#a98428;color:#453713}.cell.hit:after{content:'✓';font-size:9px;position:absolute;right:3px;top:0}.cell.current{outline:3px solid var(--purple);outline-offset:1px}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px}.legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--line);vertical-align:middle;margin-right:4px}.summary{padding:10px 14px;background:#f6eed8;border-radius:9px}.trace{font-size:14px;min-height:46px}#matches{overflow-wrap:anywhere}.grid-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:650px){main{padding:18px}h1{font-size:25px}.controls{grid-template-columns:repeat(3,minmax(0,1fr))}.controls button{grid-column:1/-1}.code-layout{grid-template-columns:1fr;gap:12px}.panel{padding:16px}.grid{gap:4px}.cell{font-size:12px;min-height:32px;border-radius:5px}.cell.hit:after{font-size:7px;right:1px}}
</style></head><body><main><span class="kicker">03 / FOR × IF</span><h1>讓迴圈走，讓條件選。</h1><p class="lead">for 決定「檢查哪些數字」，if 決定「哪些數字要亮起來」。</p><section class="panel"><form id="form" novalidate><div class="controls"><label>i 從哪裡開始<input id="start" type="number" min="1" max="100" value="1" step="1"></label><label>i 到哪裡結束（包含）<input id="end" type="number" min="1" max="100" value="100" step="1"></label><label>要是幾的倍數<input id="multiple" type="number" min="1" max="100" value="3" step="1"></label><button type="submit">套用並執行</button></div><p class="hint">皆為 1～100 的整數，開始值不可大於結束值。每次迴圈 i 都加 1。</p><p id="error" class="error" role="alert"></p></form></section>
<section class="panel code-layout"><div><h2>把設定翻成 C++</h2><pre class="code" id="code"></pre><p class="hint">% 是取餘數。i % k == 0，表示 i 除以 k 沒有餘數。</p></div><div><h2>跟著 i 走一遍</h2><div class="actions"><button id="step" class="secondary">單步執行／暫停動畫</button><button id="next" disabled>下一個 i →</button><button id="run" class="secondary">重新播放動畫</button></div><p class="trace" id="trace" aria-live="polite"></p><p class="summary" id="summary" aria-live="polite"></p></div></section>
<section class="panel"><div class="grid-title"><h2>1～100 數字探照燈</h2><span class="hint">紫框是目前的 i；✓ 表示條件成立</span></div><div class="legend"><span><i style="background:#efd27d"></i>符合條件 ✓</span><span><i style="background:#ede7f1"></i>檢查過、不符合</span><span><i style="background:white"></i>範圍內、尚未檢查</span><span><i style="background:#f5f2f7"></i>迴圈範圍外</span></div><div id="grid" class="grid" role="group" aria-label="1到100的條件檢查結果"></div><p id="matches" class="hint"></p></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let start=1,end=100,k=3,current=0,mode='ready',timer=null;
$('grid').innerHTML=Array.from({length:100},(_,i)=>'<span class="cell" data-n="'+(i+1)+'">'+(i+1)+'</span>').join('');
function stop(){clearTimeout(timer);timer=null}
function render(){
 $('code').innerHTML='for (int i = <b>'+start+'</b>; i &lt;= <b>'+end+'</b>; i++) {\n  if (i % <b>'+k+'</b> == 0) {\n    // 讓數字 i 亮起來\n  }\n}';
 const hits=[];for(const cell of $('grid').children){const n=Number(cell.dataset.n),inside=n>=start&&n<=end,visited=inside&&n<=current,hit=visited&&n%k===0;cell.className='cell'+(!inside?' outside':visited?(hit?' hit':' miss'):'')+(n===current?' current':'');const state=!inside?'迴圈範圍外':!visited?'尚未檢查':hit?'符合條件，已亮起':'不符合條件';cell.setAttribute('aria-label',n+'：'+state);if(hit)hits.push(n)}
 const count=Math.max(0,Math.min(current,end)-start+1);$('summary').textContent='已檢查 '+count+' / '+(end-start+1)+' 個數字，亮起 '+hits.length+' 個。';$('matches').textContent='目前亮起：'+(hits.join('、')||'還沒有符合的數字');$('next').disabled=mode!=='step'||current>=end;
 $('trace').textContent=current<start?'按「套用並執行」播放動畫，或選「單步執行」再按下一個 i。':(mode==='playing'?'自動播放中｜':mode==='step'?'單步模式｜':'播放完成｜')+'i = '+current+'；'+current+' % '+k+' = '+current%k+' → '+(current%k===0?'true，亮起 ✓':'false，不亮起')+(current===end?'。已到結束值，下一次 i++ 後不再進入迴圈。':'');
}
function tick(){if(mode!=='playing')return;if(current<end)current++;if(current===end){mode='done';stop();render();return}render();timer=setTimeout(tick,160)}
function play(){stop();current=start-1;mode='playing';render();timer=setTimeout(tick,160)}
$('form').onsubmit=e=>{e.preventDefault();const values=['start','end','multiple'].map(id=>Number($(id).value));if(!values.every(v=>Number.isInteger(v)&&v>=1&&v<=100)||values[0]>values[1]){$('error').textContent='請輸入1～100的整數，且開始值 ≤ 結束值；尚未套用這次輸入。';return}[start,end,k]=values;$('error').textContent='';play()};
$('step').onclick=()=>{stop();mode='step';render()};$('next').onclick=()=>{if(mode==='step'&&current<end){current++;render()}};$('run').onclick=play;addEventListener('pagehide',stop);render();
function resize(){parent.postMessage({type:'task-example-size',height:Math.ceil(document.body.getBoundingClientRect().height)},'*')}new ResizeObserver(resize).observe(document.body);addEventListener('load',resize);
})();
</script></body></html>
